[project]
name = "autoresearch-engine"
version = "0.1.0"
description = "Autoresearch loop over decomposition frameworks: LangGraph Functional API + deepagents + Gemini, git branch as agent memory"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph==1.2.11",
    "langchain==1.4.0",
    "langchain-core>=1.6,<2",
    "langchain-google-genai==4.4.0",
    "deepagents==0.7.13",
    "pydantic>=2,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]==0.4.31",
    "langgraph-sdk>=0.4,<1",
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["prompts/*.md", "catalog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits Gemini / network (deselect with -m 'not live')"]
