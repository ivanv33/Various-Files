<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel .lab { display: inline-block; transform: translateY(11px); }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"framework":{"slug":"functional-decomposition","name":"Functional Decomposition","category":"03-engineering-and-cognitive","wikipedia":"https://en.wikipedia.org/wiki/Functional_decomposition","one_liner":"Takes a whole apart into black boxes with one responsibility each, strict inputs and outputs, and an interface contract; the contract is the part nobody says out loud."},"slots":[{"id":"system","label":"System","description":"The whole being decomposed: the thing whose behaviour the functions jointly produce.","typical_provenance":"fact","color":"#d95926","shape":"box"},{"id":"function","label":"Function","description":"A black box with a single responsibility, named by what it does rather than by who staffs it or which vendor sells it.","typical_provenance":"either","color":"#3987e5","shape":"box"},{"id":"input","label":"Input","description":"What a function consumes: material, energy, data or money crossing the boundary inwards.","typical_provenance":"either","color":"#199e70","shape":"cone"},{"id":"output","label":"Output","description":"What a function produces: what crosses the boundary outwards and becomes some other box's input.","typical_provenance":"either","color":"#9085e9","shape":"cone"},{"id":"contract","label":"Interface contract","description":"The guarantees a function makes to its consumers: quantity, rate, accuracy, timing, ordering. Almost never stated in the source, which is why it is the derived slot.","typical_provenance":"derived","color":"#d55181","shape":"diamond"}],"relations":[{"id":"composed_of","label":"composed of","description":"a system is composed of functions; a function of sub-functions"},{"id":"consumes","label":"consumes","description":"a function consumes an input"},{"id":"produces","label":"produces","description":"a function produces an output"},{"id":"depends_on","label":"depends on","description":"a function cannot do its job unless another function has done its own"},{"id":"bound_by","label":"bound by","description":"a function is bound by an interface contract it owes its consumers"}],"examples":[{"id":"classic","kind":"classic","title":"The fortnightly payroll run, and the promise nobody wrote down","summary":"A batch payroll decomposed into four steps with named inputs and outputs. The decomposition is clean and the run still broke, because the guarantee each step made to the next one existed only as an accident of execution order.","source":{"type":"text","title":"Northwind Foods payroll (structured-analysis style scenario)","attribution":"A stepwise-refinement example in the tradition of DeMarco and Yourdon's structured analysis; the scenario text is written for this example so that the fact nodes have something verbatim to quote.","text":"Northwind Foods runs its fortnightly payroll as a single batch job. The batch takes three inputs: the timekeeping export from the depots, the employee master file from HR, and the current tax tables. It produces four things: a payslip for every employee, a payment instruction file for the bank, a journal posting for the general ledger, and a statutory return for the revenue office. Inside, the run is four steps. Validation reads the timekeeping export and rejects any shift that has no matching employee or that overlaps another shift. Gross pay calculation turns validated shifts into gross amounts, applying the overtime and shift-premium rules. Deduction calculation takes gross pay and the tax tables and produces tax, pension and garnishment amounts. Disbursement takes net pay and produces the bank file and the payslips, and posts the journal. Each step reads only what the step before it wrote. Last quarter the run was changed so that deductions could be calculated before gross pay had finished, to save twenty minutes of wall clock time. Nothing in the specification said this was forbidden. The next run paid three hundred people the right gross and the wrong tax, and the general ledger did not balance against the bank file. The team's post mortem noted that nobody had ever written down what each step promised the next one."},"layout":{"mode":"plane","regions":[{"label":"The box that owns the order","x":[-52,58],"y":[17,33],"color":"#9085e9"},{"label":"Four steps, strictly in order","x":[-52,58],"y":[-6,14],"color":"#3987e5"},{"label":"Interface contracts — in the gaps","x":[-52,58],"y":[-46,-19],"color":"#d55181"}],"camera":{"distance":117}},"nodes":[{"id":"cs","slot":"system","label":"Fortnightly payroll run","text":"Northwind Foods runs its fortnightly payroll as a single batch job. This is the whole being decomposed.","provenance":"fact","source_quote":"Northwind Foods runs its fortnightly payroll as a single batch job","source_ref":"sentence 1","pos":[0,42],"size":1.8},{"id":"cf1","slot":"function","label":"Validate shifts","text":"Validation reads the timekeeping export and rejects any shift that has no matching employee or that overlaps another shift.","provenance":"fact","source_quote":"Validation reads the timekeeping export and rejects any shift that has no matching employee or that overlaps another shift","source_ref":"sentence 5","pos":[-33,5],"size":1.15},{"id":"cf2","slot":"function","label":"Calculate gross pay","text":"Gross pay calculation turns validated shifts into gross amounts, applying the overtime and shift-premium rules.","provenance":"fact","source_quote":"Gross pay calculation turns validated shifts into gross amounts, applying the overtime and shift-premium rules","source_ref":"sentence 6","pos":[-7,5],"size":1.15},{"id":"cf3","slot":"function","label":"Calculate deductions","text":"Deduction calculation takes gross pay and the tax tables and produces tax, pension and garnishment amounts.","provenance":"fact","source_quote":"Deduction calculation takes gross pay and the tax tables and produces tax, pension and garnishment amounts","source_ref":"sentence 7","pos":[19,5],"size":1.15},{"id":"cf4","slot":"function","label":"Disburse and post","text":"Disbursement takes net pay and produces the bank file and the payslips, and posts the journal.","provenance":"fact","source_quote":"Disbursement takes net pay and produces the bank file and the payslips, and posts the journal","source_ref":"sentence 8","pos":[44,5],"size":1.15},{"id":"cf5","slot":"function","label":"Sequence the steps","text":"A fifth function owns the order in which the four steps run and how much of one may overlap the next. The scenario never names it, but somebody changed it last quarter.","provenance":"derived","confidence":0.7,"rationale":"Sentence 10 says the run was changed so that deductions could be calculated before gross pay had finished. A change like that has to be made somewhere, and the scenario names four steps and no scheduler, so the function that owns step order is present in the system and absent from its description.","pos":[2,24],"size":1.15},{"id":"ci1","slot":"input","label":"Timekeeping export","text":"The timekeeping export from the depots: the shifts people actually worked.","provenance":"fact","source_quote":"the timekeeping export from the depots","source_ref":"sentence 2","pos":[-60,16],"size":0.9},{"id":"ci2","slot":"input","label":"Employee master file","text":"The employee master file from HR: who exists, at what rate, on what terms.","provenance":"fact","source_quote":"the employee master file from HR","source_ref":"sentence 2","pos":[-62,2],"size":0.9},{"id":"ci3","slot":"input","label":"Current tax tables","text":"The current tax tables, which set the rates deduction calculation applies.","provenance":"fact","source_quote":"and the current tax tables","source_ref":"sentence 2","pos":[19,-11],"size":0.9},{"id":"co1","slot":"output","label":"Payslip per employee","text":"A payslip for every employee: the statement the employee receives.","provenance":"fact","source_quote":"a payslip for every employee","source_ref":"sentence 3","pos":[60,16],"size":0.9},{"id":"co2","slot":"output","label":"Bank payment file","text":"A payment instruction file for the bank: the money actually leaving.","provenance":"fact","source_quote":"a payment instruction file for the bank","source_ref":"sentence 3","pos":[64,2],"size":0.9},{"id":"co3","slot":"output","label":"Ledger journal posting","text":"A journal posting for the general ledger: the same money as the accounts see it.","provenance":"fact","source_quote":"a journal posting for the general ledger","source_ref":"sentence 3","pos":[60,-12],"size":0.9},{"id":"cc4","slot":"contract","label":"Read only the prior step's output","text":"The one guarantee the scenario states: each step reads only what the step before it wrote. It is a rule about access, not about completeness, which is exactly why it was not enough.","provenance":"fact","source_quote":"Each step reads only what the step before it wrote","source_ref":"sentence 9","pos":[-8,-38],"size":1},{"id":"cc2","slot":"contract","label":"One employee, no overlap","text":"What validation promises gross pay calculation: every shift it passes on matches exactly one employee and overlaps no other shift, so the next step never has to check.","provenance":"derived","confidence":0.85,"rationale":"Sentence 5 states what validation rejects. Reading the rejection rule as a promise to the consumer is the inference, and it is the promise that lets gross pay calculation apply rates without re-checking identity or overlap.","pos":[-32,-28],"size":1},{"id":"cc1","slot":"contract","label":"Gross is final before deductions read","text":"What gross pay calculation owes deduction calculation: by the time deductions reads a gross amount, that amount is complete and will not change. This is the guarantee the reordering broke.","provenance":"derived","confidence":0.9,"rationale":"Sentence 9 gives only an access rule, and sentence 12 says the reordered run produced the right gross and the wrong tax. A wrong tax on a right gross can only mean deductions read a gross that was still moving, so completeness at read time was a promise in force and never written; sentence 13 says so outright.","pos":[10,-28],"size":1},{"id":"cc3","slot":"contract","label":"Bank file and journal agree","text":"What disbursement owes everyone downstream: the payment instruction file and the journal posting describe the same money to the penny.","provenance":"derived","confidence":0.85,"rationale":"Sentence 12 reports that the general ledger did not balance against the bank file and treats that as a failure. It is only a failure if agreement between the two was guaranteed, and the scenario states no such guarantee anywhere.","pos":[40,-38],"size":1}],"edges":[{"id":"ce_c1","from":"cs","to":"cf1","relation":"composed_of","provenance":"derived","confidence":0.9,"rationale":"Sentence 4 says the run is four steps and sentences 5 to 8 name four activities, but no sentence says that validation is one of the run's four steps. Matching the count to the names is the decomposition's own move."},{"id":"ce_c2","from":"cs","to":"cf2","relation":"composed_of","provenance":"derived","confidence":0.9,"rationale":"Same inference as for validation: sentence 4 gives the count, sentence 6 gives the activity, and joining them into a parent-child relation is the reading, not the text."},{"id":"ce_c3","from":"cs","to":"cf3","relation":"composed_of","provenance":"derived","confidence":0.9,"rationale":"Sentence 4 gives the count and sentence 7 gives the activity; that deduction calculation is a step of this run rather than a separate job is inferred from their adjacency."},{"id":"ce_c4","from":"cs","to":"cf4","relation":"composed_of","provenance":"derived","confidence":0.9,"rationale":"Sentence 4 gives the count and sentence 8 gives the activity. Disbursement is also the step that writes the system's stated outputs, which is the strongest evidence that it sits inside the system rather than after it."},{"id":"ce_c5","from":"cs","to":"cf5","relation":"composed_of","provenance":"derived","confidence":0.7,"rationale":"Sentence 10 shows that step order is configurable and was configured, so the run contains a box that owns order. The scenario counts four steps and does not count this one."},{"id":"ce_n1","from":"cs","to":"ci1","relation":"consumes","provenance":"fact","source_quote":"The batch takes three inputs: the timekeeping export from the depots","source_ref":"sentence 2"},{"id":"ce_n2","from":"cs","to":"ci2","relation":"consumes","provenance":"fact","source_quote":"The batch takes three inputs: the timekeeping export from the depots, the employee master file from HR","source_ref":"sentence 2"},{"id":"ce_n3","from":"cs","to":"ci3","relation":"consumes","provenance":"fact","source_quote":"the employee master file from HR, and the current tax tables","source_ref":"sentence 2"},{"id":"ce_n4","from":"cf1","to":"ci1","relation":"consumes","provenance":"fact","source_quote":"Validation reads the timekeeping export","source_ref":"sentence 5"},{"id":"ce_n5","from":"cf1","to":"ci2","relation":"consumes","provenance":"derived","confidence":0.85,"rationale":"Sentence 5 says validation rejects a shift with no matching employee. Matching requires the employee master file named in sentence 2, but the scenario never connects the file to the step."},{"id":"ce_n6","from":"cf3","to":"ci3","relation":"consumes","provenance":"fact","source_quote":"Deduction calculation takes gross pay and the tax tables","source_ref":"sentence 7"},{"id":"ce_p1","from":"cs","to":"co1","relation":"produces","provenance":"fact","source_quote":"It produces four things: a payslip for every employee","source_ref":"sentence 3"},{"id":"ce_p2","from":"cs","to":"co2","relation":"produces","provenance":"fact","source_quote":"a payslip for every employee, a payment instruction file for the bank","source_ref":"sentence 3"},{"id":"ce_p3","from":"cs","to":"co3","relation":"produces","provenance":"fact","source_quote":"a payment instruction file for the bank, a journal posting for the general ledger","source_ref":"sentence 3"},{"id":"ce_p4","from":"cf4","to":"co1","relation":"produces","provenance":"fact","source_quote":"Disbursement takes net pay and produces the bank file and the payslips","source_ref":"sentence 8"},{"id":"ce_p5","from":"cf4","to":"co2","relation":"produces","provenance":"fact","source_quote":"produces the bank file and the payslips","source_ref":"sentence 8"},{"id":"ce_p6","from":"cf4","to":"co3","relation":"produces","provenance":"fact","source_quote":"the bank file and the payslips, and posts the journal","source_ref":"sentence 8"},{"id":"ce_d1","from":"cf2","to":"cf1","relation":"depends_on","provenance":"fact","source_quote":"Gross pay calculation turns validated shifts into gross amounts","source_ref":"sentence 6"},{"id":"ce_d2","from":"cf3","to":"cf2","relation":"depends_on","provenance":"fact","source_quote":"Deduction calculation takes gross pay","source_ref":"sentence 7"},{"id":"ce_d3","from":"cf4","to":"cf3","relation":"depends_on","provenance":"derived","confidence":0.85,"rationale":"Sentence 8 says disbursement takes net pay. Net pay is gross pay less the deductions of sentence 7, so disbursement cannot run before deduction calculation; the scenario never states the arithmetic or the dependency."},{"id":"ce_d4","from":"cf5","to":"cf2","relation":"depends_on","provenance":"derived","confidence":0.6,"rationale":"To order the steps the sequencing function must know when gross pay calculation has finished. Sentence 10 shows it did not know, which is the whole failure; the dependency is the one that should have existed."},{"id":"ce_b1","from":"cs","to":"cc4","relation":"bound_by","provenance":"fact","source_quote":"Each step reads only what the step before it wrote","source_ref":"sentence 9"},{"id":"ce_b2","from":"cf1","to":"cc2","relation":"bound_by","provenance":"derived","confidence":0.85,"rationale":"Turning validation's stated rejection rule into a guarantee it owes the next step is the inference; the scenario states the rule and never states the promise."},{"id":"ce_b3","from":"cf2","to":"cc1","relation":"bound_by","provenance":"derived","confidence":0.9,"rationale":"The completeness guarantee belongs to the step that produces gross pay, because it is the only box that knows when a gross amount has stopped changing."},{"id":"ce_b4","from":"cf5","to":"cc1","relation":"bound_by","provenance":"derived","confidence":0.8,"rationale":"The sequencing function is the box that can actually violate the guarantee, and it is the box that did: sentence 10 is a change to order, sentence 12 is the result. An unnamed box cannot be held to a contract."},{"id":"ce_b5","from":"cf4","to":"cc3","relation":"bound_by","provenance":"derived","confidence":0.85,"rationale":"Disbursement is the single step that writes both the bank file and the journal posting, so agreement between them is a guarantee only it can make."},{"id":"ce_s1","from":"cc1","to":"cc4","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The stated access rule in sentence 9 is the nearest thing to the unstated completeness rule, and the gap between them is what the example is about."},{"id":"ce_s2","from":"cc1","to":"cf3","relation":"supported_by","provenance":"derived","confidence":0.9,"rationale":"Deduction calculation is the consumer the guarantee is owed to, per sentence 7, which is what makes it a contract rather than an internal invariant."},{"id":"ce_s3","from":"cc2","to":"ci2","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The employee master file of sentence 2 is what makes the matching half of the guarantee checkable at all."},{"id":"ce_s4","from":"cc3","to":"co2","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The bank file of sentence 3 is one of the two artefacts the guarantee is about, and sentence 12 reports it disagreeing with the other."}]},{"id":"tbpn","kind":"tbpn","title":"Crusoe's AI factory: the boxes are stated, the guarantees are not","summary":"Chase Lockmiller walks the Abilene AI factory from curtailed wind power through transformers, switchgear, data halls and a closed water loop. Every box and almost every flow is said out loud; what no box publishes is the guarantee it makes to the box downstream, and the one guarantee most obviously missing is the one Crusoe replaced by opening its own factories.","source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-05-29_elon-musk-is-leaving-washington-meta-partners-with-anduril-kim-jong-uns-side-launch-goes-sideways-peter-rahal-john-andrew-entwistle-ashlee-vance-chase.md","date":"2025-05-29","episode_title":"Elon Musk Is Leaving Washington, Meta Partners With Anduril, Kim Jong Un's Side Launch Goes Sideways","url":"https://podscripts.co/podcasts/tbpn-live/elon-musk-is-leaving-washington-meta-partners-with-anduril-kim-jong-uns-side-launch-goes-sideways-peter-rahal-john-andrew-entwistle-ashlee-vance-chase-lochmiller-matan-grinberg-jonny-dyer-david-hsu-sushanth-raman-rob-toews"},"why_this_episode":"Crusoe Energy's Chase Lockmiller is asked what it actually takes to build a gigawatt AI campus and answers by walking the stack: the energy he sources, the transformer stack, the switchgear, the data halls, the closed-loop water circuit, and the software layer above it. He names the boxes and, unusually for conversational speech, states what goes into several of them and what comes out, which gives the input and output slots real facts to hold. He also supplies the framework's hardest slot by negation: he says switchgear is a long-lead bottleneck and that Crusoe started manufacturing it in-house, which is what a missing interface contract looks like from the buyer's side.","idea_bearing_slot":"contract","layout":{"mode":"plane","regions":[{"label":"Interface contracts — in the gaps","x":[-68,62],"y":[-64,-33],"color":"#d55181"}],"annotations":[{"pos":[34,5],"text":"Closed cooling loop","style":"caption"},{"pos":[-20,3],"text":"The box nobody names","style":"caption"}],"camera":{"distance":132}},"nodes":[{"id":"sys","slot":"system","label":"Abilene AI factory","text":"The whole being decomposed: an AI factory, a plant that manufactures intelligent outcomes from inputs sent by users. Crusoe's Abilene, Texas facility will consume 1.2 gigawatts of total power capacity.","provenance":"fact","source_quote":"It's like what we're building are these AI factories, right? So they're factories that manufacture intelligence. Factories that manufacture intelligent outcomes that are prompted by inputs from users.","source_ref":"Chase Lockmiller, L3114-L3120","entities":["Crusoe Energy"],"pos":[0,40],"size":1.8},{"id":"f_energy","slot":"function","label":"Source low-cost power","text":"The first box in Crusoe's energy-first approach: find where low-cost, clean, abundant energy can be accessed and put the computing infrastructure there, rather than building where data centres already are.","provenance":"fact","source_quote":"where can we access low cost, you know, clean as much as we can, and abundant energy to power computing infrastructure?","source_ref":"Chase Lockmiller, L2738-L2740","entities":["Crusoe Energy"],"pos":[-28,24],"size":1.15},{"id":"f_electrical","slot":"function","label":"Step voltage down to the data hall","text":"The box nobody names: whatever takes power at transmission voltage and delivers breaker-protected feeds at the data hall. Its three parts are all named; the function they jointly perform is not.","provenance":"derived","confidence":0.8,"rationale":"Lockmiller names high-voltage transformers, medium-voltage transformers and switchgear in sequence and calls them a whole stack, but never names the job they jointly do. The contents of the box are quoted; the box itself is the decomposition's inference, and it is the level at which the lead-time problem is actually owned.","entities":["Crusoe Energy"],"pos":[-20,14],"size":1.15},{"id":"f_compute","slot":"function","label":"Run the racks in the data halls","text":"The data halls hold racks of Nvidia chips with cold water flowing over them. This is the box that turns power into computation; everything else in the factory exists to keep it fed and cool.","provenance":"fact","source_quote":"cold water that flows into the rack and it flows over the chips through this copper pipe","source_ref":"Chase Lockmiller, L3402-L3404","entities":["Nvidia"],"pos":[8,24],"size":1.15},{"id":"f_cooling","slot":"function","label":"Remove heat in a closed loop","text":"Crusoe's AI factories use a closed-loop architecture: the water that carries heat off the chips is the same water, circulating, rather than a fresh supply being consumed.","provenance":"fact","source_quote":"The way we've designed our AI factories is what's called a closed loop architecture.","source_ref":"Chase Lockmiller, L3400-L3400","entities":["Crusoe Energy"],"pos":[28,14],"size":1.15},{"id":"f_software","slot":"function","label":"Managed infrastructure as a service","text":"The top box of the stack: managed infrastructure as a service at the software layer, which is what a customer actually buys. Crusoe built this from the ground up alongside the energy and the buildings.","provenance":"fact","source_quote":"as well as managed infrastructure as a service at the software layer","source_ref":"Chase Lockmiller, L3020-L3022","entities":["Crusoe Energy"],"pos":[48,24],"size":1.15},{"id":"f_hv","slot":"function","label":"High-voltage transformers","text":"High-voltage transformers are a big bottleneck and long lead time assets. A lot of that capacity gets built in China, but the supply chain is diverse enough that Lockmiller is not worried about the trade war.","provenance":"fact","source_quote":"high voltage transformers, but they are kind of long lead time assets.","source_ref":"Chase Lockmiller, L3282-L3282","entities":[],"pos":[-40,-1],"size":1},{"id":"f_mv","slot":"function","label":"Medium-voltage transformers","text":"There is a whole stack on the transformer side, and medium-voltage transformers are the next layer of it below the high-voltage ones.","provenance":"fact","source_quote":"There's a whole stack in the transformer side too. So like you have the medium voltage transformers.","source_ref":"Chase Lockmiller, L3284-L3286","entities":[],"pos":[-27,-16],"size":1},{"id":"f_switchgear","slot":"function","label":"Switchgear: the breakers","text":"Electrical switchgear is the electrical room holding all of the breakers that feed into the data halls. It is a major long lead time item and a bottleneck, and Crusoe started manufacturing it in-house in Tulsa and outside Denver.","provenance":"fact","source_quote":"It's electrical switch gear. This is basically like your electrical room that has all of the breakers that feed into the actual data halls","source_ref":"Chase Lockmiller, L3300-L3306","entities":["Crusoe Energy"],"pos":[-12,-26],"size":1},{"id":"f_coldplate","slot":"function","label":"Cold plate: chip to water","text":"Inside the rack, heat exchanges from the silicon through the copper and into the water. This is the box that gets the heat off the chip.","provenance":"fact","source_quote":"you have this heat exchange between the silicon that goes through the copper and then to the water","source_ref":"Chase Lockmiller, L3404-L3406","entities":["Nvidia"],"pos":[16,-1],"size":1},{"id":"f_chiller","slot":"function","label":"Outdoor chiller: water to air","text":"A heat exchanger outside, like a massive maze of copper pipe, with air blown over it. Chillers are another big thing, alongside switchgear, in the list of bottlenecks.","provenance":"fact","source_quote":"That hot water then goes out to a heat exchanger that's a chiller that's outside.","source_ref":"Chase Lockmiller, L3410-L3410","entities":[],"pos":[52,-16],"size":1},{"id":"i_prompts","slot":"input","label":"Prompts from users","text":"The system's demand-side input: the prompts users send, which is what the factory converts into intelligent outcomes.","provenance":"fact","source_quote":"Factories that manufacture intelligent outcomes that are prompted by inputs from users.","source_ref":"Chase Lockmiller, L3118-L3120","entities":[],"pos":[-27,40],"size":0.9},{"id":"i_energy","slot":"input","label":"Curtailed wind and solar","text":"Abilene has an abundance of wind and solar built on production tax credits, and not enough demand for it: power gets curtailed and sometimes sold at a negative price. That surplus is the factory's energy input.","provenance":"fact","source_quote":"Abilene is a market where there's an abundance of energy, a lot of wind particularly, and solar had been built on the back of production tax credit incentives","source_ref":"Chase Lockmiller, L2804-L2806","entities":[],"pos":[-58,24],"size":0.9},{"id":"i_credit","slot":"input","label":"Infrastructure credit","text":"Credit is the input that decides whether a factory of this size exists at all. The Abilene expansion's funding totals about fifteen billion dollars and was done in partnership with Blue Owl Capital.","provenance":"fact","source_quote":"credit is the unlock to all of this infrastructure getting built","source_ref":"Chase Lockmiller, L3180-L3182","entities":["Blue Owl Capital","Crusoe Energy"],"pos":[-54,40],"size":0.9},{"id":"i_coldwater","slot":"input","label":"Cold water into the rack","text":"Cold water flows into the rack. In a closed loop this is not a fresh supply: it is the same water coming back from the chiller.","provenance":"fact","source_quote":"you have cold water that flows into the rack","source_ref":"Chase Lockmiller, L3402-L3402","entities":[],"pos":[52,-1],"size":0.9},{"id":"o_intelligence","slot":"output","label":"Intelligent outcomes","text":"What the factory manufactures: intelligence, in the form of outcomes prompted by users. Lockmiller sees no near-term shortage of demand for more of it.","provenance":"fact","source_quote":"they're factories that manufacture intelligence","source_ref":"Chase Lockmiller, L3116-L3116","entities":[],"pos":[27,40],"size":0.9},{"id":"o_hotwater","slot":"output","label":"Hot water out of the rack","text":"Hot water is exhausted from the rack, carrying the heat the chips produced. It is the cold plate's output and the chiller's input.","provenance":"fact","source_quote":"and then hot water sort of exhausted from the rack","source_ref":"Chase Lockmiller, L3406-L3408","entities":[],"pos":[16,-16],"size":0.9},{"id":"o_heat","slot":"output","label":"Heat exhausted to the air","text":"Air is blown over the chiller and the heat gets exhausted out of the water. Heat, not water, is what actually leaves the system.","provenance":"fact","source_quote":"the heat basically gets exhausted out of the water","source_ref":"Chase Lockmiller, L3418-L3418","entities":[],"pos":[52,-26],"size":0.9},{"id":"c_water","slot":"contract","label":"Fill the loop once, not per hour","text":"The one guarantee stated out loud, and it is made to the local community rather than to a downstream box: a building holds a million gallons, and it is filled one time, not consumed per hour.","provenance":"fact","source_quote":"So while we have one million gallons of water per building, we only fill it one time.","source_ref":"Chase Lockmiller, L3424-L3426","entities":["Crusoe Energy"],"pos":[38,-56],"size":1},{"id":"c_thermal","slot":"contract","label":"Carry away a full rack of heat","text":"What the cooling box owes the racks: remove the entire thermal load of a GB200-density rack, continuously, because at these densities there is no longer enough heat capacity to move that heat off the chip any other way.","provenance":"derived","confidence":0.8,"rationale":"Lockmiller states the physical fact that the new Nvidia architectures produce more heat than a traditional aluminium heat sink can move, and separately describes the closed loop, but never states what the loop guarantees. The guarantee is close to forced: a cooling box whose promise is weaker than the rack's heat output shuts the rack down.","entities":["Nvidia"],"pos":[-10,-56],"size":1},{"id":"c_power","slot":"contract","label":"Firm power whatever the wind does","text":"What the energy box owes the data hall: continuous power at a contracted price, although its input is wind and solar that frequently gets curtailed. Somebody has to stand between an intermittent source and a load that cannot blink, and the transcript never says who.","provenance":"derived","confidence":0.65,"rationale":"The speaker states both that Abilene's surplus is wind and solar that frequently gets curtailed and that the facility will consume 1.2 gigawatts of total power capacity. A load of that size cannot follow the weather, so a firming guarantee has to exist between the two; he names neither the guarantee nor its owner.","idea":"Firming as a product: a counterparty that sells a gigawatt-scale AI load a firm power guarantee on top of a curtailed renewable grid, taking the intermittency risk the developer currently absorbs by owning generation itself.","entities":["Crusoe Energy"],"pos":[-44,-44],"size":1},{"id":"c_switchgear","slot":"contract","label":"A delivery date you can finance","text":"What the switchgear and medium-voltage transformer boxes owe their consumer and nobody sells: a delivery date firm enough to underwrite a construction schedule against. Crusoe's answer was to stop buying switchgear and open its own factories in Tulsa and outside Denver.","provenance":"derived","confidence":0.7,"rationale":"Lockmiller says switchgear is a major long lead time item and definitely a bottleneck, and that Crusoe started manufacturing it in-house with two factories. A buyer that would rather not be a manufacturer integrating backwards is evidence that what is missing is a guarantee rather than a part, and he never states the guarantee because nobody offers one.","idea":"A supplier of long-lead electrical gear that sells an underwritten delivery date rather than a part: lead-time insurance, or take-or-pay slots, on switchgear and medium-voltage transformers, for every data-centre developer too small to open a factory the way Crusoe did.","entities":["Crusoe Energy"],"pos":[-2,-44],"size":1},{"id":"c_uptime","slot":"contract","label":"One tenant, one cluster, one term","text":"What the compute box owes above it: a working cluster delivered to a single customer for the term the debt was raised against. Fifteen billion dollars of financing sits on one tenant's demand for one facility.","provenance":"derived","confidence":0.7,"rationale":"Lockmiller says the 1.2 gigawatt Abilene facility is for one customer and that its funding, about fifteen billion dollars, was completed with Blue Owl Capital. An asset financed against a single tenant must be guaranteeing availability to that tenant, but the term sheet is the one document the interview never reads out.","entities":["Blue Owl Capital","Crusoe Energy"],"pos":[38,-44],"size":1}],"edges":[{"id":"e_c1","from":"sys","to":"f_energy","relation":"composed_of","provenance":"fact","source_quote":"And we had done that from the ground up, all the way from energy data centers","source_ref":"Chase Lockmiller, L3016-L3018"},{"id":"e_c2","from":"sys","to":"f_software","relation":"composed_of","provenance":"fact","source_quote":"all the way from energy data centers, as well as managed infrastructure as a service at the software layer","source_ref":"Chase Lockmiller, L3018-L3022"},{"id":"e_c3","from":"sys","to":"f_cooling","relation":"composed_of","provenance":"fact","source_quote":"The way we've designed our AI factories is what's called a closed loop architecture.","source_ref":"Chase Lockmiller, L3400-L3400"},{"id":"e_c4","from":"sys","to":"f_compute","relation":"composed_of","provenance":"derived","confidence":0.85,"rationale":"Lockmiller never enumerates the factory's subsystems. That the data halls of racks are one box inside the AI factory is forced by the facts that the breakers feed into them and the water flows over their chips, but it is not stated."},{"id":"e_c5","from":"sys","to":"f_electrical","relation":"composed_of","provenance":"derived","confidence":0.8,"rationale":"The parent box is itself an inference, so its membership in the system is too. What is stated is that transformers and switchgear are part of what it means to build this stuff out."},{"id":"e_c6","from":"f_electrical","to":"f_hv","relation":"composed_of","provenance":"derived","confidence":0.85,"rationale":"Lockmiller introduces high-voltage transformers when asked what it takes to build the factory, then says there is a whole stack on the transformer side. Placing the high-voltage layer inside that stack is the reading."},{"id":"e_c7","from":"f_electrical","to":"f_mv","relation":"composed_of","provenance":"derived","confidence":0.9,"rationale":"He says outright that there is a whole stack in the transformer side and that it contains the medium-voltage transformers; only the name of the containing function is supplied by the decomposition."},{"id":"e_c8","from":"f_electrical","to":"f_switchgear","relation":"composed_of","provenance":"derived","confidence":0.85,"rationale":"Switchgear is named in the same breath as the transformer stack and described as the electrical room feeding the data halls, which places it at the bottom of the same voltage-stepping chain."},{"id":"e_c9","from":"f_cooling","to":"f_coldplate","relation":"composed_of","provenance":"derived","confidence":0.85,"rationale":"The closed loop is stated as an architecture and the chip-to-water exchange is stated as a step of it; treating that step as a sub-function with its own boundary is the decomposition's move."},{"id":"e_c10","from":"f_cooling","to":"f_chiller","relation":"composed_of","provenance":"derived","confidence":0.9,"rationale":"The chiller is described as receiving the loop's hot water and returning cold water, which makes it part of the loop rather than a consumer of it, but no sentence says so."},{"id":"e_n1","from":"sys","to":"i_prompts","relation":"consumes","provenance":"fact","source_quote":"Factories that manufacture intelligent outcomes that are prompted by inputs from users.","source_ref":"Chase Lockmiller, L3118-L3120"},{"id":"e_n2","from":"sys","to":"i_credit","relation":"consumes","provenance":"fact","source_quote":"credit is the unlock to all of this infrastructure getting built","source_ref":"Chase Lockmiller, L3180-L3182"},{"id":"e_n3","from":"f_energy","to":"i_energy","relation":"consumes","provenance":"derived","confidence":0.8,"rationale":"Lockmiller states that an AI data centre can be built in Abilene to soak up the curtailed energy, and separately that his energy-first box looks for exactly such low-cost abundant power. Assigning that curtailed surplus to that box as its input is the join he does not make explicitly."},{"id":"e_n4","from":"f_coldplate","to":"i_coldwater","relation":"consumes","provenance":"fact","source_quote":"you have cold water that flows into the rack and it flows over the chips through this copper pipe","source_ref":"Chase Lockmiller, L3402-L3404"},{"id":"e_n5","from":"f_chiller","to":"o_hotwater","relation":"consumes","provenance":"fact","source_quote":"That hot water then goes out to a heat exchanger that's a chiller that's outside.","source_ref":"Chase Lockmiller, L3410-L3410"},{"id":"e_p1","from":"sys","to":"o_intelligence","relation":"produces","provenance":"fact","source_quote":"they're factories that manufacture intelligence","source_ref":"Chase Lockmiller, L3116-L3116"},{"id":"e_p2","from":"f_coldplate","to":"o_hotwater","relation":"produces","provenance":"fact","source_quote":"you have this heat exchange between the silicon that goes through the copper and then to the water and then hot water sort of exhausted from the rack","source_ref":"Chase Lockmiller, L3404-L3408"},{"id":"e_p3","from":"f_chiller","to":"o_heat","relation":"produces","provenance":"fact","source_quote":"And then you blow air over it. You try to blow cold air over it. And then the heat basically gets exhausted out of the water.","source_ref":"Chase Lockmiller, L3414-L3418"},{"id":"e_p4","from":"f_chiller","to":"i_coldwater","relation":"produces","provenance":"fact","label":"closes the loop","source_quote":"And then you basically have cold water from that that then feeds right back into the system.","source_ref":"Chase Lockmiller, L3420-L3422"},{"id":"e_d1","from":"f_compute","to":"f_switchgear","relation":"depends_on","provenance":"fact","source_quote":"all of the breakers that feed into the actual data halls","source_ref":"Chase Lockmiller, L3304-L3306"},{"id":"e_d2","from":"f_switchgear","to":"f_mv","relation":"depends_on","provenance":"derived","confidence":0.75,"rationale":"Breakers distribute at the voltage the medium-voltage transformers hand them, so the switchgear cannot do its job until that step down has happened. The ordering is standard electrical practice and is nowhere stated in the interview."},{"id":"e_d3","from":"f_mv","to":"f_hv","relation":"depends_on","provenance":"derived","confidence":0.8,"rationale":"Calling the transformers high and medium voltage states the order of the steps implicitly: the medium-voltage layer receives what the high-voltage layer delivers. Lockmiller gives the names and not the sequence."},{"id":"e_d4","from":"f_hv","to":"f_energy","relation":"depends_on","provenance":"derived","confidence":0.8,"rationale":"The transformer stack has nothing to step down until the energy box has secured generation and an interconnect. That the two are in series follows from the build narrative rather than from any sentence."},{"id":"e_d5","from":"f_compute","to":"f_cooling","relation":"depends_on","provenance":"derived","confidence":0.85,"rationale":"Lockmiller states that there is simply not enough heat capacity to move the new chips' heat with an aluminium heat sink, which makes liquid cooling a precondition for running the racks at all rather than an optimisation. The dependency itself is never said."},{"id":"e_d6","from":"f_software","to":"f_compute","relation":"depends_on","provenance":"derived","confidence":0.8,"rationale":"Managed infrastructure as a service has nothing to manage without the racks beneath it. The layering is implied by the phrase at the software layer and by the ground-up build, not stated as a dependency."},{"id":"e_b1","from":"f_cooling","to":"c_water","relation":"bound_by","provenance":"fact","source_quote":"But in our case, we've designed it with a closed loop architecture that is like, you fill it one time, then you're done.","source_ref":"Chase Lockmiller, L3454-L3458"},{"id":"e_b2","from":"f_cooling","to":"c_thermal","relation":"bound_by","provenance":"derived","confidence":0.8,"rationale":"The thermal guarantee belongs to the cooling box because it is the only box whose output is the absence of heat. Lockmiller describes its mechanism and never its promise."},{"id":"e_b3","from":"f_energy","to":"c_power","relation":"bound_by","provenance":"derived","confidence":0.65,"rationale":"The energy box is the one that faces the intermittent source, so the firming guarantee is owed by it even though the interview never assigns it to anyone."},{"id":"e_b4","from":"f_switchgear","to":"c_switchgear","relation":"bound_by","provenance":"derived","confidence":0.7,"rationale":"Switchgear is the box Lockmiller names twice as a bottleneck and the box Crusoe chose to manufacture itself, which makes it the box whose missing delivery guarantee was binding."},{"id":"e_b5","from":"f_mv","to":"c_switchgear","relation":"bound_by","provenance":"derived","confidence":0.65,"rationale":"He groups switchgear and medium-voltage transformers as one long-lead problem, so the same missing guarantee binds both boxes. Treating one contract as covering two functions is the inference."},{"id":"e_b6","from":"f_compute","to":"c_uptime","relation":"bound_by","provenance":"derived","confidence":0.7,"rationale":"Availability to the single tenant is a promise only the box that runs the racks can make, and it is the promise the financing is written against."},{"id":"e_s1","from":"c_switchgear","to":"f_hv","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"High-voltage transformers being long lead time assets is the nearest stated fact to the missing guarantee: the lead time is acknowledged and never underwritten."},{"id":"e_s2","from":"c_thermal","to":"f_compute","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The racks are the consumer the thermal guarantee is owed to, which is what makes it a contract rather than a property of the plumbing."},{"id":"e_s3","from":"c_power","to":"i_energy","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The curtailed wind and solar input is what makes the firming guarantee necessary: an input that gets switched off is exactly what a firm guarantee has to absorb."},{"id":"e_s4","from":"c_uptime","to":"i_credit","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"Credit is what the availability guarantee is written for; the fifteen billion dollars is the measure of how much the guarantee is worth."}]}]}</script>

<script type="module">

// ---------- palette (validated categorical slots, dark surface; see _meta and SPEC.md section 5) ----------

const controls = new OrbitControls(camera, renderer.domElement);

const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(40, 80, 120); scene.add(key);

// The header and the note strip lay out after the first script pass, so a one-shot resize()

// ---------- state ----------
const state = { exampleIndex: 0, showDerived: true, showGrounding: false, showLabels: true, group: null, nodes: new Map(), edges: [], hit: [], hover: null, selected: null, fit: null };

// ---------- layouts ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function forceLayout(nodes, edges, pinned, seed, opts = {}) {
  const rand = mulberry32(seed);
  const pos = new Map();
  const R0 = opts.radius || Math.max(18, nodes.length * 2.2);
  for (const n of nodes) {
    if (pinned.has(n.id)) pos.set(n.id, pinned.get(n.id).clone());
    else pos.set(n.id, new THREE.Vector3((rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0 * (opts.flat ? 0.15 : 1)));
  }

  const d = new THREE.Vector3();
  for (let it = 0; it < 420; it++) {
    const alpha = 0.9 * (1 - it / 420) + 0.04;
    for (const id of ids) f.get(id).set(0, 0, 0);
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const a = pos.get(ids[i]), b = pos.get(ids[j]);
      d.subVectors(a, b); let dist = d.length(); if (dist < 0.5) { d.set(rand() - .5, rand() - .5, rand() - .5); dist = 0.5; }
      const s = K / (dist * dist); d.normalize().multiplyScalar(s);
      f.get(ids[i]).add(d); f.get(ids[j]).sub(d);
    }
    for (const e of edges) {
      if (!pos.has(e.from) || !pos.has(e.to)) continue;
      const a = pos.get(e.from), b = pos.get(e.to);
      d.subVectors(b, a); const dist = Math.max(d.length(), 0.01);
      const s = (dist - L) * 0.05; d.normalize().multiplyScalar(s);
      f.get(e.from).add(d); f.get(e.to).sub(d);
    }
    for (const id of ids) {
      if (pinned.has(id)) continue;
      const p = pos.get(id), ff = f.get(id);
      ff.addScaledVector(p, -0.012);
      if (opts.flat) ff.z -= p.z * 0.2;
      const len = ff.length(); if (len > 6) ff.multiplyScalar(6 / len);
      p.addScaledVector(ff, alpha);
    }

}

function treeLayout(ex) {
  const nodes = ex.nodes, edges = ex.edges.filter(e => e.relation !== 'supported_by');
  const level = new Map();
  const explicit = nodes.every(n => Number.isInteger(n.level));
  if (explicit) nodes.forEach(n => level.set(n.id, n.level));
  else {
    const out = new Map(nodes.map(n => [n.id, []])), und = new Map(nodes.map(n => [n.id, []]));
    for (const e of edges) { out.get(e.from)?.push(e.to); und.get(e.from)?.push(e.to); und.get(e.to)?.push(e.from); }
    const root = ex.layout.root && level.has(ex.layout.root) === false ? ex.layout.root : nodes[0].id;
    const q = [root]; level.set(root, 0);
    while (q.length) { const id = q.shift(); for (const t of out.get(id) || []) if (!level.has(t)) { level.set(t, level.get(id) + 1); q.push(t); } }
    // unreachable by direction: attach by undirected distance
    const q2 = [...level.keys()];
    while (q2.length) { const id = q2.shift(); for (const t of und.get(id) || []) if (!level.has(t)) { level.set(t, level.get(id) + 1); q2.push(t); } }
    for (const n of nodes) if (!level.has(n.id)) level.set(n.id, 0);
    for (const n of nodes) if (Number.isInteger(n.level)) level.set(n.id, n.level);
  }

  for (const n of nodes) { const l = level.get(n.id); if (!layers.has(l)) layers.set(l, []); layers.get(l).push(n); }
  const order = [...layers.keys()].sort((a, b) => a - b);
  const pos = new Map();
  const right = ex.layout.direction === 'right';
  const GAP_L = right ? 26 : 18, GAP_S = right ? 9 : 14;
  // barycentre ordering pass to reduce crossings
  const parents = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) if (level.get(e.to) > level.get(e.from)) parents.get(e.to).push(e.from);
  const xOf = new Map();
  for (const l of order) {
    const arr = layers.get(l);
    if (l !== order[0]) arr.sort((a, b) => {
      const pa = parents.get(a.id).filter(p => xOf.has(p)), pb = parents.get(b.id).filter(p => xOf.has(p));
      const ma = pa.length ? pa.reduce((s, p) => s + xOf.get(p), 0) / pa.length : 0;
      const mb = pb.length ? pb.reduce((s, p) => s + xOf.get(p), 0) / pb.length : 0;

function ringLayout(ex) {
  const nodes = ex.nodes;
  const onRing = nodes.filter(n => Number.isInteger(n.order) && !Array.isArray(n.pos));
  const R = Math.max(22, onRing.length * 4.2);
  const pinned = new Map();
  onRing.sort((a, b) => a.order - b.order).forEach((n, i) => { const t = Math.PI / 2 - (i / onRing.length) * Math.PI * 2; pinned.set(n.id, new THREE.Vector3(Math.cos(t) * R, Math.sin(t) * R, 0)); });
  for (const n of nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  if (pinned.size === nodes.length) return pinned;
  return forceLayout(nodes, ex.edges, pinned, 7, { radius: R * 0.5, flat: true, rest: 12 });
}

function planeLayout(ex) {
  const pinned = new Map();
  for (const n of ex.nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  if (pinned.size === ex.nodes.length) return pinned;
  return forceLayout(ex.nodes, ex.edges, pinned, 11, { flat: true, rest: 14 });
}

function computeLayout(ex) {
  const mode = ex.layout?.mode || 'force';
  if (mode === 'tree') return treeLayout(ex);
  if (mode === 'ring') return ringLayout(ex);
  if (mode === 'plane') return planeLayout(ex);
  const pinned = new Map();
  for (const n of ex.nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  return forceLayout(ex.nodes, ex.edges, pinned, 3);
