<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel .lab { display: inline-block; transform: translateY(11px); }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"framework":{"slug":"polya-four-step","name":"Pólya's 4-Step Method","category":"03-engineering-and-cognitive","wikipedia":"https://en.wikipedia.org/wiki/How_to_Solve_It","one_liner":"Understand the problem, devise a plan, carry out the plan, look back: four phases that force the unknown, the data and the condition into the open before anyone calculates."},"slots":[{"id":"phase","label":"Phase","typical_provenance":"schema","structural":true,"description":"Understand, Plan, Carry out, Look back. Polya's four phases, drawn as scaffolding rather than content.","color":"#898781","shape":"box"},{"id":"problem","label":"Problem","typical_provenance":"fact","description":"The problem as posed, in the words in which it arrives.","color":"#d95926","shape":"box"},{"id":"unknown","label":"Unknown","typical_provenance":"either","description":"What is sought: the one quantity or object the whole exercise is for.","color":"#8e6bd9","shape":"diamond"},{"id":"data","label":"Data","typical_provenance":"fact","description":"What is given: the numbers, objects and notation the solver may use.","color":"#3987e5","shape":"sphere"},{"id":"condition","label":"Condition","typical_provenance":"either","description":"How the unknown and the data are connected; the relation the solution must respect.","color":"#4ec9b0","shape":"cone"},{"id":"plan","label":"Plan","typical_provenance":"derived","description":"The approach chosen, including the analogous or simpler problem it borrows from (Polya's 'related problem', marked attrs.kind = analogy).","color":"#2f9e63","shape":"box"},{"id":"step","label":"Step","typical_provenance":"derived","description":"A verifiable step in carrying out the plan.","color":"#4fc1ff","shape":"sphere"},{"id":"check","label":"Check","typical_provenance":"derived","description":"How a step or the result is verified; in Polya's words, can you check the result, can you check the argument.","color":"#c4384a","shape":"diamond"},{"id":"generalization","label":"Generalization","typical_provenance":"derived","description":"Look back: the heuristic or result that transfers to other problems.","color":"#ff7ab2","shape":"cone"}],"relations":[{"id":"in_phase","label":"in phase","description":"node belongs to one of the four phases"},{"id":"states","label":"states","description":"the problem as posed states the unknown, the data or the condition"},{"id":"connects","label":"connects","description":"condition connects unknown and data"},{"id":"borrows_from","label":"borrows from","description":"plan borrows from an analogous or simpler solved problem (a plan node with attrs.kind = analogy)"},{"id":"executes","label":"executes","description":"plan is executed by steps"},{"id":"uses","label":"uses","description":"a step or plan consumes a datum, a quantity from the problem, or the output of an earlier step"},{"id":"verifies","label":"verifies","description":"check verifies a step or the result"},{"id":"generalizes","label":"generalizes","description":"generalization generalizes the plan or the result"}],"examples":[{"id":"classic","kind":"classic","title":"The diagonal of a rectangular parallelepiped","summary":"Polya's own worked example: the teacher's questions extract the unknown, the data and the condition, the student names the related problem but cannot use it, and the rest is supplied by the solver.","source":{"type":"text","title":"A classroom dialogue after Polya's worked example","text":"Find the diagonal of a rectangular parallelepiped whose length, width and height are known. The teacher asks what the unknown is. The student answers: the length of the diagonal of a parallelepiped. What are the data? The length, the width and the height of the parallelepiped. What is the condition? The diagonal is the segment joining two opposite corners, so its length must be determined by the three edges and nothing else. The student draws a box, marks the three edges a, b and c, and draws the diagonal from one corner to the corner furthest from it. Asked whether he knows a related problem, he answers that the diagonal of a rectangle is found from its two sides. Asked whether that helps here, he says he does not yet see how a plane figure helps with a solid. He guesses that the answer is a plus b plus c, and sees at once that this cannot be right, because the diagonal of a square of side one would then be two.","attribution":"After George Pólya, How to Solve It (1945), Part I; the dialogue is written for this example so that the fact nodes have something verbatim to quote."},"layout":{"mode":"plane","regions":[{"label":"PHASE 1 · 5 FACT · 0 DERIVED","x":[-61.5,-31.5],"y":[-40,44],"color":"#898781"},{"label":"PHASE 2 · 1 FACT · 1 DERIVED","x":[-30.5,-0.5],"y":[-40,44],"color":"#898781"},{"label":"PHASE 3 · 2 FACT · 3 DERIVED","x":[0.5,30.5],"y":[-40,44],"color":"#898781"},{"label":"PHASE 4 · 0 FACT · 4 DERIVED","x":[31.5,61.5],"y":[-40,44],"color":"#898781"}],"annotations":[{"pos":[15.5,-37],"text":"The solution steps: all inferred"},{"pos":[46.5,-37],"text":"Every node here is LLM-derived"}],"camera":{"distance":100}},"nodes":[{"id":"cph_understand","slot":"phase","label":"Understand the problem","text":"Phase 1. What is the unknown, what are the data, what is the condition. Polya's rule: you cannot answer a question you do not understand.","provenance":"schema","pos":[-46.5,34.5],"size":1.25},{"id":"cph_plan","slot":"phase","label":"Devise a plan","text":"Phase 2. Find the connection between the data and the unknown, usually by way of a related problem already solved, or an auxiliary element.","provenance":"schema","pos":[-15.5,34.5],"size":1.25},{"id":"cph_carry","slot":"phase","label":"Carry out the plan","text":"Phase 3. Execute the steps and check each one as you go. Can you see clearly that the step is correct.","provenance":"schema","pos":[15.5,34.5],"size":1.25},{"id":"cph_look","slot":"phase","label":"Look back","text":"Phase 4. Examine the solution obtained: check the result, check the argument, and ask whether the method can be used for another problem.","provenance":"schema","pos":[46.5,34.5],"size":1.25},{"id":"cp1","slot":"problem","label":"Diagonal of a parallelepiped","text":"Find the diagonal of a rectangular parallelepiped whose length, width and height are known.","provenance":"fact","source_quote":"Find the diagonal of a rectangular parallelepiped whose length, width and height are known.","source_ref":"sentence 1","pos":[-46.5,24],"size":1.15},{"id":"cu1","slot":"unknown","label":"Unknown: the diagonal's length","text":"The unknown, named in answer to the teacher's first question: the length of the diagonal of a parallelepiped.","provenance":"fact","source_quote":"the length of the diagonal of a parallelepiped","source_ref":"sentences 2-3","pos":[-55.5,10]},{"id":"cd1","slot":"data","label":"Given: length, width, height","text":"The data: the length, the width and the height of the parallelepiped. Three numbers, and nothing else is given.","provenance":"fact","source_quote":"The length, the width and the height of the parallelepiped","source_ref":"sentence 5","pos":[-52.5,-18]},{"id":"cd2","slot":"data","label":"Figure drawn, edges a, b, c","text":"The figure and the notation, which Polya counts as part of understanding the problem: a box is drawn, its three edges are marked a, b and c, and the diagonal is drawn from one corner to the corner furthest from it.","provenance":"fact","source_quote":"The student draws a box, marks the three edges a, b and c","source_ref":"sentence 8","pos":[-44,-32]},{"id":"cc1","slot":"condition","label":"Three edges fix the diagonal","text":"The condition: the diagonal is the segment joining two opposite corners, so its length must be determined by the three edges and nothing else.","provenance":"fact","source_quote":"its length must be determined by the three edges and nothing else","source_ref":"sentence 7","pos":[-44,-4]},{"id":"ca1","slot":"plan","label":"Related: diagonal of a rectangle","text":"The related problem the student produces when asked: the diagonal of a rectangle is found from its two sides. It has the same kind of unknown, one dimension lower.","provenance":"fact","attrs":{"kind":"analogy"},"source_quote":"the diagonal of a rectangle is found from its two sides","source_ref":"sentence 9","pos":[-15.5,20]},{"id":"cpl1","slot":"plan","label":"Pythagoras twice, face diagonal","text":"Introduce an auxiliary element, the diagonal of the base rectangle. It splits the solid problem into two plane problems, each of them the related problem: Pythagoras in the base, then Pythagoras in the vertical right triangle standing on it.","provenance":"derived","confidence":0.9,"rationale":"The source states the related problem and states that the student cannot use it: he 'does not yet see how a plane figure helps with a solid' (sentence 10). The bridge between them - draw the base diagonal and the solid becomes two right triangles - is exactly what the dialogue withholds, and it is close to forced once the figure, the notation and the related problem are all on the table.","pos":[-15.5,-1]},{"id":"cs0","slot":"step","label":"First guess: a + b + c","text":"A step taken before any plan exists: the student guesses that the answer is a plus b plus c.","provenance":"fact","source_quote":"He guesses that the answer is a plus b plus c","source_ref":"sentence 11","pos":[15.5,24]},{"id":"ck0","slot":"check","label":"Unit square refutes the guess","text":"The check that kills the guess on the spot: for a square of side one the guess would make the diagonal two.","provenance":"fact","source_quote":"the diagonal of a square of side one would then be two","source_ref":"sentence 11","pos":[11.5,9]},{"id":"cs1","slot":"step","label":"Face diagonal e, e² = a² + b²","text":"In the base rectangle the diagonal e satisfies e squared = a squared + b squared, by the Pythagorean theorem applied at the right angle between the edges a and b.","provenance":"derived","confidence":0.9,"rationale":"Forced by the plan together with the notation already in the source: the base is a rectangle of sides a and b, so its diagonal is fixed by the related problem the student himself named. The source never performs the step.","pos":[15.5,-1]},{"id":"cs2","slot":"step","label":"Right triangle on the base: e, c","text":"The edge c is perpendicular to the base, so e and c are the legs of a right triangle whose hypotenuse is the diagonal d that was sought.","provenance":"derived","confidence":0.88,"rationale":"Follows from what a rectangular parallelepiped is, which the problem statement names but never unpacks. The perpendicularity is the permission to apply the related problem a second time, and it is the step that makes the plan work rather than merely sound plausible.","pos":[15.5,-15]},{"id":"cs3","slot":"step","label":"d = √(a² + b² + c²)","text":"Therefore d squared = e squared + c squared = a squared + b squared + c squared, and the diagonal is the square root of the sum of the squares of the three edges.","provenance":"derived","confidence":0.92,"rationale":"Substitution of the two previous steps, arithmetic once they are granted. It is the answer to the unknown the source poses and never reaches.","pos":[15.5,-29]},{"id":"ck1","slot":"check","label":"Dimensions: degree one in length","text":"Check the result by dimension: the expression is homogeneous of degree one in length, so the diagonal comes out in the units of the edges, and scaling every edge by k scales d by k.","provenance":"derived","confidence":0.8,"rationale":"Polya's 'can you check the result' applied to the formula the steps produce. The dialogue checks only the rejected guess, so every test of the answer itself is the reader's inference, not the source's.","pos":[46.5,24]},{"id":"ck2","slot":"check","label":"Special cases: c = 0, a = b = c","text":"Check the result against answers already known: with c = 0 the formula collapses to the diagonal of a rectangle, which is the related problem; with a = b = c it gives a times the square root of three, the diagonal of a cube. The expression is also symmetric in a, b and c, as the box is.","provenance":"derived","confidence":0.85,"rationale":"Each case is an answer that is known independently and that the formula has to reproduce, and the c = 0 case closes the loop back to the related problem stated in sentence 9. None of it happens in the dialogue.","pos":[46.5,4]},{"id":"cg1","slot":"generalization","label":"Auxiliary element: 3-D to 2-D","text":"The method rather than the formula is what transfers: when a problem in three dimensions resists, introduce an auxiliary element that reduces it to a problem in two dimensions you have already solved.","provenance":"derived","confidence":0.85,"rationale":"Generalises the plan that the steps executed. Polya's fourth phase asks whether the method can be used for another problem; the dialogue ends before that question is put.","pos":[46.5,-16]},{"id":"cg2","slot":"generalization","label":"Same argument in n dimensions","text":"The same two-step argument runs in any number of dimensions: the diagonal of an n-dimensional box is the square root of the sum of the squares of its edges, by induction on the same auxiliary element.","provenance":"derived","confidence":0.8,"rationale":"The steps never used the fact that there are exactly three edges, only that one edge is perpendicular to the plane of the others, so the argument iterates. The source does not mention the extension.","pos":[46.5,-28]}],"edges":[{"id":"cip_cp1","from":"cp1","to":"cph_understand","relation":"in_phase","provenance":"schema"},{"id":"cip_cu1","from":"cu1","to":"cph_understand","relation":"in_phase","provenance":"schema"},{"id":"cip_cd1","from":"cd1","to":"cph_understand","relation":"in_phase","provenance":"schema"},{"id":"cip_cd2","from":"cd2","to":"cph_understand","relation":"in_phase","provenance":"schema"},{"id":"cip_cc1","from":"cc1","to":"cph_understand","relation":"in_phase","provenance":"schema"},{"id":"cip_ca1","from":"ca1","to":"cph_plan","relation":"in_phase","provenance":"schema"},{"id":"cip_cpl1","from":"cpl1","to":"cph_plan","relation":"in_phase","provenance":"schema"},{"id":"cip_cs0","from":"cs0","to":"cph_carry","relation":"in_phase","provenance":"schema"},{"id":"cip_ck0","from":"ck0","to":"cph_carry","relation":"in_phase","provenance":"schema"},{"id":"cip_cs1","from":"cs1","to":"cph_carry","relation":"in_phase","provenance":"schema"},{"id":"cip_cs2","from":"cs2","to":"cph_carry","relation":"in_phase","provenance":"schema"},{"id":"cip_cs3","from":"cs3","to":"cph_carry","relation":"in_phase","provenance":"schema"},{"id":"cip_ck1","from":"ck1","to":"cph_look","relation":"in_phase","provenance":"schema"},{"id":"cip_ck2","from":"ck2","to":"cph_look","relation":"in_phase","provenance":"schema"},{"id":"cip_cg1","from":"cg1","to":"cph_look","relation":"in_phase","provenance":"schema"},{"id":"cip_cg2","from":"cg2","to":"cph_look","relation":"in_phase","provenance":"schema"},{"id":"ces1","from":"cp1","to":"cu1","relation":"states","provenance":"fact","source_quote":"The teacher asks what the unknown is. The student answers: the length of the diagonal of a parallelepiped.","source_ref":"sentences 2-3"},{"id":"ces2","from":"cp1","to":"cd1","relation":"states","provenance":"fact","source_quote":"What are the data? The length, the width and the height of the parallelepiped.","source_ref":"sentences 4-5"},{"id":"ces3","from":"cp1","to":"cc1","relation":"states","provenance":"fact","source_quote":"What is the condition? The diagonal is the segment joining two opposite corners, so its length must be determined by the three edges","source_ref":"sentences 6-7"},{"id":"cec1","from":"cc1","to":"cu1","relation":"connects","provenance":"fact","source_quote":"its length must be determined by the three edges and nothing else","source_ref":"sentence 7"},{"id":"cec2","from":"cc1","to":"cd1","relation":"connects","provenance":"fact","source_quote":"The diagonal is the segment joining two opposite corners, so its length must be determined by the three edges","source_ref":"sentence 7"},{"id":"cev0","from":"ck0","to":"cs0","relation":"verifies","provenance":"fact","label":"refutes","source_quote":"He guesses that the answer is a plus b plus c, and sees at once that this cannot be right, because the diagonal of a square of side one would then be two.","source_ref":"sentence 11"},{"id":"ceu0","from":"cd2","to":"cd1","relation":"uses","provenance":"derived","confidence":0.85,"rationale":"The three edges marked a, b and c in sentence 8 are the three lengths given in sentence 5; the text names them in different words in adjacent sentences and never says they are the same three."},{"id":"ceu1","from":"cs0","to":"cd1","relation":"uses","provenance":"derived","confidence":0.8,"rationale":"The guess a plus b plus c consumes exactly the three given lengths. The source states the guess but not that it is built out of the data."},{"id":"ceb1","from":"cpl1","to":"ca1","relation":"borrows_from","provenance":"derived","confidence":0.9,"label":"same unknown, 2-D","rationale":"The plan is the related problem applied twice. Sentence 10 says explicitly that the student cannot see the link, so the link is the inference."},{"id":"cee1","from":"cpl1","to":"cs1","relation":"executes","provenance":"derived","confidence":0.92,"rationale":"First half of the plan: Pythagoras in the base rectangle."},{"id":"cee2","from":"cpl1","to":"cs2","relation":"executes","provenance":"derived","confidence":0.9,"rationale":"The plan's auxiliary element is what makes this right triangle available."},{"id":"cee3","from":"cpl1","to":"cs3","relation":"executes","provenance":"derived","confidence":0.9,"rationale":"Second half of the plan: Pythagoras in the vertical triangle, then substitution."},{"id":"ceu2","from":"cs1","to":"cd2","relation":"uses","provenance":"derived","confidence":0.9,"rationale":"The step is written in the notation introduced with the figure in sentence 8."},{"id":"ceu3","from":"cs2","to":"cd2","relation":"uses","provenance":"derived","confidence":0.88,"rationale":"The step uses the third marked edge c and the box drawn in sentence 8."},{"id":"ceu4","from":"cs2","to":"cs1","relation":"uses","provenance":"derived","confidence":0.92,"rationale":"The leg of this triangle is the face diagonal computed in the previous step."},{"id":"ceu5","from":"cs3","to":"cs2","relation":"uses","provenance":"derived","confidence":0.92,"rationale":"Substitutes the two legs of the triangle established in the previous step."},{"id":"cev1","from":"ck1","to":"cs3","relation":"verifies","provenance":"derived","confidence":0.85,"rationale":"A dimensional test of the expression the step produced."},{"id":"cev2","from":"ck2","to":"cs3","relation":"verifies","provenance":"derived","confidence":0.88,"rationale":"Special cases test the same expression against answers known in advance."},{"id":"ceu6","from":"ck2","to":"ca1","relation":"uses","provenance":"derived","confidence":0.8,"rationale":"The c = 0 case is the related problem; the check consumes it as a known answer."},{"id":"ceg1","from":"cg1","to":"cpl1","relation":"generalizes","provenance":"derived","confidence":0.85,"rationale":"Names what the plan did in a form that does not mention boxes."},{"id":"ceg2","from":"cg2","to":"cs3","relation":"generalizes","provenance":"derived","confidence":0.8,"rationale":"Extends the result, not the method, to n dimensions."},{"id":"cesb1","from":"cs3","to":"cu1","relation":"supported_by","provenance":"derived","confidence":0.9,"rationale":"The expression is an answer only because the unknown was named as a length."},{"id":"cesb2","from":"ck1","to":"cd1","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The dimensional check works because the data are three lengths."},{"id":"cesb3","from":"cg1","to":"ca1","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The general heuristic is read off the one related problem the source supplies."},{"id":"cesb4","from":"cg2","to":"cd1","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The extension replaces the three given lengths by n of them."}]},{"id":"tbpn","kind":"tbpn","title":"What is six gigawatts of AMD chips worth?","summary":"A host poses a bounded sizing problem on air, two estimates four times apart are produced before anyone has a method, the method is then stated in full and never executed, and nobody looks back.","source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-10-06_openai-amd-deal-devday-reactions-xais-memphis-datacenter-doug-olaughlin-celine-halioua.md","date":"2025-10-06","episode_title":"OpenAI AMD deal, DevDay reactions, xAI's Memphis datacenter (Doug O'Laughlin, Celine Halioua)"},"why_this_episode":"A host states the unknown out loud ('can you estimate the dollar value of that'), the givens are quoted from the filing and from an analyst, and the plan is verbalised in order - watts per chip, divide into six gigawatts, multiply by price. Two incompatible estimates are produced before the plan exists, one is rejected without a reason, the plan is never carried out and nothing is looked back at, so the four phases are visible precisely by which of them the conversation skipped.","idea_bearing_slot":"generalization","layout":{"mode":"plane","regions":[{"label":"PHASE 1 · 7 FACT · 0 DERIVED","x":[-61.5,-31.5],"y":[-44,44],"color":"#898781"},{"label":"PHASE 2 · 2 FACT · 0 DERIVED","x":[-30.5,-0.5],"y":[-44,44],"color":"#898781"},{"label":"PHASE 3 · 3 FACT · 3 DERIVED","x":[0.5,30.5],"y":[-44,44],"color":"#898781"},{"label":"PHASE 4 · 0 FACT · 4 DERIVED","x":[31.5,61.5],"y":[-44,44],"color":"#898781"}],"annotations":[{"pos":[15.5,-41],"text":"The plan's three steps, never taken"},{"pos":[46.5,-34],"text":"Every node here is LLM-derived"}],"camera":{"distance":100}},"nodes":[{"id":"tph_understand","slot":"phase","label":"Understand the problem","text":"Phase 1. What is the unknown, what are the data, what is the condition. Polya's rule: you cannot answer a question you do not understand.","provenance":"schema","pos":[-46.5,34.5],"size":1.25},{"id":"tph_plan","slot":"phase","label":"Devise a plan","text":"Phase 2. Find the connection between the data and the unknown, usually by way of a related problem already solved, or an auxiliary element.","provenance":"schema","pos":[-15.5,34.5],"size":1.25},{"id":"tph_carry","slot":"phase","label":"Carry out the plan","text":"Phase 3. Execute the steps and check each one as you go. Can you see clearly that the step is correct.","provenance":"schema","pos":[15.5,34.5],"size":1.25},{"id":"tph_look","slot":"phase","label":"Look back","text":"Phase 4. Examine the solution obtained: check the result, check the argument, and ask whether the method can be used for another problem.","provenance":"schema","pos":[46.5,34.5],"size":1.25},{"id":"tp1","slot":"problem","label":"6 GW of AMD chips committed","text":"The problem as posed, in units of power: under the terms of the deal OpenAI committed to purchasing six gigawatts worth of AMD chips.","provenance":"fact","source_quote":"Under the terms of the deal, OpenAI committed to purchasing six gigawatts worth of AMD chips.","source_ref":"host reading the WSJ, L1394-L1398","entities":["OpenAI","AMD"],"pos":[-46.5,24],"size":1.15},{"id":"tu1","slot":"unknown","label":"Unknown: dollar value of 6 GW","text":"The unknown, put by a host to the show's researcher: what is six gigawatts of AMD chips worth in dollars, if the chips are MI-450 equivalents?","provenance":"fact","source_quote":"six gigawatts of AMD chips. Can you estimate the dollar value of that if it's MI 40, 450 equivalence?","source_ref":"host to Tyler, L1690-L1692","entities":["AMD","AMD MI-450"],"pos":[-46.5,14]},{"id":"tc1","slot":"condition","label":"Orders denominated in energy","text":"The condition, noticed in passing: GPU orders are now quoted in energy demand, so any dollar figure has to be reached through a conversion from power to chips.","provenance":"fact","source_quote":"we're now just referring to GPU orders based on their energy demands","source_ref":"host, L1400-L1402","entities":[],"pos":[-46.5,4]},{"id":"td1","slot":"data","label":"Tens of billions per gigawatt","text":"A given from AMD itself: the plan costs tens of billions of dollars per gigawatt of computing capacity. The two companies did not disclose the overall expected cost.","provenance":"fact","source_quote":"AMD said it costs tens of billions of dollars per gigawatt of computing capacity","source_ref":"host reading the WSJ, L1458","entities":["AMD"],"pos":[-46.5,-6]},{"id":"td2","slot":"data","label":"$50B per gigawatt, recalled","text":"A second per-gigawatt price, recalled by the researcher from an analyst: around fifty billion dollars per gigawatt. The attribution is unintelligible in the transcript and the number is never sourced on air.","provenance":"fact","source_quote":"he said it's like around 50 billion per gigawatt","source_ref":"Tyler, L1694","entities":[],"pos":[-46.5,-16]},{"id":"td3","slot":"data","label":"1 GW MI-450 starts H2 next year","text":"The ramp: OpenAI will begin with one gigawatt worth of MI-450 chips in the second half of next year, so the six gigawatts arrives in stages.","provenance":"fact","source_quote":"open AI is going to begin with one gigawatt worth of MI 450 chips starting in the second half of next year to run its AI models.","source_ref":"host, L1600-L1602","entities":["OpenAI","AMD MI-450"],"pos":[-46.5,-26]},{"id":"td4","slot":"data","label":"AMD: tens of billions by 2027","text":"A given from the other side of the deal: Lisa Su told investors the agreement would give AMD tens of billions of dollars of revenue by 2027.","provenance":"fact","source_quote":"would give AMD tens of billions of dollars of revenue by 2027","source_ref":"host reading the WSJ on Lisa Su's investor call, L1676-L1678","entities":["AMD","Lisa Su"],"pos":[-46.5,-36]},{"id":"tpl1","slot":"plan","label":"Plan: watts per chip, then price","text":"The plan, stated out loud and in order: find the energy use of a single MI-450, divide six gigawatts by it to get the number of chips, then multiply by the price of a chip.","provenance":"fact","source_quote":"what is the energy use of a single MI-450, and then divide that by six gigawatts to get me, like, how many chips are they going to buy, and then what's the price of the chip, so multiply that","source_ref":"host, L1698-L1712","entities":["AMD MI-450"],"pos":[-15.5,20],"size":1.15},{"id":"ta1","slot":"plan","label":"Related: 1 GW ≈ 800,000 homes","text":"The same episode performs the conversion for electricity rather than for silicon: a new plant capable of generating over a gigawatt, enough to power around 800,000 homes.","provenance":"fact","attrs":{"kind":"analogy"},"source_quote":"capable of generating over a gigawatt of electricity enough to power around 800,000 homes","source_ref":"host reading the WSJ on xAI in Memphis, L1744","entities":["XAI","Elon Musk"],"pos":[-15.5,-14]},{"id":"ts0","slot":"step","label":"Estimate 1: almost $100B","text":"The first estimate, produced from AMD's per-gigawatt figure before anyone had asked what the answer depended on: almost a hundred billion dollars.","provenance":"fact","source_quote":"So we're looking at almost a hundred billion dollar deal","source_ref":"host, L1460","entities":["AMD"],"pos":[15.5,24]},{"id":"ts0b","slot":"step","label":"Estimate 2: $400B?","text":"The second estimate, produced from the recalled fifty billion per gigawatt: a four hundred billion dollar deal.","provenance":"fact","source_quote":"Wait, so this is like a 400 billion dollar deal?","source_ref":"host, L1694-L1696","entities":[],"pos":[15.5,15]},{"id":"tk0","slot":"check","label":"“That's totally wrong”","text":"The host rejects his own second estimate at once, without saying what is wrong with it or what would replace it.","provenance":"fact","source_quote":"I think, wait, that's totally wrong","source_ref":"host, L1696-L1698","entities":[],"pos":[15.5,2]},{"id":"ts1","slot":"step","label":"Step not taken: watts per chip","text":"Establish the power draw of one MI-450 as deployed, measured at the rack so that cooling and networking are inside the number. This is the first input the stated plan asks for.","provenance":"derived","confidence":0.85,"rationale":"The plan at L1698-L1712 names this as its first input and nobody supplies it; the semiconductor analyst in the next segment is asked about where the power will come from instead (L2286). Measuring at the rack rather than at the die is forced by the data: six gigawatts is facility power, so the divisor has to be facility power per accelerator.","pos":[15.5,-13]},{"id":"ts2","slot":"step","label":"Step not taken: chip count","text":"Divide six gigawatts of committed capacity by the per-accelerator draw to get the number of MI-450s the order covers.","provenance":"derived","confidence":0.85,"rationale":"Second step of the stated plan, never carried out in the episode. The quoted plan inverts its own division ('divide that by six gigawatts'), which is another reason the step has to be reconstructed rather than read off.","pos":[15.5,-23]},{"id":"ts3","slot":"step","label":"Step not taken: count × price","text":"Multiply the accelerator count by the price of one MI-450 to get the dollar value of the six-gigawatt commitment, which is the unknown as posed.","provenance":"derived","confidence":0.82,"rationale":"Third step of the stated plan and the one that would answer the question at L1690-L1692. Derived because the multiplication is never performed and no unit price is ever stated by anyone on the show.","pos":[15.5,-33]},{"id":"tk1","slot":"check","label":"Two estimates differ fourfold","text":"The two figures already on the table are incompatible: about a hundred billion read off 'tens of billions per gigawatt', and four hundred billion asserted from fifty billion per gigawatt, which would in any case give three hundred billion across six gigawatts. At most one of them survives.","provenance":"derived","confidence":0.9,"rationale":"Both estimates are facts in the source. That they exclude each other, and that fifty billion times six gigawatts is three hundred billion rather than four hundred, is arithmetic the episode never performs. This is Polya's 'examine the result' applied to two results at once.","pos":[43,22]},{"id":"tk2","slot":"check","label":"Check against AMD's guidance","text":"Bound the per-gigawatt price with AMD's own disclosure. Tens of billions of dollars of revenue by 2027 cannot sit under a six-gigawatt order priced at fifty billion per gigawatt unless most of the capacity lands after 2027, is bought through cloud partners, or is priced far below the recalled figure.","provenance":"derived","confidence":0.75,"rationale":"Uses the revenue guidance at L1676-L1678 and the phased start at L1600-L1602 as an independent bound on the per-gigawatt number at L1694. The source states all three and never puts them side by side.","pos":[51,6]},{"id":"tg1","slot":"generalization","label":"Convert the unit before pricing","text":"The heuristic that transfers: when an order is denominated in a unit you cannot price - gigawatts, tokens, square feet of fab - do not estimate in that unit. Convert it into countable physical things first, price the things, and treat the conversion rate itself as the thing being estimated.","provenance":"derived","confidence":0.7,"rationale":"Generalises the plan the host states and never executes (L1698-L1712) together with the conversion the same episode performs for electricity but not for silicon (L1744). Polya's fourth phase; the episode never reaches it, so all of it is inference.","idea":"AI infrastructure is announced in gigawatts but underwritten in accelerators and dollars, so a per-gigawatt bill of materials - watts, racks, accelerators and price per accelerator generation - is a product that analysts, lenders and reporters on this beat currently rebuild by hand for every announcement.","pos":[42,-6]},{"id":"tg2","slot":"generalization","label":"The fourfold spread is the gap","text":"The size of the disagreement is itself the finding. A live fourfold spread on the headline value of an agreement both parties call definitive says the conversion layer between energy, silicon and dollars is missing rather than merely unpublished.","provenance":"derived","confidence":0.6,"rationale":"Reads the contradiction found in tk1 as a market fact rather than a slip. Contestable, since the spread could be ordinary day-one noise; the evidence for the stronger reading is that nobody closes it on air with a semiconductor analyst waiting in the next segment.","idea":"The distance between a hundred-billion and a four-hundred-billion reading of the same announcement is the opportunity: a priced, versioned translation layer from gigawatts to accelerators to dollars would be bought by anyone who has to underwrite, report on or trade these deals within the hour.","pos":[50,-22]}],"edges":[{"id":"tip_tp1","from":"tp1","to":"tph_understand","relation":"in_phase","provenance":"schema"},{"id":"tip_tu1","from":"tu1","to":"tph_understand","relation":"in_phase","provenance":"schema"},{"id":"tip_tc1","from":"tc1","to":"tph_understand","relation":"in_phase","provenance":"schema"},{"id":"tip_td1","from":"td1","to":"tph_understand","relation":"in_phase","provenance":"schema"},{"id":"tip_td2","from":"td2","to":"tph_understand","relation":"in_phase","provenance":"schema"},{"id":"tip_td3","from":"td3","to":"tph_understand","relation":"in_phase","provenance":"schema"},{"id":"tip_td4","from":"td4","to":"tph_understand","relation":"in_phase","provenance":"schema"},{"id":"tip_tpl1","from":"tpl1","to":"tph_plan","relation":"in_phase","provenance":"schema"},{"id":"tip_ta1","from":"ta1","to":"tph_plan","relation":"in_phase","provenance":"schema"},{"id": f":"host, L1706-L1708"},{"id":"tec1","from":"tc1","to":"tu1","relation":"connects","provenance":"derived","confidence":0.8,"rationale":"The host's remark at L1400-L1402 says orders are quoted in energy; that this is what stands between the question and an answer in dollars is the framework's reading, not a claim anyone makes."},{"id":"tec2","from":"tc1","to":"td1","relation":"connects","provenance":"derived","confidence":0.8,"rationale":"The per-gigawatt price is usable only because the order is denominated in power. The source puts the two facts three hundred lines apart and never joins them."},{"id":"teb1","from":"tpl1","to":"ta1","relation":"borrows_from","provenance":"derived","confidence":0.55,"label":"same conversion","rationale":"Converting a gigawatt into 800,000 homes is the already-solved version of the conversion the plan needs. The link crosses two segments of the episode and two speakers' material, and nobody on air draws it."},{"id":"tee1","from":"tpl1","to":"ts1","relation":"executes","provenance":"derived","confidence":0.9,"rationale":"First input named by the plan."},{"id":"tee2","from":"tpl1","to":"ts2","relation":"executes","provenance":"derived","confidence":0.9,"rationale":"The division named by the plan."},{"id":"tee3","from":"tpl1","to":"ts3","relation":"executes","provenance":"derived","confidence":0.85,"rationale":"The multiplication named by the plan, which would answer the unknown."},{"id":"teu3","from":"ts2","to":"ts1","relation":"uses","provenance":"derived","confidence":0.9,"rationale":"The divisor is the output of the previous step."},{"id":"teu4","from":"ts3","to":"ts2","relation":"uses","provenance":"derived","confidence":0.9,"rationale":"The multiplicand is the chip count from the previous step."},{"id":"tev1","from":"tk1","to":"ts0","relation":"verifies","provenance":"derived","confidence":0.9,"rationale":"The hundred-billion estimate is one of the two results being compared."},{"id":"tev2","from":"tk1","to":"ts0b","relation":"veri function planeLayout(ex) {

function makeNode(n, p) {

  } else if (n.provenance === 'derived') {

    halo = new THREE.LineSegments(new THREE.WireframeGeometry(GEO[st.shape](r * 1.35)), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.75 }));

  }

  hit.userData.nodeId = n.id; obj.add(hit);

  // mark it so a reader can find the payoff without opening every panel.
  if (n.idea) {

    ring.userData.isIdeaRing = true; obj.add(ring);
  }

  const el = document.createElement('div'); el.className = 'nlabel ' + n.provenance;
  const g = document.createElement('span'); g.className = 'g'; g.textContent = glyph; g.style.color = n.provenance === 'schema' ? MUTED : st.color;
  const inner = document.createElement('span'); inner.className = 'lab';

}

function makeEdge(e, A, B) {

  const dir = new THREE.Vector3().subVectors(to, from); const len = dir.length(); dir.normalize();
  const a = from.clone().addScaledVector(dir, A.r * 1.05), b = to.clone().addScaledVector(dir, -(B.r * 1.05 + (e.relation === 'supported_by' ? 0 : 1.6)));

  if (grounding) mat = new THREE.LineDashedMaterial({ color: new THREE.Color(MUTED), dashSize: 0.5, gapSize: 0.9, transparent: true, opacity: 0.55 });
  else if (e.provenance === 'derived') mat = new THREE.LineDashedMaterial({ color: new THREE.Color(INK2), dashSize: 1.4, gapSize: 0.9, transparent: true, opacity: 0.8 });
  else if (e.provenance === 'schema') mat = new THREE.LineBasicMaterial({ color: new THREE.Color(HAIRLINE), transparent: true, opacity: 0.9 });

    arrow = new THREE.Mesh(new THREE.ConeGeometry(0.75, 2.0, 10), new THREE.MeshBasicMaterial({ color: e.provenance === 'derived' ? new THREE.Color(INK2) : new THREE.Color(INK2), transparent: true, opacity: e.provenance === 'derived' ? 0.7 : 0.95 }));
    arrow.position.copy(to).addScaledVector(dir, -(B.r * 1.05 + 1.0));

function drawDecor(ex, parent, bbox, offset) {

  // are authored in the same space as node positions. Shift the decor by the same amount so a
  // region or axis lines up with its nodes without the author having to centre on the origin.

  parent.add(group);

  const z = -0.6;
  const lineMat = new THREE.LineBasicMaterial({ color: new THREE.Color(0x4a4a47) });
  const dashMat = new THREE.LineDashedMaterial({ color: new THREE.Color(0x4a4a47), dashSize: 1.2, gapSize: 1.0 });
  for (const r of (L.regions || [])) {
    const w = Math.abs(r.x[1] - r.x[0]), h = Math.abs(r.y[1] - r.y[0]);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(r.color || '#3987e5'), transparent: true, opacity: 0.07, depthWrite: false }));
    m.position.set((r.x[0] + r.x[1]) / 2, (r.y[0] + r.y[1]) / 2, z - 0.5); group.add(m);
    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)), new THREE.LineBasicMaterial({ color: new THREE.Color(r.color || '#3987e5'), transparent: true, opacity: 0.25 }));
    edge.position.copy(m.position); group.add(edge);
    // Caption sits top-centre INSIDE the band. CSS2D centres its box on the position, so anchoring
    // at the corner made every caption straddle the boundary and builders patched it page-side.
    const lab = label2d(r.label, 'rlabel'); lab.position.set((r.x[0] + r.x[1]) / 2, Math.max(r.y[0], r.y[1]) - 3, z); group.add(lab);
    bbox.expandByPoint(shift(new THREE.Vector3(r.x[0], r.y[0], 0))); bbox.expandByPoint(shift(new THREE.Vector3(r.x[1], r.y[1], 0)));
  }
  // Free-standing captions. Without this a builder has to fake one with a zero-length guide.
  for (const an of (L.annotations || [])) {
    const lab = label2d(an.text, an.style === 'axis' ? 'axlabel' : an.style === 'region' ? 'rlabel' : 'glabel');
    lab.position.set(an.pos[0], an.pos[1], an.pos[2] ?? z); group.add(lab);
    bbox.expandByPoint(shift(new THREE.Vector3(an.pos[0], an.pos[1], 0)));
  }
  for (const gd of (L.guides || [])) {
    const a = new THREE.Vector3(gd.from[0], gd.from[1], gd.from[2] || z), b = new THREE.Vector3(gd.to[0], gd.to[1], gd.to[2] || z);
    const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), gd.style === 'dashed' ? dashMat : lineMat); ln.computeLineDistances(); group.add(ln);
    if (gd.label) { const lab = label2d(gd.label, 'glabel'); lab.position.copy(a).lerp(b, 0.5); group.add(lab); }
    bbox.expandByPoint(shift(a)); bbox.expandByPoint(shift(b));
  }
  if (L.axes) {
    const ax = L.axes.x, ay = L.axes.y;
    const xmin = ax ? ax.min : bbox.min.x, xmax = ax ? ax.max : bbox.max.x, ymin = ay ? ay.min : bbox.min.y, ymax = ay ? ay.max : bbox.max.y;
    const pad = 6;
    if (ax) {
      const y = ymin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xmin, y, z), new THREE.Vector3(xmax, y, z)]), lineMat));
      const lab = label2d(ax.label, 'axlabel'); lab.position.set((xmin + xmax) / 2, y - 7.5, z); group.add(lab);
      for (const t of (ax.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(t.value, y - 1, z), new THREE.Vector3(t.value, y + 1, z)]), lineMat)); const tl = label2d(t.label, 'tick'); tl.position.set(t.value, y - 2.2, z); group.add(tl); }
      bbox.expandByPoint(shift(new THREE.Vector3(xmin, y - 9, 0))); bbox.expandByPoint(shift(new THREE.Vector3(xmax, y, 0)));
    }
    if (ay) {
      const x = xmin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, ymin, z), new THREE.Vector3(x, ymax, z)]), lineMat));
      const lab = label2d(ay.label, 'axlabel', 'rotate(-90deg)'); lab.position.set(x - 8, (ymin + ymax) / 2, z); group.add(lab);
      for (const t of (ay.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x - 1, t.value, z), new THREE.Vector3(x + 1, t.value, z)]), lineMat)); const tl = label2d(t.label, 'tick', 'translateX(-50%)'); tl.position.set(x - 2.5, t.value, z); group.add(tl); }
      bbox.expandByPoint(shift(new THREE.Vector3(x - 11, ymin, 0))); bbox.expandByPoint(shift(new THREE.Vector3(x, ymax, 0)));
    }
  }
}

// ---------- build an example ----------
function clearGroup() {
  if (!state.group) return;
  state.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); } if (o.isCSS2DObject && o.element) o.element.remove(); });
  scene.remove(state.group);
  $('labels').replaceChildren();
  state.group = null; state.nodes.clear(); state.edges = []; state.hit = []; state.hover = null; state.selected = null;
  $('panel').hidden = true;
}

function buildExample(i) {
  clearGroup();
  state.exampleIndex = i;
  const ex = GRAPH.examples[i];
  const group = new THREE.Group(); scene.add(group); state.group = group;
  const positions = computeLayout(ex);
  // centre
  const bbox = new THREE.Box3();
  for (const p of positions.values()) bbox.expandByPoint(p);
  const centre = bbox.getCenter(new THREE.Vector3());
  const decorOffset = ex.layout?.mode !== 'plane' ? centre.clone() : new THREE.Vector3();
  if (ex.layout?.mode !== 'plane') for (const p of positions.values()) p.sub(centre);
  const bbox2 = new THREE.Box3(); for (const p of positions.values()) bbox2.expandByPoint(p);
  for (const n of ex.nodes) { const rec = makeNode(n, positions.get(n.id)); state.nodes.set(n.id, rec); group.add(rec.obj); state.hit.push(rec.hit); }
  for (const e of ex.edges) {
    const A = state.nodes.get(e.from), B = state.nodes.get(e.to); if (!A || !B) continue;
    const rec = makeEdge(e, A, B); state.edges.push(rec); group.add(rec.grp); A.edges.push(rec); B.edges.push(rec);
  }
  drawDecor(ex, group, bbox2, decorOffset);
  // camera fit
  const size = bbox2.getSize(new THREE.Vector3()), c = bbox2.getCenter(new THREE.Vector3());
  state.fit = { size, centre: c, mode: ex.layout?.mode || 'force', distance: ex.layout?.camera?.distance };
  renderNote(ex);
  renderLegend(ex);    // legend first, so the camera fit can measure it
  resetView();
  applyVisibility();
  for (const b of $('examples').children) b.setAttribute('aria-pressed', String(b.dataset.index == i));
  try { window.__frameworkExtension?.({ THREE, scene, group, graph: GRAPH, example: ex, nodesById: state.nodes, positions, api: { slotStyle, label2d, colors: { INK, INK2, MUTED, HAIRLINE, SURFACE, SLOT_COLORS, SCHEMA_COLOR } } }); } catch (e) { console.error('framework extension failed', e); }
}

// Fit the graph into the part of the stage not covered by the legend (left) or the open panel (right),
// so labels are not hidden under the cards at the default view.
function safeArea(size) {
  const W = stage.clientWidth, H = stage.clientHeight;
  const sr = stage.getBoundingClientRect();
  let left = 0, top = 0, right = 0;
  const wide = W > 820;
  const leg = $('legend'); if (wide && leg && leg.offsetParent !== null) { const r = leg.getBoundingClientRect(); left = Math.max(left, r.right - sr.left + 16); }
  const panel = $('panel'); if (wide && panel && !panel.hidden) { const r = panel.getBoundingClientRect(); right = Math.max(right, sr.right - r.left + 16); }
  return { W, H, left, top, right, w: Math.max(200, W - left - right), h: Math.max(200, H - top) };
}
function resetView() {
  if (!state.fit) return;
  const { size, centre, mode } = state.fit;
  const sa = safeArea(size);
  const halfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const bottomPad = 30;                       // px: labels hang below the lowest row of nodes
  const availH = Math.max(150, sa.h - bottomPad);
  // distance at which the graph (plus margins) fits the safe area: the vertical FOV spans sa.H pixels
  const fitH = (size.y / 2 + 8) * sa.H / (halfFov * availH);
  const sidePad = 110;                       // px: labels are centred under nodes and stick out sideways
  const fitW = (size.x / 2 + 6) * sa.H / (halfFov * Math.max(200, sa.w - 2 * sidePad));
  const dist = state.fit.distance || Math.max(50, Math.max(fitH, fitW) * (mode === 'force' ? 1.3 : 1.08) + size.z / 2);
  // world units per pixel at the target depth; shift the centre so the graph sits in the safe area
  const wpp = (2 * dist * halfFov) / sa.H;
  const target = centre.clone().add(new THREE.Vector3(-((sa.left - sa.right) / 2) * wpp, ((sa.top - bottomPad) / 2) * wpp, 0));
  const camPos = mode === 'force' ? target.clone().add(new THREE.Vector3(dist * 0.3, dist * 0.22, dist * 0.92)) : target.clone().add(new THREE.Vector3(0, 0, dist));
  camera.position.copy(camPos); controls.target.copy(target);
  camera.near = 0.1; camera.far = 5000; camera.updateProjectionMatrix(); controls.update();
}

function applyVisibility() {
  for (const rec of state.nodes.values()) {
    const vis = rec.node.provenance !== 'derived' || state.showDerived;
    rec.obj.visible = vis;
    rec.label.visible = vis && state.showLabels;
    rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  for (const rec of state.edges) {
    const endsOk = rec.A.obj.visible && rec.B.obj.visible;
    // a derived edge is reasoning too: it goes away with the derived nodes, even when both its ends are facts
    const vis = endsOk && (!rec.grounding || state.showGrounding) && (rec.edge.provenance !== 'derived' || state.showDerived);
    rec.grp.visible = vis;
    if (rec.label) rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  // The idea key explains a marker; drop it when no idea node is on screen (e.g. the facts-only view).
  const ideaKey = $('legend')?.querySelector('.key-row.idea-key');
  if (ideaKey) ideaKey.style.display = [...state.nodes.values()].some(r => r.node.idea && r.obj.visible) ? '' : 'none';
  renderStats();
}

// ---------- legend / note / stats ----------
function renderLegend(ex) {
  const el = $('legend'); el.replaceChildren();
  const h = (t) => { const x = document.createElement('h2'); x.textContent = t; return x; };
  el.appendChild(h('Slots'));
  const counts = new Map(); for (const n of ex.nodes) counts.set(n.slot, (counts.get(n.slot) || 0) + 1);
  for (const s of GRAPH.slots) {
    const row = document.createElement('div'); row.className = 'slot-row';
    const chip = document.createElement('span'); const stl = slotStyle.get(s.id);
    chip.className = 'chip' + (stl.shape && stl.shape !== 'sphere' ? ' ' + stl.shape : ''); chip.style.background = stl.color;
    if (s.structural) chip.style.borderRadius = '2px';
    const name = document.createElement('span'); name.textContent = s.label;
    const tp = document.createElement('span'); tp.className = 'tp'; tp.textContent = s.structural ? 'schema' : (s.typical_provenance || '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = String(counts.get(s.id) || 0);
    row.append(chip, name, tp, n); row.title = s.description || ''; el.appendChild(row);
  }
  el.appendChild(h('Provenance'));
  const ideaCount = ex.nodes.filter(n => n.idea).length;
  const keys = [['●', 'fact: stated in the source (solid)'], ['◌', 'derived: LLM inference (translucent, dashed)'], ['▪', 'schema: framework scaffolding (grey)'], ['→', 'solid edge stated, dashed inferred'], ['⋯', 'grounding link: derived → fact']];
  if (ideaCount) keys.push(['★', 'gold ring: an opportunity this framework surfaces']);
  for (const [sym, txt] of keys) {
    const row = document.createElement('div'); row.className = 'key-row';
    if (sym === '★') row.classList.add('idea-key');
    const a = document.createElement('span'); a.className = 'sym'; a.textContent = sym; if (sym === '★') a.style.color = IDEA;
    const b = document.createElement('span'); b.textContent = txt; row.append(a, b); el.appendChild(row);
  }
  const st = document.createElement('div'); st.className = 'stats'; st.id = 'stats'; el.appendChild(st);
  renderStats();
}
function renderStats() {
  const st = $('stats'); if (!st) return;
  const ex = GRAPH.examples[state.exampleIndex];
  const nf = ex.nodes.filter(n => n.provenance === 'fact').length, nd = ex.nodes.filter(n => n.provenance === 'derived').length, ns = ex.nodes.filter(n => n.provenance === 'schema').length;
  const ef = ex.edges.filter(e => e.provenance === 'fact').length, ed = ex.edges.filter(e => e.provenance === 'derived' && e.relation !== 'supported_by').length, eg = ex.edges.filter(e => e.relation === 'supported_by').length;
  const visN = [...state.nodes.values()].filter(r => r.obj.visible).length, visE = state.edges.filter(r => r.grp.visible).length;
  st.replaceChildren();
  const line = (html) => { const d = document.createElement('div'); d.append(...html); st.appendChild(d); };
  const b = (t) => { const x = document.createElement('b'); x.textContent = t; return x; };
  line(['nodes ', b(String(nf)), ' fact · ', b(String(nd)), ' derived', ns ? ` · ${ns} schema` : '']);
  line(['edges ', b(String(ef)), ' fact · ', b(String(ed)), ' derived · ', b(String(eg)), ' grounding']);
  line([`showing ${visN} nodes, ${visE} edges`]);
}
function renderNote(ex) {
  const el = $('note'); el.replaceChildren();
  const h = document.createElement('h3'); h.textContent = ex.title || ex.id; el.appendChild(h);
  const p = document.createElement('p'); p.textContent = ex.summary || ''; el.appendChild(p);
  const s = document.createElement('div'); s.className = 'src';
  if (ex.source?.type === 'transcript') s.textContent = `TBPN ${ex.source.date} · ${ex.source.episode_title || ''}`;
  else if (ex.source?.type === 'text') s.textContent = `source: ${ex.source.title || 'scenario text'}`;
  el.appendChild(s);
}

// ---------- panel ----------
function openPanel(rec) {
  const n = rec.node, ex = GRAPH.examples[state.exampleIndex];
  const panel = $('panel'); panel.replaceChildren(); panel.hidden = false;
  const head = document.createElement('div'); head.className = 'p-head';
  const slotEl = document.createElement('div'); slotEl.className = 'p-slot';
  const chip = document.createElement('span'); chip.className = 'chip'; chip.style.background = rec.color; slotEl.append(chip, document.createTextNode((slotStyle.get(n.slot)?.slot?.label) || n.slot));
  const close = document.createElement('button'); close.className = 'close'; close.type = 'button'; close.textContent = '×'; close.setAttribute('aria-label', 'Close'); close.onclick = () => { panel.hidden = true; state.selected = null; };
  head.append(slotEl, close); panel.appendChild(head);
  const h3 = document.createElement('h3'); h3.textContent = n.label; panel.appendChild(h3);
  const badge = document.createElement('span'); badge.className = 'badge ' + n.provenance; badge.textContent = n.provenance; panel.appendChild(badge);
  const text = document.createElement('p'); text.textContent = n.text; panel.appendChild(text);
  const h4 = (t) => { const x = document.createElement('h4'); x.textContent = t; panel.appendChild(x); };
  if (n.provenance === 'fact') {
    h4(n.paraphrase ? 'Paraphrased from the source' : 'Quoted from the source');
    const q = document.createElement('blockquote'); q.textContent = n.source_quote || ''; panel.appendChild(q);
    const r = document.createElement('div'); r.className = 'ref'; r.textContent = n.source_ref || ''; panel.appendChild(r);
  } else if (n.provenance === 'derived') {
    h4('Confidence');
    const c = document.createElement('div'); c.className = 'conf'; c.textContent = `${Math.round((n.confidence || 0) * 100)} / 100`; panel.appendChild(c);
    const bar = document.createElement('div'); bar.className = 'confbar'; const fillEl = document.createElement('i'); fillEl.style.width = `${Math.round((n.confidence || 0) * 100)}%`; bar.appendChild(fillEl); panel.appendChild(bar);
    h4('Why the LLM infers this'); const r = document.createElement('p'); r.textContent = n.rationale || ''; panel.appendChild(r);
    if (n.idea) { h4('Opportunity this points to'); const ip = document.createElement('p'); ip.className = 'idea'; ip.textContent = n.idea; panel.appendChild(ip); }
    const sup = ex.edges.filter(e => e.relation === 'supported_by' && e.from === n.id).map(e => state.nodes.get(e.to)).filter(Boolean);
    if (sup.length) { h4('Supported by'); const ul = document.createElement('ul'); for (const s of sup) { const li = document.createElement('li'); li.textContent = s.node.label; const q = document.createElement('div'); q.className = 'ref'; q.textContent = (s.node.source_quote || '').slice(0, 140); li.appendChild(q); ul.appendChild(li); } panel.appendChild(ul); }
  } else {
    const r = document.createElement('p'); r.className = 'ref'; r.textContent = 'Framework scaffolding: neither a fact nor an inference.'; panel.appendChild(r);
  }
  const rels = rec.edges.filter(e => e.edge.relation !== 'supported_by');
  if (rels.length) {
    h4('Edges'); const ul = document.createElement('ul');
    for (const e of rels) { const li = document.createElement('li'); const out = e.edge.from === n.id; const other = out ? e.B.node : e.A.node; const rl = document.createElement('span'); rl.className = 'rel'; rl.textContent = (out ? '→ ' : '← ') + (relLabel.get(e.edge.relation) || e.edge.relation) + (e.edge.provenance === 'derived' ? ' (inferred)' : '') + ' '; li.append(rl, document.createTextNode(other.label)); ul.appendChild(li); }
    panel.appendChild(ul);
  }
  if (Array.isArray(n.entities) && n.entities.length) { h4('Entities'); const p = document.createElement('p'); p.className = 'ref'; p.textContent = n.entities.join(', '); panel.appendChild(p); }
}

// ---------- interaction ----------
const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2(); const tooltip = $('tooltip');
function setHover(rec) {
  if (state.hover === rec) return;
  if (state.hover) { const h = state.hover; h.mesh.scale.setScalar(1); if (h.mesh.material.emissive) h.mesh.material.emissive.setHex(0x000000); for (const e of h.edges) { e.line.material.color.set(e.grounding ? MUTED : (e.edge.provenance === 'schema' ? HAIRLINE : INK2)); if (e.arrow) e.arrow.material.color.set(INK2); } }
  state.hover = rec;
  if (rec) { rec.mesh.scale.setScalar(1.18); if (rec.mesh.material.emissive) rec.mesh.material.emissive.set(rec.color).multiplyScalar(0.35); for (const e of rec.edges) { if (!e.grp.visible) continue; e.line.material.color.set(INK); if (e.arrow) e.arrow.material.color.set(INK); } }
  renderer.domElement.style.cursor = rec ? 'pointer' : '';
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(state.hit.filter(h => h.parent.visible), false);
  const rec = hits.length ? state.nodes.get(hits[0].object.userData.nodeId) : null;
  setHover(rec);
  if (rec) {
    tooltip.replaceChildren();
    const a = document.createElement('div'); a.className = 't-label'; a.textContent = rec.node.label;
    const b = document.createElement('div'); b.className = 't-meta'; b.textContent = `${(slotStyle.get(rec.node.slot)?.slot?.label) || rec.node.slot} · ${rec.node.provenance}${rec.node.provenance === 'derived' ? ' ' + Math.round((rec.node.confidence || 0) * 100) + '%' : ''}`;
    const c = document.createElement('div'); c.textContent = rec.node.text.length > 160 ? rec.node.text.slice(0, 157) + '…' : rec.node.text;
    tooltip.append(a, b, c);
    tooltip.style.display = 'block';
    const mx = ev.clientX - r.left + 14, my = ev.clientY - r.top + 14;
    tooltip.style.left = Math.min(mx, r.width - 320) + 'px'; tooltip.style.top = Math.min(my, r.height - 120) + 'px';
  } else tooltip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => { setHover(null); tooltip.style.display = 'none'; });
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  if (state.hover) { state.selected = state.hover; openPanel(state.hover); } else { $('panel').hidden = true; state.selected = null; }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
  if (ev.key === 'd') { $('t-derived').checked = !$('t-derived').checked; $('t-derived').dispatchEvent(new Event('change')); }
  if (ev.key === 'g') { $('t-grounding').checked = !$('t-grounding').checked; $('t-grounding').dispatchEvent(new Event('change')); }
  if (ev.key === 'r') resetView();
  if (ev.key === 'Escape') { $('panel').hidden = true; state.selected = null; }
});
$('t-derived').addEventListener('change', (e) => { state.showDerived = e.target.checked; applyVisibility(); });
$('t-grounding').addEventListener('change', (e) => { state.showGrounding = e.target.checked; applyVisibility(); });
$('t-labels').addEventListener('change', (e) => { state.showLabels = e.target.checked; applyVisibility(); });
$('t-rotate').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
$('reset').addEventListener('click', resetView);

// example selector
const seg = $('examples');
const kindCount = new Map(); for (const ex of GRAPH.examples) kindCount.set(ex.kind, (kindCount.get(ex.kind) || 0) + 1);
GRAPH.examples.forEach((ex, i) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.index = i; b.textContent = kindCount.get(ex.kind) > 1 ? (ex.title || ex.id) : ex.kind === 'tbpn' ? 'From TBPN' : ex.kind === 'classic' ? 'Classic' : (ex.title || ex.id); b.title = ex.title || ''; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => buildExample(i)); seg.appendChild(b); });

// ---------- go ----------
// URL parameters set the initial state (deep links, scripted screenshots): ?example=1&derived=0&grounding=1&labels=0&rotate=1
const q = new URLSearchParams(location.search);
const flag = (k, def) => q.has(k) ? !['0', 'false', 'off', 'no'].includes(q.get(k).toLowerCase()) : def;
state.showDerived = flag('derived', true); $('t-derived').checked = state.showDerived;
state.showGrounding = flag('grounding', false); $('t-grounding').checked = state.showGrounding;
state.showLabels = flag('labels', true); $('t-labels').checked = state.showLabels;
controls.autoRotate = flag('rotate', false); $('t-rotate').checked = controls.autoRotate;
let startIndex = parseInt(q.get('example') || '0', 10);
if (!(startIndex >= 0 && startIndex < GRAPH.examples.length)) startIndex = Math.max(0, GRAPH.examples.findIndex(x => x.id === q.get('example')));
resize();
buildExample(startIndex);
$('fallback').hidden = true; window.__engineReady = true;
function loop() {
  requestAnimationFrame(loop);
  controls.update();
  for (const rec of state.nodes.values()) for (const c of rec.obj.children) if (c.userData.isIdeaRing) c.quaternion.copy(camera.quaternion);
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
}
loop();
</script>
