<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel .lab { display: inline-block; transform: translateY(11px); background: rgba(26,26,25,.72); padding: 0 4px; border-radius: 3px; }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"framework":{"slug":"first-principles","name":"First Principles Thinking","category":"03-engineering-and-cognitive","wikipedia":"https://en.wikipedia.org/wiki/First_principle","one_liner":"Deletes the precedent and the analogy a question arrives with, keeps only what physics, arithmetic or a market price forces, and asks what the surviving limits allow you to build."},"slots":[{"id":"problem","label":"Problem","description":"The question as posed, usually arriving with an answer already attached to it.","typical_provenance":"fact","color":"#3987e5","shape":"box"},{"id":"assumption","label":"Assumption","description":"A precedent, an analogy or an industry belief that the reasoning removes. Almost always stated out loud, because a speaker has to name a belief in order to delete it.","typical_provenance":"either","color":"#c4384a","shape":"diamond"},{"id":"fundamental_truth","label":"Fundamental truth","description":"What survives the deletion: a physical law, a material or spot price, an arithmetic identity, a measured production rate. Stated when the speaker cites a number, inferred when the argument needs a law the speaker took for granted.","typical_provenance":"either","color":"#2f9e63","shape":"sphere"},{"id":"constraint","label":"Derived limit","description":"A bound the truths actually force: a cost floor, a land price, a ceiling on what a watt can earn. This is the step whose arithmetic is normally skipped.","typical_provenance":"derived","color":"#8e6bd9","shape":"cone"},{"id":"rebuilt_solution","label":"Rebuilt solution","description":"What becomes buildable at the limit rather than at the precedent, including the options the limit rules out. Where the opportunity surfaces.","typical_provenance":"derived","color":"#d95926","shape":"box"}],"relations":[{"id":"assumes","label":"assumes","description":"the problem as posed carries a precedent or analogy inside it"},{"id":"stripped_to","label":"stripped to","description":"the assumption is deleted and this is what is left standing"},{"id":"implies","label":"implies","description":"a truth forces a bound, or forces a further truth the argument needs"},{"id":"rebuilds_into","label":"rebuilds into","description":"a limit, or a truth strong enough to act on, rebuilds into a solution"}],"examples":[{"id":"classic","kind":"classic","title":"What a battery pack is made of","summary":"The standard modern illustration of the method. A settled industry price is deleted, the pack is reduced to the metals inside it and their exchange prices, the arithmetic gives a materials floor far below the quoted price, and the gap between the two becomes the thing to attack.","source":{"type":"text","title":"The investor, the founder and the six hundred dollar kilowatt-hour","attribution":"An original scenario written for this page, following the battery-pack argument popularised as the textbook illustration of first-principles reasoning (Elon Musk, 2012).","text":"An investor tells a founder that grid-scale energy storage will never be cheap. The industry number, he says, is settled: battery packs cost about six hundred dollars per kilowatt-hour, they have always cost about that, and there is no reason to expect anything different. The founder asks a different question. What is a battery pack actually made of? It is cobalt, nickel, aluminium, carbon, some polymers for separation, and a steel can. She looks up what those materials cost on the London Metal Exchange, adds them up in the quantities a kilowatt-hour of cell needs, and gets about eighty dollars per kilowatt-hour. The rest, she says, is the shape someone has chosen to put the materials in. If you bought the metals on the exchange and combined them into the shape of a cell, you would have a battery for a fraction of what anyone quotes, so the question is not whether cheap storage is possible but which of the steps between the metal and the cell is the one worth attacking."},"layout":{"mode":"tree","root":"p1","direction":"down","regions":[{"label":"Problem","x":[-60,60],"y":[29,47],"color":"#3987e5"},{"label":"Assumption","x":[-60,60],"y":[11,29],"color":"#c4384a"},{"label":"Fundamental truth","x":[-60,60],"y":[-7,11],"color":"#2f9e63"},{"label":"Derived limit","x":[-60,60],"y":[-25,-7],"color":"#8e6bd9"},{"label":"Rebuilt solution","x":[-60,60],"y":[-45,-25],"color":"#d95926"}]},"nodes":[{"id":"p1","slot":"problem","label":"Will storage ever be cheap?","text":"Whether grid-scale energy storage can ever become cheap. The question arrives with the answer already attached: an investor puts it as a settled no.","provenance":"fact","source_quote":"An investor tells a founder that grid-scale energy storage will never be cheap.","source_ref":"sentence 1","level":0,"pos":[6,38]},{"id":"a1","slot":"assumption","label":"$600/kWh is the settled number","text":"The industry price of a battery pack is about six hundred dollars per kilowatt-hour, it has always been about that, and nothing suggests it will change.","provenance":"fact","source_quote":"The industry number, he says, is settled: battery packs cost about six hundred dollars per kilowatt-hour, they have always cost about that, and there is no reason to expect anything different.","source_ref":"sentence 2","level":1,"pos":[-26,20]},{"id":"a2","slot":"assumption","label":"Past price predicts future price","text":"The unstated premise underneath the quoted number: that what packs have historically cost is evidence about what they can cost.","provenance":"derived","confidence":0.8,"rationale":"The investor offers price history as his whole argument ('they have always cost about that'), which only works if history bounds the achievable price. He never states that premise; it is what makes his sentence an argument rather than an observation.","level":1,"pos":[32,20]},{"id":"t1","slot":"fundamental_truth","label":"A pack is a list of materials","text":"A battery pack is cobalt, nickel, aluminium, carbon, separator polymers and a steel can. Nothing else is in it.","provenance":"fact","source_quote":"It is cobalt, nickel, aluminium, carbon, some polymers for separation, and a steel can.","source_ref":"sentence 5","level":2,"pos":[-42,2]},{"id":"t2","slot":"fundamental_truth","label":"The metals have a public spot price","text":"Each of those materials trades on an exchange, so its cost is a published number rather than a matter of opinion.","provenance":"fact","source_quote":"She looks up what those materials cost on the London Metal Exchange","source_ref":"sentence 6","level":2,"pos":[-6,2]},{"id":"t3","slot":"fundamental_truth","label":"No law fixes what a pack must cost","text":"No conservation law or physical constant sets the price of a pack. The price is a fact about a manufacturing process and a market, so the only irreducible term in it is the matter itself.","provenance":"derived","confidence":0.85,"rationale":"The scenario's whole move depends on this and never says it. Both the materials list and the exchange lookup are only interesting if the remaining cost is contingent; if some law forced $600, the decomposition would be pointless.","level":2,"pos":[42,2]},{"id":"c1","slot":"constraint","label":"Materials floor: about $80/kWh","text":"Priced at the exchange in the quantities a kilowatt-hour of cell needs, the materials come to about eighty dollars per kilowatt-hour. Nothing can make a pack cost less than its matter.","provenance":"fact","source_quote":"adds them up in the quantities a kilowatt-hour of cell needs, and gets about eighty dollars per kilowatt-hour.","source_ref":"sentence 6","level":3,"pos":[-40,-12]},{"id":"c2","slot":"constraint","label":"$520 is process, not matter","text":"About $520 of the $600 pack price is not material at all. It is mining margin, refining, cell fabrication, module and pack assembly, logistics, warranty and margin: the shape the materials have been put into.","provenance":"derived","confidence":0.9,"rationale":"Direct subtraction of the two stated numbers, $600 minus about $80, and the scenario names the remainder as 'the shape someone has chosen to put the materials in'. The split is forced once both numbers are on the table.","level":3,"pos":[-12,-16]},{"id":"c3","slot":"constraint","label":"A floor is not a forecast","text":"The $80 bounds the pack price from below and says nothing about how close a real process can get to it. It locates where to look, not what to expect.","provenance":"derived","confidence":0.75,"rationale":"Follows from what a lower bound is: the materials number is necessary, not sufficient. The scenario never draws the distinction, and the reader who misses it reads the floor as a price prediction, which is the standard misuse of the method.","level":3,"pos":[42,-12]},{"id":"r1","slot":"rebuilt_solution","label":"Buy metal, build the cell's shape","text":"Buy the metals on the exchange and combine them into the shape of a cell, and the pack costs a fraction of any quoted price.","provenance":"fact","source_quote":"If you bought the metals on the exchange and combined them into the shape of a cell, you would have a battery for a fraction of what anyone quotes","source_ref":"sentence 8","level":4,"pos":[-42,-30]},{"id":"r2","slot":"rebuilt_solution","label":"Attack the costliest step","text":"The question stops being whether cheap storage is possible and becomes which of the steps between the metal and the cell is the one worth attacking.","provenance":"fact","source_quote":"so the question is not whether cheap storage is possible but which of the steps between the metal and the cell is the one worth attacking","source_ref":"sentence 8","level":4,"pos":[36,-30]},{"id":"r3","slot":"rebuilt_solution","label":"The $520 gap is the market","text":"Every step between the metal and the finished cell is a business that owns part of the $520. The gap between floor and price is a map of where the value sits and who currently collects it.","provenance":"derived","confidence":0.7,"rationale":"Reads the arithmetic of c2 as a market description rather than a cost breakdown: if the remainder is process, each process step is a place a company can stand. The scenario stops one step short of saying so.","level":4,"pos":[-16,-38]}],"edges":[{"id":"ce1","from":"p1","to":"a1","relation":"assumes","provenance":"fact","source_quote":"An investor tells a founder that grid-scale energy storage will never be cheap. The industry number, he says, is settled: battery packs cost about six hundred dollars per kilowatt-hour","source_ref":"sentences 1-2"},{"id":"ce2","from":"p1","to":"a2","relation":"assumes","provenance":"derived","confidence":0.75,"rationale":"The question is only closed if history bounds the future, so posing it as settled carries the extrapolation premise inside it."},{"id":"ce3","from":"a1","to":"t1","relation":"stripped_to","provenance":"derived","confidence":0.85,"rationale":"The scenario replaces the price question with the materials question in the next breath but never says that the $600 reduces to this list; the substitution is the reader's."},{"id":"ce4","from":"a1","to":"t2","relation":"stripped_to","provenance":"derived","confidence":0.8,"rationale":"A quoted industry price is replaced by a published exchange price: the same quantity sourced from a market that cannot be argued with rather than from custom."},{"id":"ce5","from":"a2","to":"t3","relation":"stripped_to","provenance":"derived","confidence":0.7,"rationale":"Deleting the extrapolation premise leaves the question of what actually fixes the price, and the answer is that nothing does except the matter."},{"id":"ce6","from":"t1","to":"c1","relation":"implies","provenance":"fact","source_quote":"It is cobalt, nickel, aluminium, carbon, some polymers for separation, and a steel can. She looks up what those materials cost on the London Metal Exchange, adds them up in the quantities a kilowatt-hour of cell needs, and gets about eighty dollars per kilowatt-hour.","source_ref":"sentences 5-6"},{"id":"ce7","from":"t2","to":"c1","relation":"implies","provenance":"fact","source_quote":"She looks up what those materials cost on the London Metal Exchange, adds them up in the quantities a kilowatt-hour of cell needs, and gets about eighty dollars per kilowatt-hour.","source_ref":"sentence 6"},{"id":"ce8","from":"c1","to":"c2","relation":"implies","provenance":"derived","confidence":0.9,"rationale":"Subtraction: once the floor is $80 and the quoted price is $600, the remainder is fixed at about $520 and has to be something other than matter."},{"id":"ce9","from":"t3","to":"c3","relation":"implies","provenance":"derived","confidence":0.75,"rationale":"If nothing physical fixes the price, nothing physical guarantees the floor is reachable either; the bound is one-sided by construction."},{"id":"ce10","from":"c1","to":"r1","relation":"rebuilds_into","provenance":"derived","confidence":0.85,"rationale":"The scenario states the buy-the-metals move and states the $80 separately; joining them, so that the floor is the reason the move is worth making, is the reader's step."},{"id":"ce11","from":"c2","to":"r2","relation":"rebuilds_into","provenance":"derived","confidence":0.8,"rationale":"Once the remainder is identified as process rather than matter, 'which step' becomes the only remaining question, which is exactly what the closing sentence asks."},{"id":"ce12","from":"c2","to":"r3","relation":"rebuilds_into","provenance":"derived","confidence":0.7,"rationale":"The same $520 read as revenue rather than as cost: every step in the gap is somebody's business today."},{"id":"ce13","from":"c3","to":"r2","relation":"rebuilds_into","provenance":"derived","confidence":0.7,"rationale":"Because the floor is not a forecast, the useful output is a target for attack rather than a price to plan on."},{"id":"ce14","from":"a2","to":"a1","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The extrapolation premise is read off the investor's own phrasing of the settled number."},{"id":"ce15","from":"t3","to":"t1","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The materials list is the evidence that the pack is an assembly of priced things rather than an object with an intrinsic cost."},{"id":"ce16","from":"c2","to":"c1","relation":"supported_by","provenance":"derived","confidence":0.9,"rationale":"The $80 is one of the two numbers the subtraction uses."},{"id":"ce17","from":"c2","to":"a1","relation":"supported_by","provenance":"derived","confidence":0.9,"rationale":"The $600 is the other number the subtraction uses; the assumption supplies it even though the reasoning rejects it as a bound."},{"id":"ce18","from":"c3","to":"c1","relation":"supported_by","provenance":"derived","confidence":0.75,"rationale":"The caveat is about the $80 specifically: it is that number's status as a bound that is being qualified."},{"id":"ce19","from":"r3","to":"r2","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"The closing sentence names the steps between metal and cell; reading them as occupied markets is the inference on top of it."}]},{"id":"tbpn","kind":"tbpn","title":"Casey Handmer: why solar and not nuclear, and why not from orbit","summary":"A physicist-turned-founder is asked a preference question and answers with two teardowns. Nuclear's cost is stripped from the regulator to the turbine, which puts its floor at coal; space-based solar is stripped from the launch cost to a revenue-per-watt identity, which rules it out. Both rebuilds land on the same object: a sheet of silicon on the ground.","source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-03-28_dwarkesh-patel-nadia-asparouhova-augustus-doricko-casey-handmer-ishan-mukherjee-mike-knoop-trump-pardons-milton-coreweave-ipo-winners.md","date":"2025-03-28","episode_title":"Dwarkesh Patel, Nadia Asparouhova, Augustus Doricko, Casey Handmer, Ishan Mukherjee, Mike Knoop; Trump pardons Milton, CoreWeave IPO winners"},"why_this_episode":"Handmer (Terraform Industries, formerly NASA JPL, taught nuclear physics at Caltech) runs the method twice in one uninterrupted answer, L3228-L3458. He names the received explanation for nuclear's cost, deletes it in a sentence that is unusually explicit for a podcast ('even if NRC didn't exist tomorrow ... even if you could buy enriched uranium on amazon.com'), and lands on thermodynamic hardware instead; then he kills space-based solar not on launch cost, which is where that argument is normally had, but on a revenue-per-watt identity taken from Starlink. Both chains carry real numbers, which is what makes the derived-limit slot fillable rather than decorative. One caveat for a careful reader: Handmer says steam engines run 'the Brayton cycle', which is the gas-turbine cycle; steam plants run the Rankine cycle. The slip does not touch the argument, since his point is the irreducible cost of turbine plant, but it is a good live example of a quoted fundamental truth that is not quite true, and of why the truth slot needs checking rather than copying.","idea_bearing_slot":"rebuilt_solution","layout":{"mode":"tree","root":"q1","direction":"down","regions":[{"label":"Problem","x":[-63,63],"y":[29.5,47.5],"color":"#3987e5"},{"label":"Assumption","x":[-63,63],"y":[11.5,29.5],"color":"#c4384a"},{"label":"Fundamental truth","x":[-63,63],"y":[-6.5,11.5],"color":"#2f9e63"},{"label":"Derived limit","x":[-63,63],"y":[-24.5,-6.5],"color":"#8e6bd9"},{"label":"Rebuilt solution","x":[-63,63],"y":[-46,-24.5],"color":"#d95926"}]},"nodes":[{"id":"q1","slot":"problem","label":"Why solar and not nuclear?","text":"The host asks why Handmer is bullish on solar rather than nuclear, and why solar is the thing he has made his life's work, noting that both are currently in fashion.","provenance":"fact","source_quote":"Why are you so bullish on solar and not maybe less bullish on nuclear? There's a lot of chatter and everyone loves both right now. But why is solar what you've chosen to kind of make your life's work here?","source_ref":"Host, L3230-L3236","entities":[],"level":0,"pos":[-22,38.5]},{"id":"q2","slot":"problem","label":"Solar in space or on the ground?","text":"The host asks what the long-run picture looks like: solar panels in space, or solar panels covering the earth.","provenance":"fact","source_quote":"Is it solar panels all over in space? Is it solar panels all over the earth?","source_ref":"Host, L3342-L3344","entities":[],"level":0,"pos":[50,38.5]},{"id":"a1","slot":"assumption","label":"The NRC makes nuclear expensive","text":"The received explanation for nuclear's cost: the regulator and restricted access to enriched uranium. Handmer names it in order to delete it, hypothesising the NRC out of existence and uranium onto Amazon.","provenance":"fact","source_quote":"And that's even if NRC didn't exist tomorrow, right? Even if you could buy enriched uranium on amazon.com,","source_ref":"Casey Handmer, L3262-L3262","entities":[],"level":1,"pos":[-44,24.5]},{"id":"a2","slot":"assumption","label":"Cost falls by first-of-a-kind learning","text":"The standard energy-industry story that a technology gets cheap by grinding from first-of-a-kind through nth-of-a-kind units until economies of scale arrive. Handmer names it as the thing solar no longer needs.","provenance":"fact","source_quote":"So we don't have to theorize about, well, what is it going to take to get to, you know, first of a kind, second of a kind, hundredth of a kind, you know, start getting those economies of scale down in solar that's already happening.","source_ref":"Casey Handmer, L3300-L3304","entities":[],"level":1,"pos":[-34,16.5]},{"id":"a4","slot":"assumption","label":"Mirrors and lasers beam power down","text":"The premise behind space-based solar power, which the host reports as an existing category: companies are building mirrors and lasers to send orbital power to the ground.","provenance":"fact","source_quote":"I've seen a couple of these companies that are using mirrors or lasers.","source_ref":"Host, L3412-L3412","entities":[],"level":1,"pos":[50,24.5]},{"id":"a5","slot":"assumption","label":"Energy tech is ranked by its fuel","text":"The frame inside the question itself: that choosing between nuclear and solar is choosing between fuels. Handmer's answer treats it as a choice between machines, which is why a fuel-level argument cannot settle it.","provenance":"derived","confidence":0.65,"rationale":"Nobody states this. It has to be named because the whole answer is a category switch: the question offers uranium against sunlight and the answer compares a turbine hall against a laminated sheet. Without naming the frame, the answer looks like a change of subject rather than a refusal of the premise.","entities":[],"level":1,"pos":[-14,20.5]},{"id":"t1","slot":"fundamental_truth","label":"A reactor is a steam engine","text":"A nuclear reactor is a heat source bolted to a steam plant, and steam turbines carry irreducible costs that drive the total up regardless of what is making the heat.","provenance":"fact","source_quote":"At the end of the day, nuclear reactors are steam engines. And steam engines operate on what's called the Brayton cycle. And there are certain irreducible costs associated with steam turbines and so on that just drive the cost up.","source_ref":"Casey Handmer, L3254-L3258","entities":[],"level":2,"pos":[-51,6.5]},{"id":"t2","slot":"fundamental_truth","label":"Sunlight arrives free, every day","text":"Sunlight falls on the earth every day at no cost, from a fusion reactor nobody has to build, maintain or license.","provenance":"fact","source_quote":"sunlight rains down on the earth every day for free. There's a fusion reactor up in the sky.","source_ref":"Casey Handmer, L3266-L3266","entities":[],"level":2,"pos":[-16,6.5]},{"id":"t3","slot":"fundamental_truth","label":"Paper-thin silicon converts it","text":"A layer of silicon thinner than a sheet of paper converts that sunlight into electricity, and silicon is enormously abundant on Earth.","provenance":"fact","source_quote":"it is possible to convert that into high grade energy in the form of electricity with a layer of silicon that's thinner than a sheet of paper, considerably thinner than a sheet of paper. The silicon is enormously abundant on the Earth.","source_ref":"Casey Handmer, L3268-L3272","entities":[],"level":2,"pos":[-34,2.5]},{"id":"t4","slot":"fundamental_truth","label":"A terawatt a year, +30-40%","text":"Factories worldwide already ship more than a terawatt of solar a year, with production rising 30 to 40 per cent annually and no sign of slowing.","provenance":"fact","source_quote":"There are factories worldwide now churning out more than a terawatt of solar per year with no signs of slowing down. If anything, production is increasing 30 to 40% per year,","source_ref":"Casey Handmer, L3276-L3282","entities":[],"level":2,"pos":[-50,-1.5]},{"id":"t5","slot":"fundamental_truth","label":"Revenue per watt, not watts","text":"The same watt generated in orbit earns about a billion times more when it is spent amplifying radio into internet data than when it is spent transmitting raw power to the ground. Starlink is the working measurement of this.","provenance":"fact","source_quote":"And the revenue per watt of electricity used to transmit microwaves through Earth's atmosphere to the consumer, because it's chopped up and turned into internet data, as opposed to just raw power, is about a billion times higher.","source_ref":"Casey Handmer, L3430-L3434","entities":["Starlink"],"level":2,"pos":[50,6.5]},{"id":"t6","slot":"fundamental_truth","label":"Ground power sells at 10c/kWh","text":"Delivered electricity on Earth sells for around ten cents a kilowatt-hour, which is the price any beamed-down gigawatt would have to compete with.","provenance":"fact","source_quote":"than it being attempting to transmit gigawatts of power down to power plants where we pay 10 cents a kilowatt hours or something like that.","source_ref":"Casey Handmer, L3442-L3446","entities":[],"level":2,"pos":[50,-1.5]},{"id":"t8","slot":"fundamental_truth","label":"PV skips the heat cycle","text":"A photovoltaic cell converts photons to current directly. There is no boiler, turbine, condenser, working fluid or cooling loop, so none of the hardware that sets a thermal plant's floor exists in the bill of materials.","provenance":"derived","confidence":0.85,"rationale":"This is the pivot the argument turns on and Handmer never states it: he says a reactor is a steam engine and separately that a panel is a thin sheet of silicon, and leaves the reader to notice that the second one has no turbine in it at all. Without this step the two cost floors look like the same kind of number rather than floors set by different machines.","entities":[],"level":2,"pos":[-14,-1.5]},{"id":"c1","slot":"constraint","label":"Nuclear's cost floor is coal","text":"Even with the regulator deleted and fuel freely available, the steam-engine half of the plant means nuclear costs no less than coal. The floor is set by the turbine, not the licence.","provenance":"fact","source_quote":"it would still be the case that just the steam engine component is going to cost no less than coal.","source_ref":"Casey Handmer, L3262-L3264","entities":[],"level":3,"pos":[-52,-11.5]},{"id":"c2","slot":"constraint","label":"6% of Earth's surface is enough","text":"About six per cent of the earth's surface under solar would give every person alive American-level energy, roughly twenty barrels of oil a year each: less land than grazing, row crops or forestry already use.","provenance":"fact","source_quote":"give every man, woman and child on earth the amount of energy we enjoy here in the United States, which is about 20 barrels of oil per person per year, with something like 6% of earth's surface under solar, which is much, much less than we currently use for grazing or for row crops or for forestry.","source_ref":"Casey Handmer, L3360-L3366","entities":[],"level":3,"pos":[-14,-11.5]},{"id":"c3","slot":"constraint","label":"Solar acre $100-200k, farm $500","text":"Land is worth about five hundred dollars an acre per season in agriculture and about one to two hundred thousand dollars an acre per year under solar.","provenance":"fact","source_quote":"What's gonna happen is the net present value of land for agriculture is about 500 bucks per acre per season. But for solar, it's about 100 you know, 100 or 200 thousand dollars per year.","source_ref":"Casey Handmer, L3382-L3386","entities":[],"level":3,"pos":[6,-15.5]},{"id":"c4","slot":"constraint","label":"Farmland loses the bid","text":"If those panels power an AI datacentre that is a thousand times more economically productive than a human brain, farmland is outbid and ultimately paved over with solar. Handmer calls this the true AI doom scenario.","provenance":"fact","source_quote":"Now, if that's powering an AI, artificial super intelligence data center, which is a thousand times more economically productive than your terribly poorly evolved human brain, which has to sleep eight hours a day, and, you know, browse Twitter, then obviously, economically speaking, our farmland is ultimately going to get paved over with solar and we're going to starve to death.","source_ref":"Casey Handmer, L3386-L3394","entities":[],"level":3,"pos":[-15,-19.5]},{"id":"c5","slot":"constraint","label":"A 200x to 400x gap per acre","text":"The two land numbers differ by a factor of two hundred to four hundred, so on price alone no crop can outbid generation for an acre that can reach a grid connection.","provenance":"derived","confidence":0.9,"rationale":"Division of the two figures Handmer states: $100,000 to $200,000 against $500 gives 200x to 400x. The ratio is the operative quantity and he never says it, though every consequence he draws depends on it.","entities":[],"level":3,"pos":[13,-19.5]},{"id":"c6","slot":"constraint","label":"Licence reform cannot move it","text":"Because the bound comes from the turbine island rather than from the fuel or the licence, no amount of licensing reform or fuel-market liberalisation moves it. Only a converter with no heat cycle in it does, which is what a photovoltaic panel is.","provenance":"derived","confidence":0.8,"rationale":"Combines the stated floor with the stated deletion: Handmer removes the regulator and the fuel constraint and finds the floor still there, which means neither was binding. Naming what would move it, a converter without a thermal cycle, is the step he leaves out.","entities":[],"level":3,"pos":[-34,-15.5]},{"id":"c7","slot":"constraint","label":"Orbit's watt goes to the payer","text":"Every watt generated in orbit is spent on its highest-revenue use. While communications pays around a billion times more per watt than electricity does, no orbital watt will ever be allocated to beaming power down.","provenance":"derived","confidence":0.85,"rationale":"Follows almost mechanically from the two stated numbers: a scarce watt in orbit is allocated by revenue, and a billion-to-one gap is not closed by engineering. Handmer states the ratio and states the conclusion but not the allocation argument that joins them.","entities":["Starlink"],"level":3,"pos":[50,-11.5]},{"id":"r1","slot":"rebuilt_solution","label":"On the ground, it makes power","text":"A commoditised product with no moving parts, needing no special skills or labour to install and operate, easier than planting corn: put it on the ground and it produces power.","provenance":"fact","source_quote":"It's a commoditized product. It has no moving parts. You don't need any special skills or labor to install and operate it. It's even easier to do than planting corn. You just put it on the ground and it spits out power,","source_ref":"Casey Handmer, L3306-L3314","entities":[],"level":4,"pos":[-34,-28.5]},{"id":"r3","slot":"rebuilt_solution","label":"Orbital solar for orbital loads","text":"There will be a lot of solar in space, but it will power things that are already in space. Nobody will be beaming power down to Earth any time soon.","provenance":"fact","source_quote":"We will obviously have a lot of solar in space, but I think mostly it'll be for powering applications in space. I don't think people are going to be beaming power down from space to the earth at any time, anytime soon.","source_ref":"Casey Handmer, L3402-L3408","entities":[],"level":4,"pos":[50,-28.5]},{"id":"r4","slot":"rebuilt_solution","label":"Sell the acre's conversion option","text":"The buildable thing between the two land prices is an instrument, not a panel: a way for a landowner to sell the option to convert an acre to generation, priced on interconnection queue position and grid access, without selling the farm.","provenance":"derived","confidence":0.6,"rationale":"The 200x to 400x gap of c5 exists because farmland is priced on crop yield while generation land is priced on grid access, and the two prices are attached to the same acre. Today only developers cross that gap, one bilateral lease at a time; the gap itself implies a tradable instrument, which nobody in the passage mentions.","idea":"A brokerage for solar and datacentre land options, underwriting interconnection queue position rather than soil quality, would let farmers monetise the conversion option on an acre without selling it, and would put a public price on a 200x gap that is currently arbitraged privately by developers.","entities":[],"level":4,"pos":[12,-38.5]},{"id":"r5","slot":"rebuilt_solution","label":"Make food and watts bid openly","text":"If farmland is going to be outbid, the buildable response is to let food and generation bid for the same acre explicitly: measured dual-use yield data, and a paid covenant not to convert, so the food value of an acre has a price to bid with.","provenance":"derived","confidence":0.55,"rationale":"Handmer states the collision and says it is something we should figure out how to forestall, but names no mechanism. The economics of c4 rule out persuasion: the only thing that stops a 200x bid is another bid, which means either the same acre produces both, or someone pays for it not to convert.","idea":"Agrivoltaic yield measurement and a tradable non-conversion covenant are the missing market infrastructure for the farmland-versus-generation collision, which is currently a one-way, unpriced conversion with no instrument on the food side.","entities":[],"level":4,"pos":[-30,-38.5]},{"id":"r6","slot":"rebuilt_solution","label":"Screen on revenue per watt","text":"The identity that killed space-based solar generalises into a one-line screen for any hardware that generates power somewhere expensive: compare the revenue per watt of the proposed product against the revenue per watt of the incumbent use of that same watt.","provenance":"derived","confidence":0.65,"rationale":"Handmer applies the test once, to space solar, and moves on. Stated generally it disqualifies a category rather than a company, and it is a different test from the one the sector normally runs, which is dollars per kilogram to orbit.","idea":"Revenue per watt, benchmarked against the best competing use of the same watt, is a diligence screen that would disqualify a class of orbital and off-grid hardware pitches before term sheet, and nobody currently sells it as a tool or a dataset.","entities":[],"level":4,"pos":[52,-38.5]}],"edges":[{"id":"te1","from":"a1","to":"t1","relation":"stripped_to","provenance":"fact","source_quote":"And that's even if NRC didn't exist tomorrow, right? Even if you could buy enriched uranium on amazon.com, it would still be the case that just the steam engine component","source_ref":"Casey Handmer, L3262-L3262"},{"id":"te2","from":"t1","to":"c1","relation":"implies","provenance":"fact","source_quote":"it would still be the case that just the steam engine component is going to cost no less than coal.","source_ref":"Casey Handmer, L3262-L3264"},{"id":"te3","from":"t2","to":"t3","relation":"implies","provenance":"fact","source_quote":"sunlight rains down on the earth every day for free. There's a fusion reactor up in the sky. Due to some like weird quantum effects and again, silicon trickery, it is possible to convert that into high grade energy in the form of electricity","source_ref":"Casey Handmer, L3266-L3268"},{"id":"te4","from":"t3","to":"t4","relation":"implies","provenance":"derived","confidence":0.75,"rationale":"Handmer puts abundance, manufacturing skill and a terawatt a year in three consecutive sentences with no connective between them, so the link from cheap abundant silicon to the observed production volume is read from narrative order rather than stated. It is the standard reading, but it is a reading."},{"id":"te5","from":"t5","to":"t6","relation":"implies","provenance":"fact","source_quote":"The revenue per watt is a billion times higher with it being internet at a few hundred watts or whatever transmission power, than it being attempting to transmit gigawatts of power down to power plants where we pay 10 cents a kilowatt hours or something like that.","source_ref":"Casey Handmer, L3436-L3446"},{"id":"te6","from":"c3","to":"c4","relation":"implies","provenance":"fact","source_quote":"But for solar, it's about 100 you know, 100 or 200 thousand dollars per year. Now, if that's powering an AI, artificial super intelligence data center, which is a thousand times more economically productive than your terribly poorly evolved human brain, which has to sleep eight hours a day, and, you know, browse Twitter, then obviously, economically speaking, our farmland is ultimately going to get paved over with solar and we're going to starve to death.","source_ref":"Casey Handmer, L3386-L3394"},{"id":"te7","from":"q1","to":"a1","relation":"assumes","provenance":"derived","confidence":0.7,"rationale":"Host and guest are different speakers, so the link is inferred: the question treats nuclear as a live alternative, which presupposes that its cost problem is the fixable regulatory one Handmer then deletes."},{"id":"te8","from":"q1","to":"a2","relation":"assumes","provenance":"derived","confidence":0.6,"rationale":"The framing that everyone loves both right now is the scale-curve story applied to nuclear: that it is early rather than bounded. Inferred across speakers."},{"id":"te9","from":"q1","to":"a5","relation":"assumes","provenance":"derived","confidence":0.6,"rationale":"Posing the choice as nuclear against solar is posing it as uranium against sunlight; the fuel frame is inside the wording of the question."},{"id":"te10","from":"q2","to":"a4","relation":"assumes","provenance":"derived","confidence":0.7,"rationale":"The space-or-ground question presupposes that orbital generation can serve ground demand, which is precisely the premise the mirror and laser companies embody."},{"id":"te11","from":"a2","to":"t4","relation":"stripped_to","provenance":"derived","confidence":0.8,"rationale":"Handmer answers the learning-curve story with a shipped-volume number rather than with an argument, but the two are in different turns; joining them is the reader's step."},{"id":"te12","from":"a4","to":"t5","relation":"stripped_to","provenance":"derived","confidence":0.75,"rationale":"The beaming premise is replaced by a question about what a watt in orbit is worth, which is a different quantity from the one the category normally argues about, dollars per kilogram to orbit."},{"id":"te13","from":"a5","to":"t8","relation":"stripped_to","provenance":"derived","confidence":0.65,"rationale":"Dropping the fuel frame leaves the machine: what is left to compare is a turbine hall against a semiconductor with no thermal cycle in it."},{"id":"te14","from":"t3","to":"t8","relation":"implies","provenance":"derived","confidence":0.8,"rationale":"A paper-thin sheet that produces electricity directly has no room in it for a boiler or a turbine; the absence of the heat cycle follows from the description of the device."},{"id":"te15","from":"t8","to":"c6","relation":"implies","provenance":"derived","confidence":0.75,"rationale":"If the thermal hardware is what sets the floor, then the only thing that escapes the floor is a converter without that hardware."},{"id":"te16","from":"t1","to":"c6","relation":"implies","provenance":"derived","confidence":0.7,"rationale":"The steam-engine identity is what makes the floor immovable by regulatory means; the inference is the negative form of Handmer's own point."},{"id":"te17","from":"c1","to":"c6","relation":"implies","provenance":"derived","confidence":0.85,"rationale":"The floor survives the deletion of both candidate causes, which is the definition of a bound that reform cannot reach."},{"id":"te18","from":"t2","to":"c2","relation":"implies","provenance":"derived","confidence":0.7,"rationale":"The land-area result is an insolation calculation on top of the free-sunlight premise; Handmer gives the answer without the arithmetic."},{"id":"te19","from":"t3","to":"c2","relation":"implies","provenance":"derived","confidence":0.65,"rationale":"The area needed depends on conversion efficiency, so the silicon layer is the other input to the six per cent figure."},{"id":"te20","from":"t4","to":"r1","relation":"rebuilds_into","provenance":"derived","confidence":0.8,"rationale":"A terawatt a year of shipped product is what makes put-it-on-the-ground an available action rather than a plan; the two statements are adjacent in the answer but not joined in one turn."},{"id":"te21","from":"c2","to":"r1","relation":"rebuilds_into","provenance":"derived","confidence":0.7,"rationale":"The land bound is what makes the commoditised sheet sufficient rather than merely convenient: there is enough surface for the whole answer."},{"id":"te22","from":"c6","to":"r1","relation":"rebuilds_into","provenance":"derived","confidence":0.6,"rationale":"If nothing moves the thermal floor, the rebuild has to start from the non-thermal converter, which is the product r1 describes."},{"id":"te23","from":"c3","to":"c5","relation":"implies","provenance":"derived","confidence":0.9,"rationale":"Arithmetic on the two stated land prices."},{"id":"te24","from":"c5","to":"r4","relation":"rebuilds_into","provenance":"derived","confidence":0.6,"rationale":"A persistent two-hundred-fold price gap on the same asset is the standard precondition for an instrument that lets the holder sell the spread without selling the asset."},{"id":"te25","from":"c4","to":"r5","relation":"rebuilds_into","provenance":"derived","confidence":0.6,"rationale":"The stated collision needs a mechanism, and the only mechanisms that survive the price gap are dual use of the acre or payment for non-conversion."},{"id":"te26","from":"c5","to":"r5","relation":"rebuilds_into","provenance":"derived","confidence":0.55,"rationale":"The size of the gap sets how much a non-conversion covenant would have to pay, which is what makes it an instrument rather than a slogan."},{"id":"te27","from":"t5","to":"c7","relation":"implies","provenance":"derived","confidence":0.85,"rationale":"The billion-to-one revenue ratio is the input; the allocation rule for a scarce watt is the inference on top of it."},{"id":"te28","from":"t6","to":"c7","relation":"implies","provenance":"derived","confidence":0.85,"rationale":"The ten-cent ground price is the other side of the comparison: it is what a beamed watt would be paid."},{"id":"te29","from":"c7","to":"r3","relation":"rebuilds_into","provenance":"derived","confidence":0.8,"rationale":"The allocation argument is what turns the ratio into the conclusion Handmer states, that orbital solar serves orbital loads."},{"id":"te30","from":"c7","to":"r6","relation":"rebuilds_into","provenance":"derived","confidence":0.7,"rationale":"Generalising the allocation argument from this one case into a reusable screen is a step Handmer does not take."},{"id":"te31","from":"t8","to":"t1","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The absence of a heat cycle in the panel is only meaningful against the reactor's presence of one."},{"id":"te32","from":"r4","to":"c3","relation":"supported_by","provenance":"derived","confidence":0.75,"rationale":"The instrument is defined by the two stated land prices it sits between."},{"id":"te33","from":"r6","to":"t5","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"The screen is the stated revenue-per-watt comparison, lifted out of its one application."},{"id":"te34","from":"r6","to":"r3","relation":"supported_by","provenance":"derived","confidence":0.65,"rationale":"The stated verdict on space-based solar is the worked example the screen generalises from."}]}]}</script>

    bbox.expandByPoint(shift(new THREE.Vector3(an.pos[0], an.pos[1], 0)));
  }

    const a = new THREE.Vector3(gd.from[0], gd.from[1], gd.from[2] || z), b = new THREE.Vector3(gd.to[0], gd.to[1], gd.to[2] || z);
    const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), gd.style === 'dashed' ? dashMat : lineMat); ln.computeLineDistances(); group.add(ln);
    if (gd.label) { const lab = label2d(gd.label, 'glabel'); lab.position.copy(a).lerp(b, 0.5); group.add(lab); }
    bbox.expandByPoint(shift(a)); bbox.expandByPoint(shift(b));
  }

    const ax = L.axes.x, ay = L.axes.y;

    const pad = 6;
    if (ax) {
      const y = ymin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xmin, y, z), new THREE.Vector3(xmax, y, z)]), lineMat));
      const lab = label2d(ax.label, 'axlabel'); lab.position.set((xmin + xmax) / 2, y - 7.5, z); group.add(lab);
      for (const t of (ax.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(t.value, y - 1, z), new THREE.Vector3(t.value, y + 1, z)]), lineMat)); const tl = label2d(t.label, 'tick'); tl.position.set(t.value, y - 2.2, z); group.add(tl); }
      bbox.expandByPoint(shift(new THREE.Vector3(xmin, y - 9, 0))); bbox.expandByPoint(shift(new THREE.Vector3(xmax, y, 0)));
    }
    if (ay) {
      const x = xmin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, ymin, z), new THREE.Vector3(x, ymax, z)]), lineMat));

// ---------- build an example ----------
function clearGroup() {
  if (!state.group) return;
  state.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); } if (o.isCSS2DObject && o.element) o.element.remove(); });

  state.group = null; state.nodes.clear(); state.edges = []; state.hit = []; state.hover = null; state.selected = null; state.derivedDecor = [];
  $('panel').hidden = true;
}

function buildExample(i) {
  clearGroup();

  const centre = bbox.getCenter(new THREE.Vector3());

  if (ex.layout?.mode !== 'plane') for (const p of positions.values()) p.sub(centre);
  const bbox2 = new THREE.Box3(); for (const p of positions.values()) bbox2.expandByPoint(p);
  for (const n of ex.nodes) { const rec = makeNode(n, positions.get(n.id)); state.nodes.set(n.id, rec); group.add(rec.obj); state.hit.push(rec.hit); }
  for (const e of ex.edges) {
    const A = state.nodes.get(e.from), B = state.nodes.get(e.to); if (!A || !B) continue;
    const rec = makeEdge(e, A, B); state.edges.push(rec); group.add(rec.grp); A.edges.push(rec); B.edges.push(rec);
  }
  drawDecor(ex, group, bbox2, decorOffset);
  // camera fit
  const size = bbox2.getSize(new THREE.Vector3()), c = bbox2.getCenter(new THREE.Vector3());
  state.fit = { size, centre: c, mode: ex.layout?.mode || 'force', distance: ex.layout?.camera?.distance };
  renderNote(ex);
  renderLegend(ex);    // legend first, so the camera fit can measure it
  resetView();
  applyVisibility();
  for (const b of $('examples').children) b.setAttribute('aria-pressed', String(b.dataset.index == i));
  try { window.__frameworkExtension?.({ THREE, scene, group, graph: GRAPH, example: ex, nodesById: state.nodes, positions, api: { slotStyle, label2d, colors: { INK, INK2, MUTED, HAIRLINE, SURFACE, SLOT_COLORS, SCHEMA_COLOR } } }); } catch (e) { console.error('framework extension failed', e); }
}

// Fit the graph into the part of the stage not covered by the legend (left) or the open panel (right),
// so labels are not hidden under the cards at the default view.
function safeArea(size) {
  const W = stage.clientWidth, H = stage.clientHeight;
  const sr = stage.getBoundingClientRect();
  let left = 0, top = 0, right = 0;
  const wide = W > 820;
  const leg = $('legend'); if (wide && leg && leg.offsetParent !== null) { const r = leg.getBoundingClientRect(); left = Math.max(left, r.right - sr.left + 16); }
  const panel = $('panel'); if (wide && panel && !panel.hidden) { const r = panel.getBoundingClientRect(); right = Math.max(right, sr.right - r.left + 16); }
  return { W, H, left, top, right, w: Math.max(200, W - left - right), h: Math.max(200, H - top) };
}
function resetView() {
  if (!state.fit) return;
  const { size, centre, mode } = state.fit;
  const sa = safeArea(size);
  const halfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const bottomPad = 30;                       // px: labels hang below the lowest row of nodes
  const availH = Math.max(150, sa.h - bottomPad);
  // distance at which the graph (plus margins) fits the safe area: the vertical FOV spans sa.H pixels
  const fitH = (size.y / 2 + 8) * sa.H / (halfFov * availH);
  const sidePad = 110;                       // px: labels are centred under nodes and stick out sideways
  const fitW = (size.x / 2 + 6) * sa.H / (halfFov * Math.max(200, sa.w - 2 * sidePad));
  const dist = state.fit.distance || Math.max(50, Math.max(fitH, fitW) * (mode === 'force' ? 1.3 : 1.08) + size.z / 2);
  // world units per pixel at the target depth; shift the centre so the graph sits in the safe area
  const wpp = (2 * dist * halfFov) / sa.H;
  const target = centre.clone().add(new THREE.Vector3(-((sa.left - sa.right) / 2) * wpp, ((sa.top - bottomPad) / 2) * wpp, 0));
  const camPos = mode === 'force' ? target.clone().add(new THREE.Vector3(dist * 0.3, dist * 0.22, dist * 0.92)) : target.clone().add(new THREE.Vector3(0, 0, dist));
  camera.position.copy(camPos); controls.target.copy(target);
  camera.near = 0.1; camera.far = 5000; camera.updateProjectionMatrix(); controls.update();
}

function applyVisibility() {
  for (const rec of state.nodes.values()) {
    const vis = rec.node.provenance !== 'derived' || state.showDerived;
    rec.obj.visible = vis;
    rec.label.visible = vis && state.showLabels;
    rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  for (const rec of state.edges) {
    const endsOk = rec.A.obj.visible && rec.B.obj.visible;
    // a derived edge is reasoning too: it goes away with the derived nodes, even when both its ends are facts
    const vis = endsOk && (!rec.grounding || state.showGrounding) && (rec.edge.provenance !== 'derived' || state.showDerived);
    rec.grp.visible = vis;
    if (rec.label) rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  for (const lab of state.derivedDecor) lab.element.style.display = state.showDerived ? '' : 'none';
  // The idea key explains a marker; drop it when no idea node is on screen (e.g. the facts-only view).
  const ideaKey = $('legend')?.querySelector('.key-row.idea-key');
  if (ideaKey) ideaKey.style.display = [...state.nodes.values()].some(r => r.node.idea && r.obj.visible) ? '' : 'none';
  renderStats();
}

// ---------- legend / note / stats ----------
function renderLegend(ex) {
  const el = $('legend'); el.replaceChildren();
  const h = (t) => { const x = document.createElement('h2'); x.textContent = t; return x; };
  el.appendChild(h('Slots'));
  const counts = new Map(); for (const n of ex.nodes) counts.set(n.slot, (counts.get(n.slot) || 0) + 1);
  for (const s of GRAPH.slots) {
    const row = document.createElement('div'); row.className = 'slot-row';
    const chip = document.createElement('span'); const stl = slotStyle.get(s.id);
    chip.className = 'chip' + (stl.shape && stl.shape !== 'sphere' ? ' ' + stl.shape : ''); chip.style.background = stl.color;
    if (s.structural) chip.style.borderRadius = '2px';
    const name = document.createElement('span'); name.textContent = s.label;
    const tp = document.createElement('span'); tp.className = 'tp'; tp.textContent = s.structural ? 'schema' : (s.typical_provenance || '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = String(counts.get(s.id) || 0);
    row.append(chip, name, tp, n); row.title = s.description || ''; el.appendChild(row);
  }
  el.appendChild(h('Provenance'));
  const ideaCount = ex.nodes.filter(n => n.idea).length;
  const keys = [['●', 'fact: stated in the source (solid)'], ['◌', 'derived: LLM inference (translucent, dashed)'], ['▪', 'schema: framework scaffolding (grey)'], ['→', 'solid edge stated, dashed inferred'], ['⋯', 'grounding link: derived → fact']];
  if (ideaCount) keys.push(['★', 'gold ring: an opportunity this framework surfaces']);
  for (const [sym, txt] of keys) {
    const row = document.createElement('div'); row.className = 'key-row';
    if (sym === '★') row.classList.add('idea-key');
    const a = document.createElement('span'); a.className = 'sym'; a.textContent = sym; if (sym === '★') a.style.color = IDEA;
    const b = document.createElement('span'); b.textContent = txt; row.append(a, b); el.appendChild(row);
  }
  const st = document.createElement('div'); st.className = 'stats'; st.id = 'stats'; el.appendChild(st);
  renderStats();
}
function renderStats() {
  const st = $('stats'); if (!st) return;
  const ex = GRAPH.examples[state.exampleIndex];
  const nf = ex.nodes.filter(n => n.provenance === 'fact').length, nd = ex.nodes.filter(n => n.provenance === 'derived').length, ns = ex.nodes.filter(n => n.provenance === 'schema').length;
  const ef = ex.edges.filter(e => e.provenance === 'fact').length, ed = ex.edges.filter(e => e.provenance === 'derived' && e.relation !== 'supported_by').length, eg = ex.edges.filter(e => e.relation === 'supported_by').length, es = ex.edges.filter(e => e.provenance === 'schema').length;
  const visN = [...state.nodes.values()].filter(r => r.obj.visible).length, visE = state.edges.filter(r => r.grp.visible).length;
  st.replaceChildren();
  const line = (html) => { const d = document.createElement('div'); d.append(...html); st.appendChild(d); };
  const b = (t) => { const x = document.createElement('b'); x.textContent = t; return x; };
  line(['nodes ', b(String(nf)), ' fact · ', b(String(nd)), ' derived', ns ? ` · ${ns} schema` : '']);
  line(['edges ', b(String(ef)), ' fact · ', b(String(ed)), ' derived · ', b(String(eg)), ' grounding', es ? ` · ${es} schema` : '']);
  line([`showing ${visN} nodes, ${visE} edges`]);
}
function renderNote(ex) {
  const el = $('note'); el.replaceChildren();
  const h = document.createElement('h3'); h.textContent = ex.title || ex.id; el.appendChild(h);
  const p = document.createElement('p'); p.textContent = ex.summary || ''; el.appendChild(p);
  const s = document.createElement('div'); s.className = 'src';
  if (ex.source?.type === 'transcript') s.textContent = `TBPN ${ex.source.date} · ${ex.source.episode_title || ''}`;
  else if (ex.source?.type === 'text') s.textContent = `source: ${ex.source.title || 'scenario text'}`;
  el.appendChild(s);
}

// ---------- panel ----------
function openPanel(rec) {
  const n = rec.node, ex = GRAPH.examples[state.exampleIndex];
  const panel = $('panel'); panel.replaceChildren(); panel.hidden = false;
  const head = document.createElement('div'); head.className = 'p-head';
  const slotEl = document.createElement('div'); slotEl.className = 'p-slot';
  const chip = document.createElement('span'); chip.className = 'chip'; chip.style.background = rec.color; slotEl.append(chip, document.createTextNode((slotStyle.get(n.slot)?.slot?.label) || n.slot));
  const close = document.createElement('button'); close.className = 'close'; close.type = 'button'; close.textContent = '×'; close.setAttribute('aria-label', 'Close'); close.onclick = () => { panel.hidden = true; state.selected = null; };
  head.append(slotEl, close); panel.appendChild(head);
  const h3 = document.createElement('h3'); h3.textContent = n.label; panel.appendChild(h3);
  const badge = document.createElement('span'); badge.className = 'badge ' + n.provenance; badge.textContent = n.provenance; panel.appendChild(badge);
  const text = document.createElement('p'); text.textContent = n.text; panel.appendChild(text);
  const h4 = (t) => { const x = document.createElement('h4'); x.textContent = t; panel.appendChild(x); };
  if (n.provenance === 'fact') {
    h4(n.paraphrase ? 'Paraphrased from the source' : 'Quoted from the source');
    const q = document.createElement('blockquote'); q.textContent = n.source_quote || ''; panel.appendChild(q);
    const r = document.createElement('div'); r.className = 'ref'; r.textContent = n.source_ref || ''; panel.appendChild(r);
  } else if (n.provenance === 'derived') {
    h4('Confidence');
    const c = document.createElement('div'); c.className = 'conf'; c.textContent = `${Math.round((n.confidence || 0) * 100)} / 100`; panel.appendChild(c);
    const bar = document.createElement('div'); bar.className = 'confbar'; const fillEl = document.createElement('i'); fillEl.style.width = `${Math.round((n.confidence || 0) * 100)}%`; bar.appendChild(fillEl); panel.appendChild(bar);
    h4('Why the LLM infers this'); const r = document.createElement('p'); r.textContent = n.rationale || ''; panel.appendChild(r);
    if (n.idea) { h4('Opportunity this points to'); const ip = document.createElement('p'); ip.className = 'idea'; ip.textContent = n.idea; panel.appendChild(ip); }
    const sup = ex.edges.filter(e => e.relation === 'supported_by' && e.from === n.id).map(e => state.nodes.get(e.to)).filter(Boolean);
    if (sup.length) { h4('Supported by'); const ul = document.createElement('ul'); for (const s of sup) { const li = document.createElement('li'); li.textContent = s.node.label; const q = document.createElement('div'); q.className = 'ref'; q.textContent = (s.node.source_quote || '').slice(0, 140); li.appendChild(q); ul.appendChild(li); } panel.appendChild(ul); }
  } else {
    const r = document.createElement('p'); r.className = 'ref'; r.textContent = 'Framework scaffolding: neither a fact nor an inference.'; panel.appendChild(r);
  }
  const rels = rec.edges.filter(e => e.edge.relation !== 'supported_by');
  if (rels.length) {
    h4('Edges'); const ul = document.createElement('ul');
    for (const e of rels) { const li = document.createElement('li'); const out = e.edge.from === n.id; const other = out ? e.B.node : e.A.node; const rl = document.createElement('span'); rl.className = 'rel'; rl.textContent = (out ? '→ ' : '← ') + (relLabel.get(e.edge.relation) || e.edge.relation) + (e.edge.provenance === 'derived' ? ' (inferred)' : '') + ' '; li.append(rl, document.createTextNode(other.label)); ul.appendChild(li); }
    panel.appendChild(ul);
  }
  if (Array.isArray(n.entities) && n.entities.length) { h4('Entities'); const p = document.createElement('p'); p.className = 'ref'; p.textContent = n.entities.join(', '); panel.appendChild(p); }
}

// ---------- interaction ----------
const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2(); const tooltip = $('tooltip');
function setHover(rec) {
  if (state.hover === rec) return;
  if (state.hover) { const h = state.hover; h.mesh.scale.setScalar(1); if (h.mesh.material.emissive) h.mesh.material.emissive.setHex(0x000000); for (const e of h.edges) { e.line.material.color.set(e.grounding ? MUTED : (e.edge.provenance === 'schema' ? HAIRLINE : INK2)); if (e.arrow) e.arrow.material.color.set(INK2); } }
  state.hover = rec;
  if (rec) { rec.mesh.scale.setScalar(1.18); if (rec.mesh.material.emissive) rec.mesh.material.emissive.set(rec.color).multiplyScalar(0.35); for (const e of rec.edges) { if (!e.grp.visible) continue; e.line.material.color.set(INK); if (e.arrow) e.arrow.material.color.set(INK); } }
  renderer.domElement.style.cursor = rec ? 'pointer' : '';
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(state.hit.filter(h => h.parent.visible), false);
  const rec = hits.length ? state.nodes.get(hits[0].object.userData.nodeId) : null;
  setHover(rec);
  if (rec) {
    tooltip.replaceChildren();
    const a = document.createElement('div'); a.className = 't-label'; a.textContent = rec.node.label;
    const b = document.createElement('div'); b.className = 't-meta'; b.textContent = `${(slotStyle.get(rec.node.slot)?.slot?.label) || rec.node.slot} · ${rec.node.provenance}${rec.node.provenance === 'derived' ? ' ' + Math.round((rec.node.confidence || 0) * 100) + '%' : ''}`;
    const c = document.createElement('div'); c.textContent = rec.node.text.length > 160 ? rec.node.text.slice(0, 157) + '…' : rec.node.text;
    tooltip.append(a, b, c);
    tooltip.style.display = 'block';
    const mx = ev.clientX - r.left + 14, my = ev.clientY - r.top + 14;
    tooltip.style.left = Math.min(mx, r.width - 320) + 'px'; tooltip.style.top = Math.min(my, r.height - 120) + 'px';
  } else tooltip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => { setHover(null); tooltip.style.display = 'none'; });
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  if (state.hover) { state.selected = state.hover; openPanel(state.hover); } else { $('panel').hidden = true; state.selected = null; }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
  if (ev.key === 'd') { $('t-derived').checked = !$('t-derived').checked; $('t-derived').dispatchEvent(new Event('change')); }
  if (ev.key === 'g') { $('t-grounding').checked = !$('t-grounding').checked; $('t-grounding').dispatchEvent(new Event('change')); }
  if (ev.key === 'r') resetView();
  if (ev.key === 'Escape') { $('panel').hidden = true; state.selected = null; }
});
$('t-derived').addEventListener('change', (e) => { state.showDerived = e.target.checked; applyVisibility(); });
$('t-grounding').addEventListener('change', (e) => { state.showGrounding = e.target.checked; applyVisibility(); });
$('t-labels').addEventListener('change', (e) => { state.showLabels = e.target.checked; applyVisibility(); });
$('t-rotate').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
$('reset').addEventListener('click', resetView);

// example selector
const seg = $('examples');
const kindCount = new Map(); for (const ex of GRAPH.examples) kindCount.set(ex.kind, (kindCount.get(ex.kind) || 0) + 1);
GRAPH.examples.forEach((ex, i) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.index = i; b.textContent = kindCount.get(ex.kind) > 1 ? (ex.title || ex.id) : ex.kind === 'tbpn' ? 'From TBPN' : ex.kind === 'classic' ? 'Classic' : (ex.title || ex.id); b.title = ex.title || ''; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => buildExample(i)); seg.appendChild(b); });

// ---------- go ----------
// URL parameters set the initial state (deep links, scripted screenshots): ?example=1&derived=0&grounding=1&labels=0&rotate=1
const q = new URLSearchParams(location.search);
const flag = (k, def) => q.has(k) ? !['0', 'false', 'off', 'no'].includes(q.get(k).toLowerCase()) : def;
state.showDerived = flag('derived', true); $('t-derived').checked = state.showDerived;
state.showGrounding = flag('grounding', false); $('t-grounding').checked = state.showGrounding;
state.showLabels = flag('labels', true); $('t-labels').checked = state.showLabels;
controls.autoRotate = flag('rotate', false); $('t-rotate').checked = controls.autoRotate;
let startIndex = parseInt(q.get('example') || '0', 10);
if (!(startIndex >= 0 && startIndex < GRAPH.examples.length)) startIndex = Math.max(0, GRAPH.examples.findIndex(x => x.id === q.get('example')));
resize();
buildExample(startIndex);
$('fallback').hidden = true; window.__engineReady = true;
function loop() {
  requestAnimationFrame(loop);
  controls.update();
  for (const rec of state.nodes.values()) for (const c of rec.obj.children) if (c.userData.isIdeaRing) c.quaternion.copy(camera.quaternion);
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
}
loop();
</script>
