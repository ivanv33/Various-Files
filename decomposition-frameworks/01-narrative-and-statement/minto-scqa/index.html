<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; transform: translateY(14px); text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"$schema":"../../_meta/schema.json","framework":{"slug":"minto-scqa","name":"Minto SCQA","category":"01-narrative-and-statement","wikipedia":"https://en.wikipedia.org/wiki/Barbara_Minto","one_liner":"Frames a problem statement as Situation, Complication, Question and Answer, so that the audience arrives at the main point already holding the question that the point answers."},"slots":[{"id":"situation","label":"Situation","color":"#3987e5","shape":"sphere","typical_provenance":"fact","description":"The stable, agreed baseline: what the audience already knows and accepts about the subject, stated so that nobody argues with it."},{"id":"complication","label":"Complication","color":"#d95926","shape":"sphere","typical_provenance":"fact","description":"What happened in that situation to disturb it: something changed, broke, arrived or fell short, and created the need to act."},{"id":"question","label":"Question","color":"#2f9e63","shape":"diamond","typical_provenance":"derived","description":"The single question the complication raises in the audience's mind. In speech it is almost never asked out loud, and when a question is asked out loud it is usually not this one."},{"id":"answer","label":"Answer","color":"#7a5cc6","shape":"box","typical_provenance":"either","description":"The governing thought that resolves the question: a point, not a topic. It sits at the top of the pyramid and immediately raises the next question."}],"relations":[{"id":"disrupted_by","label":"disrupted by","description":"the stable situation is disrupted by the complication"},{"id":"raises","label":"raises","description":"raises the question in the audience's mind: normally the complication, though the answer raises the next one"},{"id":"answered_by","label":"answered by","description":"the question is answered by the answer, the governing thought"},{"id":"elaborates","label":"elaborates","description":"one statement adds detail to another statement in the same slot"}],"examples":[{"id":"classic","kind":"classic","title":"The memo about the sales force","summary":"Minto's introduction pattern in its everyday habitat: a division head writes to a board that already accepts the baseline, states the two changes that broke it, and opens with a point rather than a topic. The question is never written down, because the reader is already asking it.","source":{"type":"text","title":"Fielding Instruments: the memo to the board","attribution":"Written for this page in the pattern of Barbara Minto, The Pyramid Principle (1987): the S-C-Q-A introduction of a business memo.","text":"Fielding Instruments has sold its laboratory instruments through a direct field sales force for the past ten years. Everyone on the board already knows this, and nobody disputes it: the eighty-person field force has been the division's main advantage over the distributors it competes with. Since the board last reviewed the channel, two things have changed. The division's twenty largest customers have moved their purchasing onto an online marketplace that the field force does not serve, and the cost of a single field visit has doubled. The division head has to write the board a memo. She does not head it 'some thoughts on the sales force'. She writes: the division should stop selling through the field force alone and put half of the sales budget behind the marketplace channel within twelve months. Nowhere in the memo does she put the question on the page. She does not have to; by the time the board reaches her sentence, it is already asking it."},"layout":{"mode":"plane","camera":{"distance":113},"regions":[{"label":"Situation","x":[-73,-39],"y":[-32,36],"color":"#3987e5"},{"label":"Complication","x":[-37,-3],"y":[-32,36],"color":"#d95926"},{"label":"Question","x":[-1,37],"y":[-32,36],"color":"#2f9e63"},{"label":"Answer","x":[39,73],"y":[-32,36],"color":"#7a5cc6"}],"guides":[{"from":[-38,-37],"to":[-38,-37],"style":"solid","label":"disrupted by →"},{"from":[-2,-37],"to":[-2,-37],"style":"solid","label":"raises →"},{"from":[38,-37],"to":[38,-37],"style":"solid","label":"answered by →"},{"from":[18,39],"to":[18,39],"style":"solid","label":"rarely asked out loud"}]},"nodes":[{"id":"s1","slot":"situation","label":"Ten years of direct field selling","pos":[-56,20],"text":"For the past ten years the division has sold its laboratory instruments through a direct field sales force.","provenance":"fact","source_quote":"has sold its laboratory instruments through a direct field sales force for the past ten years","source_ref":"sentence 1","entities":["Fielding Instruments"]},{"id":"s2","slot":"situation","label":"The force is the main advantage","pos":[-56,-4],"text":"The eighty-person field force has been the division's main advantage over the distributors it competes with.","provenance":"fact","source_quote":"the eighty-person field force has been the division's main advantage over the distributors it competes with","source_ref":"sentence 2","entities":["Fielding Instruments"]},{"id":"s3","slot":"situation","label":"The board already accepts this","pos":[-56,-18],"text":"The baseline is common ground rather than an argument: everyone on the board already knows it and nobody disputes it.","provenance":"fact","source_quote":"Everyone on the board already knows this, and nobody disputes it","source_ref":"sentence 2","entities":[]},{"id":"c1","slot":"complication","label":"Top customers moved to marketplace","pos":[-20,20],"text":"The division's twenty largest customers have moved their purchasing onto an online marketplace that the field force does not serve.","provenance":"fact","source_quote":"The division's twenty largest customers have moved their purchasing onto an online marketplace that the field force does not serve","source_ref":"sentence 4","entities":[]},{"id":"c2","slot":"complication","label":"Cost of a field visit has doubled","pos":[-20,-3],"text":"The cost of a single field visit has doubled.","provenance":"fact","source_quote":"the cost of a single field visit has doubled","source_ref":"sentence 4","entities":[]},{"id":"c3","slot":"complication","label":"The force is now a shrinking asset","pos":[-20,-25],"text":"Taken together the two changes turn the field force from the division's advantage into a shrinking asset: dearer per call and blind to the accounts that matter most.","provenance":"derived","confidence":0.8,"rationale":"The scenario states the two changes separately; that they compound - a channel costing twice as much per call while the largest buyers leave it - is the reading that makes the situation a complication rather than two unrelated facts."},{"id":"q1","slot":"question","label":"What to do about the channel?","pos":[18,-3],"size":1.7,"text":"The question the board is already asking and the memo never writes: what should the division do about its route to market?","provenance":"derived","confidence":0.9,"rationale":"Sentence 8 says the question is never put on the page, and the complication leaves exactly one open decision - what to do about the channel - which the answer in sentence 7 addresses directly, so the question is nearly forced by the stated facts."},{"id":"q2","slot":"question","label":"How, without losing the accounts?","pos":[18,-26],"text":"The new question the answer itself raises, and the point where the pyramid under the introduction begins: how do you move half the budget without losing the accounts the field force holds?","provenance":"derived","confidence":0.65,"rationale":"Minto's rule is that the answer becomes the next question in the reader's mind (why? or how?). The scenario states the commitment but nothing about execution, so the follow-on question is a structural inference, not a reading of the text."},{"id":"a1","slot":"answer","label":"Stop relying on the force alone","pos":[56,-3],"size":1.4,"text":"The memo's governing thought, stated as a point rather than a topic: the division should stop selling through the field force alone.","provenance":"fact","source_quote":"the division should stop selling through the field force alone","source_ref":"sentence 7","entities":["Fielding Instruments"]},{"id":"a2","slot":"answer","label":"Half the budget to the marketplace","pos":[56,-20],"text":"Half of the sales budget goes behind the marketplace channel within twelve months.","provenance":"fact","source_quote":"put half of the sales budget behind the marketplace channel within twelve months","source_ref":"sentence 7","entities":[]}],"edges":[{"id":"ce1","from":"s1","to":"c1","relation":"disrupted_by","provenance":"fact","source_quote":"Since the board last reviewed the channel, two things have changed","source_ref":"sentence 3"},{"id":"ce2","from":"s1","to":"c2","relation":"disrupted_by","provenance":"fact","source_quote":"Since the board last reviewed the channel, two things have changed","source_ref":"sentence 3"},{"id":"ce3","from":"s2","to":"c3","relation":"disrupted_by","provenance":"derived","confidence":0.8,"rationale":"The advantage named in sentence 2 is exactly what the two changes erode."},{"id":"ce4","from":"s2","to":"s3","relation":"elaborates","provenance":"fact","source_quote":"Everyone on the board already knows this, and nobody disputes it: the eighty-person field force has been the division's main advantage","source_ref":"sentence 2"},{"id":"ce5","from":"c1","to":"q1","relation":"raises","provenance":"derived","confidence":0.9,"rationale":"Losing the largest buyers from the only channel forces the channel question."},{"id":"ce6","from":"c2","to":"q1","relation":"raises","provenance":"derived","confidence":0.85,"rationale":"A doubled cost per visit makes the same question a budget question."},{"id":"ce7","from":"c3","to":"q1","relation":"raises","provenance":"derived","confidence":0.8,"rationale":"The compounded reading is what makes the question urgent rather than routine."},{"id":"ce8","from":"q1","to":"a1","relation":"answered_by","provenance":"derived","confidence":0.9,"rationale":"Sentence 7 is a direct answer to the unwritten question and to nothing else in the scenario."},{"id":"ce9","from":"a1","to":"q2","relation":"raises","provenance":"derived","confidence":0.65,"rationale":"Minto's introduction hands off to the pyramid: the answer raises the next question."},{"id":"ce10","from":"a2","to":"a1","relation":"elaborates","provenance":"fact","source_quote":"the division should stop selling through the field force alone and put half of the sales budget behind the marketplace channel within twelve months","source_ref":"sentence 7"},{"id":"ce11","from":"c3","to":"c1","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"ce12","from":"c3","to":"c2","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"ce13","from":"q1","to":"c1","relation":"supported_by","provenance":"derived","confidence":0.9},{"id":"ce14","from":"q2","to":"a1","relation":"supported_by","provenance":"derived","confidence":0.65}]},{"id":"tbpn","kind":"tbpn","title":"Poseidon: from a hundred-year-old freight market to flying boats","summary":"David Zagaynov narrates a complete SCQA on air: logistics unchanged for a hundred years, then two things that changed (the Soviet ekranoplan's blockers dissolved by composites and modern controls, and ground-effect craft falling under the Coast Guard rather than the FAA), then the governing thought - so what we're building are flying boats.","source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-03-31_aaron-levie-alexis-ohanian-rj-halperin-cristobal-valenzuela-david-zagaynov-sam-lessin-xai-merges-with-x-isomorphic-labs-raises-600m.md","date":"2025-03-31","episode_title":"xAI merges with X, Isomorphic Labs raises $600M (Aaron Levie, Alexis Ohanian, RJ Halperin, Cristobal Valenzuela, David Zagaynov, Sam Lessin)","url":"https://podscripts.co/podcasts/tbpn-live/aaron-levie-alexis-ohanian-rj-halperin-cristobal-valenzuela-david-zagaynov-sam-lessin-xai-merges-with-x-isomorphic-labs-raises-600m"},"why_this_episode":"The founder tells the whole introduction in one contiguous passage, so the Situation, the Complication and the Answer are all quotable facts. Two questions are asked out loud in that passage and neither is the one the answer answers, which is exactly the provenance point this framework exists to make: the Minto question has to be derived even when a transcript is full of question marks.","idea_bearing_slot":"question","layout":{"mode":"plane","camera":{"distance":113},"regions":[{"label":"Situation","x":[-73,-39],"y":[-45,40],"color":"#3987e5"},{"label":"Complication","x":[-37,-3],"y":[-45,40],"color":"#d95926"},{"label":"Question","x":[-1,37],"y":[-45,40],"color":"#2f9e63"},{"label":"Answer","x":[39,73],"y":[-45,40],"color":"#7a5cc6"}],"guides":[{"from":[-38,-50],"to":[-38,-50],"style":"solid","label":"disrupted by →"},{"from":[-2,-50],"to":[-2,-50],"style":"solid","label":"raises →"},{"from":[38,-50],"to":[38,-50],"style":"solid","label":"answered by →"},{"from":[18,43],"to":[18,43],"style":"solid","label":"the real question is never asked"},{"from":[18,-32.5],"to":[18,-32.5],"style":"solid","label":"← answered by facts, not the Answer"}]},"nodes":[{"id":"s1","slot":"situation","label":"Logistics unchanged for 100 years","pos":[-56,20],"text":"Logistics has been a market largely unchanged for the past hundred years; it is where the founders started looking.","provenance":"fact","source_quote":"And so we were, I think ideating about like logistics and aerospace and I think like logistics, especially has been a market that's been largely unchanged for the past hundred years.","source_ref":"David Zagaynov (guest), L5614-L5620","entities":["David Zagaynov"]},{"id":"s2","slot":"situation","label":"Same planes, same hub-and-spoke","pos":[-56,32],"text":"The same 737s and Cessnas still fly the freight, and ship cargo is containerised on a hub-and-spoke model.","provenance":"fact","source_quote":"The types of planes that we're flying are like largely the same, same 737, same like Cessna's and on the ship cargo side has been pretty much like containerized cargo with very much like spoken hub model.","source_ref":"David Zagaynov (guest), L5624-L5628","entities":["David Zagaynov"]},{"id":"s3","slot":"situation","label":"Soviet ekranoplans, 60s and 70s","pos":[-56,2],"text":"Ekranoplans were built in the Soviet Union in the 1960s and 70s and were at the time the highest cargo-capacity planes ever built: flying ships.","provenance":"fact","source_quote":"So Echronoplaans were like types of vehicles that were built in the Soviet Union in the 60s and 70s. And at the time they were like the highest cargo capacity, like planes ever built, like they're like flying ships essentially.","source_ref":"David Zagaynov (guest), L5640-L5646","entities":["David Zagaynov"]},{"id":"s4","slot":"situation","label":"Ground effect: lift-drag +30-50%","pos":[-56,-28],"text":"Flying in ground effect, extremely close to the water, cuts drag and adds lift: an increase in the lift-to-drag ratio of 30 to 50 percent.","provenance":"fact","source_quote":"A largely reduces your drag and it increases your lift. So you can carry a lot more and spend a lot less fuel. So it's like increase of your lift drag ratio by 30 to 50%.","source_ref":"David Zagaynov (guest), L5654-L5658","entities":["David Zagaynov"]},{"id":"c1","slot":"complication","label":"Soviet-era blockers now solved","pos":[-20,-28],"text":"In the modern age most of the problems the Soviets had are solved: it was a controls problem and a materials-science problem, and composites answer the second.","provenance":"fact","source_quote":"the really crazy thing about ground effect vehicles in the modern age is like a lot of the problems that the Soviets had are solved for the most part. So it's really done a controls issue and a material science problem and composites are incredible material science.","source_ref":"David Zagaynov (guest), L5662-L5668","entities":["David Zagaynov"]},{"id":"c2","slot":"complication","label":"Coast Guard certifies, not FAA","pos":[-20,2],"text":"Ground-effect vehicles are not regulated by the FAA but by the Coast Guard, and Coast Guard certification is significantly easier.","provenance":"fact","source_quote":"And so but the really cool thing is like the ground fake vehicles are not regulated by the FAA, they're regulated by the Coast Guard. And so Coast Guard certification is significantly easier than FAA.","source_ref":"David Zagaynov (guest), L5674-L5678","entities":["David Zagaynov","FAA","Coast Guard"]},{"id":"c3","slot":"complication","label":"FAA path: a decade, no flights","pos":[-20,-9],"text":"Companies that built eVTOL aircraft IPO'd or SPAC'd for billions without ever flying a commercial flight, because FAA certification takes a decade or more.","provenance":"fact","source_quote":"So you have like really great companies that have built cool like EV toll stuff and like they've IPO'd or SPAC'd or whatever for billions of dollars, but they've never actually had a commercial flight because the FA regulatory process is so long. So it's like a decade plus to get certified.","source_ref":"David Zagaynov (guest), L5680-L5686","entities":["David Zagaynov","FAA"]},{"id":"c4","slot":"complication","label":"Composites matured in 10-15 years","pos":[-20,-20],"text":"Composites have come into their own over the past ten to fifteen years with good manufacturing nearby; Poseidon buys all of its composites from ATV Composites.","provenance":"fact","source_quote":"Like composites are really coming to their own in the past 10, 15 years in some terms of being able to, actually very good, there's very good manufacturing here. So like, ATV composites is where we get all of ours, and that's in the labor more.","source_ref":"David Zagaynov (guest), L5814-L5822","entities":["David Zagaynov","ATV Composites","Poseidon"]},{"id":"c5","slot":"complication","label":"Hobbyist RC parts got very good","pos":[-20,-40],"text":"As gamer GPUs enabled machine learning, hobbyist-grade RC hardware has become extremely good: motors, electronic systems and sensors small enough to fit on the aircraft.","provenance":"fact","source_quote":"And so then like on the electronic side, I think like there's in the same way that like GPUs for like gamers like enabled machine learning, they're just like the hobbyist grade RC stuff has gotten extremely good. And so just like really move forward like the quality of motors available, the quality of like electronic systems, sensors, the types of sensors that are available right now have gone small enough that we can fit them on here.","source_ref":"David Zagaynov (guest), L5840-L5858","entities":["David Zagaynov"]},{"id":"c6","slot":"complication","label":"Regulatory arbitrage in hard tech","pos":[-20,11],"text":"A host names the pattern on air: regulatory arbitrage, previously the domain of crypto, is now being used in hard tech.","provenance":"fact","source_quote":"A good Regarb just gets you going. It's previously the domain of crypto stuff, but now in hard tech, we're taking advantage of Regarb.","source_ref":"host, L5712-L5716","entities":[]},{"id":"c7","slot":"complication","label":"Constraint: physics to paperwork","pos":[-20,22],"text":"The binding constraint on coastal and island air freight is no longer aerodynamics or materials but the cost and duration of certification.","provenance":"derived","confidence":0.75,"rationale":"c1 says the physics and materials problems are solved while c2 and c3 say certification is what keeps well-funded competitors from ever flying commercially; taken together the blocking constraint has moved from the vehicle to the regulator."},{"id":"q0","slot":"question","label":"What could we build to disrupt it?","pos":[18,31],"text":"The founders' own question, voiced in the narration: what could they build to disrupt a logistics market that had not changed in a hundred years?","provenance":"fact","source_quote":"And so we were going through a bunch of ideas of like what we could build to disrupt this,","source_ref":"David Zagaynov (guest), L5630-L5630","entities":["David Zagaynov"]},{"id":"q1","slot":"question","label":"Why now and not decades ago?","pos":[18,-20],"text":"A host asks the why-now question: what in the regulatory picture and in the tech tree has enabled this now rather than decades ago?","provenance":"fact","source_quote":"The question is really just like why now but I want like more of a breakdown of like all the different things from the regulatory to the tech tree that's enabled this to happen now and not earlier because at the same time like this feels like something that could have happened decades ago but why are we just why are we just breaking through with this now?","source_ref":"host, L5802-L5808","entities":[]},{"id":"q2","slot":"question","label":"Cheapest way to move coastal cargo?","pos":[18,-7],"size":1.35,"text":"The question the complication actually forces and nobody asks: now that ground effect works and the craft can be certified as a boat, what is the cheapest way to move freight along coasts and between islands?","provenance":"derived","confidence":0.85,"rationale":"Minto's question is the one the complication raises in the listener's mind, and it is never spoken here. c1 (the physics is solved), c2 (a cheaper certifier already has jurisdiction) and c7 fix it almost completely: the only variable left open is the vehicle, which is exactly what a1 answers.","idea":"Coastal and island freight is an underserved lane where a boat-certified ground-effect craft undercuts air freight by three to four times on price per kilogram-mile."},{"id":"q3","slot":"question","label":"Which markets can switch regulator?","pos":[18,12],"size":1.05,"text":"The general question the moment raises for anyone scanning for opportunities: which physically-ready hard-tech markets are frozen under an expensive certifier when a cheaper regulator already has jurisdiction over the same physics?","provenance":"derived","confidence":0.6,"rationale":"A generalisation one step above the episode: c6 states that regulatory arbitrage has moved from crypto into hard tech and c2 gives one worked instance, but nothing in the transcript claims the pattern repeats, so the reading is plausible and contestable rather than forced.","idea":"A screen for hard-tech opportunities: enumerate categories where a cheaper certifier already has jurisdiction over the same physics, and back the teams that design to that boundary."},{"id":"a1","slot":"answer","label":"We are building flying boats","pos":[56,2],"size":1.5,"text":"Flying below 150 metres, and internationally under the IMO, the craft is certified as what is technically a boat: so what they are building are flying boats.","provenance":"fact","source_quote":"But if you're going through the Coast Guard, and so it's if you're flying sub 150 meters and it's the same thing internationally, you're up under the IMO, you get certified as like what is technically a boat. So what we're building are flying boats.","source_ref":"David Zagaynov (guest), L5688-L5698","entities":["David Zagaynov","Coast Guard","IMO"]},{"id":"a2","slot":"answer","label":"Seagull: quarter scale, 2-ton craft","pos":[56,-12],"text":"The Seagull started as a quarter-scale prototype of a full-scale vehicle that will be 50 feet long with a two-ton capacity.","provenance":"fact","source_quote":"And really the Seagull has started as like a quarter scale prototype of a full scale vehicle, which is gonna be a 50 foot, two ton capacity vehicle.","source_ref":"David Zagaynov (guest), L5862-L5866","entities":["David Zagaynov","Poseidon","Seagull"]},{"id":"a3","slot":"answer","label":"A third of air freight per kg-mile","pos":[56,-25],"text":"Commercial operations start with medical deliveries to remote islands; at full scale, carrying two tons, the aim is to compete with air freight for coastal and island cargo at roughly a quarter to a third of the price per kilogram per mile.","provenance":"fact","source_quote":"mostly like medical deliveries to remote islands. And then at the full scale carrying two tons, the idea is to be able to compete with air freight for coastal and island logistics and cargo and through a bunch of things we are gonna be able to get to roughly a quarter or third the price per kilogram per mile.","source_ref":"David Zagaynov (guest), L5920-L5926","entities":["David Zagaynov","Poseidon"]},{"id":"a4","slot":"answer","label":"DoD mission profiles for Seagull","pos":[56,16],"text":"Poseidon took the Seagull to the DoD, specifically the Naval Surface Warfare Center and SOCOM, who each had their own mission profiles for a large payload in the marine domain.","provenance":"fact","source_quote":"So we reached out to the DoD, specifically like the Naval Surface Warfare Center people and SOCOM, and they all had their own specifically mission profiles that they were interested in with the Seagull. So it's pretty large payload capacity relative to size and being able to operate in marine domains.","source_ref":"David Zagaynov (guest), L5898-L5908","entities":["David Zagaynov","Poseidon","Seagull","DoD","Naval Surface Warfare Center","SOCOM"]},{"id":"a5","slot":"answer","label":"Design to the regulatory boundary","pos":[56,30],"text":"The governing thought one level up, never stated: let the certification boundary set the specification. Stay under 150 metres and inside the Coast Guard's jurisdiction, and take the cost advantage that follows.","provenance":"derived","confidence":0.7,"rationale":"a1 states the boundary (sub-150 metres, certified as a boat) and c2 and c3 state what the boundary is worth (a decade of FAA certification avoided), but the design rule itself - build to the regulator rather than to the mission - is never put into words."},{"id":"a6","slot":"answer","label":"Defense first, then island cargo","pos":[56,-38],"text":"Defense is the beachhead: DoD mission profiles fund the vehicle while the commercial answer starts small with medical deliveries and scales to coastal cargo.","provenance":"derived","confidence":0.55,"rationale":"The founder gives defense interest as already concrete (a4) and describes the commercial programme as starting with medical deliveries before the two-ton full scale (a3); the sequencing is a reading of that ordering, not a stated strategy."}],"edges":[{"id":"e1","from":"s3","to":"c1","relation":"disrupted_by","provenance":"fact","source_quote":"And so we started looking at those and the really crazy thing about ground effect vehicles in the modern age","source_ref":"David Zagaynov (guest), L5662-L5662"},{"id":"e2","from":"s4","to":"c1","relation":"disrupted_by","provenance":"derived","confidence":0.8,"rationale":"The aerodynamic prize described in s4 is what the solved controls and materials problems finally make buildable."},{"id":"e3","from":"s1","to":"c7","relation":"disrupted_by","provenance":"derived","confidence":0.75,"rationale":"A hundred-year-stable market is the baseline that the moved constraint disturbs."},{"id":"e4","from":"s2","to":"c7","relation":"disrupted_by","provenance":"derived","confidence":0.7,"rationale":"The hub-and-spoke, same-airframe status quo is what a cheaper certification path reopens."},{"id":"e5","from":"c3","to":"c2","relation":"elaborates","provenance":"fact","source_quote":"And so Coast Guard certification is significantly easier than FAA. So you have like really great companies that have built cool like EV toll stuff and like they've IPO'd or SPAC'd or whatever for billions of dollars, but they've never actually had a commercial flight because the FA regulatory process is so long. So it's like a decade plus to get certified.","source_ref":"David Zagaynov (guest), L5678-L5686"},{"id":"e6","from":"c4","to":"c1","relation":"elaborates","provenance":"derived","confidence":0.85,"rationale":"The founder introduces the composites answer as 'the material science side', the anaphor pointing hicle, described later in the same answer."},{"id":"e24","from":"c7","to":"c1","relation":"supported_by","provenance":"derived","confidence":0.75},{"id":"e25","from":"c7","to":"c3","relation":"supported_by","provenance":"derived","confidence":0.75},{"id":"e26","from":"q2","to":"c2","relation":"supported_by","provenance":"derived","confidence":0.85},{"id":"e27","from":"q2","to":"a1","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"e28","from":"q3","to":"c6","relation":"supported_by","provenance":"derived","confidence":0.6},{"id":"e29","from":"q3","to":"c2","relation":"supported_by","provenance":"derived","confidence":0.6},{"id":"e30","from":"a5","to":"a1","relation":"supported_by","provenance":"derived","confidence":0.7},{"id":"e31","from":"a5","to":"c3","relation":"supported_by","provenance":"derived","confidence":0.7},{"id":"e32","from":"a6","to":"a4","relation":"supported_by","provenance":"derived","confidence":0.55},{"id":"e33","from":"a6","to":"a3","relation":"supported_by","provenance":"derived","confidence":0.55}]}]}</script>

const state = { exampleIndex: 0, showDerived: true, showGrounding: false, showLabels: true, group: null, nodes: new Map(), edges: [], hit: [], hover: null, selected: null, fit: null };

// ---------- layouts ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function forceLayout(nodes, edges, pinned, seed, opts = {}) {
  const rand = mulberry32(seed);
  const pos = new Map();
  const R0 = opts.radius || Math.max(18, nodes.length * 2.2);
  for (const n of nodes) {
    if (pinned.has(n.id)) pos.set(n.id, pinned.get(n.id).clone());
    else pos.set(n.id, new THREE.Vector3((rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0 * (opts.flat ? 0.15 : 1)));
  }
  const ids = nodes.map(n => n.id);
  const L = opts.rest || 16, K = opts.repulse || 420;
  const f = new Map(ids.map(id => [id, new THREE.Vector3()]));
  const d = new THREE.Vector3();
  for (let it = 0; it < 420; it++) {
    const alpha = 0.9 * (1 - it / 420) + 0.04;
    for (const id of ids) f.get(id).set(0, 0, 0);
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const a = pos.get(ids[i]), b = pos.get(ids[j]);
      d.subVectors(a, b); let dist = d.length(); if (dist < 0.5) { d.set(rand() - .5, rand() - .5, rand() - .5); dist = 0.5; }
      const s = K / (dist * dist); d.normalize().multiplyScalar(s);
      f.get(ids[i]).add(d); f.get(ids[j]).sub(d);
    }
    for (const e of edges) {
      if (!pos.has(e.from) || !pos.has(e.to)) continue;
      const a = pos.get(e.from), b = pos.get(e.to);
      d.subVectors(b, a); const dist = Math.max(d.length(), 0.01);
      const s = (dist - L) * 0.05; d.normalize().multiplyScalar(s);
      f.get(e.from).add(d); f.get(e.to).sub(d);
    }
    for (const id of ids) {
      if (pinned.has(id)) continue;
      const p = pos.get(id), ff = f.get(id);
      ff.addScaledVector(p, -0.012);
      if (opts.flat) ff.z -= p.z * 0.2;
      const len = ff.length(); if (len > 6) ff.multiplyScalar(6 / len);
      p.addScaledVector(ff, alpha);
    }
  }
  return pos;
}

function treeLayout(ex) {
  const nodes = ex.nodes, edges = ex.edges.filter(e => e.relation !== 'supported_by');
  const level = new Map();
  const explicit = nodes.every(n => Number.isInteger(n.level));
  if (explicit) nodes.forEach(n => level.set(n.id, n.level));
  else {
    const out = new Map(nodes.map(n => [n.id, []])), und = new Map(nodes.map(n => [n.id, []]));
    for (const e of edges) { out.get(e.from)?.push(e.to); und.get(e.from)?.push(e.to); und.get(e.to)?.push(e.from); }
    const root = ex.layout.root && level.has(ex.layout.root) === false ? ex.layout.root : nodes[0].id;
    const q = [root]; level.set(root, 0);
    while (q.length) { const id = q.shift(); for (const t of out.get(id) || []) if (!level.has(t)) { level.set(t, level.get(id) + 1); q.push(t); } }
    // unreachable by direction: attach by undirected distance
    const q2 = [...level.keys()];
    while (q2.length) { const id = q2.shift(); for (const t of und.get(id) || []) if (!level.has(t)) { level.set(t, level.get(id) + 1); q2.push(t); } }
    for (const n of nodes) if (!level.has(n.id)) level.set(n.id, 0);
    for (const n of nodes) if (Number.isInteger(n.level)) level.set(n.id, n.level);
  }
  const layers = new Map();
  for (const n of nodes) { const l = level.get(n.id); if (!layers.has(l)) layers.set(l, []); layers.get(l).push(n); }
  const order = [...layers.keys()].sort((a, b) => a - b);
  const pos = new Map();
  const right = ex.layout.direction === 'right';
  const GAP_L = right ? 26 : 18, GAP_S = right ? 9 : 14;
  // barycentre ordering pass to reduce crossings
  const parents = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) if (level.get(e.to) > level.get(e.from)) parents.get(e.to).push(e.from);
  const xOf = new Map();
  for (const l of order) {
    const arr = layers.get(l);
    if (l !== order[0]) arr.sort((a, b) => {
      const pa = parents.get(a.id).filter(p => xOf.has(p)), pb = parents.get(b.id).filter(p => xOf.has(p));
      const ma = pa.length ? pa.reduce((s, p) => s + xOf.get(p), 0) / pa.length : 0;
      const mb = pb.length ? pb.reduce((s, p) => s + xOf.get(p), 0) / pb.length : 0;
      return ma - mb;
    });
    arr.forEach((n, i) => {
      const s = (i - (arr.length - 1) / 2) * GAP_S;
      xOf.set(n.id, s);
      pos.set(n.id, right ? new THREE.Vector3(l * GAP_L, -s, 0) : new THREE.Vector3(s, -l * GAP_L, 0));
    });
  }
  for (const n of nodes) if (Array.isArray(n.pos)) pos.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  return pos;
}

function ringLayout(ex) {
  const nodes = ex.nodes;
  const onRing = nodes.filter(n => Number.isInteger(n.order) && !Array.isArray(n.pos));
  const R = Math.max(22, onRing.length * 4.2);
  const pinned = new Map();
  onRing.sort((a, b) => a.order - b.order).forEach((n, i) => { const t = Math.PI / 2 - (i / onRing.length) * Math.PI * 2; pinned.set(n.id, new THREE.Vector3(Math.cos(t) * R, Math.sin(t) * R, 0)); });
  for (const n of nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  if (pinned.size === nodes.length) return pinned;
  return forceLayout(nodes, ex.edges, pinned, 7, { radius: R * 0.5, flat: true, rest: 12 });
}

function planeLayout(ex) {
  const pinned = new Map();
  for (const n of ex.nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  if (pinned.size === ex.nodes.length) return pinned;
  return forceLayout(ex.nodes, ex.edges, pinned, 11, { flat: true, rest: 14 });
}

function computeLayout(ex) {
  const mode = ex.layout?.mode || 'force';
  if (mode === 'tree') return treeLayout(ex);
  if (mode === 'ring') return ringLayout(ex);
  if (mode === 'plane') return planeLayout(ex);
  const pinned = new Map();
  for (const n of ex.nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  return forceLayout(ex.nodes, ex.edges, pinned, 3);
}

// ---------- geometry helpers ----------
const GEO = {
  sphere: (r) => new THREE.SphereGeometry(r, 28, 20),
  box: (r) => new THREE.BoxGeometry(r * 1.7, r * 1.7, r * 1.7),
  diamond: (r) => new THREE.OctahedronGeometry(r * 1.25, 0),
  cone: (r) => new THREE.ConeGeometry(r * 1.1, r * 2.2, 20),
};
function label2d(text, cls) { const el = document.createElement('div'); el.className = cls; el.textContent = text; return new CSS2DObject(el); }

function makeNode(n, p) {
  const st = slotStyle.get(n.slot) || { color: MUTED, shape: 'sphere' };
  const r = NODE_R * (n.size || 1);
  const color = new THREE.Color(st.color);
  const obj = new THREE.Group(); obj.position.copy(p);
  let mesh, halo = null;
  if (n.provenance === 'fact') {
    mesh = new THREE.Mesh(GEO[st.shape](r), new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.08 }));
  } else if (n.provenance === 'derived') {
    mesh = new THREE.Mesh(GEO[st.shape](r), new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.0, transparent: true, opacity: 0.32, depthWrite: false }));
    halo = new THREE.LineSegments(new THREE.WireframeGeometry(GEO[st.shape](r * 1.35)), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.75 }));
    obj.add(halo);
  } else {
    mesh = new THREE.Mesh(GEO[st.shape === 'sphere' ? 'box' : st.shape](r * 0.8), new THREE.MeshStandardMaterial({ color: new THREE.Color(SCHEMA_COLOR), roughness: 0.9, metalness: 0, transparent: true, opacity: 0.85 }));
  }
  mesh.userData.nodeId = n.id;
  obj.add(mesh);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(r * 1.9, 10, 8), new THREE.MeshBasicMaterial({ visible: false }));
  hit.userData.nodeId = n.id; obj.add(hit);
  // A node carrying an `idea` is where this framework surfaces an underserved need or opportunity:
  // mark it so a reader can find the payoff without opening every panel.
  if (n.idea) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 1.6, r * 0.11, 8, 40), new THREE.MeshBasicMaterial({ color: new THREE.Color(IDEA) }));
    ring.userData.isIdeaRing = true; obj.add(ring);
  }
  const glyph = n.provenance === 'fact' ? '●' : n.provenance === 'derived' ? '◌' : '▪';
  const el = document.createElement('div'); el.className = 'nlabel ' + n.provenance;
  const g = document.createElement('span'); g.className = 'g'; g.textContent = glyph; g.style.color = n.provenance === 'schema' ? MUTED : st.color;
  el.appendChild(g);
  if (n.idea) { const st2 = document.createElement('span'); st2.className = 'idea-star'; st2.textContent = '★'; el.appendChild(st2); }
  el.appendChild(document.createTextNode(n.label || n.id));
  const lab = new CSS2DObject(el); lab.position.set(0, -r, 0); obj.add(lab);
  return { node: n, obj, mesh, halo, hit, label: lab, r, color: st.color, edges: [] };
}

function makeEdge(e, A, B) {
  const from = A.obj.position, to = B.obj.position;
  const dir = new THREE.Vector3().subVectors(to, from); const len = dir.length(); dir.normalize();
  const a = from.clone().addScaledVector(dir, A.r * 1.05), b = to.clone().addScaledVector(dir, -(B.r * 1.05 + (e.relation === 'supported_by' ? 0 : 1.6)));
  const geom = new THREE.BufferGeometry().setFromPoints([a, b]);
  let mat, arrow = null;
  const grounding = e.relation === 'supported_by';
  if (grounding) mat = new THREE.LineDashedMaterial({ color: new THREE.Color(MUTED), dashSize: 0.5, gapSize: 0.9, transparent: true, opacity: 0.55 });
  else if (e.provenance === 'derived') mat = new THREE.LineDashedMaterial({ color: new THREE.Color(INK2), dashSize: 1.4, gapSize: 0.9, transparent: true, opacity: 0.8 });
  else if (e.provenance === 'schema') mat = new THREE.LineBasicMaterial({ color: new THREE.Color(HAIRLINE), transparent: true, opacity: 0.9 });
  else mat = new THREE.LineBasicMaterial({ color: new THREE.Color(INK2), transparent: true, opacity: 0.85 });
  const line = new THREE.Line(geom, mat); line.computeLineDistances();
  const grp = new THREE.Group(); grp.add(line);

    arrow = new THREE.Mesh(new THREE.ConeGeometry(0.75, 2.0, 10), new THREE.MeshBasicMaterial({ color: e.provenance === 'derived' ? new THREE.Color(INK2) : new THREE.Color(INK2), transparent: true, opacity: e.provenance === 'derived' ? 0.7 : 0.95 }));

  return { edge: e, grp, line, arrow, label: lab, A, B, grounding, len };
}

function drawDecor(ex, group, bbox) {
  const L = ex.layout || {};
  const z = -0.6;
  const lineMat = new THREE.LineBasicMaterial({ color: new THREE.Color(0x4a4a47) });
  const dashMat = new THREE.LineDashedMaterial({ color: new THREE.Color(0x4a4a47), dashSize: 1.2, gapSize: 1.0 });
  for (const r of (L.regions || [])) {
    const w = Math.abs(r.x[1] - r.x[0]), h = Math.abs(r.y[1] - r.y[0]);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(r.color || '#3987e5'), transparent: true, opacity: 0.07, depthWrite: false }));
    m.position.set((r.x[0] + r.x[1]) / 2, (r.y[0] + r.y[1]) / 2, z - 0.5); group.add(m);
    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)), new THREE.LineBasicMaterial({ color: new THREE.Color(r.color || '#3987e5'), transparent: true, opacity: 0.25 }));
    edge.position.copy(m.position); group.add(edge);
    // Caption sits top-centre INSIDE the band. CSS2D centres its box on the position, so anchoring
    // at the corner made every caption straddle the boundary and builders patched it page-side.
    const lab = label2d(r.label, 'rlabel'); lab.position.set((r.x[0] + r.x[1]) / 2, Math.max(r.y[0], r.y[1]) - 3, z); group.add(lab);
    bbox.expandByPoint(new THREE.Vector3(r.x[0], r.y[0], 0)); bbox.expandByPoint(new THREE.Vector3(r.x[1], r.y[1], 0));
  }
  for (const gd of (L.guides || [])) {
    const a = new THREE.Vector3(gd.from[0], gd.from[1], gd.from[2] || z), b = new THREE.Vector3(gd.to[0], gd.to[1], gd.to[2] || z);
    const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), gd.style === 'dashed' ? dashMat : lineMat); ln.computeLineDistances(); group.add(ln);
    if (gd.label) { const lab = label2d(gd.label, 'glabel'); lab.position.copy(a).lerp(b, 0.5); group.add(lab); }
    bbox.expandByPoint(a); bbox.expandByPoint(b);
  }
  if (L.axes) {
    const ax = L.axes.x, ay = L.axes.y;
    const xmin = ax ? ax.min : bbox.min.x, xmax = ax ? ax.max : bbox.max.x, ymin = ay ? ay.min : bbox.min.y, ymax = ay ? ay.max : bbox.max.y;
    const pad = 6;
    if (ax) {
      const y = ymin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xmin, y, z), new THREE.Vector3(xmax, y, z)]), lineMat));
      const lab = label2d(ax.label, 'axlabel'); lab.position.set((xmin + xmax) / 2, y - 4.5, z); group.add(lab);
      for (const t of (ax.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(t.value, y - 1, z), new THREE.Vector3(t.value, y + 1, z)]), lineMat)); const tl = label2d(t.label, 'tick'); tl.position.set(t.value, y - 2.2, z); group.add(tl); }
      bbox.expandByPoint(new THREE.Vector3(xmin, y - 6, 0)); bbox.expandByPoint(new THREE.Vector3(xmax, y, 0));
    }
    if (ay) {
      const x = xmin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, ymin, z), new THREE.Vector3(x, ymax, z)]), lineMat));
      const lab = label2d(ay.label, 'axlabel'); lab.element.style.transform = 'rotate(-90deg)'; lab.position.set(x - 5, (ymin + ymax) / 2, z); group.add(lab);
      for (const t of (ay.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x - 1, t.value, z), new THREE.Vector3(x + 1, t.value, z)]), lineMat)); const tl = label2d(t.label, 'tick'); tl.position.set(x - 2.5, t.value, z); tl.element.style.transform = 'translateX(-50%)'; group.add(tl); }
      bbox.expandByPoint(new THREE.Vector3(x - 8, ymin, 0)); bbox.expandByPoint(new THREE.Vector3(x, ymax, 0));
    }
  }
}

// ---------- build an example ----------
function clearGroup() {
  if (!state.group) return;
  state.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); } if (o.isCSS2DObject && o.element) o.element.remove(); });
  scene.remove(state.group);
  $('labels').replaceChildren();
  state.group = null; state.nodes.clear(); state.edges = []; state.hit = []; state.hover = null; state.selected = null;
  $('panel').hidden = true;
}

function buildExample(i) {
  clearGroup();
  state.exampleIndex = i;
  const ex = GRAPH.examples[i];
  const group = new THREE.Group(); scene.add(group); state.group = group;
  const positions = computeLayout(ex);
  // centre
  const bbox = new THREE.Box3();
  for (const p of positions.values()) bbox.expandByPoint(p);
  const centre = bbox.getCenter(new THREE.Vector3());
  if (ex.layout?.mode !== 'plane') for (const p of positions.values()) p.sub(centre);
  const bbox2 = new THREE.Box3(); for (const p of positions.values()) bbox2.expandByPoint(p);
  for (const n of ex.nodes) { const rec = makeNode(n, positions.get(n.id)); state.nodes.set(n.id, rec); group.add(rec.obj); state.hit.push(rec.hit); }
  for (const e of ex.edges) {
    const A = state.nodes.get(e.from), B = state.nodes.get(e.to); if (!A || !B) continue;
    const rec = makeEdge(e, A, B); state.edges.push(rec); group.add(rec.grp); A.edges.push(rec); B.edges.push(rec);
  }
  drawDecor(ex, group, bbox2);
  // camera fit
  const size = bbox2.getSize(new THREE.Vector3()), c = bbox2.getCenter(new THREE.Vector3());
  state.fit = { size, centre: c, mode: ex.layout?.mode || 'force', distance: ex.layout?.camera?.distance };
  renderNote(ex);
  renderLegend(ex);    // legend first, so the camera fit can measure it
  resetView();
  applyVisibility();
  for (const b of $('examples').children) b.setAttribute('aria-pressed', String(b.dataset.index == i));
  try { window.__frameworkExtension?.({ THREE, scene, group, graph: GRAPH, example: ex, nodesById: state.nodes, positions, api: { slotStyle, label2d, colors: { INK, INK2, MUTED, HAIRLINE, SURFACE, SLOT_COLORS, SCHEMA_COLOR } } }); } catch (e) { console.error('framework extension failed', e); }
}

// Fit the graph into the part of the stage not covered by the legend (left) or the open panel (right),
// so labels are not hidden under the cards at the default view.
function safeArea(size) {
  const W = stage.clientWidth, H = stage.clientHeight;
  const sr = stage.getBoundingClientRect();
  let left = 0, top = 0, right = 0;
  const wide = W > 820;
  const leg = $('legend'); if (wide && leg && leg.offsetParent !== null) { const r = leg.getBoundingClientRect(); left = Math.max(left, r.right - sr.left + 16); }
  const panel = $('panel'); if (wide && panel && !panel.hidden) { const r = panel.getBoundingClientRect(); right = Math.max(right, sr.right - r.left + 16); }
  return { W, H, left, top, right, w: Math.max(200, W - left - right), h: Math.max(200, H - top) };
}
function resetView() {
  if (!state.fit) return;
  const { size, centre, mode } = state.fit;
  const sa = safeArea(size);
  const halfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const bottomPad = 30;                       // px: labels hang below the lowest row of nodes
  const availH = Math.max(150, sa.h - bottomPad);
  // distance at which the graph (plus margins) fits the safe area: the vertical FOV spans sa.H pixels
  const fitH = (size.y / 2 + 8) * sa.H / (halfFov * availH);
  const sidePad = 110;                       // px: labels are centred under nodes and stick out sideways
  const fitW = (size.x / 2 + 6) * sa.H / (halfFov * Math.max(200, sa.w - 2 * sidePad));
  const dist = state.fit.distance || Math.max(50, Math.max(fitH, fitW) * (mode === 'force' ? 1.3 : 1.08) + size.z / 2);
  // world units per pixel at the target depth; shift the centre so the graph sits in the safe area
  const wpp = (2 * dist * halfFov) / sa.H;
  const target = centre.clone().add(new THREE.Vector3(-((sa.left - sa.right) / 2) * wpp, ((sa.top - bottomPad) / 2) * wpp, 0));
  const camPos = mode === 'force' ? target.clone().add(new THREE.Vector3(dist * 0.3, dist * 0.22, dist * 0.92)) : target.clone().add(new THREE.Vector3(0, 0, dist));
  camera.position.copy(camPos); controls.target.copy(target);
  camera.near = 0.1; camera.far = 5000; camera.updateProjectionMatrix(); controls.update();
}

function applyVisibility() {
  for (const rec of state.nodes.values()) {
    const vis = rec.node.provenance !== 'derived' || state.showDerived;
    rec.obj.visible = vis;
    rec.label.visible = vis && state.showLabels;
    rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  for (const rec of state.edges) {
    const endsOk = rec.A.obj.visible && rec.B.obj.visible;
    // a derived edge is reasoning too: it goes away with the derived nodes, even when both its ends are facts
    const vis = endsOk && (!rec.grounding || state.showGrounding) && (rec.edge.provenance !== 'derived' || state.showDerived);
    rec.grp.visible = vis;
    if (rec.label) rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  renderStats();
}

// ---------- legend / note / stats ----------
function renderLegend(ex) {
  const el = $('legend'); el.replaceChildren();
  const h = (t) => { const x = document.createElement('h2'); x.textContent = t; return x; };
  el.appendChild(h('Slots'));
  const counts = new Map(); for (const n of ex.nodes) counts.set(n.slot, (counts.get(n.slot) || 0) + 1);
  for (const s of GRAPH.slots) {
    const row = document.createElement('div'); row.className = 'slot-row';
    const chip = document.createElement('span'); const stl = slotStyle.get(s.id);
    chip.className = 'chip' + (stl.shape && stl.shape !== 'sphere' ? ' ' + stl.shape : ''); chip.style.background = stl.color;
    if (s.structural) chip.style.borderRadius = '2px';
    const name = document.createElement('span'); name.textContent = s.label;
    const tp = document.createElement('span'); tp.className = 'tp'; tp.textContent = s.structural ? 'schema' : (s.typical_provenance || '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = String(counts.get(s.id) || 0);
    row.append(chip, name, tp, n); row.title = s.description || ''; el.appendChild(row);
  }
  el.appendChild(h('Provenance'));
  const ideaCount = ex.nodes.filter(n => n.idea).length;
  const keys = [['●', 'fact: stated in the source (solid)'], ['◌', 'derived: LLM inference (translucent, dashed)'], ['▪', 'schema: framework scaffolding (grey)'], ['→', 'solid edge stated, dashed inferred'], ['⋯', 'grounding link: derived → fact']];
  if (ideaCount) keys.push(['★', 'gold ring: an opportunity this framework surfaces']);
  for (const [sym, txt] of keys) {
    const row = document.createElement('div'); row.className = 'key-row';
    const a = document.createElement('span'); a.className = 'sym'; a.textContent = sym; if (sym === '★') a.style.color = IDEA;
    const b = document.createElement('span'); b.textContent = txt; row.append(a, b); el.appendChild(row);
  }
  const st = document.createElement('div'); st.className = 'stats'; st.id = 'stats'; el.appendChild(st);
  renderStats();
}
function renderStats() {
  const st = $('stats'); if (!st) return;
  const ex = GRAPH.examples[state.exampleIndex];
  const nf = ex.nodes.filter(n => n.provenance === 'fact').length, nd = ex.nodes.filter(n => n.provenance === 'derived').length, ns = ex.nodes.filter(n => n.provenance === 'schema').length;
  const ef = ex.edges.filter(e => e.provenance === 'fact').length, ed = ex.edges.filter(e => e.provenance === 'derived' && e.relation !== 'supported_by').length, eg = ex.edges.filter(e => e.relation === 'supported_by').length;
  const visN = [...state.nodes.values()].filter(r => r.obj.visible).length, visE = state.edges.filter(r => r.grp.visible).length;
  st.replaceChildren();
  const line = (html) => { const d = document.createElement('div'); d.append(...html); st.appendChild(d); };
  const b = (t) => { const x = document.createElement('b'); x.textContent = t; return x; };
  line(['nodes ', b(String(nf)), ' fact · ', b(String(nd)), ' derived', ns ? ` · ${ns} schema` : '']);
  line(['edges ', b(String(ef)), ' fact · ', b(String(ed)), ' derived · ', b(String(eg)), ' grounding']);
  line([`showing ${visN} nodes, ${visE} edges`]);
}
function renderNote(ex) {
  const el = $('note'); el.replaceChildren();
  const h = document.createElement('h3'); h.textContent = ex.title || ex.id; el.appendChild(h);
  const p = document.createElement('p'); p.textContent = ex.summary || ''; el.appendChild(p);
  const s = document.createElement('div'); s.className = 'src';
  if (ex.source?.type === 'transcript') s.textContent = `TBPN ${ex.source.date} · ${ex.source.episode_title || ''}`;
  else if (ex.source?.type === 'text') s.textContent = `source: ${ex.source.title || 'scenario text'}`;
  el.appendChild(s);
}

// ---------- panel ----------
function openPanel(rec) {
  const n = rec.node, ex = GRAPH.examples[state.exampleIndex];
  const panel = $('panel'); panel.replaceChildren(); panel.hidden = false;
  const head = document.createElement('div'); head.className = 'p-head';
  const slotEl = document.createElement('div'); slotEl.className = 'p-slot';
  const chip = document.createElement('span'); chip.className = 'chip'; chip.style.background = rec.color; slotEl.append(chip, document.createTextNode((slotStyle.get(n.slot)?.slot?.label) || n.slot));
  const close = document.createElement('button'); close.className = 'close'; close.type = 'button'; close.textContent = '×'; close.setAttribute('aria-label', 'Close'); close.onclick = () => { panel.hidden = true; state.selected = null; };
  head.append(slotEl, close); panel.appendChild(head);
  const h3 = document.createElement('h3'); h3.textContent = n.label; panel.appendChild(h3);
  const badge = document.createElement('span'); badge.className = 'badge ' + n.provenance; badge.textContent = n.provenance; panel.appendChild(badge);
  const text = document.createElement('p'); text.textContent = n.text; panel.appendChild(text);
  const h4 = (t) => { const x = document.createElement('h4'); x.textContent = t; panel.appendChild(x); };
  if (n.provenance === 'fact') {
    h4(n.paraphrase ? 'Paraphrased from the source' : 'Quoted from the source');
    const q = document.createElement('blockquote'); q.textContent = n.source_quote || ''; panel.appendChild(q);
    const r = document.createElement('div'); r.className = 'ref'; r.textContent = n.source_ref || ''; panel.appendChild(r);
  } else if (n.provenance === 'derived') {
    h4('Confidence');
    const c = document.createElement('div'); c.className = 'conf'; c.textContent = `${Math.round((n.confidence || 0) * 100)} / 100`; panel.appendChild(c);
    const bar = document.createElement('div'); bar.className = 'confbar'; const fillEl = document.createElement('i'); fillEl.style.width = `${Math.round((n.confidence || 0) * 100)}%`; bar.appendChild(fillEl); panel.appendChild(bar);
    h4('Why the LLM infers this'); const r = document.createElement('p'); r.textContent = n.rationale || ''; panel.appendChild(r);
    if (n.idea) { h4('Opportunity this points to'); const ip = document.createElement('p'); ip.className = 'idea'; ip.textContent = n.idea; panel.appendChild(ip); }
    const sup = ex.edges.filter(e => e.relation === 'supported_by' && e.from === n.id).map(e => state.nodes.get(e.to)).filter(Boolean);
    if (sup.length) { h4('Supported by'); const ul = document.createElement('ul'); for (const s of sup) { const li = document.createElement('li'); li.textContent = s.node.label; const q = document.createElement('div'); q.className = 'ref'; q.textContent = (s.node.source_quote || '').slice(0, 140); li.appendChild(q); ul.appendChild(li); } panel.appendChild(ul); }
  } else {
    const r = document.createElement('p'); r.className = 'ref'; r.textContent = 'Framework scaffolding: neither a fact nor an inference.'; panel.appendChild(r);
  }
  const rels = rec.edges.filter(e => e.edge.relation !== 'supported_by');
  if (rels.length) {
    h4('Edges'); const ul = document.createElement('ul');
    for (const e of rels) { const li = document.createElement('li'); const out = e.edge.from === n.id; const other = out ? e.B.node : e.A.node; const rl = document.createElement('span'); rl.className = 'rel'; rl.textContent = (out ? '→ ' : '← ') + (relLabel.get(e.edge.relation) || e.edge.relation) + (e.edge.provenance === 'derived' ? ' (inferred)' : '') + ' '; li.append(rl, document.createTextNode(other.label)); ul.appendChild(li); }
    panel.appendChild(ul);
  }
  if (Array.isArray(n.entities) && n.entities.length) { h4('Entities'); const p = document.createElement('p'); p.className = 'ref'; p.textContent = n.entities.join(', '); panel.appendChild(p); }
}

// ---------- interaction ----------
const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2(); const tooltip = $('tooltip');
function setHover(rec) {
  if (state.hover === rec) return;
  if (state.hover) { const h = state.hover; h.mesh.scale.setScalar(1); if (h.mesh.material.emissive) h.mesh.material.emissive.setHex(0x000000); for (const e of h.edges) { e.line.material.color.set(e.grounding ? MUTED : (e.edge.provenance === 'schema' ? HAIRLINE : INK2)); if (e.arrow) e.arrow.material.color.set(INK2); } }
  state.hover = rec;
  if (rec) { rec.mesh.scale.setScalar(1.18); if (rec.mesh.material.emissive) rec.mesh.material.emissive.set(rec.color).multiplyScalar(0.35); for (const e of rec.edges) { if (!e.grp.visible) continue; e.line.material.color.set(INK); if (e.arrow) e.arrow.material.color.set(INK); } }
  renderer.domElement.style.cursor = rec ? 'pointer' : '';
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(state.hit.filter(h => h.parent.visible), false);
  const rec = hits.length ? state.nodes.get(hits[0].object.userData.nodeId) : null;
  setHover(rec);
  if (rec) {
    tooltip.replaceChildren();
    const a = document.createElement('div'); a.className = 't-label'; a.textContent = rec.node.label;
    const b = document.createElement('div'); b.className = 't-meta'; b.textContent = `${(slotStyle.get(rec.node.slot)?.slot?.label) || rec.node.slot} · ${rec.node.provenance}${rec.node.provenance === 'derived' ? ' ' + Math.round((rec.node.confidence || 0) * 100) + '%' : ''}`;
    const c = document.createElement('div'); c.textContent = rec.node.text.length > 160 ? rec.node.text.slice(0, 157) + '…' : rec.node.text;
    tooltip.append(a, b, c);
    tooltip.style.display = 'block';
    const mx = ev.clientX - r.left + 14, my = ev.clientY - r.top + 14;
    tooltip.style.left = Math.min(mx, r.width - 320) + 'px'; tooltip.style.top = Math.min(my, r.height - 120) + 'px';
  } else tooltip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => { setHover(null); tooltip.style.display = 'none'; });
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  if (state.hover) { state.selected = state.hover; openPanel(state.hover); } else { $('panel').hidden = true; state.selected = null; }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
  if (ev.key === 'd') { $('t-derived').checked = !$('t-derived').checked; $('t-derived').dispatchEvent(new Event('change')); }
  if (ev.key === 'g') { $('t-grounding').checked = !$('t-grounding').checked; $('t-grounding').dispatchEvent(new Event('change')); }
  if (ev.key === 'r') resetView();
  if (ev.key === 'Escape') { $('panel').hidden = true; state.selected = null; }
});
$('t-derived').addEventListener('change', (e) => { state.showDerived = e.target.checked; applyVisibility(); });
$('t-grounding').addEventListener('change', (e) => { state.showGrounding = e.target.checked; applyVisibility(); });
$('t-labels').addEventListener('change', (e) => { state.showLabels = e.target.checked; applyVisibility(); });
$('t-rotate').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
$('reset').addEventListener('click', resetView);

// example selector
const seg = $('examples');
const kindCount = new Map(); for (const ex of GRAPH.examples) kindCount.set(ex.kind, (kindCount.get(ex.kind) || 0) + 1);
GRAPH.examples.forEach((ex, i) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.index = i; b.textContent = kindCount.get(ex.kind) > 1 ? (ex.title || ex.id) : ex.kind === 'tbpn' ? 'From TBPN' : ex.kind === 'classic' ? 'Classic' : (ex.title || ex.id); b.title = ex.title || ''; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => buildExample(i)); seg.appendChild(b); });

// ---------- go ----------
// URL parameters set the initial state (deep links, scripted screenshots): ?example=1&derived=0&grounding=1&labels=0&rotate=1
const q = new URLSearchParams(location.search);
const flag = (k, def) => q.has(k) ? !['0', 'false', 'off', 'no'].includes(q.get(k).toLowerCase()) : def;
state.showDerived = flag('derived', true); $('t-derived').checked = state.showDerived;
state.showGrounding = flag('grounding', false); $('t-grounding').checked = state.showGrounding;
state.showLabels = flag('labels', true); $('t-labels').checked = state.showLabels;
controls.autoRotate = flag('rotate', false); $('t-rotate').checked = controls.autoRotate;
let startIndex = parseInt(q.get('example') || '0', 10);
if (!(startIndex >= 0 && startIndex < GRAPH.examples.length)) startIndex = Math.max(0, GRAPH.examples.findIndex(x => x.id === q.get('example')));
resize();
buildExample(startIndex);
$('fallback').hidden = true; window.__engineReady = true;
function loop() {
  requestAnimationFrame(loop);
  controls.update();
  for (const rec of state.nodes.values()) for (const c of rec.obj.children) if (c.userData.isIdeaRing) c.quaternion.copy(camera.quaternion);
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
}
loop();
</script>
