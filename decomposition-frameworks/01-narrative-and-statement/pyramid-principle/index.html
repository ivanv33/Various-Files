<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel .lab { display: inline-block; transform: translateY(11px); background: rgba(26,26,25,.72); padding: 0 4px; border-radius: 3px; }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"framework":{"slug":"pyramid-principle","name":"Pyramid Principle","category":"01-narrative-and-statement","wikipedia":"https://en.wikipedia.org/wiki/Barbara_Minto","one_liner":"Arranges a piece of reasoning as a pyramid - one governing thought on top, a mutually exclusive and collectively exhaustive set of key lines beneath it, data underneath those - so the reader gets the answer first and every level summarises the level below."},"slots":[{"id":"governing_thought","label":"Governing thought","description":"The single sentence that answers the reader's question and sits at the apex. It must summarise the key lines, not merely announce that there are some; a label such as 'three things to note' is a grouping, not a governing thought.","typical_provenance":"derived","color":"#d95926","shape":"box"},{"id":"key_line","label":"Key line","description":"A pillar: one of the two to five answers to the question the governing thought raises in the reader's mind (Why? How? How do you know?). The set must be mutually exclusive and collectively exhaustive, and must be either a deductive chain or one inductive group of the same kind of idea.","typical_provenance":"either","color":"#8e6bd9","shape":"diamond"},{"id":"support","label":"Support","description":"The data, examples, numbers and quotations at the base of the pyramid, each under the pillar it evidences. A support may itself be an inference when it summarises several stated facts.","typical_provenance":"fact","color":"#3987e5","shape":"sphere"}],"relations":[{"id":"rests_on","label":"rests on","description":"a higher node rests on the nodes below it, which must together summarise to it"},{"id":"grouped_with","label":"grouped with","description":"siblings that form one logical group, deductive or inductive, and are read as a MECE set"}],"examples":[{"id":"classic","kind":"classic","title":"The rescheduling note","summary":"Minto's opening illustration: a message about moving a meeting, written in the order the phone calls came in. Every fact the reader needs is in the note and the answer is in the last line; none of the structure that makes it an argument is stated, so with the inferences hidden the note is a heap of facts with two local becauses.","source":{"type":"text","title":"A note on the desk, Tuesday morning","attribution":"Adapted from Barbara Minto, The Pyramid Principle (1987), the rescheduling-message illustration used in chapter 1 to contrast a narrated message with its pyramid.","text":"A note is on your desk at twenty to ten on Tuesday morning, written in the order the calls came in. John Collins telephoned to say he cannot make the meeting at three o'clock today, because he is on a train to Manchester until six. Hal Johnson does not mind meeting later, or even tomorrow, but not before half past ten, since he has a board call every morning. Don Clifford's assistant rang to say Don cannot come before Thursday. The conference room is booked tomorrow for the auditors, but it is free on Thursday. Could we change the meeting to Thursday at eleven?"},"layout":{"mode":"plane","guides":[{"from":[0,58],"to":[-40,32],"style":"solid"},{"from":[-40,32],"to":[-52,14],"style":"solid"},{"from":[-52,14],"to":[-62,-22],"style":"solid"},{"from":[-62,-22],"to":[62,-22],"style":"solid"},{"from":[62,-22],"to":[52,14],"style":"solid"},{"from":[52,14],"to":[40,32],"style":"solid"},{"from":[40,32],"to":[0,58],"style":"solid"},{"from":[-40,32],"to":[40,32],"style":"dashed"},{"from":[-52,14],"to":[52,14],"style":"dashed"}]},"nodes":[{"id":"gt","slot":"governing_thought","label":"Move the meeting to Thursday at 11","text":"The meeting should be moved to Thursday at eleven o'clock. In the note this is the last line; in a pyramid it is the first.","provenance":"fact","source_quote":"Could we change the meeting to Thursday at eleven?","source_ref":"sentence 6, the last line of the note","size":1.9,"level":0,"pos":[0,45]},{"id":"k1","slot":"key_line","label":"Thursday: first day all can meet","text":"Thursday is the earliest day on which all three attendees are free: today is impossible for two of them and tomorrow is impossible for Don Clifford.","provenance":"derived","confidence":0.9,"rationale":"Intersecting the three stated constraints leaves Thursday as the first free day; the note reports the three calls but never states the intersection, which is the whole point of the message.","level":1,"pos":[-34,23],"size":1.2},{"id":"k2","slot":"key_line","label":"The room is free on Thursday","text":"The conference room is booked tomorrow for the auditors, but it is free on Thursday.","provenance":"fact","source_quote":"The conference room is booked tomorrow for the auditors, but it is free on Thursday","source_ref":"sentence 5","level":1,"pos":[0,23],"size":1.2},{"id":"k3","slot":"key_line","label":"Eleven is the earliest hour","text":"Eleven o'clock is the earliest hour on Thursday that clears the attendees' own constraints, because Hal Johnson cannot start before half past ten.","provenance":"derived","confidence":0.8,"rationale":"The note gives an earliest-start constraint of half past ten and then proposes eleven; the step from the constraint to the hour is arithmetic the reader has to do.","level":1,"pos":[34,23],"size":1.2},{"id":"s1","slot":"support","label":"Collins: not at three","text":"John Collins telephoned to say he cannot make the meeting at three o'clock today.","provenance":"fact","source_quote":"John Collins telephoned to say he cannot make the meeting at three o'clock today","source_ref":"sentence 2","level":2,"pos":[-55,0],"size":0.85},{"id":"s2","slot":"support","label":"Collins on a train until six","text":"Collins is on a train to Manchester until six, which is why he cannot make the three o'clock.","provenance":"fact","source_quote":"because he is on a train to Manchester until six","source_ref":"sentence 2","level":3,"pos":[-55,-14],"size":0.7},{"id":"s3","slot":"support","label":"Johnson: not before 10:30","text":"Hal Johnson does not mind meeting later today or tomorrow, but not before half past ten.","provenance":"fact","source_quote":"Hal Johnson does not mind meeting later, or even tomorrow, but not before half past ten","source_ref":"sentence 3","level":2,"pos":[53,0],"size":0.85},{"id":"s4","slot":"support","label":"Board call every morning","text":"Johnson's earliest-start constraint has a reason: he has a board call every morning.","provenance":"fact","source_quote":"since he has a board call every morning","source_ref":"sentence 3","level":3,"pos":[53,-14],"size":0.7},{"id":"s5","slot":"support","label":"Clifford: not before Thursday","text":"Don Clifford's assistant rang to say Don cannot come before Thursday.","provenance":"fact","source_quote":"Don Clifford's assistant rang to say Don cannot come before Thursday","source_ref":"sentence 4","level":2,"pos":[22,0],"size":0.85},{"id":"d1","slot":"support","label":"Today is impossible","text":"Today is impossible: Collins is on a train until six and Clifford cannot come before Thursday.","provenance":"derived","confidence":0.95,"rationale":"Two of the three stated constraints exclude today outright; the elimination is forced by the quoted facts but is never written down.","level":2,"pos":[-32,0],"size":0.85},{"id":"d2","slot":"support","label":"Tomorrow is impossible","text":"Tomorrow is impossible: Clifford cannot come before Thursday, and the room is taken by the auditors.","provenance":"derived","confidence":0.9,"rationale":"Tomorrow is the option the note leaves open for Johnson; two stated facts close it, and the reader has to combine an attendee constraint with a room constraint to see it.","level":2,"pos":[-7,0],"size":0.85}],"edges":[{"id":"ce1","from":"gt","to":"k1","relation":"rests_on","provenance":"derived","confidence":0.9,"rationale":"The note never says why Thursday; the pillar that carries the request is supplied by the reader."},{"id":"ce2","from":"gt","to":"k2","relation":"rests_on","provenance":"derived","confidence":0.85,"rationale":"Both statements are in the note, but nothing in it attaches the room's availability to the proposal; the attachment is the reader's."},{"id":"ce3","from":"gt","to":"k3","relation":"rests_on","provenance":"derived","confidence":0.8,"rationale":"The hour in the request is only justified once Johnson's earliest-start constraint is applied to Thursday."},{"id":"ce4","from":"k1","to":"s1","relation":"rests_on","provenance":"derived","confidence":0.9,"rationale":"Collins's refusal of the three o'clock is one of the three availability facts the pillar summarises."},{"id":"ce5","from":"k1","to":"s3","relation":"rests_on","provenance":"derived","confidence":0.9,"rationale":"Johnson's window is one of the three availability facts the pillar summarises."},{"id":"ce6","from":"k1","to":"s5","relation":"rests_on","provenance":"derived","confidence":0.95,"rationale":"Clifford's constraint is the binding one: it is what makes Thursday the earliest possible day."},{"id":"ce7","from":"k1","to":"d1","relation":"rests_on","provenance":"derived","confidence":0.9,"rationale":"The pillar is reached by elimination; ruling out today is the first step of it."},{"id":"ce8","from":"k1","to":"d2","relation":"rests_on","provenance":"derived","confidence":0.9,"rationale":"Ruling out tomorrow is the second elimination step behind the pillar."},{"id":"ce9","from":"k3","to":"s3","relation":"rests_on","provenance":"derived","confidence":0.85,"rationale":"Johnson's half-past-ten floor is the only stated constraint on the hour."},{"id":"ce10","from":"s1","to":"s2","relation":"rests_on","provenance":"fact","source_quote":"he cannot make the meeting at three o'clock today, because he is on a train to Manchester until six","source_ref":"sentence 2"},{"id":"ce11","from":"s3","to":"s4","relation":"rests_on","provenance":"fact","source_quote":"but not before half past ten, since he has a board call every morning","source_ref":"sentence 3"},{"id":"ce12","from":"k1","to":"k2","relation":"grouped_with","provenance":"derived","confidence":0.8,"rationale":"People and room are the two conditions a meeting has to satisfy; read as a set they are mutually exclusive and, with the hour, collectively exhaustive."},{"id":"ce13","from":"k2","to":"k3","relation":"grouped_with","provenance":"derived","confidence":0.75,"rationale":"Day and hour are separate questions; keeping them in one group is what makes the set exhaustive rather than merely plural."},{"id":"ce14","from":"d1","to":"s2","relation":"supported_by","provenance":"derived","confidence":0.95},{"id":"ce15","from":"d1","to":"s5","relation":"supported_by","provenance":"derived","confidence":0.95},{"id":"ce16","from":"d2","to":"s5","relation":"supported_by","provenance":"derived","confidence":0.9},{"id":"ce17","from":"d2","to":"k2","relation":"supported_by","provenance":"derived","confidence":0.9},{"id":"ce18","from":"k3","to":"s4","relation":"supported_by","provenance":"derived","confidence":0.8}]},{"id":"tbpn","kind":"tbpn","title":"Elad Gil: the three underappreciated things about the AI wave","summary":"Asked what is durable in the face of AI, Elad Gil announces 'two or three things that are underappreciated', numbers three of them - capability is now an API call, closed markets are open, TAMs are moving from seats to labour - evidences each, and only afterwards says that people will miss how big these markets are. The pillars are stated and quotable; the sentence that would sit on top of them is not.","source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-10-10_sam-altman-live-on-sora-hollywood-the-future-of-ads-bill-peebles-dylan-patel-elad-gil-robby-stein-morgan-housel-misha-laskin.md","date":"2025-10-10","episode_title":"Sam Altman live on Sora, Hollywood, the future of ads (Bill Peebles, Dylan Patel, Elad Gil, Robby Stein, Morgan Housel, Misha Laskin)","url":"https://podscripts.co/podcasts/tbpn-live/sam-altman-live-on-sora-hollywood-the-future-of-ads-bill-peebles-dylan-patel-elad-gil-robby-stein-morgan-housel-misha-laskin"},"why_this_episode":"A speaker who enumerates his own key lines with ordinals ('the first thing... a second thing... and then the third thing'), so pillar membership is a quoted fact rather than an inference, and who nevertheless leaves the apex empty: the label he puts on top is the intellectually blank 'two or three things that are underappreciated', and his conclusion arrives after the pillars rather than before them. The passage therefore shows the Pyramid Principle's two failure modes in one place - a grouping that does not synthesise, and an answer delivered bottom-up - while giving numbers under every pillar and, fifty lines later, the timing pillar the stated set omits.","idea_bearing_slot":"governing_thought","layout":{"mode":"plane","guides":[{"from":[0,60],"to":[-46,33],"style":"solid"},{"from":[-46,33],"to":[-56,15],"style":"solid"},{"from":[-56,15],"to":[-68,-40],"style":"solid"},{"from":[-68,-40],"to":[68,-40],"style":"solid"},{"from":[68,-40],"to":[56,15],"style":"solid"},{"from":[56,15],"to":[46,33],"style":"solid"},{"from":[46,33],"to":[0,60],"style":"solid"},{"from":[-46,33],"to":[46,33],"style":"dashed"},{"from":[-56,15],"to":[56,15],"style":"dashed"}]},"nodes":[{"id":"gt","slot":"governing_thought","label":"AI markets sized as software","text":"The one-sentence answer the passage never states: the AI wave is being under-sized because three things moved at once - the capability became a call away, buyers who never bought software opened up, and the budget in play is labour rather than seats - so a market measured with software instincts will be measured wrong.","provenance":"derived","confidence":0.75,"rationale":"Each of the three stated pillars is about a different half of the same mis-measurement: supply (capability is now callable), demand (closed markets opened), and the unit of value (labour, not seats). The speaker states the consequence late ('you're really going to miss the size of these markets') but never the sentence that summarises the group, which is what the Pyramid Principle requires at the apex.","idea":"Price and size AI products against the labour budget they displace rather than the software budget they sit in, and the missing infrastructure - outcome metering, attribution and billing for work performed rather than seats occupied - becomes a market of its own.","entities":["Elad Gil"],"size":2,"level":0,"pos":[0,49]},{"id":"gt_stated","slot":"governing_thought","label":"You're going to miss the size","text":"The speaker's own summary line, delivered after the three pillars rather than before them: market size for these things is very underappreciated and people will miss how big the markets are.","provenance":"fact","source_quote":"And I think that's very underappreciated when you think about market size for some of these things. You're really going to miss the size of these markets and how big they are.","source_ref":"Elad Gil, L3140-L3142","entities":["Elad Gil"],"level":0,"pos":[30,38],"size":0.7},{"id":"gt_group","slot":"governing_thought","label":"2-3 underappreciated things","text":"The label the speaker actually puts on top of his group: there are two or three underappreciated things about this AI wave. It announces a set without saying what the set adds up to, and without settling how many members it has.","provenance":"fact","source_quote":"I think there's two or three things that are underappreciated about this AI wave","source_ref":"Elad Gil, L3116-L3116","entities":["Elad Gil"],"level":0,"pos":[-30,38],"size":0.7},{"id":"k1","slot":"key_line","label":"Capability: one API call","text":"The first pillar: the capability set has shifted dramatically, and not only in what the models can do - they can be reached with an API call, which puts the capability in everybody's hands.","provenance":"fact","source_quote":"I think that the first thing is that the capability set has shifted dramatically, not just in terms of what these models can do, but the fact that you can just ping them with an API and something's accessible to everybody.","source_ref":"Elad Gil, L3118-L3120","entities":["Elad Gil"],"level":1,"pos":[-51,24],"size":1.2},{"id":"k2","slot":"key_line","label":"Closed markets are open","text":"The second pillar: markets that were closed to software are open. Legal never bought any software and was hard to sell into, and now a vendor can exist there.","provenance":"fact","source_quote":"I think a second thing is that the markets are oddly open. Like legal never bought any software.","source_ref":"Elad Gil, L3124-L3126","entities":["Elad Gil"],"level":1,"pos":[-21,24],"size":1.2},{"id":"k3","slot":"key_line","label":"TAMs: seats to labour","text":"The third pillar: the addressable markets are shifting from seat-based pricing and seat-based value to labour, because the product replaces human work rather than equipping a worker.","provenance":"fact","source_quote":"And then the third thing is that a lot of this is about what you're saying, which is the tams of markets are shifting from seat-based pricing or seat-based value to labor. You're replacing human labor.","source_ref":"Elad Gil, L3128-L3132","entities":["Elad Gil"],"level":1,"pos":[8,24],"size":1.2},{"id":"k4","slot":"key_line","label":"Org process sets the rate","text":"A fourth pillar the speaker never files under his group: whatever the size, it is reached only at the speed enterprises change process, so the market is large and slow rather than large and imminent.","provenance":"derived","confidence":0.7,"rationale":"Fifty lines later, answering a different question, the speaker says the value will take about a decade and that the impediment is organisational process rather than technology. Under this governing thought those statements are a pillar, not an aside: without it the stated set of three answers 'how big' and leaves 'how fast' unanswered, which is where the group stops being collectively exhaustive.","idea":"If the binding constraint on a $5T reallocation is process change rather than model quality, the scarce good is the deployment layer - workflow re-mapping, change management and integration sold as a product - and it is being priced today as consulting rather than as software.","entities":["Elad Gil"],"level":1,"pos":[44,24],"size":1.2},{"id":"s12","slot":"support","label":"Revenue already booked","text":"Both things can be true at once, the speaker says: real revenue is being booked by these companies today.","provenance":"fact","source_quote":"And I think both things can be true simultaneously, which is we're seeing real revenue for these companies, right?","source_ref":"Elad Gil, L3168-L3170","entities":["Elad Gil"],"level":2,"pos":[-48,8],"size":0.9},{"id":"s1","slot":"support","label":"Cursor: hundreds of $M","text":"Cursor is rumoured to be at high hundreds of millions of revenue.","provenance":"fact","source_quote":"Cursor is rumored to be in the high hundreds of millions of revenue.","source_ref":"Elad Gil, L3172-L3172","entities":["Cursor","Elad Gil"],"level":3,"pos":[-60,-20],"size":0.8},{"id":"s2","slot":"support","label":"Azure: +$2-3B a quarter","text":"Azure added something like two or three billion dollars of AI revenue per quarter, from a cold start two or three years ago.","provenance":"fact","source_quote":"Azure added something like two or three billion of the AI revenue per quarter from sort of a cold start two or three years ago","source_ref":"Elad Gil, L3174-L3176","entities":["Microsoft","Elad Gil"],"level":3,"pos":[-40,-34],"size":0.75},{"id":"s3","slot":"support","label":"Distribution everywhere","text":"The distribution for these products already exists and is massive; it is everywhere in some sense.","provenance":"fact","source_quote":"But to your point, we have massive distribution. It's already everywhere in some sense, right?","source_ref":"Elad Gil, L3210-L3212","entities":["Elad Gil"],"level":2,"pos":[-60,-6],"size":0.9},{"id":"d1","slot":"support","label":"No software line item","text":"The screen the legal example implies but the speaker does not state: the open markets are the professions with almost no software line item and a large payroll line, because there is no incumbent to displace and the budget being competed for is wages.","provenance":"derived","confidence":0.75,"rationale":"The speaker offers legal as an instance ('legal never bought any software') and draws no rule from it. The rule is the only thing that makes the pillar usable by anyone else: it turns one anecdote into a test that can be run across professions.","entities":["Elad Gil"],"level":2,"pos":[-20,8],"size":0.9},{"id":"s4","slot":"support","label":"Legal bought no software","text":"Legal was hard to sell software into and bought almost none, and because of AI a vendor can suddenly exist there. ('RV' in the transcript is a speech-to-text error for the vendor's name.)","provenance":"fact","source_quote":"It was really hard to sell into legal, but because of AI, suddenly RV can exist, right?","source_ref":"Elad Gil, L3126-L3126","entities":["Elad Gil"],"level":2,"pos":[-30,-6],"size":0.9},{"id":"s5","slot":"support","label":"Not seats, how much work","text":"Customer support is the worked example: the question is not how many seats you can sell to customer-support reps, as with a seat-priced incumbent, but how much of their work you can do.","provenance":"fact","source_quote":"And so you're looking at, for example, customer support. It's not Zendaz, How many seats can you sell the customer support reps? It's how much can you augment and do work for customer support reps?","source_ref":"Elad Gil, L3132-L3136","entities":["Zendesk","Elad Gil"],"level":2,"pos":[10,8],"size":0.9},{"id":"s6","slot":"support","label":"Labour vs software market","text":"The comparison stated flatly: it is the labour market versus the software market.","provenance":"fact","source_quote":"It's the labor market versus the software market.","source_ref":"Elad Gil, L3138-L3138","entities":["Elad Gil"],"level":2,"pos":[3,-6],"size":0.9},{"id":"s7","slot":"support","label":"$5T of services spend","text":"The speaker's team sized the services economy where AI could intervene at about $5 trillion, a large share of GDP.","provenance":"fact","source_quote":"The services economy that we looked at on my team in terms of where AI could intervene is about $5 trillion. So it's a lot of GDP is accessible to this.","source_ref":"Elad Gil, L3144-L3146","entities":["Elad Gil"],"level":2,"pos":[-4,-20],"size":0.85},{"id":"d2","slot":"support","label":"A share of function cost","text":"What the seat-to-labour shift implies for the price tag, once the host's framing and the speaker's are put together: the unit of pricing becomes a share of what the function costs to run, not a per-user fee.","provenance":"derived","confidence":0.7,"rationale":"The host proposes value-based pricing at some percent of revenue for running a function; the speaker, answering, moves the whole TAM from seats to labour. Neither states the mechanism that joins them, and it is the operative one for anyone building here: the invoice has to be denominated in the function's cost.","entities":["Elad Gil"],"level":2,"pos":[24,-20],"size":0.85},{"id":"s11","slot":"support","label":"3%, 5% or 1% of revenue?","text":"The host's framing immediately before the pyramid: a seat-based incumbent such as an HR platform could transition to value-based pricing on the value of running the function - three, five or one percent of revenue.","provenance":"fact","source_quote":"I could see them transitioning to kind of value-based pricing around what is it, what's the value of like running your HR department, right? Is it 3% of revenue? Is it 5% of revenue? Is it 1% of revenue?","source_ref":"host, L3106-L3112","entities":["Ripling"],"level":3,"pos":[24,-34],"size":0.75},{"id":"s8","slot":"support","label":"Probably takes a decade","text":"The flip side, in the speaker's own words: it will probably take a decade.","provenance":"fact","source_quote":"But the flip side of it is it'll probably take a decade, right?","source_ref":"Elad Gil, L3186-L3186","entities":["Elad Gil"],"level":2,"pos":[45,8],"size":0.9},{"id":"s9","slot":"support","label":"The impediment is not tech","text":"The biggest impediment to adoption is not the technology, which could already do a great deal, but organisational process and workflow management.","provenance":"fact","source_quote":"And I think the biggest impediment to adoption isn't the technology. We could do so much stuff with the technology right now. It's organizational process. It's workflow management.","source_ref":"Elad Gil, L3190-L3196","entities":["Elad Gil"],"level":2,"pos":[35,-6],"size":0.9},{"id":"s10","slot":"support","label":"The internet took 15 years","text":"The precedent the host brings in from a Ken Griffin talk: in 1999 and 2000 it was obvious the internet would change the world, and it still took fifteen years to have an impact.","provenance":"fact","source_quote":"ken griffin gave a talk earlier this week and he was saying that in 1999 and 2000 it was very obvious that the internet was going to change the world change the way that our economies run yet it still took 15 years for it to actually have an impact","source_ref":"host, L3154-L3158","entities":["Ken Griffin"],"level":2,"pos":[60,-20],"size":0.8}],"edges":[{"id":"fe1","from":"gt_group","to":"k1","relation":"rests_on","provenance":"fact","source_quote":"I think there's two or three things that are underappreciated about this AI wave. I think that the first thing is that the capability set has shifted dramatically","source_ref":"Elad Gil, L3116-L3118"},{"id":"fe2","from":"gt_group","to":"k2","relation":"rests_on","provenance":"fact","source_quote":"I think a second thing is that the markets are oddly open","source_ref":"Elad Gil, L3124-L3124"},{"id":"fe3","from":"gt_group","to":"k3","relation":"rests_on","provenance":"fact","source_quote":"And then the third thing is that a lot of this is about what you're saying","source_ref":"Elad Gil, L3128-L3128"},{"id":"fe4","from":"k2","to":"s4","relation":"rests_on","provenance":"fact","source_quote":"Like legal never bought any software. It was really hard to sell into legal, but because of AI, suddenly RV can exist, right?","source_ref":"Elad Gil, L3124-L3126"},{"id":"fe5","from":"k3","to":"s5","relation":"rests_on","provenance":"fact","source_quote":"You're replacing human labor. And so you're looking at, for example, customer support.","source_ref":"Elad Gil, L3130-L3132"},{"id":"fe6","from":"s12","to":"s1","relation":"rests_on","provenance":"fact","source_quote":"we're seeing real revenue for these companies, right? Cursor is rumored to be in the high hundreds of millions of revenue.","source_ref":"Elad Gil, L3170-L3172"},{"id":"fe7","from":"s12","to":"s2","relation":"rests_on","provenance":"fact","source_quote":"Cursor is rumored to be in the high hundreds of millions of revenue. You know, Azure added something like two or three billion of the AI revenue per quarter","source_ref":"Elad Gil, L3172-L3174"},{"id":"fe8","from":"s8","to":"s9","relation":"rests_on","provenance":"fact","source_quote":"It's all the stuff that happens when a big enterprise uses anything. And they're like, you want me to change my tooling? You want me to change my people. You want me to, you know, my processes. And that's what's going to slow it down.","source_ref":"Elad Gil, L3198-L3206"},{"id":"de1","from":"gt","to":"k1","relation":"rests_on","provenance":"derived","confidence":0.75,"rationale":"The synthesis rests on the supply half of the argument: capability that can be reached with an API call."},{"id":"de2","from":"gt","to":"k2","relation":"rests_on","provenance":"derived","confidence":0.75,"rationale":"The synthesis rests on the demand half: buyers who never bought software are now reachable."},{"id":"de3","from":"gt","to":"k3","relation":"rests_on","provenance":"derived","confidence":0.8,"rationale":"The synthesis rests on the change in the unit of value, which is the pillar that actually moves the market size."},{"id":"de4","from":"gt","to":"k4","relation":"rests_on","provenance":"derived","confidence":0.6,"rationale":"An answer-first sentence that claims size has to carry the timing pillar too, or it overstates what the speaker himself concedes later."},{"id":"de5","from":"gt","to":"gt_stated","relation":"supported_by","provenance":"derived","confidence":0.85},{"id":"de6","from":"gt","to":"gt_group","relation":"supported_by","provenance":"derived","confidence":0.7},{"id":"de7","from":"gt","to":"s7","relation":"supported_by","provenance":"derived","confidence":0.7},{"id":"de8","from":"k1","to":"s12","relation":"rests_on","provenance":"derived","confidence":0.6,"rationale":"The revenue evidence arrives thirty lines later in answer to a different question; attaching it to the capability pillar is the analyst's placement, made because it is what shows the newly callable capability is being bought."},{"id":"de9","from":"k1","to":"s3","relation":"rests_on","provenance":"derived","confidence":0.8,"rationale":"'Accessible to everybody' and 'we have massive distribution' are the same claim stated twice in the passage, minutes apart."},{"id":"de10","from":"k2","to":"d1","relation":"rests_on","provenance":"derived","confidence":0.75,"rationale":"A pillar needs a support that generalises, not only an instance; the rule stands between the legal anecdote and the pillar."},{"id":"de11","from":"d1","to":"s4","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"de12","from":"k3","to":"s6","relation":"rests_on","provenance":"derived","confidence":0.85,"rationale":"The one-line contrast is the compressed form of the pillar and follows it directly."},{"id":"de13","from":"k3","to":"s7","relation":"rests_on","provenance":"derived","confidence":0.8,"rationale":"The $5 trillion figure is the size of the labour budget the pillar claims is in play; the speaker gives it two lines later without naming the link."},{"id":"de14","from":"k3","to":"d2","relation":"rests_on","provenance":"derived","confidence":0.7,"rationale":"The pricing mechanism is what the pillar means in practice, and it joins the host's framing to the speaker's."},{"id":"de15","from":"d2","to":"s11","relation":"supported_by","provenance":"derived","confidence":0.7},{"id":"de16","from":"d2","to":"s6","relation":"supported_by","provenance":"derived","confidence":0.75},{"id":"de17","from":"k4","to":"s8","relation":"rests_on","provenance":"derived","confidence":0.9,"rationale":"The decade estimate is the timing claim the pillar summarises."},{"id":"de18","from":"k4","to":"s9","relation":"rests_on","provenance":"derived","confidence":0.9,"rationale":"The organisational-process impediment is the reason behind the timing claim."},{"id":"de19","from":"k4","to":"s10","relation":"rests_on","provenance":"derived","confidence":0.7,"rationale":"The precedent comes from the host quoting Ken Griffin rather than from the speaker, so the link crosses speakers; it is the backing for the decade rather than evidence for it."},{"id":"de20","from":"k1","to":"k2","relation":"grouped_with","provenance":"derived","confidence":0.8,"rationale":"Supply and demand are different kinds of reason but the same kind of idea - a condition of the wave that is underappreciated - so they belong in one inductive group."},{"id":"de21","from":"k2","to":"k3","relation":"grouped_with","provenance":"derived","confidence":0.8,"rationale":"Read as supply, demand and unit of value, the three stated pillars are mutually exclusive; the speaker's own uncertainty about whether there are two or three of them shows the set was never tested."},{"id":"de22","from":"k3","to":"k4","relation":"grouped_with","provenance":"derived","confidence":0.55,"rationale":"The fourth pillar is the contested member: it is the same kind of idea about the same wave, but <script>
// Pyramid Principle. Two things the data-driven engine cannot express:
//  1. the three tiers of the pyramid are trapezoids, not rectangles, so `regions` cannot draw
//     them; the outline is carried by `layout.guides` and this block fills each tier in its slot
//     colour and writes the tier name in the margin beside it;
//  2. the node the opportunity is read from (any node carrying an `idea`) gets a gold ring, and
//     the ring is explained in the legend. The ring is parented to the node's own group, so it
//     appears and disappears with the node when LLM-derived items are toggled.
// Tier corners repeat the apex / shoulder / shoulder / base points used by layout.guides.
window.__PYRAMID_TIERS = {
  classic: {
    apex: [0, 58], shoulders: [[40, 32], [52, 14]], base: [62, -22],
    labels: [[-36, 42], [-52, 28], [-58, 10]],
  },
  tbpn: {
    apex: [0, 60], shoulders: [[46, 33], [56, 15]], base: [68, -40],
    labels: [[-38, 44], [-56, 29], [-63, 12]],
  },
};
window.__frameworkExtension = (ctx) => {
  const { THREE, example, nodesById, group, api } = ctx;
  const GOLD = '#c98500';

  // ---- the pyramid itself: one filled trapezoid per tier, in the tier's slot colour ----
  const tier = window.__PYRAMID_TIERS[example.id];
  if (tier) {
    const slots = ['governing_thought', 'key_line', 'support'];
    const [s1, s2] = tier.shoulders;
    const rows = [
      [[tier.apex[0], tier.apex[1]], [tier.apex[0], tier.apex[1]], s1],   // cap: a triangle
      [[-s1[0], s1[1]], [s1[0], s1[1]], s2],
      [[-s2[0], s2[1]], [s2[0], s2[1]], tier.base],
    ];
    rows.forEach(([tl, tr, bot], i) => {
      const st = api.slotStyle.get(slots[i]);
      const shape = new THREE.Shape();
      shape.moveTo(tl[0], tl[1]);
      shape.lineTo(tr[0], tr[1]);
      shape.lineTo(bot[0], bot[1]);
      shape.lineTo(-bot[0], bot[1]);
      shape.closePath();
      const mesh = new THREE.Mesh(
        new THREE.ShapeGeometry(shape),
        new THREE.MeshBasicMaterial({
          color: new THREE.Color((st && st.color) || '#888888'),
          transparent: true, opacity: 0.085, depthWrite: false, side: THREE.DoubleSide,
        })
      );
      mesh.position.z = -1.4;
      group.add(mesh);
    });
    ['Governing thought', 'Key line', 'Support'].forEach((text, i) => {
      const p = tier.labels[i];
      const lab = api.label2d(text, 'rlabel');
      lab.position.set(p[0], p[1], -0.6);
      group.add(lab);
    });
  }

  let marked = 0;
  for (const n of example.nodes) {
    if (!n.idea) continue;
    const rec = nodesById.get(n.id);
    if (!rec) continue;
    marked++;
    const r = rec.r * 1.75, pts = [];
    for (let i = 0; i <= 72; i++) { const t = i / 72 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(t) * r, Math.sin(t) * r, 0)); }
    const ring = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: new THREE.Color(GOLD), transparent: true, opacity: 0.9 })
    );
    rec.obj.add(ring);
  }
  if (!marked) return;
  const leg = document.getElementById('legend');
  if (!leg || leg.querySelector('[data-idea-key]')) return;
  const row = document.createElement('div');
  row.className = 'key-row';
  row.setAttribute('data-idea-key', '1');
  const sym = document.createElement('span');
  sym.className = 'sym'; sym.textContent = '\u25EF'; sym.style.color = GOLD;
  const txt = document.createElement('span');
  txt.textContent = 'gold ring: the node the opportunity is read from';
  row.append(sym, txt);
  const stats = leg.querySelector('.stats');
  if (stats) leg.insertBefore(row, stats); else leg.appendChild(row);
};
</script>

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function forceLayout(nodes, edges, pinned, seed, opts = {}) {
  const rand = mulberry32(seed);
  const pos = new Map();
  const R0 = opts.radius || Math.max(18, nodes.length * 2.2);
  for (const n of nodes) {
    if (pinned.has(n.id)) pos.set(n.id, pinned.get(n.id).clone());
    else pos.set(n.id, new THREE.Vector3((rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0 * (opts.flat ? 0.15 : 1)));
  }
  const ids = nodes.map(n => n.id);
  const L = opts.rest || 16, K = opts.repulse || 420;
  const f = new Map(ids.map(id => [id, new THREE.Vector3()]));
  const d = new THREE.Vector3();
  for (let it = 0; it < 420; it++) {
    const alpha = 0.9 * (1 - it / 420) + 0.04;
    for (const id of ids) f.get(id).set(0, 0, 0);
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const a = pos.get(ids[i]), b = pos.get(ids[j]);
      d.subVectors(a, b); let dist = d.length(); if (dist < 0.5) { d.set(rand() - .5, rand() - .5, rand() - .5); dist = 0.5; }
      const s = K / (dist * dist); d.normalize().multiplyScalar(s);

    for (const e of edges) {
      if (!pos.has(e.from) || !pos.has(e.to)) continue;
      const a = pos.get(e.from), b = pos.get(e.to);
      d.subVectors(b, a); const dist = Math.max(d.length(), 0.01);
      const s = (dist - L) * 0.05; d.normalize().multiplyScalar(s);

    }
    for (const id of ids) {

      const p = pos.get(id), ff = f.get(id);

      const len = ff.length(); if (len > 6) ff.multiplyScalar(6 / len);

    }

}

function treeLayout(ex) {
  const nodes = ex.nodes, edges = ex.edges.filter(e => e.relation !== 'supported_by');
  const level = new Map();
  const explicit = nodes.every(n => Number.isInteger(n.level));
  if (explicit) nodes.forEach(n => level.set(n.id, n.level));

    const out = new Map(nodes.map(n => [n.id, []])), und = new Map(nodes.map(n => [n.id, []]));
    for (const e of edges) { out.get(e.from)?.push(e.to); und.get(e.from)?.push(e.to); und.get(e.to)?.push(e.from); }
    const root = ex.layout.root && level.has(ex.layout.root) === false ? ex.layout.root : nodes[0].id;
    const q = [root]; level.set(root, 0);
    while (q.length) { const id = q.shift(); for (const t of out.get(id) || []) if (!level.has(t)) { level.set(t, level.get(id) + 1); q.push(t); } }

  const GAP_L = right ? 26 : 18, GAP_S = right ? 9 : 14;

  const parents = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) if (level.get(e.to) > level.get(e.from)) parents.get(e.to).push(e.from);
  const xOf = new Map();
  for (const l of order) {
    const arr = layers.get(l);
    if (l !== order[0]) arr.sort((a, b) => {
      const pa = parents.get(a.id).filter(p => xOf.has(p)), pb = parents.get(b.id).filter(p => xOf.has(p));
      const ma = pa.length ? pa.reduce((s, p) => s + xOf.get(p), 0) / pa.length : 0;

      return ma - mb;

      const s = (i - (arr.length - 1) / 2) * GAP_S;

}

function ringLayout(ex) {
  const nodes = ex.nodes;
  const onRing = nodes.filter(n => Number.isInteger(n.order) && !Array.isArray(n.pos));
  const R = Math.max(22, onRing.length * 4.2);

  onRing.sort((a, b) => a.order - b.order).forEach((n, i) => { const t = Math.PI / 2 - (i / onRing.length) * Math.PI * 2; pinned.set(n.id, new THREE.Vector3(Math.cos(t) * R, Math.sin(t) * R, 0)); });
  for (const n of nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  if (pinned.size === nodes.length) return pinned;
  return forceLayout(nodes, ex.edges, pinned, 7, { radius: R * 0.5, flat: true, rest: 12 });
}

function planeLayout(ex) {
  const pinned = new Map();
  for (const n of ex.nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  if (pinned.size === ex.nodes.length) return pinned;
  return forceLayout(ex.nodes, ex.edges, pinned, 11, { flat: true, rest: 14 });

function computeLayout(ex) {
  const mode = ex.layout?.mode || 'force';
  if (mode === 'tree') return treeLayout(ex);
  if (mode === 'ring') return ringLayout(ex);
  if (mode === 'plane') return planeLayout(ex);
  const pinned = new Map();
  for (const n of ex.nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));

const GEO = {

function makeNode(n, p) {

    ring.userData.isIdeaRing = true; obj.add(ring);

  const g = document.createElement('span'); g.className = 'g'; g.textContent = glyph; g.style.color = n.provenance === 'schema' ? MUTED : st.color;

}

function makeEdge(e, A, B) {

  else if (e.provenance === 'derived') mat = new THREE.LineDashedMaterial({ color: new THREE.Color(INK2), dashSize: 1.4, gapSize: 0.9, transparent: true, opacity: 0.8 });
  else if (e.provenance === 'schema') mat = new THREE.LineBasicMaterial({ color: new THREE.Color(HAIRLINE), transparent: true, opacity: 0.9 });

function drawDecor(ex, parent, bbox, offset) {
  const L = ex.layout || {};

  // are authored in the same space as node positions. Shift the decor by the same amount so a
  // region or axis lines up with its nodes without the author having to centre on the origin.
  const group = new THREE.Group();

  parent.add(group);
  const shift = (v) => new THREE.Vector3(v.x - offset.x, v.y - offset.y, v.z - offset.z);
  const z = -0.6;
  const lineMat = new THREE.LineBasicMaterial({ color: new THREE.Color(0x4a4a47) });
  const dashMat = new THREE.LineDashedMaterial({ color: new THREE.Color(0x4a4a47), dashSize: 1.2, gapSize: 1.0 });

    const w = Math.abs(r.x[1] - r.x[0]), h = Math.abs(r.y[1] - r.y[0]);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(r.color || '#3987e5'), transparent: true, opacity: 0.07, depthWrite: false }));
    m.position.set((r.x[0] + r.x[1]) / 2, (r.y[0] + r.y[1]) / 2, z - 0.5); group.add(m);
    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)), new THREE.LineBasicMaterial({ color: new THREE.Color(r.color || '#3987e5'), transparent: true, opacity: 0.25 }));

    bbox.expandByPoint(shift(new THREE.Vector3(r.x[0], r.y[0], 0))); bbox.expandByPoint(shift(new THREE.Vector3(r.x[1], r.y[1], 0)));

    lab.position.set(an.pos[0], an.pos[1], an.pos[2] ?? z); group.add(lab);
    bbox.expandByPoint(shift(new THREE.Vector3(an.pos[0], an.pos[1], 0)));
  }

    const a = new THREE.Vector3(gd.from[0], gd.from[1], gd.from[2] || z), b = new THREE.Vector3(gd.to[0], gd.to[1], gd.to[2] || z);
    const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), gd.style === 'dashed' ? dashMat : lineMat); ln.computeLineDistances(); group.add(ln);
    if (gd.label) { const lab = label2d(gd.label, 'glabel'); lab.position.copy(a).lerp(b, 0.5); group.add(lab); }
    bbox.expandByPoint(shift(a)); bbox.expandByPoint(shift(b));
  }

    const pad = 6;
    if (ax) {
      const y = ymin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xmin, y, z), new THREE.Vector3(xmax, y, z)]), lineMat));
      const lab = label2d(ax.label, 'axlabel'); lab.position.set((xmin + xmax) / 2, y - 7.5, z); group.add(lab);
      for (const t of (ax.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(t.value, y - 1, z), new THREE.Vector3(t.value, y + 1, z)]), lineMat)); const tl = label2d(t.label, 'tick'); tl.position.set(t.value, y - 2.2, z); group.add(tl); }
      bbox.expandByPoint(shift(new THREE.Vector3(xmin, y - 9, 0))); bbox.expandByPoint(shift(new THREE.Vector3(xmax, y, 0)));
    }
    if (ay) {
      const x = xmin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, ymin, z), new THREE.Vector3(x, ymax, z)]), lineMat));
      const lab = label2d(ay.label, 'axlabel', 'rotate(-90deg)'); lab.position.set(x - 8, (ymin + ymax) / 2, z); group.add(lab);
      for (const t of (ay.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x - 1, t.value, z), new THREE.Vector3(x + 1, t.value, z)]), lineMat)); const tl = label2d(t.label, 'tick', 'translateX(-50%)'); tl.position.set(x - 2.5, t.value, z); group.add(tl); }

}

// ---------- build an example ----------
function clearGroup() {
  if (!state.group) return;
  state.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); } if (o.isCSS2DObject && o.element) o.element.remove(); });
  scene.remove(state.group);
  $('labels').replaceChildren();
  state.group = null; state.nodes.clear(); state.edges = []; state.hit = []; state.hover = null; state.selected = null;
  $('panel').hidden = true;
}

function buildExample(i) {
  clearGroup();
  state.exampleIndex = i;
  const ex = GRAPH.examples[i];
  const group = new THREE.Group(); scene.add(group); state.group = group;
  const positions = computeLayout(ex);
  // centre
  const bbox = new THREE.Box3();
  for (const p of positions.values()) bbox.expandByPoint(p);
  const centre = bbox.getCenter(new THREE.Vector3());
  const decorOffset = ex.layout?.mode !== 'plane' ? centre.clone() : new THREE.Vector3();
  if (ex.layout?.mode !== 'plane') for (const p of positions.values()) p.sub(centre);
  const bbox2 = new THREE.Box3(); for (const p of positions.values()) bbox2.expandByPoint(p);
  for (const n of ex.nodes) { const rec = makeNode(n, positions.get(n.id)); state.nodes.set(n.id, rec); group.add(rec.obj); state.hit.push(rec.hit); }
  for (const e of ex.edges) {
    const A = state.nodes.get(e.from), B = state.nodes.get(e.to); if (!A || !B) continue;
    const rec = makeEdge(e, A, B); state.edges.push(rec); group.add(rec.grp); A.edges.push(rec); B.edges.push(rec);
  }
  drawDecor(ex, group, bbox2, decorOffset);
  // camera fit
  const size = bbox2.getSize(new THREE.Vector3()), c = bbox2.getCenter(new THREE.Vector3());
  state.fit = { size, centre: c, mode: ex.layout?.mode || 'force', distance: ex.layout?.camera?.distance };
  renderNote(ex);
  renderLegend(ex);    // legend first, so the camera fit can measure it
  resetView();
  applyVisibility();
  for (const b of $('examples').children) b.setAttribute('aria-pressed', String(b.dataset.index == i));
  try { window.__frameworkExtension?.({ THREE, scene, group, graph: GRAPH, example: ex, nodesById: state.nodes, positions, api: { slotStyle, label2d, colors: { INK, INK2, MUTED, HAIRLINE, SURFACE, SLOT_COLORS, SCHEMA_COLOR } } }); } catch (e) { console.error('framework extension failed', e); }
}

// Fit the graph into the part of the stage not covered by the legend (left) or the open panel (right),
// so labels are not hidden under the cards at the default view.
function safeArea(size) {
  const W = stage.clientWidth, H = stage.clientHeight;
  const sr = stage.getBoundingClientRect();
  let left = 0, top = 0, right = 0;
  const wide = W > 820;
  const leg = $('legend'); if (wide && leg && leg.offsetParent !== null) { const r = leg.getBoundingClientRect(); left = Math.max(left, r.right - sr.left + 16); }
  const panel = $('panel'); if (wide && panel && !panel.hidden) { const r = panel.getBoundingClientRect(); right = Math.max(right, sr.right - r.left + 16); }
  return { W, H, left, top, right, w: Math.max(200, W - left - right), h: Math.max(200, H - top) };
}
function resetView() {
  if (!state.fit) return;
  const { size, centre, mode } = state.fit;
  const sa = safeArea(size);
  const halfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const bottomPad = 30;                       // px: labels hang below the lowest row of nodes
  const availH = Math.max(150, sa.h - bottomPad);
  // distance at which the graph (plus margins) fits the safe area: the vertical FOV spans sa.H pixels
  const fitH = (size.y / 2 + 8) * sa.H / (halfFov * availH);
  const sidePad = 110;                       // px: labels are centred under nodes and stick out sideways
  const fitW = (size.x / 2 + 6) * sa.H / (halfFov * Math.max(200, sa.w - 2 * sidePad));
  const dist = state.fit.distance || Math.max(50, Math.max(fitH, fitW) * (mode === 'force' ? 1.3 : 1.08) + size.z / 2);
  // world units per pixel at the target depth; shift the centre so the graph sits in the safe area
  const wpp = (2 * dist * halfFov) / sa.H;
  const target = centre.clone().add(new THREE.Vector3(-((sa.left - sa.right) / 2) * wpp, ((sa.top - bottomPad) / 2) * wpp, 0));
  const camPos = mode === 'force' ? target.clone().add(new THREE.Vector3(dist * 0.3, dist * 0.22, dist * 0.92)) : target.clone().add(new THREE.Vector3(0, 0, dist));
  camera.position.copy(camPos); controls.target.copy(target);
  camera.near = 0.1; camera.far = 5000; camera.updateProjectionMatrix(); controls.update();
}

function applyVisibility() {
  for (const rec of state.nodes.values()) {
    const vis = rec.node.provenance !== 'derived' || state.showDerived;
    rec.obj.visible = vis;
    rec.label.visible = vis && state.showLabels;
    rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  for (const rec of state.edges) {
    const endsOk = rec.A.obj.visible && rec.B.obj.visible;
    // a derived edge is reasoning too: it goes away with the derived nodes, even when both its ends are facts
    const vis = endsOk && (!rec.grounding || state.showGrounding) && (rec.edge.provenance !== 'derived' || state.showDerived);
    rec.grp.visible = vis;
    if (rec.label) rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  // The idea key explains a marker; drop it when no idea node is on screen (e.g. the facts-only view).
  const ideaKey = $('legend')?.querySelector('.key-row.idea-key');
  if (ideaKey) ideaKey.style.display = [...state.nodes.values()].some(r => r.node.idea && r.obj.visible) ? '' : 'none';
  renderStats();
}

// ---------- legend / note / stats ----------
function renderLegend(ex) {
  const el = $('legend'); el.replaceChildren();
  const h = (t) => { const x = document.createElement('h2'); x.textContent = t; return x; };
  el.appendChild(h('Slots'));
  const counts = new Map(); for (const n of ex.nodes) counts.set(n.slot, (counts.get(n.slot) || 0) + 1);
  for (const s of GRAPH.slots) {
    const row = document.createElement('div'); row.className = 'slot-row';
    const chip = document.createElement('span'); const stl = slotStyle.get(s.id);
    chip.className = 'chip' + (stl.shape && stl.shape !== 'sphere' ? ' ' + stl.shape : ''); chip.style.background = stl.color;
    if (s.structural) chip.style.borderRadius = '2px';
    const name = document.createElement('span'); name.textContent = s.label;
    const tp = document.createElement('span'); tp.className = 'tp'; tp.textContent = s.structural ? 'schema' : (s.typical_provenance || '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = String(counts.get(s.id) || 0);
    row.append(chip, name, tp, n); row.title = s.description || ''; el.appendChild(row);
  }
  el.appendChild(h('Provenance'));
  const ideaCount = ex.nodes.filter(n => n.idea).length;
  const keys = [['●', 'fact: stated in the source (solid)'], ['◌', 'derived: LLM inference (translucent, dashed)'], ['▪', 'schema: framework scaffolding (grey)'], ['→', 'solid edge stated, dashed inferred'], ['⋯', 'grounding link: derived → fact']];
  if (ideaCount) keys.push(['★', 'gold ring: an opportunity this framework surfaces']);
  for (const [sym, txt] of keys) {
    const row = document.createElement('div'); row.className = 'key-row';
    if (sym === '★') row.classList.add('idea-key');
    const a = document.createElement('span'); a.className = 'sym'; a.textContent = sym; if (sym === '★') a.style.color = IDEA;
    const b = document.createElement('span'); b.textContent = txt; row.append(a, b); el.appendChild(row);
  }
  const st = document.createElement('div'); st.className = 'stats'; st.id = 'stats'; el.appendChild(st);
  renderStats();
}
function renderStats() {
  const st = $('stats'); if (!st) return;
  const ex = GRAPH.examples[state.exampleIndex];
  const nf = ex.nodes.filter(n => n.provenance === 'fact').length, nd = ex.nodes.filter(n => n.provenance === 'derived').length, ns = ex.nodes.filter(n => n.provenance === 'schema').length;
  const ef = ex.edges.filter(e => e.provenance === 'fact').length, ed = ex.edges.filter(e => e.provenance === 'derived' && e.relation !== 'supported_by').length, eg = ex.edges.filter(e => e.relation === 'supported_by').length, es = ex.edges.filter(e => e.provenance === 'schema').length;
  const visN = [...state.nodes.values()].filter(r => r.obj.visible).length, visE = state.edges.filter(r => r.grp.visible).length;
  st.replaceChildren();
  const line = (html) => { const d = document.createElement('div'); d.append(...html); st.appendChild(d); };
  const b = (t) => { const x = document.createElement('b'); x.textContent = t; return x; };
  line(['nodes ', b(String(nf)), ' fact · ', b(String(nd)), ' derived', ns ? ` · ${ns} schema` : '']);
  line(['edges ', b(String(ef)), ' fact · ', b(String(ed)), ' derived · ', b(String(eg)), ' grounding', es ? ` · ${es} schema` : '']);
  line([`showing ${visN} nodes, ${visE} edges`]);
}
function renderNote(ex) {
  const el = $('note'); el.replaceChildren();
  const h = document.createElement('h3'); h.textContent = ex.title || ex.id; el.appendChild(h);
  const p = document.createElement('p'); p.textContent = ex.summary || ''; el.appendChild(p);
  const s = document.createElement('div'); s.className = 'src';
  if (ex.source?.type === 'transcript') s.textContent = `TBPN ${ex.source.date} · ${ex.source.episode_title || ''}`;
  else if (ex.source?.type === 'text') s.textContent = `source: ${ex.source.title || 'scenario text'}`;
  el.appendChild(s);
}

// ---------- panel ----------
function openPanel(rec) {
  const n = rec.node, ex = GRAPH.examples[state.exampleIndex];
  const panel = $('panel'); panel.replaceChildren(); panel.hidden = false;
  const head = document.createElement('div'); head.className = 'p-head';
  const slotEl = document.createElement('div'); slotEl.className = 'p-slot';
  const chip = document.createElement('span'); chip.className = 'chip'; chip.style.background = rec.color; slotEl.append(chip, document.createTextNode((slotStyle.get(n.slot)?.slot?.label) || n.slot));
  const close = document.createElement('button'); close.className = 'close'; close.type = 'button'; close.textContent = '×'; close.setAttribute('aria-label', 'Close'); close.onclick = () => { panel.hidden = true; state.selected = null; };
  head.append(slotEl, close); panel.appendChild(head);
  const h3 = document.createElement('h3'); h3.textContent = n.label; panel.appendChild(h3);
  const badge = document.createElement('span'); badge.className = 'badge ' + n.provenance; badge.textContent = n.provenance; panel.appendChild(badge);
  const text = document.createElement('p'); text.textContent = n.text; panel.appendChild(text);
  const h4 = (t) => { const x = document.createElement('h4'); x.textContent = t; panel.appendChild(x); };
  if (n.provenance === 'fact') {
    h4(n.paraphrase ? 'Paraphrased from the source' : 'Quoted from the source');
    const q = document.createElement('blockquote'); q.textContent = n.source_quote || ''; panel.appendChild(q);
    const r = document.createElement('div'); r.className = 'ref'; r.textContent = n.source_ref || ''; panel.appendChild(r);
  } else if (n.provenance === 'derived') {
    h4('Confidence');
    const c = document.createElement('div'); c.className = 'conf'; c.textContent = `${Math.round((n.confidence || 0) * 100)} / 100`; panel.appendChild(c);
    const bar = document.createElement('div'); bar.className = 'confbar'; const fillEl = document.createElement('i'); fillEl.style.width = `${Math.round((n.confidence || 0) * 100)}%`; bar.appendChild(fillEl); panel.appendChild(bar);
    h4('Why the LLM infers this'); const r = document.createElement('p'); r.textContent = n.rationale || ''; panel.appendChild(r);
    if (n.idea) { h4('Opportunity this points to'); const ip = document.createElement('p'); ip.className = 'idea'; ip.textContent = n.idea; panel.appendChild(ip); }
    const sup = ex.edges.filter(e => e.relation === 'supported_by' && e.from === n.id).map(e => state.nodes.get(e.to)).filter(Boolean);
    if (sup.length) { h4('Supported by'); const ul = document.createElement('ul'); for (const s of sup) { const li = document.createElement('li'); li.textContent = s.node.label; const q = document.createElement('div'); q.className = 'ref'; q.textContent = (s.node.source_quote || '').slice(0, 140); li.appendChild(q); ul.appendChild(li); } panel.appendChild(ul); }
  } else {
    const r = document.createElement('p'); r.className = 'ref'; r.textContent = 'Framework scaffolding: neither a fact nor an inference.'; panel.appendChild(r);
  }
  const rels = rec.edges.filter(e => e.edge.relation !== 'supported_by');
  if (rels.length) {
    h4('Edges'); const ul = document.createElement('ul');
    for (const e of rels) { const li = document.createElement('li'); const out = e.edge.from === n.id; const other = out ? e.B.node : e.A.node; const rl = document.createElement('span'); rl.className = 'rel'; rl.textContent = (out ? '→ ' : '← ') + (relLabel.get(e.edge.relation) || e.edge.relation) + (e.edge.provenance === 'derived' ? ' (inferred)' : '') + ' '; li.append(rl, document.createTextNode(other.label)); ul.appendChild(li); }
    panel.appendChild(ul);
  }
  if (Array.isArray(n.entities) && n.entities.length) { h4('Entities'); const p = document.createElement('p'); p.className = 'ref'; p.textContent = n.entities.join(', '); panel.appendChild(p); }
}

// ---------- interaction ----------
const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2(); const tooltip = $('tooltip');
function setHover(rec) {
  if (state.hover === rec) return;
  if (state.hover) { const h = state.hover; h.mesh.scale.setScalar(1); if (h.mesh.material.emissive) h.mesh.material.emissive.setHex(0x000000); for (const e of h.edges) { e.line.material.color.set(e.grounding ? MUTED : (e.edge.provenance === 'schema' ? HAIRLINE : INK2)); if (e.arrow) e.arrow.material.color.set(INK2); } }
  state.hover = rec;
  if (rec) { rec.mesh.scale.setScalar(1.18); if (rec.mesh.material.emissive) rec.mesh.material.emissive.set(rec.color).multiplyScalar(0.35); for (const e of rec.edges) { if (!e.grp.visible) continue; e.line.material.color.set(INK); if (e.arrow) e.arrow.material.color.set(INK); } }
  renderer.domElement.style.cursor = rec ? 'pointer' : '';
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(state.hit.filter(h => h.parent.visible), false);
  const rec = hits.length ? state.nodes.get(hits[0].object.userData.nodeId) : null;
  setHover(rec);
  if (rec) {
    tooltip.replaceChildren();
    const a = document.createElement('div'); a.className = 't-label'; a.textContent = rec.node.label;
    const b = document.createElement('div'); b.className = 't-meta'; b.textContent = `${(slotStyle.get(rec.node.slot)?.slot?.label) || rec.node.slot} · ${rec.node.provenance}${rec.node.provenance === 'derived' ? ' ' + Math.round((rec.node.confidence || 0) * 100) + '%' : ''}`;
    const c = document.createElement('div'); c.textContent = rec.node.text.length > 160 ? rec.node.text.slice(0, 157) + '…' : rec.node.text;
    tooltip.append(a, b, c);
    tooltip.style.display = 'block';
    const mx = ev.clientX - r.left + 14, my = ev.clientY - r.top + 14;
    tooltip.style.left = Math.min(mx, r.width - 320) + 'px'; tooltip.style.top = Math.min(my, r.height - 120) + 'px';
  } else tooltip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => { setHover(null); tooltip.style.display = 'none'; });
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  if (state.hover) { state.selected = state.hover; openPanel(state.hover); } else { $('panel').hidden = true; state.selected = null; }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
  if (ev.key === 'd') { $('t-derived').checked = !$('t-derived').checked; $('t-derived').dispatchEvent(new Event('change')); }
  if (ev.key === 'g') { $('t-grounding').checked = !$('t-grounding').checked; $('t-grounding').dispatchEvent(new Event('change')); }
  if (ev.key === 'r') resetView();
  if (ev.key === 'Escape') { $('panel').hidden = true; state.selected = null; }
});
$('t-derived').addEventListener('change', (e) => { state.showDerived = e.target.checked; applyVisibility(); });
$('t-grounding').addEventListener('change', (e) => { state.showGrounding = e.target.checked; applyVisibility(); });
$('t-labels').addEventListener('change', (e) => { state.showLabels = e.target.checked; applyVisibility(); });
$('t-rotate').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
$('reset').addEventListener('click', resetView);

// example selector
const seg = $('examples');
const kindCount = new Map(); for (const ex of GRAPH.examples) kindCount.set(ex.kind, (kindCount.get(ex.kind) || 0) + 1);
GRAPH.examples.forEach((ex, i) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.index = i; b.textContent = kindCount.get(ex.kind) > 1 ? (ex.title || ex.id) : ex.kind === 'tbpn' ? 'From TBPN' : ex.kind === 'classic' ? 'Classic' : (ex.title || ex.id); b.title = ex.title || ''; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => buildExample(i)); seg.appendChild(b); });

// ---------- go ----------
// URL parameters set the initial state (deep links, scripted screenshots): ?example=1&derived=0&grounding=1&labels=0&rotate=1
const q = new URLSearchParams(location.search);
const flag = (k, def) => q.has(k) ? !['0', 'false', 'off', 'no'].includes(q.get(k).toLowerCase()) : def;
state.showDerived = flag('derived', true); $('t-derived').checked = state.showDerived;
state.showGrounding = flag('grounding', false); $('t-grounding').checked = state.showGrounding;
state.showLabels = flag('labels', true); $('t-labels').checked = state.showLabels;
controls.autoRotate = flag('rotate', false); $('t-rotate').checked = controls.autoRotate;
let startIndex = parseInt(q.get('example') || '0', 10);
if (!(startIndex >= 0 && startIndex < GRAPH.examples.length)) startIndex = Math.max(0, GRAPH.examples.findIndex(x => x.id === q.get('example')));
resize();
buildExample(startIndex);
$('fallback').hidden = true; window.__engineReady = true;
function loop() {
  requestAnimationFrame(loop);
  controls.update();
  for (const rec of state.nodes.values()) for (const c of rec.obj.children) if (c.userData.isIdeaRing) c.quaternion.copy(camera.quaternion);
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
