<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel .lab { display: inline-block; transform: translateY(11px); }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"framework":{"slug":"carl","name":"CARL","category":"01-narrative-and-statement","wikipedia":"https://en.wikipedia.org/wiki/Double-loop_learning","one_liner":"Takes a completed episode apart into the Context it happened in, the Action taken, the Result that followed and the Learning drawn from it, then forces a fifth question: which governing rule has to change so that the failure class cannot recur."},"slots":[{"id":"context","label":"Context","description":"The setting and the constraints the actor was operating inside: who they were, what they had, and which rules, markets or structures bounded them. Usually stated, because accounts open with it.","typical_provenance":"fact","color":"#4a7fd4","shape":"sphere"},{"id":"action","label":"Action","description":"What was actually done, as concrete steps in order. CARL keeps the actor's own moves separate from the setting so that the two can fail independently.","typical_provenance":"fact","color":"#199e70","shape":"sphere"},{"id":"result","label":"Result","description":"What happened as a consequence: the outcome, measured where possible, including outcomes that contradict each other (an operation that worked inside a business that did not).","typical_provenance":"fact","color":"#c98500","shape":"sphere"},{"id":"learning","label":"Learning","description":"The single-loop lesson: what the actor would do differently next time inside the same setup. Sometimes said out loud in a reflection, often only implied by the tone of the retelling.","typical_provenance":"either","color":"#7d5bd6","shape":"box"},{"id":"rule","label":"Systemic rule","description":"The double-loop lesson: the governing assumption, policy or structure that has to change so this class of failure cannot happen again. Almost never stated as a rule, and the reason the fifth slot exists.","typical_provenance":"derived","color":"#d0466f","shape":"diamond"}],"relations":[{"id":"motivates","label":"motivates","description":"the context, or an earlier step, motivates what is done next"},{"id":"produces","label":"produces","description":"an action, or an earlier outcome, produces what happened next"},{"id":"constrains","label":"constrains","description":"a context condition bounds what an action can achieve, up to preventing it outright"},{"id":"teaches","label":"teaches","description":"a result teaches a lesson to the actor"},{"id":"generalizes_to","label":"generalizes to","description":"a lesson, or an observed recurrence, generalises into a standing rule"}],"examples":[{"id":"classic","kind":"classic","title":"A medication near miss on a ward (reflective account)","summary":"The reflective-practice setting CARL was written for: a nurse writes up a near miss, draws the obvious lesson about her own care, and the ward then changes something she never proposed. The graph separates the stated account from the two inferences that turn a personal resolution into a systemic rule.","source":{"type":"text","title":"Reflective account written by a second-year ward nurse after a medication near miss","text":"On a late shift in February I was the only registered nurse covering sixteen beds, working with one healthcare assistant and an agency nurse who had never worked on the ward before. At about nine in the evening a patient was prescribed 1 mg of intravenous morphine for breakthrough pain. I went to the controlled-drugs cupboard, took an ampoule from the tray, drew up the dose, and asked the agency nurse to check it with me before I gave it. She read the label back and stopped me: the ampoule was 10 mg in 1 ml, not 1 mg in 1 ml. The two strengths are kept in the same drawer in almost identical boxes. No morphine reached the patient, and I recorded the event as a near miss before the end of the shift. My first reaction was that I had been careless, and I decided that I would slow down and read every label twice. When the team reviewed the incident the following week, we found that the same two ampoules had been confused twice already that year, by two other nurses. Because it had now happened three times to three different people, the ward changed where the drugs live: the two strengths are stored in separate cupboards and the 10 mg ampoule is released only against a second signature in the controlled-drugs register. I still read every label twice, but I no longer think that is what makes the next dose safe.","attribution":"Written for this library in the genre CARL is taught in (nursing and allied-health reflective practice); the ward, the shift and the figures are invented, the look-alike-ampoule failure mode is a standard patient-safety case."},"layout":{"mode":"plane","regions":[{"label":"Context","x":[-83,-48],"y":[-55,38],"color":"#4a7fd4"},{"label":"Action","x":[-48,-16],"y":[-55,38],"color":"#199e70"},{"label":"Result","x":[-16,16],"y":[-55,38],"color":"#c98500"},{"label":"Learning","x":[16,48],"y":[-55,38],"color":"#7d5bd6"},{"label":"Systemic rule","x":[48,83],"y":[-55,38],"color":"#d0466f"},{"label":"grounded only","x":[-83,83],"y":[-55,-37],"color":"#898781"}],"guides":[{"from":[-48,44],"to":[-48,44],"label":"motivates →"},{"from":[-16,44],"to":[-16,44],"label":"produces →"},{"from":[16,44],"to":[16,44],"label":"teaches →"},{"from":[48,44],"to":[48,44],"label":"generalizes to →"},{"from":[0,-65.5],"to":[0,-65.5]},{"from":[0,-73.5],"to":[0,-73.5]}]},"nodes":[{"id":"c1","slot":"context","label":"Sole RN for sixteen beds","text":"On a late shift the author was the only registered nurse for sixteen beds, with a healthcare assistant and an agency nurse who did not know the ward.","provenance":"fact","source_quote":"I was the only registered nurse covering sixteen beds, working with one healthcare assistant and an agency nurse who had never worked on the ward before","source_ref":"sentence 1","pos":[-64,6]},{"id":"c2","slot":"context","label":"1 mg IV morphine prescribed","text":"A patient was prescribed 1 mg of intravenous morphine for breakthrough pain at about nine in the evening.","provenance":"fact","source_quote":"a patient was prescribed 1 mg of intravenous morphine for breakthrough pain","source_ref":"sentence 2","pos":[-64,30]},{"id":"c3","slot":"context","label":"Look-alikes in one drawer","text":"The 1 mg and 10 mg morphine ampoules are kept in the same drawer in almost identical boxes.","provenance":"fact","source_quote":"The two strengths are kept in the same drawer in almost identical boxes","source_ref":"sentence 5","pos":[-64,18]},{"id":"c4","slot":"context","label":"Only small print separates 10x","text":"Nothing but the printed strength on a near-identical box separates a dose from ten times that dose.","provenance":"derived","confidence":0.85,"rationale":"The account states that the two strengths sit in one drawer in almost identical boxes and that the ampoules are 1 mg and 10 mg in the same volume; that the small print is the only discriminator is the inference joining those two statements.","pos":[-64,-47]},{"id":"a1","slot":"action","label":"Drew up the dose from the tray","text":"She went to the controlled-drugs cupboard, took an ampoule from the tray and drew up the dose.","provenance":"fact","source_quote":"I went to the controlled-drugs cupboard, took an ampoule from the tray, drew up the dose","source_ref":"sentence 3","pos":[-32,24]},{"id":"a2","slot":"action","label":"Asked for a second check","text":"She asked the agency nurse to check the drawn-up dose with her before administering it.","provenance":"fact","source_quote":"asked the agency nurse to check it with me before I gave it","source_ref":"sentence 3","pos":[-32,0]},{"id":"a3","slot":"action","label":"Logged it as a near miss","text":"She recorded the event as a near miss before the end of the shift.","provenance":"fact","source_quote":"I recorded the event as a near miss before the end of the shift","source_ref":"sentence 6","pos":[-32,-12]},{"id":"a4","slot":"action","label":"Team reviewed it a week later","text":"The team reviewed the incident at its meeting the following week.","provenance":"fact","source_quote":"the team reviewed the incident the following week","source_ref":"sentence 8","pos":[-32,-24]},{"id":"r1","slot":"result","label":"Caught: 10 mg, not 1 mg","text":"The agency nurse read the label back and stopped her: the ampoule was 10 mg in 1 ml, not 1 mg in 1 ml.","provenance":"fact","source_quote":"She read the label back and stopped me: the ampoule was 10 mg in 1 ml, not 1 mg in 1 ml","source_ref":"sentence 4","pos":[0,6]},{"id":"r2","slot":"result","label":"No morphine reached the patient","text":"No morphine reached the patient.","provenance":"fact","source_quote":"No morphine reached the patient","source_ref":"sentence 6","pos":[0,18]},{"id":"r3","slot":"result","label":"Same swap twice before","text":"The review found that the same two ampoules had been confused twice already that year, by two other nurses.","provenance":"fact","source_quote":"the same two ampoules had been confused twice already that year, by two other nurses","source_ref":"sentence 8","pos":[0,-30]},{"id":"r4","slot":"result","label":"The barrier that held: the check","text":"The error was stopped by a second person reading the label, not by the care taken in drawing the dose up.","provenance":"derived","confidence":0.8,"rationale":"The same nurse both selected the wrong ampoule and asked for the check; identifying the check rather than her own attention as the barrier that actually worked is a reading of that sequence, not a statement in it.","pos":[0,-47]},{"id":"l1","slot":"learning","label":"Resolved to read labels twice","text":"Her first lesson was that she had been careless and would slow down and read every label twice.","provenance":"fact","source_quote":"I would slow down and read every label twice","source_ref":"sentence 7","pos":[32,12]},{"id":"l2","slot":"learning","label":"Vigilance was not what failed","text":"Three different nurses made the same mistake, so the variable that failed is not individual attention but the arrangement that requires it.","provenance":"derived","confidence":0.85,"rationale":"The recurrence across two other nurses is stated; concluding from it that attention is the wrong variable to correct is the move from a single-loop resolution to a double-loop diagnosis, and the account gestures at it without naming it.","pos":[32,-12]},{"id":"u1","slot":"rule","label":"Split cupboards, 2nd signature","text":"The ward now stores the two strengths in separate cupboards and releases the 10 mg ampoule only against a second signature in the controlled-drugs register.","provenance":"fact","source_quote":"the two strengths are stored in separate cupboards and the 10 mg ampoule is released only against a second signature in the controlled-drugs register","source_ref":"sentence 9","pos":[64,-30]},{"id":"u2","slot":"rule","label":"Design ambiguity out of storage","text":"The governing rule moves from asking people to read more carefully to removing the situation in which a misread is possible at all.","provenance":"derived","confidence":0.8,"rationale":"The ward's change and the closing sentence both point at this principle, but the account states the new arrangement rather than the rule behind it; naming the rule is what makes the lesson transfer to every other look-alike pair on the ward.","pos":[64,-18]}],"edges":[{"id":"ce1","from":"c2","to":"a1","relation":"motivates","provenance":"derived","confidence":0.9,"rationale":"The prescription is what sent her to the cupboard; the account gives the two in sequence without stating the link."},{"id":"ce2","from":"c1","to":"a2","relation":"motivates","provenance":"derived","confidence":0.6,"rationale":"With no second registered nurse on the ward the check could only fall to the agency nurse; the account states the staffing and the request but never connects them."},{"id":"ce3","from":"c3","to":"a1","relation":"constrains","provenance":"derived","confidence":0.8,"rationale":"Taking the wrong strength was possible because both sit in one drawer in almost identical boxes; the arrangement is stated separately from the act."},{"id":"ce4","from":"a2","to":"r1","relation":"produces","provenance":"derived","confidence":0.9,"rationale":"The catch follows the request to check in the next sentence, but no connective is stated; narrative order is doing the work."},{"id":"ce5","from":"r1","to":"r2","relation":"produces","provenance":"derived","confidence":0.9,"rationale":"Nothing reaching the patient is the consequence of the ampoule being stopped; the two are reported as separate facts."},{"id":"ce6","from":"a3","to":"a4","relation":"motivates","provenance":"derived","confidence":0.7,"rationale":"The logged near miss is what put the event on the team meeting's agenda; the account states both without joining them."},{"id":"ce7","from":"a4","to":"r3","relation":"produces","provenance":"fact","source_quote":"When the team reviewed the incident the following week, we found that the same two ampoules had been confused twice already that year, by two other nurses","source_ref":"sentence 8"},{"id":"ce8","from":"r1","to":"l1","relation":"teaches","provenance":"fact","source_quote":"My first reaction was that I had been careless, and I decided that I would slow down and read every label twice","source_ref":"sentence 7"},{"id":"ce9","from":"r3","to":"u1","relation":"generalizes_to","provenance":"fact","source_quote":"Because it had now happened three times to three different people, the ward changed where the drugs live","source_ref":"sentence 9"},{"id":"ce10","from":"r3","to":"l2","relation":"teaches","provenance":"derived","confidence":0.85,"rationale":"Reading the recurrence as evidence about the system rather than about three careless individuals is the inference the ward acted on but the author does not write down."},{"id":"ce11","from":"l1","to":"l2","relation":"generalizes_to","provenance":"derived","confidence":0.7,"rationale":"The single-loop resolution is superseded rather than confirmed once the recurrence is known; the account keeps both without ranking them."},{"id":"ce12","from":"l2","to":"u1","relation":"generalizes_to","provenance":"derived","confidence":0.8,"rationale":"The stated rule change follows from the diagnosis that attention is the wrong variable; the ward states the new arrangement, never the diagnosis."},{"id":"ce13","from":"l2","to":"u2","relation":"generalizes_to","provenance":"derived","confidence":0.85,"rationale":"Once vigilance is ruled out as the failing variable, the only remaining lever is the storage design, which is the governing rule the ward actually changed."},{"id":"ce14","from":"c4","to":"c3","relation":"supported_by","provenance":"derived","confidence":0.85},{"id":"ce15","from":"c4","to":"r1","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"ce16","from":"r4","to":"a2","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"ce17","from":"r4","to":"r1","relation":"supported_by","provenance":"derived","confidence":0.85},{"id":"ce18","from":"l2","to":"r3","relation":"supported_by","provenance":"derived","confidence":0.85},{"id":"ce19","from":"u2","to":"u1","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"ce20","from":"u2","to":"c3","relation":"supported_by","provenance":"derived","confidence":0.8}]},{"id":"tbpn","kind":"tbpn","title":"Cala: profitable restaurants, terminal structure","summary":"Ylan Richard tells the show why Cala, a French food-robotics company with five very profitable restaurants, was shut down two months earlier, and what he is changing in the company he is incorporating now. The operating loop worked and the governing structure did not, which is exactly the situation CARL's fifth slot exists for.","source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-07-23_apple-goes-full-throttle-on-f1-meme-stocks-make-a-comeback-amazons-new-wearable-ai-device-christina-cacioppo-deena-shakir-davide-asnaghi-ylan-richard.md","date":"2025-07-23","episode_title":"Apple Goes Full Throttle on F1, Meme Stocks Make a Comeback, Amazon's New Wearable AI Device (Christina Cacioppo, Deena Shakir, Davide Asnaghi, Ylan Richard)","url":"https://podscripts.co/podcasts/tbpn-live/apple-goes-full-throttle-on-f1-meme-stocks-make-a-comeback-amazons-new-wearable-ai-device-christina-cacioppo-deena-shakir-davide-asnaghi-ylan-richard"},"why_this_episode":"A completed eight-year episode told by the founder two months after the shutdown, with the outcome, the mechanism and the lessons all stated out loud, and with a rare property: the actions succeeded on every operating measure the speaker gives while the company still died, so the correction has to happen one loop up. The founder even names the governing assumption that failed, that they did not understand the European financing cliff when they structured the business, which is what CARL's Learning and Systemic rule slots are there to catch.","idea_bearing_slot":"rule","layout":{"mode":"plane","regions":[{"label":"Context","x":[-83,-48],"y":[-55,38],"color":"#4a7fd4"},{"label":"Action","x":[-48,-16],"y":[-55,38],"color":"#199e70"},{"label":"Result","x":[-16,16],"y":[-55,38],"color":"#c98500"},{"label":"Learning","x":[16,48],"y":[-55,38],"color":"#7d5bd6"},{"label":"Systemic rule","x":[48,83],"y":[-55,38],"color":"#d0466f"},{"label":"grounded only","x":[-83,83],"y":[-55,-37],"color":"#898781"}],"guides":[{"from":[-48,44],"to":[-48,44],"label":"motivates →"},{"from":[-16,44],"to":[-16,44],"label":"produces →"},{"from":[16,44],"to":[16,44],"label":"teaches →"},{"from":[48,44],"to":[48,44],"label":"generalizes to →"},{"from":[0,-65.5],"to":[0,-65.5]},{"from":[0,-73.5],"to":[0,-73.5]}]},"nodes":[{"id":"ct1","slot":"context","label":"Robotics to cut restaurant costs","text":"Cala's mission was to make real food more affordable by using robotics and AI to automate back-kitchen operations.","provenance":"fact","source_quote":"The vision and the mission was to basically make real food more affordable by using robotics and AI to automate the back kitchen operations","source_ref":"Ylan Richard, L5898-L5902","entities":["Cala"],"pos":[-64,30]},{"id":"ct2","slot":"context","label":"Ten million raised from VCs","text":"By the time the first restaurants were working the company had raised ten million dollars from venture investors.","provenance":"fact","source_quote":"We had raised 10 million up to that point from VCs","source_ref":"Ylan Richard, L5948-L5950","entities":["Cala"],"pos":[-64,18]},{"id":"ct3","slot":"context","label":"European Series A/B cliff","text":"European venture has a structural financing gap at the Series A to Series B moment: a gigantic cliff rather than a next rung.","provenance":"fact","source_quote":"there's a big financing gap when you get to the Series A slash Series B moment, where basically there's just a gigantic cliff of funding there","source_ref":"Ylan Richard, L5950-L5954","pos":[-64,6]},{"id":"ct4","slot":"context","label":"French insolvency severance","text":"French law gives employees high severance when a company goes bankrupt, with further state-backed protections on top.","provenance":"fact","source_quote":"what the regulation actually says is just that when a company goes bankrupt, the employee gets pretty high severance","source_ref":"Ylan Richard, L6148-L6151","pos":[-64,-18]},{"id":"ct5","slot":"context","label":"Cliff unknown at incorporation","text":"The founders did not know about the financing cliff when they created and structured the business.","provenance":"fact","source_quote":"we did not understand that when we created the business and structured the business","source_ref":"Ylan Richard, L5954-L5956","entities":["Cala"],"pos":[-64,-30]},{"id":"ct6","slot":"context","label":"Plan needed capital Europe lacks","text":"The scaling plan required a round of a size European venture does not supply for capital-intensive physical businesses.","provenance":"derived","confidence":0.7,"rationale":"The speaker states the cliff and states that ten million had been raised just as scaling began; the mismatch between the plan's capital requirement and the market's supply is a reading of those two facts and is never put that way.","entities":["Cala"],"pos":[-64,-6]},{"id":"a1","slot":"action","label":"Ran the company eight years","text":"The founders ran Cala for eight years, making, in the speaker's words, an ungodly amount of mistakes along the way.","provenance":"fact","source_quote":"We basically ran the company for eight years, did a bunch, like an ungodly amount of mistakes along the way","source_ref":"Ylan Richard, L5928-L5932","entities":["Cala"],"pos":[-32,24]},{"id":"a2","slot":"action","label":"Decided to scale on first results","text":"On the strength of the first profitable restaurants the team decided to start scaling.","provenance":"fact","source_quote":"we have kept those great first results with the restaurants, let's start scaling","source_ref":"Ylan Richard, L5946-L5948","pos":[-32,0]},{"id":"a3","slot":"action","label":"Tried to restructure to break even","text":"With scaling blocked, the team tried to restructure away from a handful of profitable restaurants carrying a very high HQ cost.","provenance":"fact","source_quote":"restructuring the business to go from those hands full of restaurants that were very profitable and a very high HQ cost","source_ref":"Ylan Richard, L5978-L5982","pos":[-32,-12]},{"id":"a4","slot":"action","label":"Asked regulators for a workaround","text":"The founders went to regulators, the government and any structure around them looking for a workaround.","provenance":"fact","source_quote":"we basically tried to talk to the regulators, to the government, to any structure that was around us to try and find a workaround","source_ref":"Ylan Richard, L6012-L6014","pos":[-32,-24]},{"id":"a5","slot":"action","label":"Kept HQ sized for the big plan","text":"Through those years the company carried a headquarters sized for the ambitious plan rather than for the five restaurants it operated.","provenance":"derived","confidence":0.7,"rationale":"He describes a very high HQ cost against a handful of restaurants and says they had kept a much more ambitious vision than what was achievable in Europe; that the HQ was sized to the plan rather than to the estate is the inference joining those statements.","entities":["Cala"],"pos":[-32,-45]},{"id":"r1","slot":"result","label":"Five very profitable restaurants","text":"The eight years produced five very, very, very profitable restaurants.","provenance":"fact","source_quote":"managed to have five very, very, very profitable restaurants","source_ref":"Ylan Richard, L5932-L5934","entities":["Cala"],"pos":[0,30]},{"id":"r2","slot":"result","label":"60% retention, 95% satisfaction","text":"Sixty per cent of customers came back more than once a week and customer satisfaction was ninety-five per cent.","provenance":"fact","source_quote":"but like 60% retention, customers coming more than once a week, 95% customer satisfaction","source_ref":"Ylan Richard, L5938-L5942","entities":["Cala"],"pos":[0,18]},{"id":"r3","slot":"result","label":"Only payback on the robot install","text":"Cala was, with the possible exception of Sweetgreen, the only restaurant business to have proven an incrementally positive return on the whole investment including the machines.","provenance":"fact","source_quote":"we are the only business that had, and technically Sweetgreen does as well, but had proven, let's say, incrementally positive return investment on the whole investment of a restaurant","source_ref":"Ylan Richard, L6078-L6082","entities":["Cala","Sweetgreen"],"pos":[0,6]},{"id":"r4","slot":"result","label":"Severance liability exceeded cash","text":"The severance liability alone was higher than the cash the company held at the time.","provenance":"fact","source_quote":"Like the purely the severance liability was higher than the cash on the hands we have at the time","source_ref":"Ylan Richard, L6000-L6002","entities":["Cala"],"pos":[0,-18]},{"id":"r5","slot":"result","label":"Shut down two months earlier","text":"The business was shut down a bit more than two months before the interview.","provenance":"fact","source_quote":"we had to shut down the business around a bit more than two months ago","source_ref":"Ylan Richard, L6018-L6020","entities":["Cala"],"pos":[0,-30]},{"id":"r6","slot":"result","label":"Product worked, scaling did not","text":"The product worked and the economics were there; what the company could not do was keep scaling.","provenance":"fact","source_quote":"we actually had a product that work and, and the economics were there. We just couldn't keep on scaling","source_ref":"Ylan Richard, L6207-L6211","entities":["Cala"],"pos":[0,-6]},{"id":"r7","slot":"result","label":"Regulation priced the fix out","text":"Insolvency protection turned a solvable cost problem into an unsolvable one: the cheapest legal route back to profitability cost more cash than the company held.","provenance":"derived","confidence":0.8,"rationale":"He says the restructuring was possible on paper, that French regulation prevented it, and that the severance liability alone exceeded cash on hand; naming that combination as the failure mechanism joins three separate statements into one.","entities":["Cala"],"pos":[0,-50]},{"id":"l1","slot":"learning","label":"Mistake was building in France","text":"The biggest mistake was starting the business in Europe, and in France specifically.","provenance":"fact","source_quote":"the biggest mistakes we made was definitely starting the business in Europe, in France specifically","source_ref":"Ylan Richard, L6108-L6110","entities":["Cala"],"pos":[32,-24]},{"id":"l2","slot":"learning","label":"Should have seen it years earlier","text":"They should have understood two or three years earlier that they could not keep scaling, and been far more conservative in structuring the business.","provenance":"fact","source_quote":"we should have understood that maybe two or three years earlier and just, uh, been a lot more conservative on the structuring of the business","source_ref":"Ylan Richard, L6210-L6214","entities":["Cala"],"pos":[32,0]},{"id":"l3","slot":"learning","label":"No single-loop fix could save it","text":"What failed was not how the restaurants were run but how the company was structured, so no improvement inside the existing setup could have changed the outcome.","provenance":"derived","confidence":0.8,"rationale":"The stated results show the operating loop working (profitable stores, weekly retention, payback on the machines) while the outcome was still terminal; diagnosing the failure as sitting in the governing structure rather than in execution is the double-loop reading the speaker approaches but never states.","entities":["Cala"],"pos":[32,-12]},{"id":"u1","slot":"rule","label":"Finance with VC and retail PE","text":"The financing strategy has to combine venture capital with private equity that handles retail and restaurants naturally, and the business must be tailored to both.","provenance":"fact","source_quote":"you have to build a strategy around your financing that's both VC but also private equity that does retail and restaurants more naturally","source_ref":"Ylan Richard, L6222-L6225","pos":[64,30]},{"id":"u2","slot":"rule","label":"Keep HQ cost low and lean","text":"The new company keeps a low HQ cost and lean HQ operations, with the other structuring elements changed to match.","provenance":"fact","source_quote":"that means low HQ cost, more lean HQ operations","source_ref":"Ylan Richard, L6228","pos":[64,18]},{"id":"u3","slot":"rule","label":"Franchise rather than own stores","text":"Franchising is under serious consideration as the path to scale, more aggressively and more capital-efficiently than owning every restaurant as Cala did.","provenance":"fact","source_quote":"pretty highly considering franchising as kind of a path to scale a lot more aggressively than and a lot more efficiently, capital efficiently than we did with Cali where we own every single restaurant","source_ref":"Ylan Richard, L6299-L6305","entities":["Cala"],"pos":[64,6]},{"id":"u4","slot":"rule","label":"Next company starts in New York","text":"The roadmap is to launch the first store of the new company in New York around the middle of next year.","provenance":"fact","source_quote":"The higher level roadmap is to launch the first store in New York, middle of next year","source_ref":"Ylan Richard, L6289","pos":[64,-30]},{"id":"u5","slot":"rule","label":"Structure is a design variable","text":"Jurisdiction, financing mix and ownership model are design variables to be chosen at incorporation and tested against the wind-down case, not only against the growth case.","provenance":"derived","confidence":0.75,"rationale":"Each of the four rules he states changes something that was fixed before the first restaurant opened; the governing rule they share, that structure is chosen and testable rather than inherited from where you happen to live, is the generalisation over them and is what makes the lesson portable.","idea":"The formation stack has no tool that prices jurisdiction, severance exposure and wind-down cost at incorporation the way a cap table is modelled, which is the diligence primitive this failure asks for.","pos":[64,-18],"size":1.3},{"id":"u6","slot":"rule","label":"The A/B cliff is an open market","text":"Proven, capital-intensive consumer businesses in Europe have no natural capital source between venture and retail private equity, which is why an operationally successful company had to stop.","provenance":"derived","confidence":0.6,"rationale":"Generalising one founder's account into a claim about a whole capital market is contestable: the cliff and the financing mix he now prescribes are stated, but the market-level gap and its size are inferred from a single case.","idea":"A growth vehicle that underwrites unit-economics-proven physical businesses across Europe's Series A to B gap, with retail private-equity discipline and venture speed, addresses a market the speaker describes as a gigantic cliff of funding.","pos":[64,-6],"size":1.3}],"edges":[{"id":"te1","from":"ct1","to":"a1","relation":"motivates","provenance":"derived","confidence":0.85,"rationale":"The mission is what the eight years of operating pursued; the speaker states them in sequence rather than as a cause."},{"id":"te2","from":"a1","to":"r1","relation":"produces","provenance":"fact","source_quote":"We basically ran the company for eight years, did a bunch, like an ungodly amount of mistakes along the way, but in the end, managed to have five very, very, very profitable restaurants","source_ref":"Ylan Richard, L5928-L5934"},{"id":"te3","from":"a1","to":"r2","relation":"produces","provenance":"derived","confidence":0.8,"rationale":"Retention and satisfaction are offered as the numbers behind the profitable restaurants, but the attribution to the eight years of operating is not made in a single span."},{"id":"te4","from":"r1","to":"a2","relation":"motivates","provenance":"fact","source_quote":"And so the thinking from there was, okay, we have kept those great first results with the restaurants, let's start scaling","source_ref":"Ylan Richard, L5946-L5948"},{"id":"te5","from":"ct3","to":"a2","relation":"constrains","provenance":"fact","source_quote":"let's start scaling. We had raised 10 million up to that point from VCs and we kind of got hung on a very structural problem of Europe","source_ref":"Ylan Richard, L5948-L5951"},{"id":"te6","from":"ct3","to":"a3","relation":"motivates","provenance":"derived","confidence":0.8,"rationale":"He describes hitting the funding wall and then the attempt to restructure to a break-even business; the link is adjacent in the narrative but never stated."},{"id":"te7","from":"ct4","to":"a3","relation":"constrains","provenance":"fact","source_quote":"We could have cut down cost enough to make the business profitable, but just pure French regulation prevented us from doing that","source_ref":"Ylan Richard, L5990-L5994"},{"id":"te8","from":"a3","to":"r4","relation":"produces","provenance":"derived","confidence":0.85,"rationale":"The severance liability is what the restructuring ran into; he names the regulation and then the liability in consecutive sentences without joining them."},{"id":"te9","from":"a4","to":"r5","relation":"produces","provenance":"fact","source_quote":"we basically tried to talk to the regulators, to the government, to any structure that was around us to try and find a workaround. But in the end, we couldn't really go beyond what the laws and rules allowed. And so ultimately, we had to shut down the business around a bit more than two months ago","source_ref":"Ylan Richard, L6012-L6020"},{"id":"te10","from":"r4","to":"r5","relation":"produces","provenance":"derived","confidence":0.85,"rationale":"The liability exceeding cash is why the shutdown was unavoidable, but the two are separated in his account by the attempt to find a workaround."},{"id":"te11","from":"r5","to":"l1","relation":"teaches","provenance":"fact","source_quote":"But yeah, in the end, couldn't really get there with Cala. And I think in the end, the biggest mistakes we made was definitely starting the business in Europe, in France specifically","source_ref":"Ylan Richard, L6104-L6110"},{"id":"te12","from":"r6","to":"l2","relation":"teaches","provenance":"fact","source_quote":"we actually had a product that work and, and the economics were there. We just couldn't keep on scaling and we should have understood that maybe two or three years earlier and just, uh, been a lot more conservative on the structuring of the business","source_ref":"Ylan Richard, L6207-L6214"},{"id":"te13","from":"l2","to":"l3","relation":"generalizes_to","provenance":"derived","confidence":0.75,"rationale":"Being more conservative about structuring is a step towards the diagnosis but stops short of it; naming the governing structure as the thing that failed is the analyst's move."},{"id":"te14","from":"l1","to":"u4","relation":"generalizes_to","provenance":"derived","confidence":0.8,"rationale":"The new company's first store is in New York; reading that as acting on the France lesson is a link the speaker leaves the listener to make, though he states the two minutes apart."},{"id":"te15","from":"l2","to":"u1","relation":"generalizes_to","provenance":"derived","confidence":0.85,"rationale":"The financing strategy is offered as the key lesson from the collapse, but the step from being more conservative to combining VC with retail private equity is a generalisation."},{"id":"te16","from":"l2","to":"u2","relation":"generalizes_to","provenance":"derived","confidence":0.8,"rationale":"A lean HQ is the operational form of being more conservative on structuring; he states both as lessons without connecting them."},{"id":"te17","from":"l3","to":"u3","relation":"generalizes_to","provenance":"derived","confidence":0.7,"rationale":"Franchising changes the ownership model rather than the operation, which follows from the diagnosis that the operation was not the problem."},{"id":"te18","from":"l3","to":"u5","relation":"generalizes_to","provenance":"derived","confidence":0.75,"rationale":"If single-loop fixes could not save it, the correction has to be made where the governing variables are set, which is the rule stated at u5."},{"id":"te19","from":"l3","to":"u6","relation":"generalizes_to","provenance":"derived","confidence":0.6,"rationale":"Turning one company's structural failure into a claim about a missing capital market is the widest step in the graph and the most contestable."},{"id":"te20","from":"ct6","to":"a2","relation":"constrains","provenance":"derived","confidence":0.7,"rationale":"If the plan needed more capital than the market supplies, the decision to scale was already unfundable when it was taken; the speaker states the cliff but not this consequence."},{"id":"te21","from":"ct6","to":"ct2","relation":"supported_by","provenance":"derived","confidence":0.7},{"id":"te22","from":"ct6","to":"ct3","relation":"supported_by","provenance":"derived","confidence":0.75},{"id":"te23","from":"a5","to":"a3","relation":"supported_by","provenance":"derived","confidence":0.7},{"id":"te24","from":"a5","to":"r1","relation":"supported_by","provenance":"derived","confidence":0.65},{"id":"te25","from":"r7","to":"r4","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"te26","from":"r7","to":"ct4","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"te27","from":"l3","to":"r6","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"te28","from":"l3","to":"r1","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"te29","from":"l3","to":"r3","relation":"supported_by","provenance":"derived","confidence":0.75},{"id":"te30","from":"u5","to":"ct5","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"te31","from":"u5","to":"u1","relation":"supported_by","provenance":"derived","confidence":0.75},{"id":"te32","from":"u5","to":"u4","relation":"supported_by","provenance":"derived","confidence":0.75},{"id":"te33","from":"u6","to":"ct3","relation":"supported_by","provenance":"derived","confidence":0.6},{"id":"te34","from":"u6","to":"r6","relation":"supported_by","provenance":"derived","confidence":0.6}]}]}</script>

      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xmin, y, z), new THREE.Vector3(xmax, y, z)]), lineMat));
      const lab = label2d(ax.label, 'axlabel'); lab.position.set((xmin + xmax) / 2, y - 4.5, z); group.add(lab);
      for (const t of (ax.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(t.value, y - 1, z), new THREE.Vector3(t.value, y + 1, z)]), lineMat)); const tl = label2d(t.label, 'tick'); tl.position.set(t.value, y - 2.2, z); group.add(tl); }
      bbox.expandByPoint(new THREE.Vector3(xmin, y - 6, 0)); bbox.expandByPoint(new THREE.Vector3(xmax, y, 0));
    }
    if (ay) {
      const x = xmin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, ymin, z), new THREE.Vector3(x, ymax, z)]), lineMat));
      const lab = label2d(ay.label, 'axlabel'); lab.element.style.transform = 'rotate(-90deg)'; lab.position.set(x - 5, (ymin + ymax) / 2, z); group.add(lab);
      for (const t of (ay.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x - 1, t.value, z), new THREE.Vector3(x + 1, t.value, z)]), lineMat)); const tl = label2d(t.label, 'tick'); tl.position.set(x - 2.5, t.value, z); tl.element.style.transform = 'translateX(-50%)'; group.add(tl); }
      bbox.expandByPoint(new THREE.Vector3(x - 8, ymin, 0)); bbox.expandByPoint(new THREE.Vector3(x, ymax, 0));
    }
  }
}

// ---------- build an example ----------
function clearGroup() {
  if (!state.group) return;
  state.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); } if (o.isCSS2DObject && o.element) o.element.remove(); });
  scene.remove(state.group);
  $('labels').replaceChildren();
  state.group = null; state.nodes.clear(); state.edges = []; state.hit = []; state.hover = null; state.selected = null;
  $('panel').hidden = true;
}

function buildExample(i) {
  clearGroup();
  state.exampleIndex = i;
  const ex = GRAPH.examples[i];
  const group = new THREE.Group(); scene.add(group); state.group = group;
  const positions = computeLayout(ex);
  // centre
  const bbox = new THREE.Box3();
  for (const p of positions.values()) bbox.expandByPoint(p);
  const centre = bbox.getCenter(new THREE.Vector3());
  if (ex.layout?.mode !== 'plane') for (const p of positions.values()) p.sub(centre);
  const bbox2 = new THREE.Box3(); for (const p of positions.values()) bbox2.expandByPoint(p);
  for (const n of ex.nodes) { const rec = makeNode(n, positions.get(n.id)); state.nodes.set(n.id, rec); group.add(rec.obj); state.hit.push(rec.hit); }
  for (const e of ex.edges) {
    const A = state.nodes.get(e.from), B = state.nodes.get(e.to); if (!A || !B) continue;
    const rec = makeEdge(e, A, B); state.edges.push(rec); group.add(rec.grp); A.edges.push(rec); B.edges.push(rec);
  }
  drawDecor(ex, group, bbox2);
  // camera fit
  const size = bbox2.getSize(new THREE.Vector3()), c = bbox2.getCenter(new THREE.Vector3());
  state.fit = { size, centre: c, mode: ex.layout?.mode || 'force', distance: ex.layout?.camera?.distance };
  renderNote(ex);
  renderLegend(ex);    // legend first, so the camera fit can measure it
  resetView();
  applyVisibility();
  for (const b of $('examples').children) b.setAttribute('aria-pressed', String(b.dataset.index == i));
  try { window.__frameworkExtension?.({ THREE, scene, group, graph: GRAPH, example: ex, nodesById: state.nodes, positions, api: { slotStyle, label2d, colors: { INK, INK2, MUTED, HAIRLINE, SURFACE, SLOT_COLORS, SCHEMA_COLOR } } }); } catch (e) { console.error('framework extension failed', e); }
}

// Fit the graph into the part of the stage not covered by the legend (left) or the open panel (right),
// so labels are not hidden under the cards at the default view.
function safeArea(size) {
  const W = stage.clientWidth, H = stage.clientHeight;
  const sr = stage.getBoundingClientRect();
  let left = 0, top = 0, right = 0;
  const wide = W > 820;
  const leg = $('legend'); if (wide && leg && leg.offsetParent !== null) { const r = leg.getBoundingClientRect(); left = Math.max(left, r.right - sr.left + 16); }
  const panel = $('panel'); if (wide && panel && !panel.hidden) { const r = panel.getBoundingClientRect(); right = Math.max(right, sr.right - r.left + 16); }
  return { W, H, left, top, right, w: Math.max(200, W - left - right), h: Math.max(200, H - top) };
}
function resetView() {
  if (!state.fit) return;
  const { size, centre, mode } = state.fit;
  const sa = safeArea(size);
  const halfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const bottomPad = 30;                       // px: labels hang below the lowest row of nodes
  const availH = Math.max(150, sa.h - bottomPad);
  // distance at which the graph (plus margins) fits the safe area: the vertical FOV spans sa.H pixels
  const fitH = (size.y / 2 + 8) * sa.H / (halfFov * availH);
  const sidePad = 110;                       // px: labels are centred under nodes and stick out sideways
  const fitW = (size.x / 2 + 6) * sa.H / (halfFov * Math.max(200, sa.w - 2 * sidePad));
  const dist = state.fit.distance || Math.max(50, Math.max(fitH, fitW) * (mode === 'force' ? 1.3 : 1.08) + size.z / 2);
  // world units per pixel at the target depth; shift the centre so the graph sits in the safe area
  const wpp = (2 * dist * halfFov) / sa.H;
  const target = centre.clone().add(new THREE.Vector3(-((sa.left - sa.right) / 2) * wpp, ((sa.top - bottomPad) / 2) * wpp, 0));
  const camPos = mode === 'force' ? target.clone().add(new THREE.Vector3(dist * 0.3, dist * 0.22, dist * 0.92)) : target.clone().add(new THREE.Vector3(0, 0, dist));
  camera.position.copy(camPos); controls.target.copy(target);
  camera.near = 0.1; camera.far = 5000; camera.updateProjectionMatrix(); controls.update();
}

function applyVisibility() {
  for (const rec of state.nodes.values()) {
    const vis = rec.node.provenance !== 'derived' || state.showDerived;
    rec.obj.visible = vis;
    rec.label.visible = vis && state.showLabels;
    rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  for (const rec of state.edges) {
    const endsOk = rec.A.obj.visible && rec.B.obj.visible;
    // a derived edge is reasoning too: it goes away with the derived nodes, even when both its ends are facts
    const vis = endsOk && (!rec.grounding || state.showGrounding) && (rec.edge.provenance !== 'derived' || state.showDerived);
    rec.grp.visible = vis;
    if (rec.label) rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  renderStats();
}

// ---------- legend / note / stats ----------
function renderLegend(ex) {
  const el = $('legend'); el.replaceChildren();
  const h = (t) => { const x = document.createElement('h2'); x.textContent = t; return x; };
  el.appendChild(h('Slots'));
  const counts = new Map(); for (const n of ex.nodes) counts.set(n.slot, (counts.get(n.slot) || 0) + 1);
  for (const s of GRAPH.slots) {
    const row = document.createElement('div'); row.className = 'slot-row';
    const chip = document.createElement('span'); const stl = slotStyle.get(s.id);
    chip.className = 'chip' + (stl.shape && stl.shape !== 'sphere' ? ' ' + stl.shape : ''); chip.style.background = stl.color;
    if (s.structural) chip.style.borderRadius = '2px';
    const name = document.createElement('span'); name.textContent = s.label;
    const tp = document.createElement('span'); tp.className = 'tp'; tp.textContent = s.structural ? 'schema' : (s.typical_provenance || '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = String(counts.get(s.id) || 0);
    row.append(chip, name, tp, n); row.title = s.description || ''; el.appendChild(row);
  }
  el.appendChild(h('Provenance'));
  const ideaCount = ex.nodes.filter(n => n.idea).length;
  const keys = [['●', 'fact: stated in the source (solid)'], ['◌', 'derived: LLM inference (translucent, dashed)'], ['▪', 'schema: framework scaffolding (grey)'], ['→', 'solid edge stated, dashed inferred'], ['⋯', 'grounding link: derived → fact']];
  if (ideaCount) keys.push(['★', 'gold ring: an opportunity this framework surfaces']);
  for (const [sym, txt] of keys) {
    const row = document.createElement('div'); row.className = 'key-row';
    const a = document.createElement('span'); a.className = 'sym'; a.textContent = sym; if (sym === '★') a.style.color = IDEA;
    const b = document.createElement('span'); b.textContent = txt; row.append(a, b); el.appendChild(row);
  }
  const st = document.createElement('div'); st.className = 'stats'; st.id = 'stats'; el.appendChild(st);
  renderStats();
}
function renderStats() {
  const st = $('stats'); if (!st) return;
  const ex = GRAPH.examples[state.exampleIndex];
  const nf = ex.nodes.filter(n => n.provenance === 'fact').length, nd = ex.nodes.filter(n => n.provenance === 'derived').length, ns = ex.nodes.filter(n => n.provenance === 'schema').length;
  const ef = ex.edges.filter(e => e.provenance === 'fact').length, ed = ex.edges.filter(e => e.provenance === 'derived' && e.relation !== 'supported_by').length, eg = ex.edges.filter(e => e.relation === 'supported_by').length;
  const visN = [...state.nodes.values()].filter(r => r.obj.visible).length, visE = state.edges.filter(r => r.grp.visible).length;
  st.replaceChildren();
  const line = (html) => { const d = document.createElement('div'); d.append(...html); st.appendChild(d); };
  const b = (t) => { const x = document.createElement('b'); x.textContent = t; return x; };
  line(['nodes ', b(String(nf)), ' fact · ', b(String(nd)), ' derived', ns ? ` · ${ns} schema` : '']);
  line(['edges ', b(String(ef)), ' fact · ', b(String(ed)), ' derived · ', b(String(eg)), ' grounding']);
  line([`showing ${visN} nodes, ${visE} edges`]);
}
function renderNote(ex) {
  const el = $('note'); el.replaceChildren();
  const h = document.createElement('h3'); h.textContent = ex.title || ex.id; el.appendChild(h);
  const p = document.createElement('p'); p.textContent = ex.summary || ''; el.appendChild(p);
  const s = document.createElement('div'); s.className = 'src';
  if (ex.source?.type === 'transcript') s.textContent = `TBPN ${ex.source.date} · ${ex.source.episode_title || ''}`;
  else if (ex.source?.type === 'text') s.textContent = `source: ${ex.source.title || 'scenario text'}`;
  el.appendChild(s);
}

// ---------- panel ----------
function openPanel(rec) {
  const n = rec.node, ex = GRAPH.examples[state.exampleIndex];
  const panel = $('panel'); panel.replaceChildren(); panel.hidden = false;
  const head = document.createElement('div'); head.className = 'p-head';
  const slotEl = document.createElement('div'); slotEl.className = 'p-slot';
  const chip = document.createElement('span'); chip.className = 'chip'; chip.style.background = rec.color; slotEl.append(chip, document.createTextNode((slotStyle.get(n.slot)?.slot?.label) || n.slot));
  const close = document.createElement('button'); close.className = 'close'; close.type = 'button'; close.textContent = '×'; close.setAttribute('aria-label', 'Close'); close.onclick = () => { panel.hidden = true; state.selected = null; };
  head.append(slotEl, close); panel.appendChild(head);
  const h3 = document.createElement('h3'); h3.textContent = n.label; panel.appendChild(h3);
  const badge = document.createElement('span'); badge.className = 'badge ' + n.provenance; badge.textContent = n.provenance; panel.appendChild(badge);
  const text = document.createElement('p'); text.textContent = n.text; panel.appendChild(text);
  const h4 = (t) => { const x = document.createElement('h4'); x.textContent = t; panel.appendChild(x); };
  if (n.provenance === 'fact') {
    h4(n.paraphrase ? 'Paraphrased from the source' : 'Quoted from the source');
    const q = document.createElement('blockquote'); q.textContent = n.source_quote || ''; panel.appendChild(q);
    const r = document.createElement('div'); r.className = 'ref'; r.textContent = n.source_ref || ''; panel.appendChild(r);
  } else if (n.provenance === 'derived') {
    h4('Confidence');
    const c = document.createElement('div'); c.className = 'conf'; c.textContent = `${Math.round((n.confidence || 0) * 100)} / 100`; panel.appendChild(c);
    const bar = document.createElement('div'); bar.className = 'confbar'; const fillEl = document.createElement('i'); fillEl.style.width = `${Math.round((n.confidence || 0) * 100)}%`; bar.appendChild(fillEl); panel.appendChild(bar);
    h4('Why the LLM infers this'); const r = document.createElement('p'); r.textContent = n.rationale || ''; panel.appendChild(r);
    if (n.idea) { h4('Opportunity this points to'); const ip = document.createElement('p'); ip.className = 'idea'; ip.textContent = n.idea; panel.appendChild(ip); }
    const sup = ex.edges.filter(e => e.relation === 'supported_by' && e.from === n.id).map(e => state.nodes.get(e.to)).filter(Boolean);
    if (sup.length) { h4('Supported by'); const ul = document.createElement('ul'); for (const s of sup) { const li = document.createElement('li'); li.textContent = s.node.label; const q = document.createElement('div'); q.className = 'ref'; q.textContent = (s.node.source_quote || '').slice(0, 140); li.appendChild(q); ul.appendChild(li); } panel.appendChild(ul); }
  } else {
    const r = document.createElement('p'); r.className = 'ref'; r.textContent = 'Framework scaffolding: neither a fact nor an inference.'; panel.appendChild(r);
  }
  const rels = rec.edges.filter(e => e.edge.relation !== 'supported_by');
  if (rels.length) {
    h4('Edges'); const ul = document.createElement('ul');
    for (const e of rels) { const li = document.createElement('li'); const out = e.edge.from === n.id; const other = out ? e.B.node : e.A.node; const rl = document.createElement('span'); rl.className = 'rel'; rl.textContent = (out ? '→ ' : '← ') + (relLabel.get(e.edge.relation) || e.edge.relation) + (e.edge.provenance === 'derived' ? ' (inferred)' : '') + ' '; li.append(rl, document.createTextNode(other.label)); ul.appendChild(li); }
    panel.appendChild(ul);
  }
  if (Array.isArray(n.entities) && n.entities.length) { h4('Entities'); const p = document.createElement('p'); p.className = 'ref'; p.textContent = n.entities.join(', '); panel.appendChild(p); }
}

// ---------- interaction ----------
const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2(); const tooltip = $('tooltip');
function setHover(rec) {
  if (state.hover === rec) return;
  if (state.hover) { const h = state.hover; h.mesh.scale.setScalar(1); if (h.mesh.material.emissive) h.mesh.material.emissive.setHex(0x000000); for (const e of h.edges) { e.line.material.color.set(e.grounding ? MUTED : (e.edge.provenance === 'schema' ? HAIRLINE : INK2)); if (e.arrow) e.arrow.material.color.set(INK2); } }
  state.hover = rec;
  if (rec) { rec.mesh.scale.setScalar(1.18); if (rec.mesh.material.emissive) rec.mesh.material.emissive.set(rec.color).multiplyScalar(0.35); for (const e of rec.edges) { if (!e.grp.visible) continue; e.line.material.color.set(INK); if (e.arrow) e.arrow.material.color.set(INK); } }
  renderer.domElement.style.cursor = rec ? 'pointer' : '';
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(state.hit.filter(h => h.parent.visible), false);
  const rec = hits.length ? state.nodes.get(hits[0].object.userData.nodeId) : null;
  setHover(rec);
  if (rec) {
    tooltip.replaceChildren();
    const a = document.createElement('div'); a.className = 't-label'; a.textContent = rec.node.label;
    const b = document.createElement('div'); b.className = 't-meta'; b.textContent = `${(slotStyle.get(rec.node.slot)?.slot?.label) || rec.node.slot} · ${rec.node.provenance}${rec.node.provenance === 'derived' ? ' ' + Math.round((rec.node.confidence || 0) * 100) + '%' : ''}`;
    const c = document.createElement('div'); c.textContent = rec.node.text.length > 160 ? rec.node.text.slice(0, 157) + '…' : rec.node.text;
    tooltip.append(a, b, c);
    tooltip.style.display = 'block';
    const mx = ev.clientX - r.left + 14, my = ev.clientY - r.top + 14;
    tooltip.style.left = Math.min(mx, r.width - 320) + 'px'; tooltip.style.top = Math.min(my, r.height - 120) + 'px';
  } else tooltip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => { setHover(null); tooltip.style.display = 'none'; });
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  if (state.hover) { state.selected = state.hover; openPanel(state.hover); } else { $('panel').hidden = true; state.selected = null; }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
  if (ev.key === 'd') { $('t-derived').checked = !$('t-derived').checked; $('t-derived').dispatchEvent(new Event('change')); }
  if (ev.key === 'g') { $('t-grounding').checked = !$('t-grounding').checked; $('t-grounding').dispatchEvent(new Event('change')); }
  if (ev.key === 'r') resetView();
  if (ev.key === 'Escape') { $('panel').hidden = true; state.selected = null; }
});
$('t-derived').addEventListener('change', (e) => { state.showDerived = e.target.checked; applyVisibility(); });
$('t-grounding').addEventListener('change', (e) => { state.showGrounding = e.target.checked; applyVisibility(); });
$('t-labels').addEventListener('change', (e) => { state.showLabels = e.target.checked; applyVisibility(); });
$('t-rotate').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
$('reset').addEventListener('click', resetView);

// example selector
const seg = $('examples');
const kindCount = new Map(); for (const ex of GRAPH.examples) kindCount.set(ex.kind, (kindCount.get(ex.kind) || 0) + 1);
GRAPH.examples.forEach((ex, i) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.index = i; b.textContent = kindCount.get(ex.kind) > 1 ? (ex.title || ex.id) : ex.kind === 'tbpn' ? 'From TBPN' : ex.kind === 'classic' ? 'Classic' : (ex.title || ex.id); b.title = ex.title || ''; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => buildExample(i)); seg.appendChild(b); });

// ---------- go ----------
// URL parameters set the initial state (deep links, scripted screenshots): ?example=1&derived=0&grounding=1&labels=0&rotate=1
const q = new URLSearchParams(location.search);
const flag = (k, def) => q.has(k) ? !['0', 'false', 'off', 'no'].includes(q.get(k).toLowerCase()) : def;
state.showDerived = flag('derived', true); $('t-derived').checked = state.showDerived;
state.showGrounding = flag('grounding', false); $('t-grounding').checked = state.showGrounding;
state.showLabels = flag('labels', true); $('t-labels').checked = state.showLabels;
controls.autoRotate = flag('rotate', false); $('t-rotate').checked = controls.autoRotate;
let startIndex = parseInt(q.get('example') || '0', 10);
if (!(startIndex >= 0 && startIndex < GRAPH.examples.length)) startIndex = Math.max(0, GRAPH.examples.findIndex(x => x.id === q.get('example')));
resize();
buildExample(startIndex);
$('fallback').hidden = true; window.__engineReady = true;
function loop() {
  requestAnimationFrame(loop);
  controls.update();
  for (const rec of state.nodes.values()) for (const c of rec.obj.children) if (c.userData.isIdeaRing) c.quaternion.copy(camera.quaternion);
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
}
loop();
</script>
