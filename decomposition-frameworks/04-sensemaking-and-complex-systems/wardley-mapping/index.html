<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel .lab { display: inline-block; transform: translateY(11px); background: rgba(26,26,25,.72); padding: 0 4px; border-radius: 3px; }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  /* Insights: the LLM layer on its own. Facts ghost, inferences stay lit, and a card lists what was derived. */
  #insights { right: 12px; top: 12px; bottom: 12px; width: 360px; padding: 14px 16px; overflow: auto; font-size: 13px; z-index: 3; }
  #insights[hidden] { display: none; }
  #insights .i-head { display: flex; align-items: flex-start; gap: 8px; }
  #insights .eyebrow { color: #eda100; }
  #insights h3 { margin: 4px 0 8px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #insights .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  #insights .formula { margin: 0 0 12px; padding: 10px 12px; border-left: 2px solid #eda100; background: rgba(237,161,0,.06); color: var(--ink); line-height: 1.5; }
  #insights h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; display: flex; align-items: center; gap: 6px; }
  #insights h4 .chip { width: 9px; height: 9px; border-radius: 50%; }
  #insights .i-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--hairline); cursor: pointer; }
  #insights .i-item:hover { background: rgba(255,255,255,.03); }
  #insights .i-item .t { color: var(--ink); }
  #insights .i-item .idea { grid-column: 1 / -1; color: #eda100; font-size: 12px; }
  #insights .i-item .c { font: 11px var(--mono); color: var(--muted); align-self: start; }
  #insights .i-item.starred .t::before { content: "★ "; color: #eda100; }
  .ghost { opacity: .18 !important; }
  .nlabel.ghost .lab { background: transparent; text-shadow: none; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"framework":{"slug":"wardley-mapping","name":"Wardley Mapping","category":"04-sensemaking-and-complex-systems","wikipedia":"https://en.wikipedia.org/wiki/Wardley_map","one_liner":"Anchors on a user, runs their need down a value chain, and spreads that chain across an evolution axis, so a component sitting at the wrong stage becomes a move you can see."},"slots":[{"id":"user","label":"User","description":"Who the map is anchored on: the person or organisation whose need every component below exists to serve.","typical_provenance":"either","color":"#6ea8fe","shape":"sphere"},{"id":"need","label":"Need","description":"What that user needs, stated in the user's terms rather than the supplier's.","typical_provenance":"either","color":"#4fc3a1","shape":"sphere"},{"id":"component","label":"Component","description":"A capability, practice or piece of the stack the need depends on, as named in the source.","typical_provenance":"fact","color":"#b48ef0","shape":"box"},{"id":"stage","label":"Evolution stage","description":"Genesis, Custom-built, Product (+rental), Commodity (+utility): the four stages, drawn as the bands of the x axis. Scaffolding, not content.","typical_provenance":"schema","structural":true,"shape":"box"},{"id":"movement","label":"Movement","description":"A predicted shift of a component along the evolution axis, with the reasoning that predicts it.","typical_provenance":"derived","color":"#ef6f6c","shape":"cone"},{"id":"play","label":"Play","description":"A strategic move the map suggests: commoditise, build, buy, exit, wait. Where the opportunity surfaces.","typical_provenance":"derived","color":"#ff9de2","shape":"diamond"}],"relations":[{"id":"needs","label":"needs","description":"the user needs this"},{"id":"fulfilled_by","label":"fulfilled by","description":"the need is fulfilled by this component"},{"id":"depends_on","label":"depends on","description":"this component depends on a lower, less visible component"},{"id":"at_stage","label":"at stage","description":"the component sits at this evolution stage; always a derived judgement with a confidence, and it is what sets the component's x position"},{"id":"moves","label":"moves","description":"this movement is predicted for that component"},{"id":"enables","label":"enables","description":"this movement opens up that play"}],"examples":[{"id":"classic","kind":"classic","title":"The tea shop: a value chain from the customer down to the wall socket","summary":"Wardley's teaching map. A shop owner's notes are turned into an anchored value chain (customer, cup of tea, tea, hot water, cup, kettle, water, power, staff time) and every component is placed on the evolution axis, which is where the reasoning starts.","source":{"type":"text","title":"Notes from a high-street tea shop owner","text":"Notes from the owner of a high-street tea shop, written before a strategy review.\n\nOur customers come in for one thing: a good cup of tea, served fast. To make one we need tea, hot water and a cup. The hot water comes from a kettle, and the kettle needs water and power. We buy the tea from a wholesaler and the cups from a catering supplier; both arrive the next day and cost pennies. The kettle is a commercial model we picked out of a catalogue, and we bought four of them. Power comes out of the wall and we pay by the unit; nobody here thinks about it. What we do think about is that our staff spend the first hour of every morning boiling, refilling and descaling kettles, and that every tea shop on this street does exactly the same thing with the same equipment.","attribution":"An original scenario written for this library, following Simon Wardley's canonical 'cup of tea' teaching map (Wardley Maps, chapter 2)."},"layout":{"mode":"plane","axes":{"x":{"label":"Evolution  ·  uncharted → industrialised","min":-64,"max":64,"ticks":[{"value":-48,"label":"I"},{"value":-16,"label":"II"},{"value":16,"label":"III"},{"value":48,"label":"IV"}]},"y":{"label":"Value chain","min":-69,"max":38,"ticks":[{"value":34,"label":"visible"},{"value":-44,"label":"invisible"}]}},"regions":[{"label":"novel · uncertain","x":[-64,-32],"y":[-53,38]},{"label":"bespoke · learning","x":[-32,0],"y":[-53,38]},{"label":"common · defined","x":[0,32],"y":[-53,38]},{"label":"ubiquitous · metered","x":[32,64],"y":[-53,38]}],"guides":[{"from":[-64,-58],"to":[64,-58],"style":"dashed","label":"plays read off the map"}]},"nodes":[{"id":"u1","slot":"user","label":"Walk-in customers","size":1.35,"text":"The people who walk into the shop. The whole map is anchored on them: every component below exists only because they want something.","provenance":"fact","source_quote":"Our customers come in for one thing","source_ref":"shop owner's notes, sentence 2","pos":[22,28]},{"id":"n1","slot":"need","label":"A good cup of tea, served fast","text":"The customer's need, stated in the customer's terms: a good cup of tea, quickly. Not \"a kettle\" and not \"hot water\".","provenance":"fact","source_quote":"a good cup of tea, served fast","source_ref":"shop owner's notes, sentence 2","pos":[26,18]},{"id":"c_hot","slot":"component","label":"Hot water","text":"Hot water at the counter, on demand. The shop produces it rather than buying it.","provenance":"fact","source_quote":"The hot water comes from a kettle","source_ref":"shop owner's notes, sentence 4","pos":[-17,8]},{"id":"c_tea","slot":"component","label":"Tea leaves","text":"Tea bought in from a wholesaler, delivered next day at a price the owner describes as pennies.","provenance":"fact","source_quote":"We buy the tea from a wholesaler","source_ref":"shop owner's notes, sentence 5","pos":[38,8]},{"id":"c_cup","slot":"component","label":"Cups","text":"Cups bought from a catering supplier, next-day delivery, negligible unit cost.","provenance":"fact","source_quote":"the cups from a catering supplier; both arrive the next day and cost pennies","source_ref":"shop owner's notes, sentence 5","pos":[55,8]},{"id":"c_kettle","slot":"component","label":"Kettles","text":"Four commercial kettles chosen from a catalogue: one of several substitutable models on the market.","provenance":"fact","source_quote":"The kettle is a commercial model we picked out of a catalogue, and we bought four of them.","source_ref":"shop owner's notes, sentence 6","pos":[13,-14]},{"id":"c_staff","slot":"component","label":"Staff boiling and descaling","text":"The manual practice of boiling, refilling and descaling kettles: an hour of staff time every morning.","provenance":"fact","source_quote":"our staff spend the first hour of every morning boiling, refilling and descaling kettles","source_ref":"shop owner's notes, sentence 8","pos":[-22,-25]},{"id":"c_water","slot":"component","label":"Mains water","text":"Water from the mains, needed by the kettle.","provenance":"fact","source_quote":"the kettle needs water and power","source_ref":"shop owner's notes, sentence 4","pos":[39,-25]},{"id":"c_power","slot":"component","label":"Electric power","text":"Electricity from the wall, metered and billed by the unit; nobody in the shop thinks about it.","provenance":"fact","source_quote":"Power comes out of the wall and we pay by the unit; nobody here thinks about it.","source_ref":"shop owner's notes, sentence 7","pos":[50,-36]},{"id":"m1","slot":"movement","label":"Hot water → metered utility","text":"Hot water stops being something the shop makes with kettles and staff time and becomes something it draws from a plumbed-in boiler tap, metered like water and power.","provenance":"derived","confidence":0.6,"rationale":"Everything hot water depends on (kettle, water, power) is already Product or Commodity, and the only remaining custom part is an hour of manual labour a day. Wardley's climatic pattern is that such a component keeps industrialising; the counter-argument is that a tea shop's scale may never justify the plumbing, so this stays contestable.","pos":[42,-3]},{"id":"m2","slot":"movement","label":"Kettles → undifferentiated","text":"The kettle finishes its slide from product to commodity: every shop on the street already runs the same equipment, so the model chosen stops mattering.","provenance":"derived","confidence":0.7,"rationale":"The owner notes that every tea shop on the street uses the same equipment, which is the signature of a component whose feature differences no longer decide anything. That is the Product-to-Commodity transition in Wardley's terms.","pos":[46,-14]},{"id":"p1","slot":"play","label":"Buy hot water on tap","text":"Plumb in a metered boiler tap, retire the kettles and the morning ritual, and spend the reclaimed hour on the counter.","provenance":"derived","confidence":0.6,"rationale":"If hot water is heading for utility, the shop can stop being the thing that industrialises it and simply buy the industrialised version, converting a fixed morning labour cost into a metered one.","pos":[36,-66]},{"id":"p2","slot":"play","label":"Compete above the utility line","text":"Accept that everything below the counter is bought in and identical to the competition, and differentiate on the tea, the blend and the room instead.","provenance":"derived","confidence":0.65,"rationale":"The map has nothing in Genesis and almost everything in Product or Commodity, so no advantage can come from the lower value chain; the only uncharted space left is what the customer actually experiences.","pos":[-36,-66]},{"id":"s1","slot":"stage","label":"Genesis","text":"Genesis: the component is novel and uncertain; it is built by hand because nothing to buy exists yet.","provenance":"schema","pos":[-48,-47]},{"id":"s2","slot":"stage","label":"Custom-built","text":"Custom-built: the component is understood well enough to build deliberately, but every instance is bespoke.","provenance":"schema","pos":[-16,-47]},{"id":"s3","slot":"stage","label":"Product/rental","text":"Product: competing, substitutable versions can be bought or rented; the differences are features, not existence.","provenance":"schema","pos":[16,-47]},{"id":"s4","slot":"stage","label":"Commodity/utility","text":"Commodity or utility: the component is undifferentiated, metered and bought without thought.","provenance":"schema","pos":[48,-47]}],"edges":[{"id":"ce1","from":"u1","to":"n1","relation":"needs","provenance":"fact","source_quote":"Our customers come in for one thing: a good cup of tea, served fast.","source_ref":"shop owner's notes, sentence 2"},{"id":"ce2","from":"n1","to":"c_tea","relation":"fulfilled_by","provenance":"fact","source_quote":"To make one we need tea, hot water and a cup.","source_ref":"shop owner's notes, sentence 3"},{"id":"ce3","from":"n1","to":"c_hot","relation":"fulfilled_by","provenance":"fact","source_quote":"To make one we need tea, hot water and a cup.","source_ref":"shop owner's notes, sentence 3"},{"id":"ce4","from":"n1","to":"c_cup","relation":"fulfilled_by","provenance":"fact","source_quote":"To make one we need tea, hot water and a cup.","source_ref":"shop owner's notes, sentence 3"},{"id":"ce5","from":"c_hot","to":"c_kettle","relation":"depends_on","provenance":"fact","source_quote":"The hot water comes from a kettle, and the kettle needs water and power.","source_ref":"shop owner's notes, sentence 4"},{"id":"ce6","from":"c_kettle","to":"c_water","relation":"depends_on","provenance":"fact","source_quote":"the kettle needs water and power","source_ref":"shop owner's notes, sentence 4"},{"id":"ce7","from":"c_kettle","to":"c_power","relation":"depends_on","provenance":"fact","source_quote":"the kettle needs water and power","source_ref":"shop owner's notes, sentence 4"},{"id":"ce8","from":"c_kettle","to":"c_staff","relation":"depends_on","provenance":"fact","source_quote":"our staff spend the first hour of every morning boiling, refilling and descaling kettles","source_ref":"shop owner's notes, sentence 8"},{"id":"cs1","from":"c_tea","to":"s4","relation":"at_stage","provenance":"derived","confidence":0.8,"rationale":"Bought from a wholesaler, next-day, at pennies: substitutable supply at a metered price is the commodity signature."},{"id":"cs2","from":"c_cup","to":"s4","relation":"at_stage","provenance":"derived","confidence":0.85,"rationale":"Catering-supplier cups delivered next day for pennies are undifferentiated and bought without thought."},{"id":"cs3","from":"c_kettle","to":"s3","relation":"at_stage","provenance":"derived","confidence":0.9,"rationale":"\"A commercial model we picked out of a catalogue\" is close to the definition of the Product stage: competing, substitutable versions chosen on features."},{"id":"cs4","from":"c_water","to":"s4","relation":"at_stage","provenance":"derived","confidence":0.9,"rationale":"Mains water is metered, ubiquitous and invisible to the buyer: the utility end of the axis."},{"id":"cs5","from":"c_power","to":"s4","relation":"at_stage","provenance":"derived","confidence":0.95,"rationale":"\"Comes out of the wall and we pay by the unit; nobody here thinks about it\" is the textbook description of a utility."},{"id":"cs6","from":"c_hot","to":"s2","relation":"at_stage","provenance":"derived","confidence":0.7,"rationale":"The shop assembles hot water itself from kettles, water, power and labour rather than buying it, which puts the component itself at Custom-built even though all of its parts are industrialised."},{"id":"cs7","from":"c_staff","to":"s2","relation":"at_stage","provenance":"derived","confidence":0.7,"rationale":"A manual in-house practice that every shop repeats independently is custom-built: it is deliberate and understood, but nobody sells it as a product."},{"id":"cm1","from":"m1","to":"c_hot","relation":"moves","provenance":"derived","confidence":0.6,"rationale":"The predicted shift applies to hot water, not to the kettle beneath it."},{"id":"cm2","from":"m2","to":"c_kettle","relation":"moves","provenance":"derived","confidence":0.7,"rationale":"The kettle is the component whose feature differences are said to have stopped mattering."},{"id":"cm3","from":"m1","to":"p1","relation":"enables","provenance":"derived","confidence":0.6,"rationale":"If hot water industrialises, buying it becomes the cheaper option and the play follows from the movement."},{"id":"cm4","from":"m2","to":"p2","relation":"enables","provenance":"derived","confidence":0.6,"rationale":"Once the equipment layer is undifferentiated, no advantage is available there and the shop must compete higher up."},{"id":"cg1","from":"m1","to":"c_staff","relation":"supported_by","provenance":"derived","confidence":0.65,"rationale":"The hour of daily manual labour is the cost the movement removes."},{"id":"cg2","from":"m2","to":"c_kettle","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"The catalogue purchase and the identical equipment on the street are the evidence for the movement."},{"id":"cg3","from":"p1","to":"c_power","relation":"supported_by","provenance":"derived","confidence":0.6,"rationale":"Metered power is the model for how the shop would buy hot water: by the unit, without thinking about it."},{"id":"cg4","from":"p2","to":"c_tea","relation":"supported_by","provenance":"derived","confidence":0.6,"rationale":"Tea is the highest component the shop still chooses, so it is where differentiation can survive."},{"id":"cg5","from":"p1","to":"c_staff","relation":"supported_by","provenance":"derived","confidence":0.6,"rationale":"The reclaimed hour of staff time is what the play spends elsewhere."}]},{"id":"tbpn","kind":"tbpn","title":"Poolside's stack: intelligence is a commodity, the shell underneath it is not","summary":"Eiso Kant walks Poolside's whole value chain on air, from the knowledge workforce down to grid power, and rules on how industrialised each layer is. One layer has demand at 250MW scale and no vendor to call, which is what an underserved market looks like on a map.","source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-10-16_googles-ai-breakthrough-in-cancer-protein-powders-exposed-marc-benioff-eiso-kant-dante-vaisbort-alice-bentinck-eric-seufert-pim-de-witte.md","date":"2025-10-16","episode_title":"Google's AI Breakthrough in Cancer, Protein Powders Exposed (Marc Benioff, Eiso Kant, Dante Vaisbort, Alice Bentinck, Eric Seufert, Pim de Witte)"},"why_this_episode":"In one uninterrupted interview (L4128-L4494) Eiso Kant names every layer of Poolside's value chain from the knowledge workforce down to grid power, and gives an industrialisation verdict on most of them: intelligence is 'a commodity', tokens behind an API are 'your commodity business', the RL environment was hand-built over two and a half years, GPU capacity is rented but sold out into 2027, and at 250MW of powered shell 'there's no one you can call'. A Wardley map needs exactly that combination of an anchored value chain and stage evidence, and it is rare to hear a supplier call his own product a commodity on air.","idea_bearing_slot":"play","layout":{"mode":"plane","axes":{"x":{"label":"Evolution  ·  uncharted → industrialised","min":-64,"max":64,"ticks":[{"value":-48,"label":"I"},{"value":-16,"label":"II"},{"value":16,"label":"III"},{"value":48,"label":"IV"}]},"y":{"label":"Value chain","min":-69,"max":38,"ticks":[{"value":34,"label":"visible"},{"value":-44,"label":"invisible"}]}},"regions":[{"label":"novel · uncertain","x":[-64,-32],"y":[-53,38]},{"label":"bespoke · learning","x":[-32,0],"y":[-53,38]},{"label":"common · defined","x":[0,32],"y":[-53,38]},{"label":"ubiquitous · metered","x":[32,64],"y":[-53,38]}],"guides":[{"from":[-64,-58],"to":[64,-58],"style":"dashed","label":"plays read off the map"}]},"nodes":[{"id":"u1","slot":"user","label":"The knowledge workforce","size":1.35,"text":"The user Poolside anchors on: enterprises and the knowledge workforce inside them, in the world's most high-consequence environments.","provenance":"fact","source_quote":"And from day zero, we wanted to be for the world's, frankly, knowledge workforce. We wanted to be for the enterprise. We wanted to be for the world's most high-consequence environments.","source_ref":"Eiso Kant, L4248-L4252","entities":["Poolside"],"pos":[22,28]},{"id":"u2","slot":"user","label":"Defense and government","text":"The first customer segment Poolside sold into, chosen because nobody else was there.","provenance":"fact","source_quote":"But when we weren't at the frontier, we kind of decided to cut our teeth in a go-to-market area, which was really no one else was out, which was defense and government.","source_ref":"Eiso Kant, L4258-L4260","entities":["Poolside"],"pos":[-26,28]},{"id":"n1","slot":"need","label":"Grow revenue or cut cost","text":"What the enterprise buyer actually needs: something that raises revenue or improves the cost basis. Not tokens.","provenance":"fact","source_quote":"You want to be in a business that either increases someone's revenue, right or improves their cost basis like it helps them grow their business","source_ref":"Eiso Kant, L4426-L4428","pos":[30,18]},{"id":"n2","slot":"need","label":"Run it in high-consequence places","text":"The defense and government need: the model has to run in air-gapped environments, GovClouds and places that require an ATO, down to workstations and Humvees.","provenance":"fact","source_quote":"all the way to like the larger models and like air gaped environments or guff clouds or places where you needed ATOs.","source_ref":"Eiso Kant, L4270","entities":["Poolside"],"pos":[-28,18]},{"id":"c1","slot":"component","label":"Coding agents","text":"The product the need is served through first: coding agents, chosen because developers adopt earliest.","provenance":"fact","source_quote":"Not just with coding agents, by the way, that's been really our starting point. It was our view that's where the market was first going to go adopt.","source_ref":"Eiso Kant, L4274-L4276","entities":["Poolside"],"pos":[12,8]},{"id":"c2","slot":"component","label":"Enterprise deployment stack","text":"The stack built alongside the model so it can be deployed anywhere the customer is: workstations, Humvees, air-gapped sites, GovClouds, ATOs.","provenance":"fact","source_quote":"And so kind of our first customers were not just building the model, but also putting all the crazy enterprise stack to be able to deploy it anywhere.","source_ref":"Eiso Kant, L4264-L4266","entities":["Poolside"],"pos":[-18,8]},{"id":"c3","slot":"component","label":"Tokens behind an API","text":"The delivery form of intelligence and, in Kant's words, the commodity business: selling tokens through an API, where only cost and scale matter.","provenance":"fact","source_quote":"You're just selling your tokens behind an API, and that's your commodity business.","source_ref":"Eiso Kant, L4238","pos":[42,8]},{"id":"c4","slot":"component","label":"Frontier intelligence","text":"The foundation model itself. Kant calls intelligence a commodity produced by only a handful of companies, with no large differences between models at the limit.","provenance":"fact","source_quote":"And in that world, intelligence in our view is a commodity. It's actually a commodity that gets created by only a small number of companies because it is sheer amount of resources and kind of compounding efforts that go into it.","source_ref":"Eiso Kant, L4226-L4230","entities":["Poolside"],"pos":[8,-1]},{"id":"c5","slot":"component","label":"RL environment","text":"Two and a half years of hand-building: a million real-world code bases in which agents can run hundreds of billions of tasks. Nobody sells this.","provenance":"fact","source_quote":"years building what I believe is the largest RL environment in the world. It's a million real world code basis where our agents can do hundreds and hundreds of billions of tasks.","source_ref":"Eiso Kant, L4302-L4304","entities":["Poolside"],"pos":[-44,-10]},{"id":"c6","slot":"component","label":"GPU compute","text":"More than 40,000 GB300s brought online through a partnership with CoreWeave, after 10,000 H200s in the preceding two and a half years.","provenance":"fact","source_quote":"And we got really excited because we found the path to partner with CoreWeave that brought online more than 40,000 GB300s really quickly.","source_ref":"Eiso Kant, L4340","entities":["Poolside","CoreWeave","Nvidia"],"pos":[22,-19]},{"id":"c7","slot":"component","label":"Powered data-centre shells","text":"The layer Kant names as the real bottleneck: bringing chips and power together into powered shells that are actually online. At 50MW he could call someone last year; at 250MW, he says, there is no one you can call.","provenance":"fact","source_quote":"The actual bottleneck is bringing it all together and actually having powered shells like data centers online. Because, well, last year I could call someone for 50 megawatts and I could kind of, you know, get it within six to nine months. If I needed to call someone for 250 megawatts, guys, there's no one you can call.","source_ref":"Eiso Kant, L4380-L4384","pos":[-26,-28]},{"id":"c8","slot":"component","label":"Modular skids on a flatbed","text":"Poolside's answer to the shell problem: a data hall decomposed into an electrical skid, a cooling skid and a compute skid, manufactured off-site and sized to a flatbed truck.","provenance":"fact","source_quote":"So a data center for a GPU compute is effectively three layers. It's an electrical skid. It's a cooling skid and it's a compute skid. And you actually designed them that they fit on the back of a flatbed truck.","source_ref":"Eiso Kant, L4488-L4494","entities":["Poolside"],"pos":[-42,-37]},{"id":"c9","slot":"component","label":"Grid power and gas","text":"Energy: 400-kilovolt grid electricity and, on Poolside's own land, six gigawatts of gas turned into electricity by turbines.","provenance":"fact","source_quote":"There's a lot of like 400-kilovolt electricity that comes off the grid. There's a lot of sources of energy in the United States.","source_ref":"Eiso Kant, L4374-L4376","pos":[50,-37]},{"id":"pl1","slot":"play","label":"Own the vertical stack","text":"The play Kant states outright: because the layers that matter are energy, compute and intelligence, and the shell layer cannot be bought, Poolside owns the whole stack.","provenance":"fact","source_quote":"And so we understood that we had to own that vertical stack entirely if we were going to be able to secure our future.","source_ref":"Eiso Kant, L4392","entities":["Poolside"],"pos":[40,-66]},{"id":"m1","slot":"movement","label":"Intelligence → utility","text":"Frontier intelligence and the tokens it is sold as finish crossing into the commodity band: priced per unit, bought on cost and scale, with no meaningful difference between suppliers.","provenance":"derived","confidence":0.8,"rationale":"Kant states the destination himself, twice, and gives the mechanism: at the limit there are no large differences between foundation models, so the buyer is left with cost and scale, which is what a utility competes on. He is a supplier predicting his own product's commoditisation, which is unusual enough to take seriously.","entities":["Poolside"],"pos":[48,-1]},{"id":"m2","slot":"movement","label":"Powered shells → product","text":"The 250MW powered shell stops being a bespoke, multi-billion-dollar, fifteen-year negotiation and becomes something orderable: a repeatable unit with a lead time and a price.","provenance":"derived","confidence":0.7,"rationale":"Kant describes the exact conditions under which a component industrialises: demand far exceeding supply, no vendor to call, and a first attempt at a repeatable unit (the truckable skid) already being manufactured. Wardley's pattern is that componentisation of this kind precedes the Product stage; the open question is whether the incumbents keep it bespoke.","entities":["Poolside"],"pos":[10,-28]},{"id":"m3","slot":"movement","label":"Rented compute unclogs","text":"Frontier-scale GPU rental stops being sold out and returns to an orderable product with normal lead times, once the 2026-27 shells land.","provenance":"derived","confidence":0.55,"rationale":"Kant says the scale of compute he needed is sold out through 2026 and into 2027, which prices a shortage with an end date rather than a permanent condition. Whether supply actually catches demand is exactly the contested part, so this stays in the plausible-but-contestable band.","entities":["CoreWeave","Nvidia"],"pos":[48,-15]},{"id":"pl2","slot":"play","label":"Sell the shell as a product","text":"Turn the truckable electrical, cooling and compute skids into a product other people can order, instead of an internal answer to Poolside's own supply problem.","provenance":"derived","confidence":0.6,"rationale":"Kant says that at 250MW there is no one to call, and separately that Poolside has designed a repeatable, factory-built, road-legal unit for itself. The gap between a component in demand and a component nobody sells is where a product business fits; the risk is that the skid design is only economic at Poolside's own scale.","idea":"Factory-built, truckable 2MW data-hall skids sold as a standard product would serve every AI company that needs 50-250MW but cannot sign a fifteen-year, multi-billion-dollar lease.","entities":["Poolside"],"pos":[-40,-66]},{"id":"pl3","slot":"play","label":"Productise deployment","text":"If the model layer is a commodity, the defensible position is the bespoke layer above it: the stack that gets a frontier model into an air-gapped site, a GovCloud, an ATO, a workstation or a Humvee.","provenance":"derived","confidence":0.6,"rationale":"Kant treats intelligence as a commodity and the enterprise deployment stack as something his first customers had to have built for them, which is the standard shape of an underserved market: high, stated demand and no purchasable version. The counter-argument is that accreditation work may be irreducibly per-customer.","idea":"A vendor-neutral deployment layer that takes any frontier model into air-gapped, ATO-bound and edge environments would sell to every lab that wants defense revenue without building the compliance stack itself.","entities":["Poolside"],"pos":[-2,-66]},{"id":"s1","slot":"stage","label":"Genesis","text":"Genesis: the component is novel and uncertain; it is built by hand because nothing to buy exists yet.","provenance":"schema","pos":[-48,-47]},{"id":"s2","slot":"stage","label":"Custom-built","text":"Custom-built: the component is understood well enough to build deliberately, but every instance is bespoke.","provenance":"schema","pos":[-16,-47]},{"id":"s3","slot":"stage","label":"Product/rental","text":"Product: competing, substitutable versions can be bought or rented; the differences are features, not existence.","provenance":"schema","pos":[16,-47]},{"id":"s4","slot":"stage","label":"Commodity/utility","text":"Commodity or utility: the component is undifferentiated, metered and bought without thought.","provenance":"schema","pos":[48,-47]}],"edges":[{"id":"te1","from":"n2","to":"c2","relation":"fulfilled_by","provenance":"fact","source_quote":"And so kind of our first customers were not just building the model, but also putting all the crazy enterprise stack to be able to deploy it anywhere. Like literally, and workstations and Humveys. all the way to like the larger models and like air gaped environments or guff clouds or places where you needed ATOs.","source_ref":"Eiso Kant, L4264-L4270"},{"id":"te2","from":"c1","to":"c4","relation":"depends_on","provenance":"fact","source_quote":"hopefully those products just get better for the customers as the underlying intelligence improves","source_ref":"host (Jordi Hayes), L4404-L4406"},{"id":"te3","from":"c3","to":"c4","relation":"depends_on","provenance":"fact","source_quote":"And so I think as a foundation model company, you're in two businesses. You're on one hand in what I often refer to internally is that the barrels of oil business, right? You're just selling your tokens behind an API, and that's your commodity business.","source_ref":"Eiso Kant, L4234-L4238"},{"id":"te4","from":"c4","to":"c5","relation":"depends_on","provenance":"fact","source_quote":"it was going to be clear that coding was going to be the first domain where we could do that through reinforcement learning because we could simulate it. So we spent the last two and a half years building what I believe is the largest RL environment in the world.","source_ref":"Eiso Kant, L4298-L4302"},{"id":"te5","from":"c4","to":"c6","relation":"depends_on","provenance":"fact","source_quote":"So we needed a lot of GPUs very fast because we saw now that, hey, we had gotten to a point where our models had gotten so good now that we knew if we'd skilled them up, we'd be on track to be at where the frontier was going to be.","source_ref":"Eiso Kant, L4332-L4336"},{"id":"te6","from":"c6","to":"c7","relation":"depends_on","provenance":"fact","source_quote":"So the true bottleneck in our industry is not chips, and it's not energy. There's a lot of like 400-kilovolt electricity that comes off the grid. There's a lot of sources of energy in the United States. And while it's the limit it is the bottleneck, it's not the immediate bottleneck. The actual bottleneck is bringing it all together and actually having powered shells like data centers online.","source_ref":"Eiso Kant, L4372-L4380"},{"id":"te7","from":"c7","to":"c8","relation":"depends_on","provenance":"fact","source_quote":"So a data center for a GPU compute is effectively three layers. It's an electrical skid. It's a cooling skid and it's a compute skid.","source_ref":"Eiso Kant, L4488-L4492"},{"id":"te8","from":"u1","to":"n1","relation":"needs","provenance":"derived","confidence":0.8,"rationale":"Kant names the enterprise as the user in one passage and the revenue-or-cost-basis test in another; joining the two is the reader's inference, not a sentence he says."},{"id":"te9","from":"u2","to":"n2","relation":"needs","provenance":"derived","confidence":0.85,"rationale":"The air-gapped, GovCloud and ATO requirements are described as what the first customers needed, and those customers are defense and government; the link is one step of joining."},{"id":"te10","from":"n1","to":"c1","relation":"fulfilled_by","provenance":"derived","confidence":0.7,"rationale":"Coding agents are named as the starting product and the revenue-or-cost test as the business Poolside wants to be in, but nowhere does Kant say that the agents are how that need is met."},{"id":"te11","from":"c2","to":"c4","relation":"depends_on","provenance":"derived","confidence":0.9,"rationale":"The deployment stack exists to put the model somewhere, which the source states as a pairing ('not just building the model, but also...') rather than as a dependency."},{"id":"te12","from":"c7","to":"c9","relation":"depends_on","provenance":"derived","confidence":0.9,"rationale":"A powered shell is by definition a shell plus power, and Kant names energy as one of the three layers that matter, but he never states the dependency in a single span."},{"id":"te13","from":"c5","to":"c6","relation":"depends_on","provenance":"derived","confidence":0.6,"rationale":"Running hundreds of billions of agent tasks in a simulated environment consumes compute; Kant discusses the two separately and never connects them."},{"id":"ts1","from":"c1","to":"s3","relation":"at_stage","provenance":"derived","confidence":0.7,"rationale":"Earlier in the same segment the host lists codex, cloud code, windsurf and cursor as the field; several substitutable offerings competing on features is the Product stage."},{"id":"ts2","from":"c2","to":"s2","relation":"at_stage","provenance":"derived","confidence":0.75,"rationale":"Built by Poolside for its own first customers, per environment, with nothing named that could have been bought instead: custom-built."},{"id":"ts3","from":"c3","to":"s4","relation":"at_stage","provenance":"derived","confidence":0.85,"rationale":"Kant calls tokens behind an API his commodity business outright and says the only things that matter there are cost and scale."},{"id":"ts4","from":"c4","to":"s3","relation":"at_stage","provenance":"derived","confidence":0.7,"rationale":"Kant calls intelligence a commodity, but in the same breath says it is created by only a small number of companies because of the sheer resources required. A handful of substitutable suppliers competing on capability is the Product stage; his 'commodity' is better read as where the component is going than where it is, which is what movement m1 records."},{"id":"ts5","from":"c5","to":"s1","relation":"at_stage","provenance":"derived","confidence":0.75,"rationale":"A one-of-a-kind artefact built over two and a half years, described as the largest in the world, with no vendor mentioned: genesis."},{"id":"ts6","from":"c6","to":"s3","relation":"at_stage","provenance":"derived","confidence":0.8,"rationale":"GPU capacity is rented from a named vendor under a commercial partnership, which is the rental half of the Product stage; the sold-out supply keeps it short of utility."},{"id":"ts7","from":"c7","to":"s2","relation":"at_stage","provenance":"derived","confidence":0.85,"rationale":"'If I needed to call someone for 250 megawatts, guys, there's no one you can call' states that no product form of this component exists at the size required; what is available is a bespoke fifteen-year lease."},{"id":"ts8","from":"c8","to":"s1","relation":"at_stage","provenance":"derived","confidence":0.65,"rationale":"The skid decomposition is Poolside's own design, described as unusual and not covered in the press; novel and unproven puts it at genesis, though modular data halls exist elsewhere in the industry, which is why this is the least certain placement on the map."},{"id":"ts9","from":"c9","to":"s4","relation":"at_stage","provenance":"derived","confidence":0.9,"rationale":"Grid electricity is metered and abundant in Kant's own account ('there's a lot of sources of energy in the United States'), which is the utility end of the axis."},{"id":"tm1","from":"m1","to":"c4","relation":"moves","provenance":"derived","confidence":0.8,"rationale":"The commoditisation Kant predicts is of intelligence itself, not of the API it is sold through."},{"id":"tm2","from":"m2","to":"c7","relation":"moves","provenance":"derived","confidence":0.7,"rationale":"The powered shell is the component with demand and no vendor, so it is the one under pressure to industrialise."},{"id":"tm3","from":"m3","to":"c6","relation":"moves","provenance":"derived","confidence":0.55,"rationale":"The sold-out condition Kant describes is of rentable frontier compute, which is the component this movement applies to."},{"id":"tm4","from":"m1","to":"pl1","relation":"enables","provenance":"derived","confidence":0.75,"rationale":"Kant draws the line himself: if intelligence is a barrel of oil someone else will deliver, you compete on cost and scale, hence infrastructure and vertical integration."},{"id":"tm5","from":"m2","to":"pl2","relation":"enables","provenance":"derived","confidence":0.6,"rationale":"A component moving from custom to product is precisely the window in which selling the product form is available."},{"id":"tm6","from":"m1","to":"pl3","relation":"enables","provenance":"derived","confidence":0.6,"rationale":"Commoditisation of the layer below is what makes the layer above worth productising: the value moves to whatever is still bespoke."},{"id":"tg1","from":"m1","to":"c3","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The 'commodity business' phrase is the direct evidence for the movement's destination."},{"id":"tg2","from":"m2","to":"c8","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"The truckable skid is the repeatable unit that would make the shell a product."},{"id":"tg3","from":"m3","to":"c6","relation":"supported_by","provenance":"derived","confidence":0.55,"rationale":"The sold-out-through-2027 statement is the fact the prediction is read from."},{"id":"tg4","from":"pl2","to":"c7","relation":"supported_by","provenance":"derived","confidence":0.65,"rationale":"'There's no one you can call' is the demand-without-supply condition the play exploits."},{"id":"tg5","from":"pl2","to":"c8","relation":"supported_by","provenance":"derived","confidence":0.6,"rationale":"The skid design already exists inside Poolside; the play is to sell it."},{"id":"tg6","from":"pl3","to":"c2","relation":"supported_by","provenance":"derived","confidence":0.6,"rationale":"The enterprise deployment stack is the bespoke component the play would turn into a product."},{"id":"tg7","from":"pl3","to":"n2","relation":"supported_by","provenance":"derived","confidence":0.6,"rationale":"The air-gapped, GovCloud and ATO requirements are the stated demand the product would serve."}]}]}</script>

const slotStyle = new Map();
let ci = 0;

relLabel.set('supported_by', 'supported by');

// ---------- renderer / scene ----------

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(40, 80, 120); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-60, -20, -80); scene.add(fill);

function resize() {

// ---------- state ----------
const state = { exampleIndex: 0, showDerived: true, showGrounding: false, showLabels: true, insights: false, group: null, nodes: new Map(), edges: [], hit: [], hover: null, selected: null, fit: null, derivedDecor: [] };

// ---------- layouts ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function forceLayout(nodes, edges, pinned, seed, opts = {}) {

    else pos.set(n.id, new THREE.Vector3((rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0 * (opts.flat ? 0.15 : 1)));

    const alpha = 0.9 * (1 - it / 420) + 0.04;
    for (const id of ids) f.get(id).set(0, 0, 0);
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const a = pos.get(ids[i]), b = pos.get(ids[j]);
      d.subVectors(a, b); let dist = d.length(); if (dist < 0.5) { d.set(rand() - .5, rand() - .5, rand() - .5); dist = 0.5; }

      const a = pos.get(e.from), b = pos.get(e.to);
      d.subVectors(b, a); const dist = Math.max(d.length(), 0.01);

}

function treeLayout(ex) {

    for (const e of edges) { out.get(e.from)?.push(e.to); und.get(e.from)?.push(e.to); und.get(e.to)?.push(e.from); }

function planeLayout(ex) {
  const pinned = new Map();
  for (const n of ex.nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));

function computeLayout(ex) {

// ---------- geometry helpers ----------
const GEO = {

  box: (r) => new THREE.BoxGeometry(r * 1.7, r * 1.7, r * 1.7),

};
function label2d(text, cls, innerTransform) {

  if (innerTransform) {
    const inner = document.createElement('span');

    inner.textContent = text; el.appendChild(inner);

}

function makeNode(n, p) {

  const obj = new THREE.Group(); obj.position.copy(p);
  let mesh, halo = null;
  if (n.provenance === 'fact') {
    mesh = new THREE.Mesh(GEO[st.shape](r), new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.08 }));
  } else if (n.provenance === 'derived') {
    mesh = new THREE.Mesh(GEO[st.shape](r), new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.0, transparent: true, opacity: 0.32, depthWrite: false }));
    halo = new THREE.LineSegments(new THREE.WireframeGeometry(GEO[st.shape](r * 1.35)), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.75 }));
    obj.add(halo);
  } else {
    mesh = new THREE.Mesh(GEO[st.shape === 'sphere' ? 'box' : st.shape](r * 0.8), new THREE.MeshStandardMaterial({ color: new THREE.Color(SCHEMA_COLOR), roughness: 0.9, metalness: 0, transparent: true, opacity: 0.85 }));
  }
  mesh.userData.nodeId = n.id;
  obj.add(mesh);

  hit.userData.nodeId = n.id; obj.add(hit);

  // mark it so a reader can find the payoff without opening every panel.
  if (n.idea) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 1.6, r * 0.11, 8, 40), new THREE.MeshBasicMaterial({ color: new THREE.Color(IDEA) }));
    ring.userData.isIdeaRing = true; obj.add(ring);
  }
  const glyph = n.provenance === 'fact' ? '●' : n.provenance === 'derived' ? '◌' : '▪';
  const el = document.createElement('div'); el.className = 'nlabel ' + n.provenance;
  const g = document.createElement('span'); g.className = 'g'; g.textContent = glyph; g.style.color = n.provenance === 'schema' ? MUTED : st.color;
  const inner = document.createElement('span'); inner.className = 'lab';
  inner.appendChild(g);
  if (n.idea) { const st2 = document.createElement('span'); st2.className = 'idea-star'; st2.textContent = '★'; inner.appendChild(st2); }
  inner.appendChild(document.createTextNode(n.label || n.id));
  el.appendChild(inner);

  // sphere, a derived node adds a 1.35r halo, and an idea node adds a 1.6r ring. Anchoring at -r
  // regardless (the old behaviour) made labels collide with their own marker on those nodes.
  const SHAPE_EXTENT = { sphere: 1.0, box: 0.85, diamond: 1.25, cone: 1.1 };
  let extent = (SHAPE_EXTENT[st.shape] ?? 1) * r;

  if (n.idea) extent = Math.max(extent, r * 1.72);

}

function makeEdge(e, A, B) {
  const from = A.obj.position, to = B.obj.position;
  const dir = new THREE.Vector3().subVectors(to, from); const len = dir.length(); dir.normalize();
  const a = from.clone().addScaledVector(dir, A.r * 1.05), b = to.clone().addScaledVector(dir, -(B.r * 1.05 + (e.relation === 'supported_by' ? 0 : 1.6)));
  const geom = new THREE.BufferGeometry().setFromPoints([a, b]);
  let mat, arrow = null;
  const grounding = e.relation === 'supported_by';
  if (grounding) mat = new THREE.LineDashedMaterial({ color: new THREE.Color(MUTED), dashSize: 0.5, gapSize: 0.9, transparent: true, opacity: 0.55 });
  else if (e.provenance === 'derived') mat = new THREE.LineDashedMaterial({ color: new THREE.Color(INK2), dashSize: 1.4, gapSize: 0.9, transparent: true, opacity: 0.8 });
  else if (e.provenance === 'schema') mat = new THREE.LineBasicMaterial({ color: new THREE.Color(HAIRLINE), transparent: true, opacity: 0.9 });
  else mat = new THREE.LineBasicMaterial({ color: new THREE.Color(INK2), transparent: true, opacity: 0.85 });
  const line = new THREE.Line(geom, mat); line.computeLineDistances();
  const grp = new THREE.Group(); grp.add(line);
  if (!grounding && e.provenance !== 'schema') {
    arrow = new THREE.Mesh(new THREE.ConeGeometry(0.75, 2.0, 10), new THREE.MeshBasicMaterial({ color: e.provenance === 'derived' ? new THREE.Color(INK2) : new THREE.Color(INK2), transparent: true, opacity: e.provenance === 'derived' ? 0.7 : 0.95 }));
    arrow.position.copy(to).addScaledVector(dir, -(B.r * 1.05 + 1.0));
    arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    grp.add(arrow);
  }
  let lab = null;
  if (e.label) { lab = label2d(e.label, 'elabel'); lab.position.copy(a).lerp(b, 0.5); grp.add(lab); }
  return { edge: e, grp, line, arrow, label: lab, A, B, grounding, len };
