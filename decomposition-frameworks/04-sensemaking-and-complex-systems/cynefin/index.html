<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel .lab { display: inline-block; transform: translateY(11px); }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"$schema":"../../_meta/schema.json","framework":{"slug":"cynefin","name":"Cynefin Framework","category":"04-sensemaking-and-complex-systems","wikipedia":"https://en.wikipedia.org/wiki/Cynefin_framework","one_liner":"Sorts situations by the kind of causality they have - Clear, Complicated, Complex, Chaotic, or Disorder - so that each one gets the decision protocol its domain allows instead of the one the organisation prefers."},"slots":[{"id":"domain","label":"Domain","description":"Clear, Complicated, Complex, Chaotic, Disorder. The five domains are scaffolding, not content: each is a kind of causality and the decision protocol that kind of causality permits.","typical_provenance":"schema","structural":true,"shape":"box"},{"id":"item","label":"Situation","description":"A decision, market, launch or incident being classified, taken from the source as the speakers describe it.","typical_provenance":"fact","color":"#6ea8fe","shape":"sphere"},{"id":"signal","label":"Signal","description":"A quoted observation that tells you which domain a situation is in: is cause and effect visible, do the experts agree, is the answer only available after you try something, is there time to analyse at all.","typical_provenance":"fact","color":"#4fc3a1","shape":"diamond"},{"id":"response","label":"Response","description":"What the matching protocol prescribes for this situation: categorise, analyse, probe, or act. Derived, because the source shows what was done, not what the domain permits.","typical_provenance":"derived","color":"#b48ef0","shape":"cone"}],"relations":[{"id":"classified_as","label":"classified as","description":"A situation is placed in a domain. Always derived: the classification is the judgment the framework exists to make. A second edge labelled 'treated as' records the domain whose protocol was actually applied."},{"id":"observed_in","label":"observed in","description":"An observation belongs to a situation. A fact edge when one span of the source states both; derived when the link has to be inferred across turns."},{"id":"indicates","label":"indicates","description":"An observation is diagnostic of a domain: this is what makes the classification readable rather than asserted. Always derived."},{"id":"calls_for","label":"calls for","description":"A situation calls for the response its domain permits. Always derived."}],"examples":[{"id":"classic","kind":"classic","title":"Meridian Foods: four items on one Monday agenda","summary":"A mid-size manufacturer puts an invoice queue, an intermittent line fault, a new plant-based product and an allergen recall on the same agenda, then sends all four to the programme office on one Gantt chart. Two of the four come out fine and the framework says which two, and why.","source":{"type":"text","title":"Meridian Foods, Monday operations review","attribution":"Composite of the standard teaching cases used with Cynefin (Snowden and Boone, 'A Leader's Framework for Decision Making', Harvard Business Review, November 2007): a rule-governed back-office queue, an expert-diagnosable machine fault, an emergent product launch, and a recall crisis.","text":"Meridian Foods, a mid-size manufacturer, holds its Monday operations review, and four items are on the agenda.\n\nThe first is invoice exceptions. About three percent of supplier invoices fail the automated match each week. The cause is known, the correction is written down in the finance handbook, and a clerk who follows it clears the queue by Wednesday.\n\nThe second is an intermittent fault on packaging line four. The line stops about twice a shift and nobody on site knows why. Two of the maintenance engineers disagree about the cause, and the maintenance lead says a week of instrumented testing will settle which of them is right.\n\nThe third is the plant-based line the company launched in March. Sales are flat in two regions and triple the forecast in a third, and the brand team cannot say why. Shoppers have been using the product in ways nobody designed it for.\n\nThe fourth is an allergen mislabel found on a pallet that shipped on Friday. Stores open in twelve hours, nobody yet knows how much of the batch is affected, and the recall hotline is already ringing.\n\nThe operations director sends all four items to the programme office, which puts each one on a single Gantt chart with a named owner, a fixed milestone and a monthly steering review. By June the invoice queue is clean and the packaging fault has been found and fixed. The plant-based plan has slipped three times; each slip produces a replanning exercise and a new forecast, and not one regional test has been run. The recall was handled by a director who ignored the chart, called the stores herself and asked her questions afterwards. At the July review the team argues about whether the plant-based line needs a better plan or no plan at all, and each manager argues from the kind of problem he is used to."},"layout":{"mode":"plane","axes":{"x":{"label":"Causality  ·  unordered  →  ordered","min":-63,"max":63,"ticks":[{"value":-38,"label":"no reliable cause and effect"},{"value":38,"label":"cause and effect available"}]},"y":{"label":"Protocol  ·  respond now  →  find out first","min":-46,"max":46,"ticks":[{"value":40,"label":"probe / analyse first"},{"value":-40,"label":"act / categorise now"}]}},"regions":[{"label":"COMPLEX","x":[-63,-13],"y":[12,46],"color":"#8a5cf5"},{"label":"COMPLICATED","x":[13,63],"y":[12,46],"color":"#3987e5"},{"label":"CHAOTIC","x":[-63,-13],"y":[-46,-12],"color":"#d6453f"},{"label":"CLEAR","x":[13,63],"y":[-46,-12],"color":"#3fa66f"},{"label":"DISORDER","x":[-11,11],"y":[-11,11],"color":"#6f6f6b"}],"guides":[{"from":[0,-46],"to":[0,-12],"style":"dashed","label":"the cliff"}],"annotations":[{"pos":[0,50],"text":"dashed 'treated as' edge = the protocol actually applied","style":"caption"}]},"nodes":[{"id":"d_clear","slot":"domain","label":"sense, categorise, respond","text":"Cause and effect are self-evident and stable, so the right answer is known and written down. Protocol: sense, categorise, respond, applying best practice. Failure mode: the categories outlive the conditions that made them true.","provenance":"schema","pos":[38,-40.382],"size":1.4},{"id":"d_complicated","slot":"domain","label":"sense, analyse, respond","text":"Cause and effect are knowable but not self-evident; expertise or analysis finds the answer, and there may be several defensible answers. Protocol: sense, analyse, respond, applying good practice. Failure mode: expert entrainment, where the analysis only confirms the discipline it came from.","provenance":"schema","pos":[38,41.618],"size":1.4},{"id":"d_complex","slot":"domain","label":"probe, sense, respond","text":"Cause and effect cohere only in retrospect, so no amount of analysis in advance produces the answer. Protocol: probe with safe-to-fail experiments, sense what emerges, respond. Failure mode: imposing a plan and then treating the first slip as a planning error.","provenance":"schema","pos":[-38,41.618],"size":1.4},{"id":"d_chaotic","slot":"domain","label":"act, sense, respond","text":"There is no usable cause and effect and the situation moves faster than any analysis of it. Protocol: act to establish order, sense where stability is returning, then respond. Failure mode: waiting for the review the clock does not allow.","provenance":"schema","pos":[-38,-40.382],"size":1.4},{"id":"d_disorder","slot":"domain","label":"no domain agreed","text":"Nobody knows which domain the situation is in, so each person acts from the domain they are most comfortable in. The only move is to break the situation into parts and move each part to a domain where it can be handled.","provenance":"schema","pos":[0,5.618],"size":1.4},{"id":"c_invoice","slot":"item","label":"3% of invoices fail the match","text":"Three percent of supplier invoices fail the automated match every week, a recurring back-office exception queue.","provenance":"fact","source_quote":"About three percent of supplier invoices fail the automated match each week.","source_ref":"sentence 2","pos":[38,-16.8]},{"id":"c_handbook","slot":"signal","label":"Written down in the handbook","text":"The cause of the exceptions is known, the correction is documented, and a clerk following the document clears the queue on a predictable schedule.","provenance":"fact","source_quote":"The cause is known, the correction is written down in the finance handbook, and a clerk who follows it clears the queue by Wednesday.","source_ref":"sentence 3","pos":[48,-20.25]},{"id":"c_line4","slot":"item","label":"Line four stops twice a shift","text":"An intermittent fault stops packaging line four about twice a shift, and nobody on site knows the cause.","provenance":"fact","source_quote":"an intermittent fault on packaging line four. The line stops about twice a shift and nobody on site knows why.","source_ref":"sentences 4-5","pos":[34,33.2]},{"id":"c_disagree","slot":"signal","label":"Two engineers disagree; test it","text":"Two maintenance engineers hold different theories of the cause, and the maintenance lead puts a price on settling it: one week of instrumented testing.","provenance":"fact","source_quote":"Two of the maintenance engineers disagree about the cause, and the maintenance lead says a week of instrumented testing will settle which of them is right.","source_ref":"sentence 6","pos":[46,29.75]},{"id":"c_plant","slot":"item","label":"Plant-based: flat, flat, triple","text":"The plant-based line launched in March is flat in two regions and at triple forecast in a third, and the brand team cannot explain the pattern.","provenance":"fact","source_quote":"the plant-based line the company launched in March. Sales are flat in two regions and triple the forecast in a third, and the brand team cannot say why.","source_ref":"sentences 7-8","pos":[-40,29.2]},{"id":"c_unexpected","slot":"signal","label":"Used in ways nobody designed","text":"Shoppers are using the product in ways the company did not design it for, so the behaviour driving the numbers was not in anyone's model.","provenance":"fact","source_quote":"Shoppers have been using the product in ways nobody designed it for.","source_ref":"sentence 9","pos":[-46,37.75]},{"id":"c_gantt","slot":"signal","label":"All four onto one Gantt chart","text":"Every item, regardless of what kind of problem it is, is given a named owner, a fixed milestone and a monthly steering review.","provenance":"fact","source_quote":"puts each one on a single Gantt chart with a named owner, a fixed milestone and a monthly steering review","source_ref":"sentence 13","pos":[-30,25.75]},{"id":"c_slips","slot":"signal","label":"Three slips, no regional test","text":"The plant-based plan has slipped three times, each slip producing a replan and a new forecast, while not one regional test has been run.","provenance":"fact","source_quote":"The plant-based plan has slipped three times; each slip produces a replanning exercise and a new forecast, and not one regional test has been run.","source_ref":"sentence 15","pos":[-32,33.75]},{"id":"c_recall","slot":"item","label":"Allergen mislabel on a pallet","text":"An allergen mislabel is found on a pallet that has already shipped, with stores opening in twelve hours.","provenance":"fact","source_quote":"an allergen mislabel found on a pallet that shipped on Friday","source_ref":"sentence 10","pos":[-38,-16.8]},{"id":"c_hours","slot":"signal","label":"Stores open in twelve hours","text":"Nobody knows the scope of the affected batch, the hotline is already ringing, and the clock runs out before any analysis could finish.","provenance":"fact","source_quote":"Stores open in twelve hours, nobody yet knows how much of the batch is affected, and the recall hotline is already ringing.","source_ref":"sentence 11","pos":[-48,-20.25]},{"id":"c_argue","slot":"item","label":"Better plan, or no plan at all?","text":"At the July review the team cannot agree whether the plant-based line needs a better plan or no plan at all, and each manager argues from the kind of problem he is used to.","provenance":"fact","source_quote":"the team argues about whether the plant-based line needs a better plan or no plan at all, and each manager argues from the kind of problem he is used to","source_ref":"sentence 18","pos":[6,-0.8]},{"id":"c_r_cat","slot":"response","label":"Apply the handbook, move on","text":"Clear protocol: sense the exception, categorise it against the handbook, respond. The only management question worth asking is whether the rule still matches the conditions, because that is the one way this domain fails.","provenance":"derived","confidence":0.85,"rationale":"The scenario states that the cause is known and the correction documented, which is the defining condition of the Clear domain; sense-categorise-respond follows from the classification, and the expiry question is the failure mode the framework attaches to it.","pos":[34,-24.03]},{"id":"c_r_an","slot":"response","label":"Buy the week of instrumentation","text":"Complicated protocol: sense, analyse, respond. The week of instrumented testing is the correct purchase because the answer exists and the disagreement is about which expert holds it, not about whether anyone can.","provenance":"derived","confidence":0.8,"rationale":"Expert disagreement that a defined experiment can settle is Cynefin's marker for the Complicated domain rather than the Complex one; the scenario states the price of the analysis but does not draw the conclusion that it is the right spend.","pos":[36,25.97]},{"id":"c_r_probe","slot":"response","label":"Three cheap regional probes","text":"Complex protocol: probe, sense, respond. Run several small parallel regional tests designed to be safe to fail, watch which pattern amplifies, and commit behind the one that holds. A fourth replan produces a new forecast and no new information.","provenance":"derived","confidence":0.75,"rationale":"The scenario reports three slips, no test and an unexplained demand pattern, which is exactly the signature Cynefin predicts when a Complex situation is run on a Complicated protocol; the prescribed probe is the framework's answer and is not in the text.","pos":[-40,21.97]},{"id":"c_r_act","slot":"response","label":"Act now, sense after","text":"Chaotic protocol: act to establish order, then sense. Calling the stores before the scope of the batch is known is the correct move in this domain, and the chart's monthly review is irrelevant to it.","provenance":"derived","confidence":0.8,"rationale":"The scenario reports the director acting before analysing and the outcome holding, and Cynefin prescribes act-sense-respond when the clock is shorter than any possible analysis; the judgment that this was right rather than reckless is the inference.","pos":[-32,-24.03]},{"id":"c_r_split","slot":"response","label":"Split the agenda item by item","text":"Disorder protocol: stop arguing about the whole and break it into parts, then move each part to the domain where it can be handled. The plant-based line holds a Clear supply question, a Complicated pricing question and a Complex demand question, and only the third is what the argument is about.","provenance":"derived","confidence":0.65,"rationale":"Each manager arguing from his habitual problem type is Cynefin's description of Disorder; the decomposition prescribed here is the framework's remedy and the scenario never performs it.","pos":[-6,-6.03]}],"edges":[{"id":"ce1","from":"c_handbook","to":"c_invoice","relation":"observed_in","provenance":"fact","source_quote":"About three percent of supplier invoices fail the automated match each week. The cause is known, the correction is written down in the finance handbook","source_ref":"sentences 2-3"},{"id":"ce2","from":"c_disagree","to":"c_line4","relation":"observed_in","provenance":"fact","source_quote":"The line stops about twice a shift and nobody on site knows why. Two of the maintenance engineers disagree about the cause","source_ref":"sentences 5-6"},{"id":"ce3","from":"c_unexpected","to":"c_plant","relation":"observed_in","provenance":"fact","source_quote":"the brand team cannot say why. Shoppers have been using the product in ways nobody designed it for.","source_ref":"sentences 8-9"},{"id":"ce4","from":"c_hours","to":"c_recall","relation":"observed_in","provenance":"fact","source_quote":"an allergen mislabel found on a pallet that shipped on Friday. Stores open in twelve hours, nobody yet knows how much of the batch is affected","source_ref":"sentences 10-11"},{"id":"ce5","from":"c_gantt","to":"c_plant","relation":"observed_in","provenance":"derived","confidence":0.9,"rationale":"The chart is stated to cover all four items, so it covers the plant-based line; the source does not single that item out."},{"id":"ce6","from":"c_slips","to":"c_plant","relation":"observed_in","provenance":"fact","source_quote":"The plant-based plan has slipped three times; each slip produces a replanning exercise and a new forecast","source_ref":"sentence 15"},{"id":"ce7","from":"c_handbook","to":"d_clear","relation":"indicates","provenance":"derived","confidence":0.9,"rationale":"A known cause with a written correction that a non-expert can apply is the textbook marker of the Clear domain."},{"id":"ce8","from":"c_disagree","to":"d_complicated","relation":"indicates","provenance":"derived","confidence":0.85,"rationale":"Experts who disagree but agree on an experiment that would settle it means the answer is knowable: Complicated, not Complex."},{"id":"ce9","from":"c_unexpected","to":"d_complex","relation":"indicates","provenance":"derived","confidence":0.85,"rationale":"Use the designers did not anticipate means the behaviour driving the outcome was outside every model, which is emergence."},{"id":"ce10","from":"c_slips","to":"d_complex","relation":"indicates","provenance":"derived","confidence":0.75,"rationale":"Repeated slips that each produce a replan instead of new information are the signature of a plan imposed on a space where the answer can only be found by trying."},{"id":"ce11","from":"c_hours","to":"d_chaotic","relation":"indicates","provenance":"derived","confidence":0.85,"rationale":"Unknown scope plus a deadline shorter than any possible analysis is the Chaotic condition: you must act to create enough order to sense."},{"id":"ce12","from":"c_gantt","to":"d_complicated","relation":"indicates","provenance":"derived","confidence":0.8,"rationale":"A named owner, a fixed milestone and a monthly review is the Complicated protocol made into a procedure: it assumes the answer is knowable in advance."},{"id":"ce13","from":"c_invoice","to":"d_clear","relation":"classified_as","provenance":"derived","confidence":0.9,"rationale":"Stable cause, documented correction, no judgment required: Clear."},{"id":"ce14","from":"c_line4","to":"d_complicated","relation":"classified_as","provenance":"derived","confidence":0.85,"rationale":"The cause is not visible but is knowable by instrumented analysis, and the experts differ only about which knowable answer is right."},{"id":"ce15","from":"c_plant","to":"d_complex","relation":"classified_as","provenance":"derived","confidence":0.8,"rationale":"Demand that is flat in two regions and triple in a third for reasons nobody can state, driven by unanticipated use, is emergent: the pattern is only legible after the fact."},{"id":"ce16","from":"c_plant","to":"d_complicated","relation":"classified_as","provenance":"derived","confidence":0.9,"label":"treated as","rationale":"The programme office gave the launch a fixed milestone and a monthly steering review, which is the protocol of the Complicated domain applied to a Complex situation."},{"id":"ce17","from":"c_recall","to":"d_chaotic","relation":"classified_as","provenance":"derived","confidence":0.85,"rationale":"Unknown scope, an irreversible shipment and twelve hours: there is no usable cause and effect to analyse before acting."},{"id":"ce18","from":"c_recall","to":"d_complicated","relation":"classified_as","provenance":"derived","confidence":0.7,"label":"treated as","rationale":"The recall went onto the same chart with a milestone and a monthly review; the director's success came from ignoring that assignment, not from it."},{"id":"ce19","from":"c_argue","to":"d_disorder","relation":"classified_as","provenance":"derived","confidence":0.8,"rationale":"The July argument is not about the evidence but about which kind of problem this is, with each manager arguing from his habitual domain: the definition of Disorder."},{"id":"ce20","from":"c_invoice","to":"c_r_cat","relation":"calls_for","provenance":"derived","confidence":0.85,"rationale":"The response follows from the Clear classification."},{"id":"ce21","from":"c_line4","to":"c_r_an","relation":"calls_for","provenance":"derived","confidence":0.8,"rationale":"The response follows from the Complicated classification and the stated price of the test."},{"id":"ce22","from":"c_plant","to":"c_r_probe","relation":"calls_for","provenance":"derived","confidence":0.75,"rationale":"The response follows from the Complex classification and from what the three slips show."},{"id":"ce23","from":"c_recall","to":"c_r_act","relation":"calls_for","provenance":"derived","confidence":0.8,"rationale":"The response follows from the Chaotic classification."},{"id":"ce24","from":"c_argue","to":"c_r_split","relation":"calls_for","provenance":"derived","confidence":0.65,"rationale":"The response follows from the Disorder classification."},{"id":"ce25","from":"c_r_probe","to":"c_slips","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The slips with no test are the evidence that replanning is producing forecasts rather than information."},{"id":"ce26","from":"c_r_probe","to":"c_unexpected","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"Unanticipated use is the evidence that the demand pattern cannot be planned into existence."},{"id":"ce27","from":"c_r_an","to":"c_disagree","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The engineers' disagreement and the week of testing are the evidence that the answer is knowable."},{"id":"ce28","from":"c_r_act","to":"c_hours","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The twelve-hour clock and the unknown batch scope are the evidence that analysis cannot precede action."},{"id":"ce29","from":"c_r_cat","to":"c_handbook","relation":"supported_by","provenance":"derived","confidence":0.9,"rationale":"The handbook is the evidence that a categorisation step is all this situation needs."},{"id":"ce30","from":"c_r_split","to":"c_argue","relation":"supported_by","provenance":"derived","confidence":0.75,"rationale":"The argument itself is the evidence that the object has not been decomposed."}]},{"id":"tbpn","kind":"tbpn","title":"SpaceX after Starship Flight 10: four cost decisions, four kinds of causality","summary":"The hosts walk through Flight 10 and then through David Senra's account of how Elon Musk attacks cost at SpaceX. Within four hundred lines the episode puts a fixed orbital deadline, a qualified aerospace part, a four-bolt specification and a cracked engine skirt side by side, and shows three of them being answered out of a rulebook.","source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-08-27_spacex-launch-deep-dive-reactions-josh-reeves-keller-cliffton-will-brown-julia-steinberg-olivia-moore-flo-crivello.md","date":"2025-08-27","episode_title":"SpaceX Flight 10, venture debt, NVIDIA earnings, consumer AI top 100"},"why_this_episode":"One continuous stretch of the episode, from the Flight 10 recap to the Founders podcast quotes, contains a situation in every Cynefin domain at once: an 18-month transfer window whose causality is fixed, a three-million-dollar part whose price experts can itemise, a flight deliberately stress-tested because the answer is not knowable in advance, and a crack found the day before launch with hours to decide. It also contains the framework's central failure in the speakers' own words, engineers answering 'no' from a specification where the only available answer is to pull two bolts and see what breaks.","idea_bearing_slot":"response","layout":{"mode":"plane","axes":{"x":{"label":"Causality  ·  unordered  →  ordered","min":-63,"max":63,"ticks":[{"value":-38,"label":"no reliable cause and effect"},{"value":38,"label":"cause and effect available"}]},"y":{"label":"Protocol  ·  respond now  →  find out first","min":-46,"max":46,"ticks":[{"value":40,"label":"probe / analyse first"},{"value":-40,"label":"act / categorise now"}]}},"regions":[{"label":"COMPLEX","x":[-63,-13],"y":[12,46],"color":"#8a5cf5"},{"label":"COMPLICATED","x":[13,63],"y":[12,46],"color":"#3987e5"},{"label":"CHAOTIC","x":[-63,-13],"y":[-46,-12],"color":"#d6453f"},{"label":"CLEAR","x":[13,63],"y":[-46,-12],"color":"#3fa66f"},{"label":"DISORDER","x":[-11,11],"y":[-11,11],"color":"#6f6f6b"}],"guides":[{"from":[0,-46],"to":[0,-12],"style":"dashed","label":"the cliff"}],"annotations":[{"pos":[0,50],"text":"three 'treated as' edges cross into CLEAR: the rulebook won","style":"caption"}]},"nodes":[{"id":"d_clear","slot":"domain","label":"sense, categorise, respond","text":"Cause and effect are self-evident and stable, so the right answer is known and written down. Protocol: sense, categorise, respond, applying best practice. Failure mode: the categories outlive the conditions that made them true.","provenance":"schema","pos":[38,-40.382],"size":1.4},{"id":"d_complicated","slot":"domain","label":"sense, analyse, respond","text":"Cause and effect are knowable but not self-evident; expertise or analysis finds the answer, and there may be several defensible answers. Protocol: sense, analyse, respond, applying good practice. Failure mode: expert entrainment, where the analysis only confirms the discipline it came from.","provenance":"schema","pos":[38,41.618],"size":1.4},{"id":"d_complex","slot":"domain","label":"probe, sense, respond","text":"Cause and effect cohere only in retrospect, so no amount of analysis in advance produces the answer. Protocol: probe with safe-to-fail experiments, sense what emerges, respond. Failure mode: imposing a plan and then treating the first slip as a planning error.","provenance":"schema","pos":[-38,41.618],"size":1.4},{"id":"d_chaotic","slot":"domain","label":"act, sense, respond","text":"There is no usable cause and effect and the situation moves faster than any analysis of it. Protocol: act to establish order, sense where stability is returning, then respond. Failure mode: waiting for the review the clock does not allow.","provenance":"schema","pos":[-38,-40.382],"size":1.4},{"id":"d_disorder","slot":"domain","label":"no domain agreed","text":"Nobody knows which domain the situation is in, so each person acts from the domain they are most comfortable in. The only move is to break the situation into parts and move each part to a domain where it can be handled.","provenance":"schema","pos":[0,5.618],"size":1.4},{"id":"i_window","slot":"item","label":"March Mars transfer window","text":"Musk wants an uncrewed Starship at Mars next year, and the transfer window that allows it opens about every eighteen months: hit March 2026 or wait until 2028.","provenance":"fact","source_quote":"there's a March transfer window that only comes up, I think, every 18 months or so. So it's really critical to hit it in 26, or else you've got to wait until 2028","source_ref":"TBPN host, L312-L316","entities":["SpaceX","Starship","Elon Musk"],"pos":[38,-16.8]},{"id":"i_cooling","slot":"item","label":"$3M air cooling system","text":"An engineer priced the air cooling system for Falcon 9 at three million dollars; Musk asked what a house air conditioner costs, and the team bought commercial units and modified the pumps.","provenance":"fact","source_quote":"when an engineer told Elon the air cooling system for the Falcon 9 would cost $3 million,","source_ref":"TBPN host reading David Senra's How Elon Works, L352","entities":["SpaceX","Falcon 9","Elon Musk","Gwen Shotwell","David Senra"],"pos":[44,37.2]},{"id":"i_cranes","slot":"item","label":"$2M pair of cranes","text":"A pair of cranes to lift rockets was quoted at two million dollars, a price justified by the Air Force safety regulations the team was shown.","provenance":"fact","source_quote":"Elon saved money by questioning the requirements when he asked his team why it would cost $2 million to build a pair of cranes.","source_ref":"TBPN host reading David Senra's How Elon Works, L466-L468","entities":["SpaceX","Elon Musk","David Senra"],"pos":[32,33.2]},{"id":"i_flight10","slot":"item","label":"Flight 10 as a stress test","text":"SpaceX deliberately configured the Flight 10 mission to stress test parts of the Starship spacecraft rather than to fly the safest possible profile.","provenance":"fact","source_quote":"experiment with its design, SpaceX set up Tuesday's mission to stress test parts of the Starship Spacecraft","source_ref":"TBPN host reading the Wall Street Journal, L260-L262","entities":["SpaceX","Starship"],"pos":[-44,37.2]},{"id":"i_bolts","slot":"item","label":"Why four bolts? Whose spec?","text":"Walking the line, Musk questions a specification that calls for four bolts and asks who set it and whether two would do.","provenance":"fact","source_quote":"Why do we have to have four bolts there? Who set that specification? Can we do it with two?","source_ref":"TBPN host quoting David Senra quoting Elon Musk, L396-L400","entities":["SpaceX","Elon Musk","David Senra"],"pos":[-38,17.2]},{"id":"i_skirt","slot":"item","label":"Two cracks in the engine skirt","text":"The day before a launch, a final inspection found two small cracks in the engine skirt of the rocket's second stage.","provenance":"fact","source_quote":"a final inspection revealed two small cracks in the engine skirt of the rocket's second stage","source_ref":"TBPN host reading David Senra's How Elon Works, L532-L534","entities":["SpaceX","Elon Musk","David Senra"],"pos":[-38,-32.8]},{"id":"i_vibes","slot":"item","label":"Vibes going in were rough","text":"Before the flight the public read on SpaceX was an argument between stock explanations: Musk distracted by politics, or Musk too focused on AI companions.","provenance":"fact","source_quote":"the vibes going into this were rough, honestly. Lots of people with the Elon's been distracted by politics take. Lots of people with the Elon too focused on AI romantic companions take.","source_ref":"TBPN hosts, L98-L102","entities":["SpaceX","Elon Musk"],"pos":[6,0.2]},{"id":"g_ducttape","slot":"signal","label":"Will duct tape work? Tinfoil?","text":"The host states the question the flight was flown to answer: how cheap can the vehicle be made, and what happens if you try the cheapest thing.","provenance":"fact","source_quote":"the calculus here is like, how cheap can you make this thing? If you use duct tape, will that work? Will you use tinfoil?","source_ref":"TBPN host, L266-L268","entities":["SpaceX","Starship"],"pos":[-32,33.75]},{"id":"g_debris","slot":"signal","label":"Debris: we didn't need it","text":"Watching parts shed during ascent, the hosts note they cannot say where the debris came from, and conclude only afterwards that it was not needed.","provenance":"fact","source_quote":"There's just a bunch of debris. That's not what we want to see. Where did the stuff come from? We clearly didn't need it.","source_ref":"TBPN hosts over the launch video, L66-L72","entities":["SpaceX","Starship"],"pos":[-44,29.75]},{"id":"g_tryit","slot":"signal","label":"We'll try it. See if it fails.","text":"Asked whether two bolts would do, the team answers no from the specification; Musk's answer is to run the article and find out.","provenance":"fact","source_quote":"They would say no. He said, we'll try it. See if it fails.","source_ref":"TBPN host quoting David Senra quoting Elon Musk, L402-L406","entities":["SpaceX","Elon Musk"],"pos":[-32,25.75]},{"id":"g_qualified","slot":"signal","label":"Probably tested for aerospace","text":"The host itemises what the three million dollars buys: aerospace qualification testing, a team to make it work reliably, and a set of nice-to-haves.","provenance":"fact","source_quote":"But like if you're spending $3 million on the air cooling system, like it probably has been tested in aerospace environment. It probably comes to the team to help you get it working reliably. There's probably lots of nice to haves that go into that.","source_ref":"TBPN host, L362-L366","entities":["SpaceX","Falcon 9"],"pos":[46,29.75]},{"id":"g_obsolete","slot":"signal","label":"Most regs were obsolete","text":"The two million dollar crane price rested on Air Force safety regulations, and most of those regulations turned out to be obsolete; the Air Force revised them and the cranes cost three hundred thousand.","provenance":"fact","source_quote":"He was shown all the safety regulations imposed by the Air Force. Most were obsolete.","source_ref":"TBPN host reading David Senra's How Elon Works, L474-L476","entities":["SpaceX","Elon Musk"],"pos":[48,21.75]},{"id":"g_usualplan","slot":"signal","label":"Usual plan: replace the engine","text":"Everyone at NASA assumed the launch would stand down for weeks, because the standard procedure for cracks in the engine skirt is to replace the entire engine.","provenance":"fact","source_quote":"Everyone at NASA assumed we'd be standing down from the launch for a few weeks. The usual plan would be then to replace the entire engine.","source_ref":"TBPN host reading David Senra's How Elon Works, L534-L538","entities":["SpaceX","David Senra"],"pos":[-44,-28.25]},{"id":"g_decisions","slot":"signal","label":"20% wrong, but if I don't, we die","text":"Musk estimated a hundred command decisions a day on the factory floor, accepted that at least a fifth would be wrong, and said the company dies if he does not make them.","provenance":"fact","source_quote":"At least 20% are going to be wrong, he said, but we're going to alter them later. But if I don't make decisions, we die.","source_ref":"TBPN host reading David Senra's How Elon Works, L418-L420","entities":["SpaceX","Elon Musk","David Senra"],"pos":[-32,-24.25]},{"id":"r_categorize","slot":"response","label":"Window is fixed: categorise","text":"Clear protocol: sense, categorise against the known rule, respond. Orbital mechanics is the one item on this list with no judgment in it, so the programme's scarce variance budget belongs on the items where cause and effect are not yet visible.","provenance":"derived","confidence":0.8,"rationale":"The window is set by celestial mechanics independently of anything SpaceX decides, which is the defining condition of the Clear domain; the episode states the constraint and the deadline pressure but never draws the allocation conclusion.","entities":["SpaceX","Starship"],"pos":[38,-24.03]},{"id":"r_unbundle","slot":"response","label":"Unbundle the assurance you buy","text":"Complicated protocol: sense, analyse, respond. Three million dollars is not a price but a bundle of qualification testing, reliability support and nice-to-haves, and the analytic move is to price each element separately and buy only the ones this flight needs.","provenance":"derived","confidence":0.65,"rationale":"The host itemises the bundle himself without concluding that it can be unpicked; Cynefin's Complicated domain says an expert-knowable answer exists, so the move is to decompose the price rather than to probe it or to pay it.","idea":"Assurance sold separately from hardware is an underserved market: qualification, instrumentation and reliability support offered as a service would let a programme buy a six thousand dollar commercial unit and only the aerospace confidence it actually needs.","entities":["SpaceX","Falcon 9"],"pos":[34,26.784]},{"id":"r_probe","slot":"response","label":"Probe the spec, not its owner","text":"Complex protocol: probe, sense, respond. Whether four bolts are needed cannot be answered from the document that specifies four bolts, so the only move that produces information is to fly an article with two and watch it hold or fail.","provenance":"derived","confidence":0.7,"rationale":"The episode shows the engineers answering from the specification and Musk answering with a test; Cynefin names the second the Complex protocol and predicts the first, a defence of a requirement whose originating conditions nobody present can state. The prescription generalises the single case the hosts report.","idea":"Nobody sells inherited-requirement auditing: a firm that systematically re-probes the specifications carrying a hardware programme's cost, the way SpaceX did with bolt counts and Air Force crane rules, would be selling a share of the 85 to 98 percent savings this episode reports on individual line items.","entities":["SpaceX","Elon Musk"],"pos":[-44,22.784]},{"id":"r_act","slot":"response","label":"Pre-delegate the hour-long call","text":"Chaotic protocol: act to establish order, then sense. With a launch hours away the binding constraint is decision latency, not engineering judgment, so the capability to buy in advance is delegated authority and a pre-costed reversal path rather than a faster review.","provenance":"derived","confidence":0.6,"rationale":"The episode reports the decision taking under an hour against an expectation of weeks, and a separate passage gives the decision regime it came from: a hundred calls a day with a fifth expected to be wrong. Cynefin's act-sense-respond explains why that works here, but the inference that the transferable asset is pre-delegation rather than speed is ours.","idea":"Hardware teams have no tooling for decision latency: pre-delegated authority with blast radius and reversal cost computed in advance is what lets a programme trim a cracked skirt in an hour instead of standing down for weeks, and it is sold nowhere.","entities":["SpaceX","Elon Musk"],"pos":[-42,-19.216]},{"id":"r_triage","slot":"response","label":"Split the programme, then judge","text":"Disorder protocol: break the object into parts and move each part to a domain where it can be handled. The pre-flight argument is unresolvable because it treats one programme as one object, when its transfer window is Clear, its supplier pricing Complicated and its flap loads Complex.","provenance":"derived","confidence":0.55,"rationale":"Each take the hosts report explains the whole programme from a single frame, which is what Cynefin calls arguing from your preferred domain; the remedy of decomposing the object before classifying it is never said in the episode.","idea":"Hard-tech diligence lacks an instrument that separates a programme's fixed-schedule risk from its emergent-engineering risk, and a per-part domain scoreboard would price launch and defence companies better than the single narrative their coverage trades on.","entities":["SpaceX","Starship"],"pos":[-6,-3.216]}],"edges":[{"id":"te1","from":"g_ducttape","to":"i_flight10","relation":"observed_in","provenance":"fact","source_quote":"set up Tuesday's mission to stress test parts of the Starship Spacecraft. We certainly saw that on display with the parts flying all over the place, seeking to give engineers information to continue developing the vehicle. Basically, the calculus here is like, how cheap can you make this thing?","source_ref":"TBPN host reading the Wall Street Journal, then commenting, L262-L268"},{"id":"te2","from":"g_tryit","to":"i_bolts","relation":"observed_in","provenance":"fact","source_quote":"Why do we have to have four bolts there? Who set that specification? Can we do it with two? They would say no. He said, we'll try it. See if it fails.","source_ref":"TBPN host quoting David Senra quoting Elon Musk, L396-L406"},{"id":"te3","from":"g_obsolete","to":"i_cranes","relation":"observed_in","provenance":"fact","source_quote":"when he asked his team why it would cost $2 million to build a pair of cranes. These are cranes. They're supposed to lift rockets. He was shown all the safety regulations imposed by the Air Force. Most were obsolete.","source_ref":"TBPN host reading David Senra's How Elon Works, L466-L476"},{"id":"te4","from":"g_usualplan","to":"i_skirt","relation":"observed_in","provenance":"fact","source_quote":"a final inspection revealed two small cracks in the engine skirt of the rocket's second stage. That's the piece of the bottom. Everyone at NASA assumed we'd be standing down from the launch for a few weeks.","source_ref":"TBPN host reading David Senra's How Elon Works, L532-L536"},{"id":"te5","from":"g_debris","to":"i_flight10","relation":"observed_in","provenance":"derived","confidence":0.85,"rationale":"The debris is shed during the Flight 10 ascent the hosts are watching, but the connection to the stress-test configuration is made 190 lines later by a different source."},{"id":"te6","from":"g_qualified","to":"i_cooling","relation":"observed_in","provenance":"derived","confidence":0.9,"rationale":"The host is plainly itemising the three million dollar part just described, but the two statements are separated by the Gwen Shotwell exchange and the six thousand dollar comparison."},{"id":"te7","from":"g_decisions","to":"i_skirt","relation":"observed_in","provenance":"derived","confidence":0.55,"rationale":"The hundred-decisions-a-day passage describes the regime in which a call like the skirt trim gets made, but the episode never connects the two stories."},{"id":"te8","from":"g_ducttape","to":"d_complex","relation":"indicates","provenance":"derived","confidence":0.85,"rationale":"Asking whether duct tape would work is an admission that the answer is not available from analysis: you learn the minimum by trying it, which is the Complex condition."},{"id":"te9","from":"g_debris","to":"d_complex","relation":"indicates","provenance":"derived","confidence":0.8,"rationale":"Knowing that a part was unnecessary only after watching it fall off is retrospective coherence, Cynefin's defining marker for the Complex domain."},{"id":"te10","from":"g_tryit","to":"d_complex","relation":"indicates","provenance":"derived","confidence":0.8,"rationale":"One party can only answer from the document and the other can only answer by running the test; when the document's authority is what is in question, the answer exists nowhere but in the probe."},{"id":"te11","from":"g_qualified","to":"d_complicated","relation":"indicates","provenance":"derived","confidence":0.8,"rationale":"A price that decomposes into testing, support and optional extras is knowable by expertise: several defensible answers, all reachable by analysis, which is the Complicated domain."},{"id":"te12","from":"g_obsolete","to":"d_complicated","relation":"indicates","provenance":"derived","confidence":0.7,"rationale":"Whether a regulation still applies is answerable, and it was in fact answered by examining the rules and negotiating with the Air Force: knowable, not emergent."},{"id":"te13","from":"g_obsolete","to":"d_clear","relation":"indicates","provenance":"derived","confidence":0.8,"label":"rule outlived its conditions","rationale":"Regulations applied by category long after the conditions that produced them had gone is exactly how Cynefin says the Clear domain fails, and it is why the price looked like a fact."},{"id":"te14","from":"g_usualplan","to":"d_clear","relation":"indicates","provenance":"derived","confidence":0.85,"rationale":"A standard procedure invoked by everyone present without analysis of this particular crack is the Clear protocol: sense, categorise, respond."},{"id":"te15","from":"g_decisions","to":"d_chaotic","relation":"indicates","provenance":"derived","confidence":0.8,"rationale":"Accepting a known error rate because the alternative is not deciding is the Chaotic protocol stated outright: act first, correct later."},{"id":"te16","from":"i_window","to":"d_clear","relation":"classified_as","provenance":"derived","confidence":0.9,"rationale":"The transfer window's cause and effect are fixed, public and independent of the programme: there is nothing to analyse and nothing to probe, only a date to categorise against."},{"id":"te17","from":"i_cooling","to":"d_complicated","relation":"classified_as","provenance":"derived","confidence":0.8,"rationale":"What an adequate cooling system costs is knowable by comparison and analysis, which is what Musk's question to Gwen Shotwell performed; experts differ on the answer but an answer exists in advance."},{"id":"te18","from":"i_cranes","to":"d_complicated","relation":"classified_as","provenance":"derived","confidence":0.7,"rationale":"Which of the Air Force requirements still had a reason behind it was discoverable by examination and negotiation, so the situation was Complicated rather than emergent."},{"id":"te19","from":"i_cranes","to":"d_clear","relation":"classified_as","provenance":"derived","confidence":0.85,"label":"treated as","rationale":"The team answered the cost question by showing the regulations, which is sense-categorise-respond: the Clear protocol applied to a question the rulebook could not settle."},{"id":"te20","from":"i_flight10","to":"d_complex","relation":"classified_as","provenance":"derived","confidence":0.85,"rationale":"A flight configured to stress parts to failure in order to give engineers information is a probe by construction: the team is buying retrospective coherence it cannot get any other way."},{"id":"te21","from":"i_bolts","to":"d_complex","relation":"classified_as","provenance":"derived","confidence":0.75,"rationale":"Nobody in the exchange can say why the specification says four, so the margin it encodes is unknown; the true load limit of this assembly is only discoverable by testing it, which places the question in the Complex domain rather than the Complicated one."},{"id":"te22","from":"i_bolts","to":"d_clear","relation":"classified_as","provenance":"derived","confidence":0.85,"label":"treated as","rationale":"The engineers' answer is no, read off the specification as a category: the Clear protocol applied to the one question in the episode that only a probe can answer."},{"id":"te23","from":"i_skirt","to":"d_chaotic","relation":"classified_as","provenance":"derived","confidence":0.6,"rationale":"Cracks found the day before a launch leave no time for the structural analysis that would settle the question, and the cost of the default is weeks: the clock, not the physics, puts this in the Chaotic domain. A reader could defend Complicated instead, which is why the confidence is low."},{"id":"te24","from":"i_skirt","to":"d_clear","relation":"classified_as","provenance":"derived","confidence":0.8,"label":"treated as","rationale":"Everyone assumed the usual plan, replace the engine and stand down, which is a category lookup rather than a judgment about these two cracks."},{"id":"te25","from":"i_vibes","to":"d_disorder","relation":"classified_as","provenance":"derived","confidence":0.7,"rationale":"The pre-flight argument was not about evidence but about which story explained the programme, each commentator reasoning from his preferred frame: Cynefin's Disorder."},{"id":"te26","from":"i_window","to":"r_categorize","relation":"calls_for","provenance":"derived","confidence":0.8,"rationale":"The response follows from the Clear classification."},{"id":"te27","from":"i_cooling","to":"r_unbundle","relation":"calls_for","provenance":"derived","confidence":0.65,"rationale":"The response follows from the Complicated classification and from the host's own itemisation of the price."},{"id":"te28","from":"i_bolts","to":"r_probe","relation":"calls_for","provenance":"derived","confidence":0.7,"rationale":"The response follows from the Complex classification and from the mismatch with the protocol actually applied."},{"id":"te29","from":"i_skirt","to":"r_act","relation":"calls_for","provenance":"derived","confidence":0.6,"rationale":"The response follows from the Chaotic classification."},{"id":"te30","from":"i_vibes","to":"r_triage","relation":"calls_for","provenance":"derived","confidence":0.55,"rationale":"The response follows from the Disorder classification."},{"id":"te31","from":"r_probe","to":"g_tryit","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The two answers in this quote, the specification's no and Musk's test, are the whole argument for the Complex protocol here."},{"id":"te32","from":"r_probe","to":"g_obsolete","relation":"supported_by","provenance":"derived","confidence":0.75,"rationale":"The obsolete crane regulations are the second instance, and the evidence that inherited requirements carry unexamined cost."},{"id":"te33","from":"r_unbundle","to":"g_qualified","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The host's itemisation is the evidence that the price is a bundle rather than a figure."},{"id":"te34","from":"r_act","to":"g_usualplan","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The weeks-long default is the cost that decision latency imposes, and the reason pre-delegation is worth buying."},{"id":"te35","from":"r_act","to":"g_decisions","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"The hundred-decisions-a-day regime is the evidence that the speed came from a standing delegation rather than from one heroic call."},{"id":"te36","from":"r_categorize","to":"i_window","relation":"supported_by","provenance":"derived","confidence":0.9,"rationale":"The eighteen-month window is the fact the categorisation is made against."},{"id":"te37","from":"r_triage","to":"i_vibes","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"The two competing takes are the evidence that the programme was being judged as one undifferentiated object."}]}]}</script>

<script type="module">
import * as THREE from 'three';

// ---------- palette (validated categorical slots, dark surface; see _meta and SPEC.md section 5) ----------
const SLOT_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
const SCHEMA_COLOR = '#898781';
const INK = '#ffffff', INK2 = '#c3c2b7', MUTED = '#898781', HAIRLINE = '#2c2c2a', SURFACE = '#1a1a19';
const IDEA = '#eda100';   // marks a node whose `idea` field names an opportunity
const NODE_R = 2.2;

// ---------- data ----------
const $ = (id) => document.getElementById(id);
let GRAPH;
try { GRAPH = JSON.parse($('graph-data').textContent); } catch (e) { fatal('The embedded graph data is not valid JSON: ' + e.message); }
if (!GRAPH || !GRAPH.framework || !Array.isArray(GRAPH.examples) || GRAPH.examples.length === 0) fatal('No graph data embedded yet. Run: node _meta/build.mjs <framework-dir>');

function fatal(msg) { const f = $('fallback'); f.hidden = false; f.textContent = msg; window.__engineReady = true; throw new Error(msg); }

const fw = GRAPH.framework;

// slot colours: fixed order over content slots, never cycled; beyond 8, muted
const slotStyle = new Map();
let ci = 0;
for (const s of GRAPH.slots) {
  if (s.structural) slotStyle.set(s.id, { color: SCHEMA_COLOR, shape: s.shape || 'box', slot: s });
  else slotStyle.set(s.id, { color: s.color || (ci < SLOT_COLORS.length ? SLOT_COLORS[ci++] : MUTED), shape: s.shape || 'sphere', slot: s });
}
const relLabel = new Map((GRAPH.relations || []).map(r => [r.id, r.label || r.id]));
relLabel.set('supported_by', 'supported by');

// ---------- renderer / scene ----------
const stage = $('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false }); } catch (e) { fatal('WebGL is not available in this browser.'); }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

stage.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: $('labels') });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.autoRotateSpeed = 0.6;
scene.add(new THREE.AmbientLight(0xffffff, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(40, 80, 120); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-60, -20, -80); scene.add(fill);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, true); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
// The header and the note strip lay out after the first script pass, so a one-shot resize()
// leaves the WebGL buffer and the CSS2D label layer disagreeing (labels drift from their nodes).
// Observing the stage keeps both renderers on its real size, at first paint and on every change.
let roFrame = 0;
const ro = new ResizeObserver(() => { cancelAnimationFrame(roFrame); roFrame = requestAnimationFrame(() => { resize(); resetView(); }); });
ro.observe(stage);

// ---------- state ----------
const state = { exampleIndex: 0, showDerived: true, showGrounding: false, showLabels: true, group: null, nodes: new Map(), edges: [], hit: [], hover: null, selected: null, fit: null };

// ---------- layouts ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function forceLayout(nodes, edges, pinned, seed, opts = {}) {
  const rand = mulberry32(seed);
  const pos = new Map();
  const R0 = opts.radius || Math.max(18, nodes.length * 2.2);
  for (const n of nodes) {
    if (pinned.has(n.id)) pos.set(n.id, pinned.get(n.id).clone());
    else pos.set(n.id, new THREE.Vector3((rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0 * (opts.flat ? 0.15 : 1)));
  }
  const ids = nodes.map(n => n.id);
  const L = opts.rest || 16, K = opts.repulse || 420;
  const f = new Map(ids.map(id => [id, new THREE.Vector3()]));
  const d = new THREE.Vector3();
  for (let it = 0; it < 420; it++) {
    const alpha = 0.9 * (1 - it / 420) + 0.04;
    for (const id of ids) f.get(id).set(0, 0, 0);
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const a = pos.get(ids[i]), b = pos.get(ids[j]);
      d.subVectors(a, b); let dist = d.length(); if (dist < 0.5) { d.set(rand() - .5, rand() - .5, rand() - .5); dist = 0.5; }
      const s = K / (dist * dist); d.normalize().multiplyScalar(s);
      f.get(ids[i]).add(d); f.get(ids[j]).sub(d);
    }
    for (const e of edges) {
      if (!pos.has(e.from) || !pos.has(e.to)) continue;
      const a = pos.get(e.from), b = pos.get(e.to);
      d.subVectors(b, a); const dist = Math.max(d.length(), 0.01);
      const s = (dist - L) * 0.05; d.normalize().multiplyScalar(s);
      f.get(e.from).add(d); f.get(e.to).sub(d);
    }
    for (const id of ids) {
      if (pinned.has(id)) continue;
      const p = pos.get(id), ff = f.get(id);
      ff.addScaledVector(p, -0.012);
      if (opts.flat) ff.z -= p.z * 0.2;
      const len = ff.length(); if (len > 6) ff.multiplyScalar(6 / len);
      p.addScaledVector(ff, alpha);
    }
  }
  return pos;
}

function treeLayout(ex) {
  const nodes = ex.nodes, edges = ex.edges.filter(e => e.relation !== 'supported_by');
  const level = new Map();
  const explicit = nodes.every(n => Number.isInteger(n.level));
  if (explicit) nodes.forEach(n => level.set(n.id, n.level));
  else {
    const out = new Map(nodes.map(n => [n.id, []])), und = new Map(nodes.map(n => [n.id, []]));
    for (const e of edges) { out.get(e.from)?.push(e.to); und.get(e.from)?.push(e.to); und.get(e.to)?.push(e.from); }
    const root = ex.layout.root && level.has(ex.layout.root) === false ? ex.layout.root : nodes[0].id;
    const q = [root]; level.set(root, 0);
    while (q.length) { const id = q.shift(); for (const t of out.get(id) || []) if (!level.has(t)) { level.set(t, level.get(id) + 1); q.push(t); } }
    // unreachable by direction: attach by undirected distance
    const q2 = [...level.keys()];
    while (q2.length) { const id = q2.shift(); for (const t of und.get(id) || []) if (!level.has(t)) { level.set(t, level.get(id) + 1); q2.push(t); } }
    for (const n of nodes) if (!level.has(n.id)) level.set(n.id, 0);
    for (const n of nodes) if (Number.isInteger(n.level)) level.set(n.id, n.level);
  }
  const layers = new Map();
  for (const n of nodes) { const l = level.get(n.id); if (!layers.has(l)) layers.set(l, []); layers.get(l).push(n); }
  const order = [...layers.keys()].sort((a, b) => a - b);
  const pos = new Map();
  const right = ex.layout.direction === 'right';
  const GAP_L = right ? 26 : 18, GAP_S = right ? 9 : 14;
  // barycentre ordering pass to reduce crossings
  const parents = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) if (level.get(e.to) > level.get(e.from)) parents.get(e.to).push(e.from);
  const xOf = new Map();
  for (const l of order) {
    const arr = layers.get(l);
    if (l !== order[0]) arr.sort((a, b) => {
      const pa = parents.get(a.id).filter(p => xOf.has(p)), pb = parents.get(b.id).filter(p => xOf.has(p));
      const ma = pa.length ? pa.reduce((s, p) => s + xOf.get(p), 0) / pa.length : 0;
      const mb = pb.length ? pb.reduce((s, p) => s + xOf.get(p), 0) / pb.length : 0;
      return ma - mb;
    });
    arr.forEach((n, i) => {
      const s = (i - (arr.length - 1) / 2) * GAP_S;
      xOf.set(n.id, s);
      pos.set(n.id, right ? new THREE.Vector3(l * GAP_L, -s, 0) : new THREE.Vector3(s, -l * GAP_L, 0));
    });
  }
  for (const n of nodes) if (Array.isArray(n.pos)) pos.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  return pos;
}

function ringLayout(ex) {
  const nodes = ex.nodes;
  const onRing = nodes.filter(n => Number.isInteger(n.order) && !Array.isArray(n.pos));
  const R = Math.max(22, onRing.length * 4.2);
  const pinned = new Map();
  onRing.sort((a, b) => a.order - b.order).forEach((n, i) => { const t = Math.PI / 2 - (i / onRing.length) * Math.PI * 2; pinned.set(n.id, new THREE.Vector3(Math.cos(t) * R, Math.sin(t) * R, 0)); });
  for (const n of nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  if (pinned.size === nodes.length) return pinned;
  return forceLayout(nodes, ex.edges, pinned, 7, { radius: R * 0.5, flat: true, rest: 12 });
}

function planeLayout(ex) {
  const pinned = new Map();
  for (const n of ex.nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  if (pinned.size === ex.nodes.length) return pinned;
  return forceLayout(ex.nodes, ex.edges, pinned, 11, { flat: true, rest: 14 });
}

function computeLayout(ex) {
  const mode = ex.layout?.mode || 'force';
  if (mode === 'tree') return treeLayout(ex);
  if (mode === 'ring') return ringLayout(ex);
  if (mode === 'plane') return planeLayout(ex);
  const pinned = new Map();
  for (const n of ex.nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  return forceLayout(ex.nodes, ex.edges, pinned, 3);
}

// ---------- geometry helpers ----------
const GEO = {
  sphere: (r) => new THREE.SphereGeometry(r, 28, 20),
  box: (r) => new THREE.BoxGeometry(r * 1.7, r * 1.7, r * 1.7),
  diamond: (r) => new THREE.OctahedronGeometry(r * 1.25, 0),
  cone: (r) => new THREE.ConeGeometry(r * 1.1, r * 2.2, 20),
};
function label2d(text, cls, innerTransform) {
  const el = document.createElement('div'); el.className = cls;
  if (innerTransform) {
    const inner = document.createElement('span');
    inner.className = 'lab'; inner.style.display = 'inline-block'; inner.style.transform = innerTransform;
    inner.textContent = text; el.appendChild(inner);
  } else el.textContent = text;
  return new CSS2DObject(el);
}

function makeNode(n, p) {
  const st = slotStyle.get(n.slot) || { color: MUTED, shape: 'sphere' };
  const r = NODE_R * (n.size || 1);
  const color = new THREE.Color(st.color);
  const obj = new THREE.Group(); obj.position.copy(p);
  let mesh, halo = null;
  if (n.provenance === 'fact') {
    mesh = new THREE.Mesh(GEO[st.shape](r), new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.08 }));
  } else if (n.provenance === 'derived') {
    mesh = new THREE.Mesh(GEO[st.shape](r), new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.0, transparent: true, opacity: 0.32, depthWrite: false }));
    halo = new THREE.LineSegments(new THREE.WireframeGeometry(GEO[st.shape](r * 1.35)), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.75 }));
    obj.add(halo);
  } else {
    mesh = new THREE.Mesh(GEO[st.shape === 'sphere' ? 'box' : st.shape](r * 0.8), new THREE.MeshStandardMaterial({ color: new THREE.Color(SCHEMA_COLOR), roughness: 0.9, metalness: 0, transparent: true, opacity: 0.85 }));
  }
  mesh.userData.nodeId = n.id;
  obj.add(mesh);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(r * 1.9, 10, 8), new THREE.MeshBasicMaterial({ visible: false }));
  hit.userData.nodeId = n.id; obj.add(hit);
  // A node carrying an `idea` is where this framework surfaces an underserved need or opportunity:
  // mark it so a reader can find the payoff without opening every panel.
  if (n.idea) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 1.6, r * 0.11, 8, 40), new THREE.MeshBasicMaterial({ color: new THREE.Color(IDEA) }));
    ring.userData.isIdeaRing = true; obj.add(ring);
  }
  const glyph = n.provenance === 'fact' ? '●' : n.provenance === 'derived' ? '◌' : '▪';
  const el = document.createElement('div'); el.className = 'nlabel ' + n.provenance;
  const g = document.createElement('span'); g.className = 'g'; g.textContent = glyph; g.style.color = n.provenance === 'schema' ? MUTED : st.color;
  const inner = document.createElement('span'); inner.className = 'lab';
  inner.appendChild(g);
  if (n.idea) { const st2 = document.createElement('span'); st2.className = 'idea-star'; st2.textContent = '★'; inner.appendChild(st2); }
  inner.appendChild(document.createTextNode(n.label || n.id));
  el.appendChild(inner);
  // Anchor the label below whatever the node actually draws: a diamond reaches further than a
  // sphere, a derived node adds a 1.35r halo, and an idea node adds a 1.6r ring. Anchoring at -r
  // regardless (the old behaviour) made labels collide with their own marker on those nodes.
  const SHAPE_EXTENT = { sphere: 1.0, box: 0.85, diamond: 1.25, cone: 1.1 };
  let extent = (SHAPE_EXTENT[st.shape] ?? 1) * r;
  if (n.provenance === 'derived') extent = Math.max(extent, r * 1.35);
  if (n.idea) extent = Math.max(extent, r * 1.72);
  const lab = new CSS2DObject(el); lab.position.set(0, -extent, 0); obj.add(lab);
  return { node: n, obj, mesh, halo, hit, label: lab, r, color: st.color, edges: [] };
}

function makeEdge(e, A, B) {
  const from = A.obj.position, to = B.obj.position;
  const dir = new THREE.Vector3().subVectors(to, from); const len = dir.length(); dir.normalize();
  const a = from.clone().addScaledVector(dir, A.r * 1.05), b = to.clone().addScaledVector(dir, -(B.r * 1.05 + (e.relation === 'supported_by' ? 0 : 1.6)));
  const geom = new THREE.BufferGeometry().setFromPoints([a, b]);
  let mat, arrow = null;
  const grounding = e.relation === 'supported_by';
  if (grounding) mat = new THREE.LineDashedMaterial({ color: new THREE.Color(MUTED), dashSize: 0.5, gapSize: 0.9, transparent: true, opacity: 0.55 });
  else if (e.provenance === 'derived') mat = new THREE.LineDashedMaterial({ color: new THREE.Color(INK2), dashSize: 1.4, gapSize: 0.9, transparent: true, opacity: 0.8 });
  else if (e.provenance === 'schema') mat = new THREE.LineBasicMaterial({ color: new THREE.Color(HAIRLINE), transparent: true, opacity: 0.9 });
  else mat = new THREE.LineBasicMaterial({ color: new THREE.Color(INK2), transparent: true, opacity: 0.85 });
  const line = new THREE.Line(geom, mat); line.computeLineDistances();
  const grp = new THREE.Group(); grp.add(line);
  if (!grounding && e.provenance !== 'schema') {
    arrow = new THREE.Mesh(new THREE.ConeGeometry(0.75, 2.0, 10), new THREE.MeshBasicMaterial({ color: e.provenance === 'derived' ? new THREE.Color(INK2) : new THREE.Color(INK2), transparent: true, opacity: e.provenance === 'derived' ? 0.7 : 0.95 }));
    arrow.position.copy(to).addScaledVector(dir, -(B.r * 1.05 + 1.0));
    arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);

}

function drawDecor(ex, parent, bbox, offset) {
  const L = ex.layout || {};
  // Nodes are re-centred on their bounding box in every mode except plane, but decor coordinates
  // are authored in the same space as node positions. Shift the decor by the same amount so a
  // region or axis lines up with its nodes without the author having to centre on the origin.
  const group = new THREE.Group();
  group.position.copy(offset).negate();
  parent.add(group);
  const shift = (v) => new THREE.Vector3(v.x - offset.x, v.y - offset.y, v.z - offset.z);
  const z = -0.6;
  const lineMat = new THREE.LineBasicMaterial({ color: new THREE.Color(0x4a4a47) });
  const dashMat = new THREE.LineDashedMaterial({ color: new THREE.Color(0x4a4a47), dashSize: 1.2, gapSize: 1.0 });
  for (const r of (L.regions || [])) {
    const w = Math.abs(r.x[1] - r.x[0]), h = Math.abs(r.y[1] - r.y[0]);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(r.color || '#3987e5'), transparent: true, opacity: 0.07, depthWrite: false }));
    m.position.set((r.x[0] + r.x[1]) / 2, (r.y[0] + r.y[1]) / 2, z - 0.5); group.add(m);
    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)), new THREE.LineBasicMaterial({ color: new THREE.Color(r.color || '#3987e5'), transparent: true, opacity: 0.25 }));
    edge.position.copy(m.position); group.add(edge);
    // Caption sits top-centre INSIDE the band. CSS2D centres its box on the position, so anchoring
    // at the corner made every caption straddle the boundary and builders patched it page-side.
    const lab = label2d(r.label, 'rlabel'); lab.position.set((r.x[0] + r.x[1]) / 2, Math.max(r.y[0], r.y[1]) - 3, z); group.add(lab);
    bbox.expandByPoint(shift(new THREE.Vector3(r.x[0], r.y[0], 0))); bbox.expandByPoint(shift(new THREE.Vector3(r.x[1], r.y[1], 0)));
  }
  // Free-standing captions. Without this a builder has to fake one with a zero-length guide.
  for (const an of (L.annotations || [])) {
    const lab = label2d(an.text, an.style === 'axis' ? 'axlabel' : an.style === 'region' ? 'rlabel' : 'glabel');
    lab.position.set(an.pos[0], an.pos[1], an.pos[2] ?? z); group.add(lab);
    bbox.expandByPoint(shift(new THREE.Vector3(an.pos[0], an.pos[1], 0)));
  }
  for (const gd of (L.guides || [])) {
    const a = new THREE.Vector3(gd.from[0], gd.from[1], gd.from[2] || z), b = new THREE.Vector3(gd.to[0], gd.to[1], gd.to[2] || z);
    const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), gd.style === 'dashed' ? dashMat : lineMat); ln.computeLineDistances(); group.add(ln);
    if (gd.label) { const lab = label2d(gd.label, 'glabel'); lab.position.copy(a).lerp(b, 0.5); group.add(lab); }
    bbox.expandByPoint(shift(a)); bbox.expandByPoint(shift(b));
  }
  if (L.axes) {
    const ax = L.axes.x, ay = L.axes.y;
    const xmin = ax ? ax.min : bbox.min.x, xmax = ax ? ax.max : bbox.max.x, ymin = ay ? ay.min : bbox.min.y, ymax = ay ? ay.max : bbox.max.y;
    const pad = 6;
    if (ax) {
      const y = ymin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xmin, y, z), new THREE.Vector3(xmax, y, z)]), lineMat));
      const lab = label2d(ax.label, 'axlabel'); lab.position.set((xmin + xmax) / 2, y - 7.5, z); group.add(lab);
      for (const t of (ax.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(t.value, y - 1, z), new THREE.Vector3(t.value, y + 1, z)]), lineMat)); const tl = label2d(t.label, 'tick'); tl.position.set(t.value, y - 2.2, z); group.add(tl); }
      bbox.expandByPoint(shift(new THREE.Vector3(xmin, y - 9, 0))); bbox.expandByPoint(shift(new THREE.Vector3(xmax, y, 0)));
    }
    if (ay) {
      const x = xmin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, ymin, z), new THREE.Vector3(x, ymax, z)]), lineMat));
      const lab = label2d(ay.label, 'axlabel', 'rotate(-90deg)'); lab.position.set(x - 8, (ymin + ymax) / 2, z); group.add(lab);
      for (const t of (ay.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x - 1, t.value, z), new THREE.Vector3(x + 1, t.value, z)]), lineMat)); const tl = label2d(t.label, 'tick', 'translateX(-50%)'); tl.position.set(x - 2.5, t.value, z); group.add(tl); }
      bbox.expandByPoint(shift(new THREE.Vector3(x - 11, ymin, 0))); bbox.expandByPoint(shift(new THREE.Vector3(x, ymax, 0)));
    }
  }
}

// ---------- build an example ----------
function clearGroup() {
  if (!state.group) return;
  state.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); } if (o.isCSS2DObject && o.element) o.element.remove(); });
  scene.remove(state.group);
  $('labels').replaceChildren();
  state.group = null; state.nodes.clear(); state.edges = []; state.hit = []; state.hover = null; state.selected = null;
  $('panel').hidden = true;
}

function buildExample(i) {
  clearGroup();
  state.exampleIndex = i;
  const ex = GRAPH.examples[i];
  const group = new THREE.Group(); scene.add(group); state.group = group;
  const positions = computeLayout(ex);
  // centre
  const bbox = new THREE.Box3();
  for (const p of positions.values()) bbox.expandByPoint(p);
  const centre = bbox.getCenter(new THREE.Vector3());
  const decorOffset = ex.layout?.mode !== 'plane' ? centre.clone() : new THREE.Vector3();
  if (ex.layout?.mode !== 'plane') for (const p of positions.values()) p.sub(centre);
  const bbox2 = new THREE.Box3(); for (const p of positions.values()) bbox2.expandByPoint(p);
  for (const n of ex.nodes) { const rec = makeNode(n, positions.get(n.id)); state.nodes.set(n.id, rec); group.add(rec.obj); state.hit.push(rec.hit); }
  for (const e of ex.edges) {
    const A = state.nodes.get(e.from), B = state.nodes.get(e.to); if (!A || !B) continue;
    const rec = makeEdge(e, A, B); state.edges.push(rec); group.add(rec.grp); A.edges.push(rec); B.edges.push(rec);
  }
