<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; transform: translateY(14px); text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"framework":{"slug":"ishikawa-fishbone","name":"Ishikawa (Fishbone) Diagram","category":"02-strategic-and-business","wikipedia":"https://en.wikipedia.org/wiki/Ishikawa_diagram","one_liner":"Files every candidate cause of one named effect onto six fixed ribs - Methods, Machines, Materials, Measurements, Milieu, Manpower - so a team searches the whole space of causes instead of the corner it already knows."},"slots":[{"id":"effect","label":"Effect","description":"The one problem at the head of the fish, stated as an observed outcome rather than as a diagnosis. Everything else in the diagram is a candidate explanation of this and nothing else.","typical_provenance":"fact","color":"#d95926","shape":"box"},{"id":"category","label":"Category (6M)","description":"One of Methods, Machines, Materials, Measurements, Milieu, Manpower. Scaffolding given by the framework, not content taken from the source: the six ribs exist before anyone reads a word.","typical_provenance":"schema","structural":true,"color":"#7a7873","shape":"box"},{"id":"cause","label":"Cause","description":"A candidate cause hanging on one category rib. Usually stated by a speaker; sometimes the reader has to put one on a rib the source left bare.","typical_provenance":"either","color":"#3987e5","shape":"sphere"},{"id":"subcause","label":"Sub-cause","description":"A finer cause under a cause: the reason behind the reason. The level where a source usually stops talking and where the reader's inference, and the opportunity, tend to live.","typical_provenance":"either","color":"#1b998b","shape":"diamond"}],"relations":[{"id":"contributes_to","label":"contributes to","description":"this node is offered as a cause of the node it points at; the arrow always runs toward the head of the fish"},{"id":"belongs_to","label":"belongs to","description":"a cause is filed on this category rib; the bone itself, not a claim about the world"}],"examples":[{"id":"classic","kind":"classic","title":"Quality circle, Line 3: the scrap rate on the moulded housings","summary":"A moulding department's Thursday quality circle: the scrap rate has tripled, every reject shows the same defect, and five departments each name a cause. Five ribs fill from the minutes; the Machines rib stays bare because nobody from maintenance came.","source":{"type":"text","title":"Minutes of the Thursday quality circle, moulding department","attribution":"Synthetic scenario in the genre Kaoru Ishikawa used at Kawasaki Heavy Industries: one defect, a circle of the people who touch the line, and a cause offered by each of them.","text":"Minutes of the Thursday quality circle, moulding department.\n\nThe scrap rate on the Line 3 housings has risen from two per cent to nine per cent over the last six weeks, and every rejected part shows the same surface defect, a cloudy streak near the gate.\n\nIto, night shift: the two operators who joined in July were shown the job by a colleague on their first night, and nobody walked them through the written procedure.\n\nSato, purchasing: we qualified a second resin supplier in the spring. We have been drawing from both suppliers' drums without recording which lot went into which run.\n\nNakamura, process engineering: when the schedule tightened in August we cut the drying time on the resin from four hours to two, so that the line would not sit idle.\n\nWatanabe, inspection: the gauge at final inspection was last calibrated fourteen months ago, and the standard is twelve months.\n\nKato, facilities: the dehumidifier in the material store failed at the start of the summer and has not been repaired, so the store has been running humid since June.\n\nNobody from maintenance attended the circle, and the mould tool was not discussed."},"layout":{"mode":"plane","guides":[{"from":[-39,0],"to":[28,0],"style":"solid"},{"from":[-32,0],"to":[-45.27,29.5],"style":"solid"},{"from":[-21,0],"to":[-36.98,-35.5],"style":"solid"},{"from":[-10,0],"to":[-23.27,29.5],"style":"solid"},{"from":[1,0],"to":[-12.5,-30],"style":"solid"},{"from":[12,0],"to":[-1.28,29.5],"style":"solid"},{"from":[23,0],"to":[7.47,-34.5],"style":"solid"},{"from":[33,-7.6],"to":[51.75,-7.6],"style":"solid"},{"from":[51.75,-7.6],"to":[58,0],"style":"solid"},{"from":[58,0],"to":[51.75,7.6],"style":"solid"},{"from":[51.75,7.6],"to":[33,7.6],"style":"solid"},{"from":[33,7.6],"to":[33,-7.6],"style":"solid"}]},"nodes":[{"id":"effect","slot":"effect","label":"Line 3 scrap rate 2% to 9%","text":"The scrap rate on the Line 3 housings has gone from two per cent to nine per cent in six weeks, and every rejected part carries the same defect: a cloudy streak near the gate.","provenance":"fact","source_quote":"the scrap rate on the Line 3 housings has risen from two per cent to nine per cent over the last six weeks, and every rejected part shows the same surface defect, a cloudy streak near the gate","source_ref":"sentence 2","pos":[43,0],"size":2.8},{"id":"cat_methods","slot":"category","label":"Methods","text":"Methods: the procedures, settings and written work instructions by which the job is done.","provenance":"schema","pos":[-32,0],"size":1.3},{"id":"cat_measurements","slot":"category","label":"Measurements","text":"Measurements: the gauges, calibrations and records by which the process is known.","provenance":"schema","pos":[-21,0],"size":1.3},{"id":"cat_machines","slot":"category","label":"Machines","text":"Machines: the press, the mould tool, the dryer and every other piece of equipment the job runs on.","provenance":"schema","pos":[-10,0],"size":1.3},{"id":"cat_milieu","slot":"category","label":"Milieu","text":"Milieu: the surrounding conditions - temperature, humidity, storage, season, the plant around the line.","provenance":"schema","pos":[1,0],"size":1.3},{"id":"cat_materials","slot":"category","label":"Materials","text":"Materials: the resin, the colourant and every other physical input the line consumes.","provenance":"schema","pos":[12,0],"size":1.3},{"id":"cat_manpower","slot":"category","label":"Manpower","text":"Manpower: the operators and inspectors, their training, experience and shift patterns.","provenance":"schema","pos":[23,0],"size":1.3},{"id":"c_methods_drying","slot":"cause","label":"Drying time cut from 4h to 2h","text":"Process engineering halved the resin drying time, from four hours to two, in August.","provenance":"fact","source_quote":"we cut the drying time on the resin from four hours to two","source_ref":"Nakamura, process engineering, sentence 6","pos":[-36.5,10]},{"id":"sc_methods_schedule","slot":"subcause","label":"Schedule pressure in August","text":"The change was made because the production schedule tightened in August and the line would otherwise have stood idle.","provenance":"fact","source_quote":"when the schedule tightened in August","source_ref":"Nakamura, process engineering, sentence 6","pos":[-43.7,26]},{"id":"c_measure_gauge","slot":"cause","label":"Gauge 14 months since calibration","text":"The gauge used at final inspection was last calibrated fourteen months ago against a twelve-month standard.","provenance":"fact","source_quote":"the gauge at final inspection was last calibrated fourteen months ago, and the standard is twelve months","source_ref":"Watanabe, inspection, sentence 7","pos":[-25.5,-10]},{"id":"c_measure_lots","slot":"cause","label":"No lot traceability per run","text":"Resin is drawn from both suppliers' drums without any record of which lot went into which run, so no run can be traced back to its material.","provenance":"fact","source_quote":"We have been drawing from both suppliers' drums without recording which lot went into which run","source_ref":"Sato, purchasing, sentence 5","pos":[-35.4,-32]},{"id":"c_measure_drift","slot":"cause","label":"Some of the 9% may be gauge drift","text":"An uncalibrated gauge fails good parts as readily as it passes bad ones, so part of the rise from two per cent to nine per cent may be the instrument moving rather than the process.","provenance":"derived","confidence":0.6,"rationale":"The scrap rate is a number produced by the very gauge the circle has just reported as two months past its calibration interval. Nothing in the minutes separates a change in the process from a change in the measurement of it.","pos":[-30.45,-21]},{"id":"c_machines_tool","slot":"cause","label":"Mould tool never examined","text":"The mould tool and its gate have not been inspected for wear, deposit or a temperature-control fault, any of which would put a defect exactly where this one appears.","provenance":"derived","confidence":0.5,"rationale":"The minutes end by recording that nobody from maintenance attended and the mould tool was not discussed. The Machines rib is empty because no one in the room owned it, not because the tool has been cleared; the defect's location at the gate is precisely where tool condition would show.","pos":[-19.45,21]},{"id":"c_milieu_humid","slot":"cause","label":"Material store humid since June","text":"The material store has been running humid since June, so the resin sits in damp air before it reaches the dryer.","provenance":"fact","source_quote":"the store has been running humid since June","source_ref":"Kato, facilities, sentence 8","pos":[-5.98,-15.5]},{"id":"sc_milieu_dehumidifier","slot":"subcause","label":"Store dehumidifier failed, unrepaired","text":"The dehumidifier in the material store failed at the start of the summer and has still not been repaired.","provenance":"fact","source_quote":"the dehumidifier in the material store failed at the start of the summer and has not been repaired","source_ref":"Kato, facilities, sentence 8","pos":[-10.93,-26.5]},{"id":"c_materials_supplier","slot":"cause","label":"Second resin supplier qualified","text":"A second resin supplier was qualified in the spring and both suppliers' drums are now in use on the line.","provenance":"fact","source_quote":"we qualified a second resin supplier in the spring","source_ref":"Sato, purchasing, sentence 4","pos":[0.3,26]},{"id":"c_materials_moisture","slot":"cause","label":"Moisture in the resin at the gate","text":"Resin carrying too much water into the mould flashes to steam at the gate and leaves a cloudy streak. Three of the reported causes - a second supplier of unknown drying behaviour, a drying step cut in half, and a store that has been damp since June - all move the same variable in the same direction.","provenance":"derived","confidence":0.8,"rationale":"The defect is specific: a cloudy streak at the gate is the standard signature of moisture in a moulded part. Three independently reported causes each raise the water the resin carries, and no other reported cause explains why every reject shows the same mark rather than a scatter of defects.","pos":[7.5,10]},{"id":"c_manpower_shadow","slot":"cause","label":"July operators trained by shadowing","text":"The two operators who joined in July were shown the job by a colleague on their first night, and nobody took them through the written procedure.","provenance":"fact","source_quote":"the two operators who joined in July were shown the job by a colleague on their first night, and nobody walked them through the written procedure","source_ref":"Ito, night shift, sentence 3","pos":[13.78,-20.5]},{"id":"sc_manpower_noonboarding","slot":"subcause","label":"No onboarding step uses the procedure","text":"Being shown the job by whoever is on shift is the department's normal way of starting someone, not an exception made in July, so the written procedure is not the thing anyone is actually taught.","provenance":"derived","confidence":0.6,"rationale":"Ito reports the shadowing without qualification or apology and offers it as a standing condition of the night shift, which reads as routine practice rather than a one-off lapse. A single lapse would not be worth bringing to the circle.","pos":[9.05,-31]}],"edges":[{"id":"sp_methods","from":"cat_methods","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"sp_measurements","from":"cat_measurements","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"sp_machines","from":"cat_machines","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"sp_milieu","from":"cat_milieu","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"sp_materials","from":"cat_materials","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"sp_manpower","from":"cat_manpower","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"b_methods_drying","from":"c_methods_drying","to":"cat_methods","relation":"belongs_to","provenance":"schema"},{"id":"b_measure_gauge","from":"c_measure_gauge","to":"cat_measurements","relation":"belongs_to","provenance":"schema"},{"id":"b_measure_lots","from":"c_measure_lots","to":"cat_measurements","relation":"belongs_to","provenance":"schema"},{"id":"b_measure_drift","from":"c_measure_drift","to":"cat_measurements","relation":"belongs_to","provenance":"schema"},{"id":"b_machines_tool","from":"c_machines_tool","to":"cat_machines","relation":"belongs_to","provenance":"schema"},{"id":"b_milieu_humid","from":"c_milieu_humid","to":"cat_milieu","relation":"belongs_to","provenance":"schema"},{"id":"b_materials_supplier","from":"c_materials_supplier","to":"cat_materials","relation":"belongs_to","provenance":"schema"},{"id":"b_materials_moisture","from":"c_materials_moisture","to":"cat_materials","relation":"belongs_to","provenance":"schema"},{"id":"b_manpower_shadow","from":"c_manpower_shadow","to":"cat_manpower","relation":"belongs_to","provenance":"schema"},{"id":"f_schedule_drying","from":"sc_methods_schedule","to":"c_methods_drying","relation":"contributes_to","provenance":"fact","source_quote":"when the schedule tightened in August we cut the drying time on the resin from four hours to two","source_ref":"Nakamura, process engineering, sentence 6"},{"id":"f_dehum_humid","from":"sc_milieu_dehumidifier","to":"c_milieu_humid","relation":"contributes_to","provenance":"fact","source_quote":"the dehumidifier in the material store failed at the start of the summer and has not been repaired, so the store has been running humid since June","source_ref":"Kato, facilities, sentence 8"},{"id":"d_noonboarding_shadow","from":"sc_manpower_noonboarding","to":"c_manpower_shadow","relation":"contributes_to","provenance":"derived","confidence":0.6,"rationale":"If shadowing is the department's normal onboarding, that practice is the cause of what happened to the July starters rather than the other way round."},{"id":"d_supplier_moisture","from":"c_materials_supplier","to":"c_materials_moisture","relation":"contributes_to","provenance":"derived","confidence":0.7,"rationale":"A second supplier's resin need not dry on the same schedule as the first; qualifying it in spring puts an unvalidated moisture behaviour on the line."},{"id":"d_drying_moisture","from":"c_methods_drying","to":"c_materials_moisture","relation":"contributes_to","provenance":"derived","confidence":0.8,"rationale":"Halving a drying time is a direct reduction in water removed; the link from the stated change to residual moisture is close to forced."},{"id":"d_humid_moisture","from":"c_milieu_humid","to":"c_materials_moisture","relation":"contributes_to","provenance":"derived","confidence":0.75,"rationale":"Hygroscopic resin picks up water from damp storage air before it ever reaches the dryer, so the store condition raises the load the shortened dry has to remove."},{"id":"d_moisture_effect","from":"c_materials_moisture","to":"effect","relation":"contributes_to","provenance":"derived","confidence":0.8,"rationale":"The single mechanism the three ribs share is also the one that produces the specific mark reported: a cloudy streak at the gate."},{"id":"d_drift_effect","from":"c_measure_drift","to":"effect","relation":"contributes_to","provenance":"derived","confidence":0.6,"rationale":"The effect is a measured rate, so an instrument fault contributes to the number even when the process has not changed."},{"id":"d_tool_effect","from":"c_machines_tool","to":"effect","relation":"contributes_to","provenance":"derived","confidence":0.5,"rationale":"Gate wear or a thermal fault in the tool would produce a repeating defect at the gate, which is what the inspection report describes; the rib is unexamined, not cleared."},{"id":"g_drift_gauge","from":"c_measure_drift","to":"c_measure_gauge","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The calibration lapse reported by inspection is the fact the inference rests on."},{"id":"g_moisture_lots","from":"c_materials_moisture","to":"c_measure_lots","relation":"supported_by","provenance":"derived","confidence":0.65,"rationale":"The missing lot records are why the moisture reading cannot be confirmed or ruled out from the existing data; the inference has to stand on the defect signature instead."}]},{"id":"tbpn","kind":"tbpn","title":"Chris Power of Hadrian: why the United States has no industrial base","summary":"Asked for the pitch for Hadrian, Chris Power states the effect in one sentence and then spends the next four hundred lines naming causes of it - aging machinists, 1950s plant, no domestic machine tools, CAM software that emits bad code, no public process data, offshoring and export control. All six ribs fill from one speaker.","source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-03-27_defense-tech-day-delian-asparouhov-dhruva-rajendra-steven-simoni-chris-power-aaron-slodov-aj-piplica-connor-love-cameron-mccord.md","date":"2025-03-27","episode_title":"defense-tech-day-reindustrialization-tariffs"},"why_this_episode":"Ishikawa needs one named bad outcome and several causes of it that are different in kind, not one cause chased down through five whys. Power names the effect flatly - there is no industrial base anymore - and then supplies a cause on every one of the six ribs, in the framework's home domain of manufacturing quality, with each cause concrete enough to quote.","idea_bearing_slot":"subcause","layout":{"mode":"plane","guides":[{"from":[-39,0],"to":[28,0],"style":"solid"},{"from":[-32,0],"to":[-48.65,37],"style":"solid"},{"from":[-21,0],"to":[-36.52,-34.5],"style":"solid"},{"from":[-10,0],"to":[-28.23,40.5],"style":"solid"},{"from":[1,0],"to":[-13.18,-31.5],"style":"solid"},{"from":[12,0],"to":[-8.03,44.5],"style":"solid"},{"from":[23,0],"to":[4.77,-40.5],"style":"solid"},{"from":[33,-7.6],"to":[51.75,-7.6],"style":"solid"},{"from":[51.75,-7.6],"to":[58,0],"style":"solid"},{"from":[58,0],"to":[51.75,7.6],"style":"solid"},{"from":[51.75,7.6],"to":[33,7.6],"style":"solid"},{"from":[33,7.6],"to":[33,-7.6],"style":"solid"}]},"nodes":[{"id":"effect","slot":"effect","label":"No US industrial base left","text":"The United States no longer has an industrial base: the plant and the people needed to make high-precision machined and cast parts at scale are gone.","provenance":"fact","source_quote":"So we really don't have an industrial base anymore.","source_ref":"Chris Power, L5254-L5256","entities":[],"pos":[43,0],"size":2.8},{"id":"cat_methods","slot":"category","label":"Methods","text":"Methods: the processes, software workflows and programming steps by which parts are made.","provenance":"schema","pos":[-32,0],"size":1.3},{"id":"cat_measurements","slot":"category","label":"Measurements","text":"Measurements: the instruments, records and data by which the process is known - including whether any record of it exists at all.","provenance":"schema","pos":[-21,0],"size":1.3},{"id":"cat_machines","slot":"category","label":"Machines","text":"Machines: the machine tools, plant and capital equipment the work runs on.","provenance":"schema","pos":[-10,0],"size":1.3},{"id":"cat_milieu","slot":"category","label":"Milieu","text":"Milieu: the surrounding environment - trade policy, export control, the decisions the country made about where things get made.","provenance":"schema","pos":[1,0],"size":1.3},{"id":"cat_materials","slot":"category","label":"Materials","text":"Materials: the physical inputs the system consumes - here the machine tools themselves, which a factory has to buy before it can make anything.","provenance":"schema","pos":[12,0],"size":1.3},{"id":"cat_manpower","slot":"category","label":"Manpower","text":"Manpower: the people, their skills, their training and who they will take direction from.","provenance":"schema","pos":[23,0],"size":1.3},{"id":"c_methods_cam","slot":"cause","label":"CAM tools emit bad machine code","text":"The digital manufacturing tools are hard to use, require an expert to drive, and generate poor assembly code for the machines to run.","provenance":"fact","source_quote":"all of those digital manufacturing tools, which are super hard to use and you need to be an expert, generate basically terrible assembly code that the machines run on","source_ref":"Chris Power, L5406-L5414","entities":["Hadrian"],"pos":[-35.83,8.5]},{"id":"sc_methods_nocursor","slot":"subcause","label":"No Cursor for CAM exists","text":"There is no AI assistant sitting on top of CAM programming the way Cursor sits on top of software code; Hadrian had to build that stack itself.","provenance":"fact","source_quote":"there's no cursor for cam that you're like on top of and just plugging in to speed things up","source_ref":"John Coogan, L5398-L5400","entities":["Cursor","Hadrian"],"pos":[-47.08,33.5]},{"id":"sc_methods_nofeedback","slot":"subcause","label":"Toolchain never sees its own output","text":"Nothing carries the result of a cut back to the program that produced it, so the code that comes out of CAM is never scored against the part that came out of the machine. The tools stay bad because nothing measures them.","provenance":"derived","confidence":0.55,"rationale":"Power states both halves separately: the tools emit terrible assembly code, and no process data from American manufacturing reaches any model. If no run data returns to the toolchain, there is no mechanism by which the code could have improved; the connection between the two statements is the reader's.","pos":[-41.23,20.5]},{"id":"c_measure_nodata","slot":"cause","label":"No public manufacturing corpus","text":"There is no Stack Overflow for manufacturing data, so no off-the-shelf model has ever been trained on how these parts are actually made.","provenance":"fact","source_quote":"There is no stack overflow for manufacturing data. So none of the off-the-shelf models actually have ever been trained on any of this.","source_ref":"Chris Power, L5426-L5428","entities":["Hadrian"],"pos":[-25.95,-11]},{"id":"sc_measure_corpus_moat","slot":"subcause","label":"The corpus only exists inside a factory","text":"The only labelled manufacturing data that exists is what a running factory records day by day, and that record stays inside the company that owns the factory. The public shortage is therefore structural: the data is not missing, it is private.","provenance":"derived","confidence":0.75,"rationale":"Power gives both halves in one passage: export control keeps the data off the internet, and his own models work only because his factory is the one creating a labelled data set daily. The general rule follows directly from the pair he states.","idea":"In any export-controlled or privacy-walled vertical - ITAR machining, clinical operations, utility field work - the defensible asset is the instrumented operation that generates a proprietary corpus, not a model fine-tuned on public text.","entities":["Hadrian"],"pos":[-34.95,-31]},{"id":"c_machines_old","slot":"cause","label":"Installed plant is 1950s to 1980s","text":"The capital equipment in naval facilities and in machine shops generally dates from somewhere between the 1950s and the 1980s.","provenance":"fact","source_quote":"a lot of the capital equipment in all of the naval facilities or, you know, everywhere in machine shops is, you know, somewhere between from the 1950s to the 1980s","source_ref":"Chris Power, L5580-L5584","entities":[],"pos":[-15.85,13]},{"id":"sc_machines_nocomputers","slot":"subcause","label":"No computers on the old machines","text":"That equipment cannot be automated at all, because most of it has no computer on it in the first place.","provenance":"fact","source_quote":"it's just impossible to automate it because often none of them have computers on them in the first place","source_ref":"Chris Power, L5584-L5586","entities":[],"pos":[-21.25,25]},{"id":"sc_machines_brownfield","slot":"subcause","label":"Nobody sells a retrofit for it","text":"Because the installed base has no controller to talk to, automation is sold only to new factories, and the existing plant is written off rather than upgraded - which is why it is still 1950s equipment.","provenance":"derived","confidence":0.6,"rationale":"Power's own conclusion from the old plant is that you have to build factories from scratch with new technology; he treats the installed base as impossible rather than as a market, which implies no retrofit path is on offer to the shops that own it.","idea":"A retrofit layer - sensing, motion capture and closed-loop control bolted onto machine tools that have no computer - would open the 1950s-to-1980s installed base that every automation vendor currently writes off as unreachable.","entities":[],"pos":[-26.65,37]},{"id":"c_milieu_itar","slot":"cause","label":"Export control keeps the data offline","text":"Because American manufacturing is largely export-controlled, none of its process data reaches the public internet. (The transcript renders ITAR as 'high tire'.)","provenance":"fact","source_quote":"because American manufacturing is largely regulated in high tire, there is no training data on the internet","source_ref":"Chris Power, L5418-L5420","entities":[],"pos":[-6.2,-16]},{"id":"c_milieu_offshore","slot":"cause","label":"Offshored the base to China, 70s-90s","text":"From the 1970s through the 1990s the country de-industrialised deliberately and handed its industrial power to China.","provenance":"fact","source_quote":"we de-industrialize the country from the 70s through the 90s and gave all our industrial power to China","source_ref":"Chris Power, L5250-L5252","entities":[],"pos":[-11.6,-28]},{"id":"c_materials_nocnc","slot":"cause","label":"US no longer makes CNC machines","text":"The Air Force invented the CNC machine and the United States no longer manufactures CNC machines at all.","provenance":"fact","source_quote":"we invented, Air Force invented CNC machine, and we no longer make CNC machines in the US","source_ref":"Chris Power, L5612-L5616","entities":[],"pos":[8.18,8.5]},{"id":"sc_materials_china","slot":"subcause","label":"Chinese machine tools carry spyware","text":"China is the largest machine-tool market, but its machines are not bought because of spyware, which leaves Germany, South Korea and Japan as the only sources.","provenance":"fact","source_quote":"the main manufacturing markets where we buy from is China's number one. We don't buy for them because they got spyware all over this stuff","source_ref":"Chris Power, L5620-L5624","entities":["Haas"],"pos":[3.45,19]},{"id":"sc_materials_conflict","slot":"subcause","label":"A conflict would cut off the capex","text":"If a conflict starts, the country may not be able to buy the capital equipment to fill its factories, because it does not make that equipment itself.","provenance":"fact","source_quote":"can we even buy the amount of capital equipment to put in the factories because we don't produce that capital equipment in the US anymore","source_ref":"Chris Power, L5632-L5634","entities":[],"pos":[-1.5,30]},{"id":"sc_materials_nomaker","slot":"subcause","label":"No one is rebuilding machine tools","text":"Nobody has restarted domestic machine-tool manufacturing, so the gap is not closing on its own; the working answer on offer is to buy faster from allied partners, which keeps the dependency in place.","provenance":"derived","confidence":0.6,"rationale":"Power names the absence, calls it a very hard question the country has to answer, and then describes his own response as growing fast and buying all the capital expenditure from allied partners. Treating the supply itself as fixed, rather than as something to rebuild, is the reader's inference from that workaround.","idea":"A domestic machine-tool builder, or a financing vehicle that pre-buys allied capital equipment and leases it into US factories, sits upstream of every re-industrialisation plan and is not being built.","entities":["Hadrian"],"pos":[-6.45,41]},{"id":"c_manpower_aging","slot":"cause","label":"Skilled machinists aging out","text":"The people who do high-precision machining and castings are retiring, and no comparable cohort is coming up behind them.","provenance":"fact","source_quote":"the incredibly skilled workforce that does incredible technical things in high-precision machining or castings are all aging out","source_ref":"Chris Power, L5252-L5256","entities":[],"pos":[18.05,-11]},{"id":"c_manpower_mba","slot":"cause","label":"Machinists will not follow an MBA","text":"A master machinist or welder will not take direction from an outside manager in a suit with a Harvard MBA, which is why buying up existing shops and running them from the top does not work.","provenance":"fact","source_quote":"no master machinist or welder is going to respect a kid who's got a suit and a Harvard MBA on coming and telling him what to do","source_ref":"Chris Power, L5532-L5536","entities":[],"pos":[12.2,-24]},{"id":"c_manpower_loop","slot":"cause","label":"The skills gap is self-reinforcing","text":"Offshoring removed the factories in which machinists were trained, so the cohort that would have replaced the retiring one was never made. The missing base and the missing workforce now each keep the other missing.","provenance":"derived","confidence":0.6,"rationale":"Power states both facts in adjacent clauses - the country gave its industrial power away from the 70s to the 90s, and the skilled cohort is now aging out - but asserts only that they happened, not that each sustains the other. The circularity is the reader's addition and it is what makes the effect stable rather than merely bad.","entities":[],"pos":[6.35,-37]}],"edges":[{"id":"sp_methods","from":"cat_methods","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"sp_measurements","from":"cat_measurements","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"sp_machines","from":"cat_machines","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"sp_milieu","from":"cat_milieu","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"sp_materials","from":"cat_materials","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"sp_manpower","from":"cat_manpower","to":"effect","relation":"contributes_to","provenance":"schema"},{"id":"b_methods_cam","from":"c_methods_cam","to":"cat_methods","relation":"belongs_to","provenance":"schema"},{"id":"b_measure_nodata","from":"c_measure_nodata","to":"cat_measurements","relation":"belongs_to","provenance":"schema"},{"id":"b_machines_old","from":"c_machines_old","to":"cat_machines","relation":"belongs_to","provenance":"schema"},{"id":"b_milieu_itar","from":"c_milieu_itar","to":"cat_milieu","relation":"belongs_to","provenance":"schema"},{"id":"b_milieu_offshore","from":"c_milieu_offshore","to":"cat_milieu","relation":"belongs_to","provenance":"schema"},{"id":"b_materials_nocnc","from":"c_materials_nocnc","to":"cat_materials","relation":"belongs_to","provenance":"schema"},{"id":"b_manpower_aging","from":"c_manpower_aging","to":"cat_manpower","relation":"belongs_to","provenance":"schema"},{"id":"b_manpower_mba","from":"c_manpower_mba","to":"cat_manpower","relation":"belongs_to","provenance":"schema"},{"id":"b_manpower_loop","from":"c_manpower_loop","to":"cat_manpower","relation":"belongs_to","provenance":"schema"},{"id":"f_aging_effect","from":"c_manpower_aging","to":"effect","relation":"contributes_to","provenance":"fact","source_quote":"castings are all aging out. So we really don't have an industrial base anymore.","source_ref":"Chris Power, L5254-L5256"},{"id":"f_offshore_aging","from":"c_milieu_offshore","to":"c_manpower_aging","relation":"contributes_to","provenance":"fact","source_quote":"we de-industrialize the country from the 70s through the 90s and gave all our industrial power to China. And now the incredibly skilled workforce that does incredible technical things in high-precision machining or castings are all aging out","source_ref":"Chris Power, L5250-L5256"},{"id":"f_itar_nodata","from":"c_milieu_itar","to":"c_measure_nodata","relation":"contributes_to","provenance":"fact","source_quote":"because American manufacturing is largely regulated in high tire, there is no training data on the internet","source_ref":"Chris Power, L5418-L5420"},{"id":"f_nocomputers_old","from":"sc_machines_nocomputers","to":"c_machines_old","relation":"contributes_to","provenance":"fact","source_quote":"somewhere between from the 1950s to the 1980s. And it's just impossible to automate it because often none of them have computers on them in the first place","source_ref":"Chris Power, L5582-L5586"},{"id":"f_conflict_nocnc","from":"sc_materials_conflict","to":"c_materials_nocnc","relation":"contributes_to","provenance":"fact","source_quote":"if the balloon goes up with the conflict you know can we even buy the amount of capital equipment to put in the factories because we don't produce that capital equipment in the US anymore","source_ref":"Chris Power, L5630-L5634"},{"id":"d_nocursor_cam","from":"sc_methods_nocursor","to":"c_methods_cam","relation":"contributes_to","provenance":"derived","confidence":0.75,"rationale":"The host names the missing assistant and Power answers with the main reason the tools are bad. The link is stated across two speakers' turns rather than inside one, so it is a reading rather than a quotation."},{"id":"d_nofeedback_cam","from":"sc_methods_nofeedback","to":"c_methods_cam","relation":"contributes_to","provenance":"derived","confidence":0.55,"rationale":"A toolchain with no return path from the machine to the program cannot improve its own output; this explains persistence rather than origin."},{"id":"d_corpus_nodata","from":"sc_measure_corpus_moat","to":"c_measure_nodata","relation":"contributes_to","provenance":"derived","confidence":0.7,"rationale":"If the only corpus is generated privately inside working factories, the public absence is a consequence of where the data is made, not an accident of collection."},{"id":"d_brownfield_old","from":"sc_machines_brownfield","to":"c_machines_old","relation":"contributes_to","provenance":"derived","confidence":0.6,"rationale":"Plant stays at 1950s vintage partly because no supplier offers an upgrade path for it; the absence of a retrofit market is a cause of the age, not only a consequence."},{"id":"d_china_nocnc","from":"sc_materials_china","to":"c_materials_nocnc","relation":"contributes_to","provenance":"derived","confidence":0.8,"rationale":"Power lists the security exclusion of Chinese machines immediately after stating that the US makes none, inside one answer about where machine tools come from; the two are adjacent in the same argument but he never states the connective."},{"id":"d_nomaker_nocnc","from":"sc_materials_nomaker","to":"c_materials_nocnc","relation":"contributes_to","provenance":"derived","confidence":0.6,"rationale":"The absence persists because no one is rebuilding the capability; the workaround Power describes routes around the gap instead of closing it."},{"id":"d_loop_effect","from":"c_manpower_loop","to":"effect","relation":"contributes_to","provenance":"derived","confidence":0.6,"rationale":"A self-reinforcing loop is what turns a historical decision into a standing condition, which is why the effect is stated in the present tense."},{"id":"g_loop_offshore","from":"c_manpower_loop","to":"c_milieu_offshore","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"One half of the loop is quoted: the country gave its industrial power away."},{"id":"g_loop_aging","from":"c_manpower_loop","to":"c_manpower_aging","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The other half is quoted: the skilled cohort is aging out with nobody behind it."},{"id":"g_brownfield_nocomputers","from":"sc_machines_brownfield","to":"sc_machines_nocomputers","relation":"supported_by","provenance":"derived","confidence":0.75,"rationale":"The absence of a controller is the stated fact that makes retrofit hard and therefore unsold."},{"id":"g_corpus_itar","from":"sc_measure_corpus_moat","to":"c_milieu_itar","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"Export control is the stated reason the data cannot leave the companies that make it."},{"id":"g_nofeedback_nodata","from":"sc_methods_nofeedback","to":"c_measure_nodata","relation":"supported_by","provenance":"derived","confidence":0.6,"rationale":"The stated absence of any process corpus is the evidence that no measurement loop closes anywhere in the toolchain."},{"id":"g_nomaker_conflict","from":"sc_materials_nomaker","to":"sc_materials_conflict","relation":"supported_by","provenance":"derived","confidence":0.65,"rationale":"The conflict scenario Power raises is the stated cost of leaving the supply gap open."}]}]}</script>

<script>
/* Ishikawa. The engine draws the nodes, the edges and the layout guides; three things it cannot
   express are exactly the things that make a fishbone read as a fishbone:
     1. Bones. `belongs_to` and the category->effect edges are schema-provenance, so the engine
        draws them in hairline (correctly: they are scaffolding, not evidence). A fishbone whose
        bones are the faintest thing on screen is not a fishbone, so the spine and the six ribs
        are redrawn here as grey bars over their guides - grey, because bones are scaffolding and
        grey is the engine's colour for that.
     2. A head to point at. Schema edges carry no arrowhead, so nothing terminates the spine.
        The head outline, its faint fill and the arrow into it are drawn here.
     3. Label clearance. The engine parks every label one mesh-radius below its node, which is
        right for a sphere and wrong for a wireframe halo (r*1.35), a diamond (r*1.25) or the
        gold idea ring (r*1.71) - the label lands on top of its own node. Each label is moved to
        the outward side of its bone by its node's real drawn extent.
   All geometry is read from layout.guides / node positions, so moving a node in graph.json moves
   its bone with it. */
window.__frameworkExtension = (ctx) => {
  const { THREE, group, example, nodesById, api } = ctx;
  const EFFECT = ctx.graph.slots.find(s => s.id === 'effect')?.color || '#d95926';
  const BONE = '#7c7a73';           // spine / ribs: the grey of the framework's own scaffolding
  const eq = (a, b) => Math.abs(a - b) < 0.01;

  // ---- 1. read the skeleton off the guides -------------------------------------------------
  const catX = new Set();
  for (const rec of nodesById.values()) if (rec.node.slot === 'category') catX.add(rec.obj.position.x);
  const cats = [...catX];
  const spine = [], ribs = [], head = [];
  for (const g of (example.layout?.guides || [])) {
    const [ax, ay] = g.from, [bx, by] = g.to;
    if (eq(ay, 0) && eq(by, 0)) spine.push([ax, ay, bx, by]);
    else if (eq(ay, 0) && cats.some(x => eq(x, ax))) ribs.push([ax, ay, bx, by]);   // junction first
    else if (eq(by, 0) && cats.some(x => eq(x, bx))) ribs.push([bx, by, ax, ay]);
    else head.push([ax, ay, bx, by]);
  }

    if (ax) {
      const y = ymin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xmin, y, z), new THREE.Vector3(xmax, y, z)]), lineMat));
      const lab = label2d(ax.label, 'axlabel'); lab.position.set((xmin + xmax) / 2, y - 4.5, z); group.add(lab);
      for (const t of (ax.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(t.value, y - 1, z), new THREE.Vector3(t.value, y + 1, z)]), lineMat)); const tl = label2d(t.label, 'tick'); tl.position.set(t.value, y - 2.2, z); group.add(tl); }
      bbox.expandByPoint(new THREE.Vector3(xmin, y - 6, 0)); bbox.expandByPoint(new THREE.Vector3(xmax, y, 0));
    }
    if (ay) {
      const x = xmin - pad;
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, ymin, z), new THREE.Vector3(x, ymax, z)]), lineMat));
      const lab = label2d(ay.label, 'axlabel'); lab.element.style.transform = 'rotate(-90deg)'; lab.position.set(x - 5, (ymin + ymax) / 2, z); group.add(lab);
      for (const t of (ay.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x - 1, t.value, z), new THREE.Vector3(x + 1, t.value, z)]), lineMat)); const tl = label2d(t.label, 'tick'); tl.position.set(x - 2.5, t.value, z); tl.element.style.transform = 'translateX(-50%)'; group.add(tl); }
      bbox.expandByPoint(new THREE.Vector3(x - 8, ymin, 0)); bbox.expandByPoint(new THREE.Vector3(x, ymax, 0));
    }
  }
}

// ---------- build an example ----------
function clearGroup() {
  if (!state.group) return;
  state.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); } if (o.isCSS2DObject && o.element) o.element.remove(); });
  scene.remove(state.group);
  $('labels').replaceChildren();
  state.group = null; state.nodes.clear(); state.edges = []; state.hit = []; state.hover = null; state.selected = null;
  $('panel').hidden = true;
}

function buildExample(i) {
  clearGroup();
  state.exampleIndex = i;
  const ex = GRAPH.examples[i];
  const group = new THREE.Group(); scene.add(group); state.group = group;
  const positions = computeLayout(ex);
  // centre
  const bbox = new THREE.Box3();
  for (const p of positions.values()) bbox.expandByPoint(p);
  const centre = bbox.getCenter(new THREE.Vector3());
  if (ex.layout?.mode !== 'plane') for (const p of positions.values()) p.sub(centre);
  const bbox2 = new THREE.Box3(); for (const p of positions.values()) bbox2.expandByPoint(p);
  for (const n of ex.nodes) { const rec = makeNode(n, positions.get(n.id)); state.nodes.set(n.id, rec); group.add(rec.obj); state.hit.push(rec.hit); }
  for (const e of ex.edges) {
    const A = state.nodes.get(e.from), B = state.nodes.get(e.to); if (!A || !B) continue;
    const rec = makeEdge(e, A, B); state.edges.push(rec); group.add(rec.grp); A.edges.push(rec); B.edges.push(rec);
  }
  drawDecor(ex, group, bbox2);
  // camera fit
  const size = bbox2.getSize(new THREE.Vector3()), c = bbox2.getCenter(new THREE.Vector3());
  state.fit = { size, centre: c, mode: ex.layout?.mode || 'force', distance: ex.layout?.camera?.distance };
  renderNote(ex);
  renderLegend(ex);    // legend first, so the camera fit can measure it
  resetView();
  applyVisibility();
  for (const b of $('examples').children) b.setAttribute('aria-pressed', String(b.dataset.index == i));
  try { window.__frameworkExtension?.({ THREE, scene, group, graph: GRAPH, example: ex, nodesById: state.nodes, positions, api: { slotStyle, label2d, colors: { INK, INK2, MUTED, HAIRLINE, SURFACE, SLOT_COLORS, SCHEMA_COLOR } } }); } catch (e) { console.error('framework extension failed', e); }
}

// Fit the graph into the part of the stage not covered by the legend (left) or the open panel (right),
// so labels are not hidden under the cards at the default view.
function safeArea(size) {
  const W = stage.clientWidth, H = stage.clientHeight;
  const sr = stage.getBoundingClientRect();
  let left = 0, top = 0, right = 0;
  const wide = W > 820;
  const leg = $('legend'); if (wide && leg && leg.offsetParent !== null) { const r = leg.getBoundingClientRect(); left = Math.max(left, r.right - sr.left + 16); }
  const panel = $('panel'); if (wide && panel && !panel.hidden) { const r = panel.getBoundingClientRect(); right = Math.max(right, sr.right - r.left + 16); }
  return { W, H, left, top, right, w: Math.max(200, W - left - right), h: Math.max(200, H - top) };
}
function resetView() {
  if (!state.fit) return;
  const { size, centre, mode } = state.fit;
  const sa = safeArea(size);
  const halfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const bottomPad = 30;                       // px: labels hang below the lowest row of nodes
  const availH = Math.max(150, sa.h - bottomPad);
  // distance at which the graph (plus margins) fits the safe area: the vertical FOV spans sa.H pixels
  const fitH = (size.y / 2 + 8) * sa.H / (halfFov * availH);
  const sidePad = 110;                       // px: labels are centred under nodes and stick out sideways
  const fitW = (size.x / 2 + 6) * sa.H / (halfFov * Math.max(200, sa.w - 2 * sidePad));
  const dist = state.fit.distance || Math.max(50, Math.max(fitH, fitW) * (mode === 'force' ? 1.3 : 1.08) + size.z / 2);
  // world units per pixel at the target depth; shift the centre so the graph sits in the safe area
  const wpp = (2 * dist * halfFov) / sa.H;
  const target = centre.clone().add(new THREE.Vector3(-((sa.left - sa.right) / 2) * wpp, ((sa.top - bottomPad) / 2) * wpp, 0));
  const camPos = mode === 'force' ? target.clone().add(new THREE.Vector3(dist * 0.3, dist * 0.22, dist * 0.92)) : target.clone().add(new THREE.Vector3(0, 0, dist));
  camera.position.copy(camPos); controls.target.copy(target);
  camera.near = 0.1; camera.far = 5000; camera.updateProjectionMatrix(); controls.update();
}

function applyVisibility() {
  for (const rec of state.nodes.values()) {
    const vis = rec.node.provenance !== 'derived' || state.showDerived;
    rec.obj.visible = vis;
    rec.label.visible = vis && state.showLabels;
    rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  for (const rec of state.edges) {
    const endsOk = rec.A.obj.visible && rec.B.obj.visible;
    // a derived edge is reasoning too: it goes away with the derived nodes, even when both its ends are facts
    const vis = endsOk && (!rec.grounding || state.showGrounding) && (rec.edge.provenance !== 'derived' || state.showDerived);
    rec.grp.visible = vis;
    if (rec.label) rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  renderStats();
}

// ---------- legend / note / stats ----------
function renderLegend(ex) {
  const el = $('legend'); el.replaceChildren();
  const h = (t) => { const x = document.createElement('h2'); x.textContent = t; return x; };
  el.appendChild(h('Slots'));
  const counts = new Map(); for (const n of ex.nodes) counts.set(n.slot, (counts.get(n.slot) || 0) + 1);
  for (const s of GRAPH.slots) {
    const row = document.createElement('div'); row.className = 'slot-row';
    const chip = document.createElement('span'); const stl = slotStyle.get(s.id);
    chip.className = 'chip' + (stl.shape && stl.shape !== 'sphere' ? ' ' + stl.shape : ''); chip.style.background = stl.color;
    if (s.structural) chip.style.borderRadius = '2px';
    const name = document.createElement('span'); name.textContent = s.label;
    const tp = document.createElement('span'); tp.className = 'tp'; tp.textContent = s.structural ? 'schema' : (s.typical_provenance || '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = String(counts.get(s.id) || 0);
    row.append(chip, name, tp, n); row.title = s.description || ''; el.appendChild(row);
  }
  el.appendChild(h('Provenance'));
  const ideaCount = ex.nodes.filter(n => n.idea).length;
  const keys = [['●', 'fact: stated in the source (solid)'], ['◌', 'derived: LLM inference (translucent, dashed)'], ['▪', 'schema: framework scaffolding (grey)'], ['→', 'solid edge stated, dashed inferred'], ['⋯', 'grounding link: derived → fact']];
  if (ideaCount) keys.push(['★', 'gold ring: an opportunity this framework surfaces']);
  for (const [sym, txt] of keys) {
    const row = document.createElement('div'); row.className = 'key-row';
    const a = document.createElement('span'); a.className = 'sym'; a.textContent = sym; if (sym === '★') a.style.color = IDEA;
    const b = document.createElement('span'); b.textContent = txt; row.append(a, b); el.appendChild(row);
  }
  const st = document.createElement('div'); st.className = 'stats'; st.id = 'stats'; el.appendChild(st);
  renderStats();
}
function renderStats() {
  const st = $('stats'); if (!st) return;
  const ex = GRAPH.examples[state.exampleIndex];
  const nf = ex.nodes.filter(n => n.provenance === 'fact').length, nd = ex.nodes.filter(n => n.provenance === 'derived').length, ns = ex.nodes.filter(n => n.provenance === 'schema').length;
  const ef = ex.edges.filter(e => e.provenance === 'fact').length, ed = ex.edges.filter(e => e.provenance === 'derived' && e.relation !== 'supported_by').length, eg = ex.edges.filter(e => e.relation === 'supported_by').length;
  const visN = [...state.nodes.values()].filter(r => r.obj.visible).length, visE = state.edges.filter(r => r.grp.visible).length;
  st.replaceChildren();
  const line = (html) => { const d = document.createElement('div'); d.append(...html); st.appendChild(d); };
  const b = (t) => { const x = document.createElement('b'); x.textContent = t; return x; };
  line(['nodes ', b(String(nf)), ' fact · ', b(String(nd)), ' derived', ns ? ` · ${ns} schema` : '']);
  line(['edges ', b(String(ef)), ' fact · ', b(String(ed)), ' derived · ', b(String(eg)), ' grounding']);
  line([`showing ${visN} nodes, ${visE} edges`]);
}
function renderNote(ex) {
  const el = $('note'); el.replaceChildren();
  const h = document.createElement('h3'); h.textContent = ex.title || ex.id; el.appendChild(h);
  const p = document.createElement('p'); p.textContent = ex.summary || ''; el.appendChild(p);
  const s = document.createElement('div'); s.className = 'src';
  if (ex.source?.type === 'transcript') s.textContent = `TBPN ${ex.source.date} · ${ex.source.episode_title || ''}`;
  else if (ex.source?.type === 'text') s.textContent = `source: ${ex.source.title || 'scenario text'}`;
  el.appendChild(s);
}

// ---------- panel ----------
function openPanel(rec) {
  const n = rec.node, ex = GRAPH.examples[state.exampleIndex];
  const panel = $('panel'); panel.replaceChildren(); panel.hidden = false;
  const head = document.createElement('div'); head.className = 'p-head';
  const slotEl = document.createElement('div'); slotEl.className = 'p-slot';
  const chip = document.createElement('span'); chip.className = 'chip'; chip.style.background = rec.color; slotEl.append(chip, document.createTextNode((slotStyle.get(n.slot)?.slot?.label) || n.slot));
  const close = document.createElement('button'); close.className = 'close'; close.type = 'button'; close.textContent = '×'; close.setAttribute('aria-label', 'Close'); close.onclick = () => { panel.hidden = true; state.selected = null; };
  head.append(slotEl, close); panel.appendChild(head);
  const h3 = document.createElement('h3'); h3.textContent = n.label; panel.appendChild(h3);
  const badge = document.createElement('span'); badge.className = 'badge ' + n.provenance; badge.textContent = n.provenance; panel.appendChild(badge);
  const text = document.createElement('p'); text.textContent = n.text; panel.appendChild(text);
  const h4 = (t) => { const x = document.createElement('h4'); x.textContent = t; panel.appendChild(x); };
  if (n.provenance === 'fact') {
    h4(n.paraphrase ? 'Paraphrased from the source' : 'Quoted from the source');
    const q = document.createElement('blockquote'); q.textContent = n.source_quote || ''; panel.appendChild(q);
    const r = document.createElement('div'); r.className = 'ref'; r.textContent = n.source_ref || ''; panel.appendChild(r);
  } else if (n.provenance === 'derived') {
    h4('Confidence');
    const c = document.createElement('div'); c.className = 'conf'; c.textContent = `${Math.round((n.confidence || 0) * 100)} / 100`; panel.appendChild(c);
    const bar = document.createElement('div'); bar.className = 'confbar'; const fillEl = document.createElement('i'); fillEl.style.width = `${Math.round((n.confidence || 0) * 100)}%`; bar.appendChild(fillEl); panel.appendChild(bar);
    h4('Why the LLM infers this'); const r = document.createElement('p'); r.textContent = n.rationale || ''; panel.appendChild(r);
    if (n.idea) { h4('Opportunity this points to'); const ip = document.createElement('p'); ip.className = 'idea'; ip.textContent = n.idea; panel.appendChild(ip); }
    const sup = ex.edges.filter(e => e.relation === 'supported_by' && e.from === n.id).map(e => state.nodes.get(e.to)).filter(Boolean);
    if (sup.length) { h4('Supported by'); const ul = document.createElement('ul'); for (const s of sup) { const li = document.createElement('li'); li.textContent = s.node.label; const q = document.createElement('div'); q.className = 'ref'; q.textContent = (s.node.source_quote || '').slice(0, 140); li.appendChild(q); ul.appendChild(li); } panel.appendChild(ul); }
  } else {
    const r = document.createElement('p'); r.className = 'ref'; r.textContent = 'Framework scaffolding: neither a fact nor an inference.'; panel.appendChild(r);
  }
  const rels = rec.edges.filter(e => e.edge.relation !== 'supported_by');
  if (rels.length) {
    h4('Edges'); const ul = document.createElement('ul');
    for (const e of rels) { const li = document.createElement('li'); const out = e.edge.from === n.id; const other = out ? e.B.node : e.A.node; const rl = document.createElement('span'); rl.className = 'rel'; rl.textContent = (out ? '→ ' : '← ') + (relLabel.get(e.edge.relation) || e.edge.relation) + (e.edge.provenance === 'derived' ? ' (inferred)' : '') + ' '; li.append(rl, document.createTextNode(other.label)); ul.appendChild(li); }
    panel.appendChild(ul);
  }
  if (Array.isArray(n.entities) && n.entities.length) { h4('Entities'); const p = document.createElement('p'); p.className = 'ref'; p.textContent = n.entities.join(', '); panel.appendChild(p); }
}

// ---------- interaction ----------
const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2(); const tooltip = $('tooltip');
function setHover(rec) {
  if (state.hover === rec) return;
  if (state.hover) { const h = state.hover; h.mesh.scale.setScalar(1); if (h.mesh.material.emissive) h.mesh.material.emissive.setHex(0x000000); for (const e of h.edges) { e.line.material.color.set(e.grounding ? MUTED : (e.edge.provenance === 'schema' ? HAIRLINE : INK2)); if (e.arrow) e.arrow.material.color.set(INK2); } }
  state.hover = rec;
  if (rec) { rec.mesh.scale.setScalar(1.18); if (rec.mesh.material.emissive) rec.mesh.material.emissive.set(rec.color).multiplyScalar(0.35); for (const e of rec.edges) { if (!e.grp.visible) continue; e.line.material.color.set(INK); if (e.arrow) e.arrow.material.color.set(INK); } }
  renderer.domElement.style.cursor = rec ? 'pointer' : '';
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(state.hit.filter(h => h.parent.visible), false);
  const rec = hits.length ? state.nodes.get(hits[0].object.userData.nodeId) : null;
  setHover(rec);
  if (rec) {
    tooltip.replaceChildren();
    const a = document.createElement('div'); a.className = 't-label'; a.textContent = rec.node.label;
    const b = document.createElement('div'); b.className = 't-meta'; b.textContent = `${(slotStyle.get(rec.node.slot)?.slot?.label) || rec.node.slot} · ${rec.node.provenance}${rec.node.provenance === 'derived' ? ' ' + Math.round((rec.node.confidence || 0) * 100) + '%' : ''}`;
    const c = document.createElement('div'); c.textContent = rec.node.text.length > 160 ? rec.node.text.slice(0, 157) + '…' : rec.node.text;
    tooltip.append(a, b, c);
    tooltip.style.display = 'block';
    const mx = ev.clientX - r.left + 14, my = ev.clientY - r.top + 14;
    tooltip.style.left = Math.min(mx, r.width - 320) + 'px'; tooltip.style.top = Math.min(my, r.height - 120) + 'px';
  } else tooltip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => { setHover(null); tooltip.style.display = 'none'; });
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  if (state.hover) { state.selected = state.hover; openPanel(state.hover); } else { $('panel').hidden = true; state.selected = null; }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
  if (ev.key === 'd') { $('t-derived').checked = !$('t-derived').checked; $('t-derived').dispatchEvent(new Event('change')); }
  if (ev.key === 'g') { $('t-grounding').checked = !$('t-grounding').checked; $('t-grounding').dispatchEvent(new Event('change')); }
  if (ev.key === 'r') resetView();
  if (ev.key === 'Escape') { $('panel').hidden = true; state.selected = null; }
});
$('t-derived').addEventListener('change', (e) => { state.showDerived = e.target.checked; applyVisibility(); });
$('t-grounding').addEventListener('change', (e) => { state.showGrounding = e.target.checked; applyVisibility(); });
$('t-labels').addEventListener('change', (e) => { state.showLabels = e.target.checked; applyVisibility(); });
$('t-rotate').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
$('reset').addEventListener('click', resetView);

// example selector
const seg = $('examples');
const kindCount = new Map(); for (const ex of GRAPH.examples) kindCount.set(ex.kind, (kindCount.get(ex.kind) || 0) + 1);
GRAPH.examples.forEach((ex, i) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.index = i; b.textContent = kindCount.get(ex.kind) > 1 ? (ex.title || ex.id) : ex.kind === 'tbpn' ? 'From TBPN' : ex.kind === 'classic' ? 'Classic' : (ex.title || ex.id); b.title = ex.title || ''; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => buildExample(i)); seg.appendChild(b); });

// ---------- go ----------
// URL parameters set the initial state (deep links, scripted screenshots): ?example=1&derived=0&grounding=1&labels=0&rotate=1
const q = new URLSearchParams(location.search);
const flag = (k, def) => q.has(k) ? !['0', 'false', 'off', 'no'].includes(q.get(k).toLowerCase()) : def;
state.showDerived = flag('derived', true); $('t-derived').checked = state.showDerived;
state.showGrounding = flag('grounding', false); $('t-grounding').checked = state.showGrounding;
state.showLabels = flag('labels', true); $('t-labels').checked = state.showLabels;
controls.autoRotate = flag('rotate', false); $('t-rotate').checked = controls.autoRotate;
let startIndex = parseInt(q.get('example') || '0', 10);
if (!(startIndex >= 0 && startIndex < GRAPH.examples.length)) startIndex = Math.max(0, GRAPH.examples.findIndex(x => x.id === q.get('example')));
resize();
buildExample(startIndex);
$('fallback').hidden = true; window.__engineReady = true;
function loop() {
  requestAnimationFrame(loop);
  controls.update();
  for (const rec of state.nodes.values()) for (const c of rec.obj.children) if (c.userData.isIdeaRing) c.quaternion.copy(camera.quaternion);
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
}
loop();
</script>
