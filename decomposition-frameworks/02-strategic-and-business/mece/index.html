<!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel .lab { display: inline-block; transform: translateY(11px); background: rgba(26,26,25,.72); padding: 0 4px; border-radius: 3px; }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"framework":{"slug":"mece","name":"MECE Principle","category":"02-strategic-and-business","wikipedia":"https://en.wikipedia.org/wiki/MECE_principle","one_liner":"Cuts a whole into branches on one dimension so that nothing overlaps and nothing is left out; the branch that comes back empty is the underserved market."},"slots":[{"id":"whole","label":"Whole","description":"The thing being partitioned: a market, a spend, a problem, a population. Its size is what the branches must add up to.","typical_provenance":"either","color":"#9085e9","shape":"sphere"},{"id":"cut","label":"Cut","description":"The single dimension the whole is cut on. Choosing it is the whole of MECE: one cut gives exclusive branches, two cuts at once give overlaps.","typical_provenance":"derived","color":"#c98500","shape":"cone"},{"id":"bucket","label":"Bucket","description":"A branch of the partition. Usually the analyst's construction rather than the source's, even when the source names the members.","typical_provenance":"derived","color":"#3987e5","shape":"box"},{"id":"item","label":"Item","description":"An observed member placed in a bucket: a company, a ledger line, a customer type. This is where the source's own words live.","typical_provenance":"fact","color":"#199e70","shape":"sphere"},{"id":"gap","label":"Gap","description":"A branch the data leaves empty or thin: no member, or no member that counts. The candidate blind spot, and in a market the candidate underserved space.","typical_provenance":"derived","color":"#d55181","shape":"box"},{"id":"overlap","label":"Overlap","description":"An item or a branch that lands in two buckets at once. Always a symptom of two dimensions mixed into one cut.","typical_provenance":"derived","color":"#d95926","shape":"diamond"}],"relations":[{"id":"cut_by","label":"cut by","description":"the whole, or a branch of it, is cut by one partitioning dimension"},{"id":"partitions","label":"partitions into","description":"the whole, under the chosen cut, partitions into buckets"},{"id":"contains","label":"contains","description":"bucket contains item"},{"id":"missing_from","label":"missing from","description":"what the partition does not hold: an unopened branch of the cut, an absent member of a bucket, or a share of the whole that no branch accounts for"},{"id":"violates","label":"violates","description":"an overlap violates exclusivity between buckets, or the cut that was supposed to keep them apart"}],"examples":[{"id":"classic","kind":"classic","title":"Where did every case go? A drinks company's volume, cut one way","summary":"A ledger of last year's case volume is read out in a meeting. The lines are facts; the channel partition, the double-counted wholesaler and the branch nobody has ever opened are the analysis.","source":{"type":"text","title":"Minutes of a strategy meeting at a bottled-drinks company","text":"Minutes of a Monday strategy meeting at a mid-size bottled-drinks company. The finance director reads last year's volume from the ledger: the company shipped 4.1 million cases in total, down from 4.6 million the year before. Supermarket chains took 1.7 million cases and convenience stores took 0.9 million. The company's own website shipped 0.2 million cases direct to consumers, and vending operators took 0.3 million. The sales director adds that a further 0.4 million cases went to a German wholesaler, and that nobody is sure whether those cases ended up in shops or in restaurants, because the wholesaler is booked by country and not by channel. The finance director notes that the ledger's lines do not add up to the total and asks what the remaining cases were; nobody in the room can say. The head of marketing observes that the company has no salesperson who calls on restaurants, canteens or hotels, and that the ledger has never had a line for them. The CEO closes the meeting by asking for one picture of where every case goes, cut one way only, before the board meets.","attribution":"A written-out version of the standard MECE teaching case: a volume or cost base whose reported lines neither add up nor stay apart. The test is Barbara Minto's."},"layout":{"mode":"plane","regions":[{"label":"Counted by the ledger","x":[-70,25],"y":[-40,11],"color":"#3987e5"},{"label":"Left out","x":[29,62],"y":[-40,50],"color":"#d55181"},{"label":"Not on this cut","x":[-70,25],"y":[-52,-41],"color":"#d95926"}],"guides":[{"from":[-64,2],"to":[25,2],"style":"solid"},{"from":[25,2],"to":[54,2],"style":"dashed"}]},"nodes":[{"id":"c_whole","slot":"whole","label":"4.1m cases shipped last year","text":"The whole to be partitioned is last year's shipped volume: 4.1 million cases in total, down from 4.6 million the year before.","provenance":"fact","source_quote":"the company shipped 4.1 million cases in total","source_ref":"finance director, sentence 2","level":0,"pos":[-8,46],"size":2},{"id":"c_cut_rule","slot":"cut","label":"One picture, cut one way only","text":"The CEO asks for one picture of where every case goes, cut one way only. That is the MECE instruction, and it is all the source gives: the rule, not the dimension.","provenance":"fact","source_quote":"asking for one picture of where every case goes, cut one way only","source_ref":"CEO, sentence 8","level":1,"pos":[-8,32],"size":1.15},{"id":"c_cut","slot":"cut","label":"Cut by channel","text":"The dimension chosen is channel: where the case is sold, not who bought it, not which country it went to. Every branch below is a channel and nothing else.","provenance":"derived","confidence":0.85,"rationale":"The CEO demands one cut but never says which. Channel is the dimension four of the five ledger lines already follow (supermarkets, convenience, own website, vending), so it is the cut that costs the least re-coding, and it is the cut that makes the German line's ambiguity visible instead of hiding it inside a geography branch.","level":1,"pos":[-8,18],"size":1.15},{"id":"c_b_grocery","slot":"bucket","label":"Grocery retail","text":"Off-trade grocery: cases sold through shops a household buys from, whether a supermarket chain or a convenience store.","provenance":"derived","confidence":0.85,"rationale":"The ledger keeps supermarkets and convenience stores as two lines. Merging them into one branch is the analyst's move; it is justified because both sell the same pack to the same drinker through the same route to market, and separating them would cut on account size, which is a second dimension.","level":2,"pos":[-58,2],"size":1.15},{"id":"c_b_dtc","slot":"bucket","label":"Direct to consumer","text":"Cases the company ships itself to the drinker, with no retailer in between.","provenance":"derived","confidence":0.85,"rationale":"The website line is one ledger row; calling it a branch of the channel cut is the analyst's construction, and it is what makes the 0.2 million comparable with the 1.7 million rather than a footnote.","level":2,"pos":[-22,2],"size":1.15},{"id":"c_b_vending","slot":"bucket","label":"Vending","text":"Cases sold through vending operators, who place the machines and buy the stock.","provenance":"derived","confidence":0.85,"rationale":"Vending is a distinct route to market with its own economics; the ledger names the operators but never calls them a channel. As a branch it stays exclusive of grocery because a case cannot be both machine-filled and shelf-stocked.","level":2,"pos":[6,2],"size":1.15},{"id":"c_g_onprem","slot":"gap","label":"On-premise: branch never opened","text":"The fourth channel a drinks business always has, restaurants, canteens and hotels, where the drink is consumed where it is bought. Under this cut it is a branch with no ledger line, no salesperson and no number.","provenance":"derived","confidence":0.65,"rationale":"Nothing in the minutes says the on-premise channel exists. It is the branch the cut requires in order to be collectively exhaustive: once channel is the dimension, off-trade and on-trade are the two halves of it, and the source has only ever counted the off-trade half.","level":2,"pos":[48,2],"size":1.2},{"id":"c_i_super","slot":"item","label":"Supermarket chains, 1.7m","text":"Supermarket chains took 1.7 million cases, the largest single line in the ledger.","provenance":"fact","source_quote":"Supermarket chains took 1.7 million cases","source_ref":"finance director, sentence 3","level":3,"pos":[-64,-16],"size":0.85},{"id":"c_i_conv","slot":"item","label":"Convenience stores, 0.9m","text":"Convenience stores took 0.9 million cases.","provenance":"fact","source_quote":"convenience stores took 0.9 million","source_ref":"finance director, sentence 3","level":3,"pos":[-52,-30],"size":0.85},{"id":"c_i_web","slot":"item","label":"Own website, 0.2m","text":"The company's own website shipped 0.2 million cases direct to consumers.","provenance":"fact","source_quote":"The company's own website shipped 0.2 million cases direct to consumers","source_ref":"finance director, sentence 4","level":3,"pos":[-22,-16],"size":0.85},{"id":"c_i_vend","slot":"item","label":"Vending operators, 0.3m","text":"Vending operators took 0.3 million cases.","provenance":"fact","source_quote":"vending operators took 0.3 million","source_ref":"finance director, sentence 4","level":3,"pos":[6,-16],"size":0.85},{"id":"c_i_wholesale","slot":"item","label":"German wholesaler, 0.4m","text":"A further 0.4 million cases went to a German wholesaler; nobody is sure whether those cases ended up in shops or in restaurants, because the wholesaler is booked by country and not by channel.","provenance":"fact","source_quote":"a further 0.4 million cases went to a German wholesaler","source_ref":"sales director, sentence 5","level":3,"pos":[-38,-46],"size":0.85},{"id":"c_g_stated","slot":"gap","label":"No line, no salesperson","text":"The company has no salesperson who calls on restaurants, canteens or hotels, and the ledger has never had a line for them.","provenance":"fact","source_quote":"the company has no salesperson who calls on restaurants, canteens or hotels, and that the ledger has never had a line for them","source_ref":"head of marketing, sentence 7","level":3,"pos":[48,-16],"size":1.2},{"id":"c_g_unaccounted","slot":"gap","label":"0.6m cases in no branch","text":"The five ledger lines add to 3.5 million cases against a total of 4.1 million: 0.6 million cases, one case in seven, sit in no branch of the partition at all.","provenance":"derived","confidence":0.9,"rationale":"Arithmetic on the stated numbers: 1.7 + 0.9 + 0.2 + 0.3 + 0.4 = 3.5 against a stated total of 4.1. The minutes say the lines do not add up and that nobody can say what the rest were; the size of the hole, and that it is a seventh of the business, is the inference.","level":3,"pos":[52,46],"size":1.2},{"id":"c_o_german","slot":"overlap","label":"German line cut by country","text":"The German wholesaler line is booked on a different dimension from every other line: country, not channel. Its 0.4 million cases could be in grocery or in on-premise, so as long as it stands the branches are not mutually exclusive.","provenance":"derived","confidence":0.85,"rationale":"The minutes state the booking basis and the uncertainty but not the diagnosis. Naming it as a second dimension smuggled into a single cut is what turns an accounting annoyance into the reason the partition fails the exclusivity test, and it says what to do: re-code the German cases by channel before the picture is drawn.","level":3,"pos":[-2,-46],"size":1.15}],"edges":[{"id":"ce1","from":"c_whole","to":"c_cut_rule","relation":"cut_by","provenance":"fact","source_quote":"asking for one picture of where every case goes, cut one way only","source_ref":"CEO, sentence 8"},{"id":"ce2","from":"c_cut_rule","to":"c_cut","relation":"cut_by","provenance":"derived","confidence":0.85,"rationale":"The instruction is stated, the dimension that satisfies it is chosen."},{"id":"ce3","from":"c_cut","to":"c_b_grocery","relation":"partitions","provenance":"derived","confidence":0.85,"rationale":"Branch of the channel cut; two ledger lines fold into it."},{"id":"ce4","from":"c_cut","to":"c_b_dtc","relation":"partitions","provenance":"derived","confidence":0.85,"rationale":"Branch of the channel cut; one ledger line falls in it."},{"id":"ce5","from":"c_cut","to":"c_b_vending","relation":"partitions","provenance":"derived","confidence":0.85,"rationale":"Branch of the channel cut; one ledger line falls in it."},{"id":"ce6","from":"c_cut","to":"c_g_onprem","relation":"partitions","provenance":"derived","confidence":0.65,"rationale":"The branch the cut requires for exhaustiveness and the ledger has never held."},{"id":"ce7","from":"c_b_grocery","to":"c_i_super","relation":"contains","provenance":"derived","confidence":0.9,"rationale":"Placing a stated line in a constructed branch is the analyst's act, though this one is near-forced."},{"id":"ce8","from":"c_b_grocery","to":"c_i_conv","relation":"contains","provenance":"derived","confidence":0.9,"rationale":"Convenience stores are grocery retail on the channel dimension, whatever their account size."},{"id":"ce9","from":"c_b_dtc","to":"c_i_web","relation":"contains","provenance":"derived","confidence":0.9,"rationale":"The website line is the direct branch; the source states the line, not the branch."},{"id":"ce10","from":"c_b_vending","to":"c_i_vend","relation":"contains","provenance":"derived","confidence":0.9,"rationale":"The operator line is the vending branch; the source states the line, not the branch."},{"id":"ce11","from":"c_o_german","to":"c_b_grocery","relation":"violates","provenance":"derived","confidence":0.85,"rationale":"If the German cases went to shops they belong in grocery, and grocery is then understated by up to 0.4 million."},{"id":"ce12","from":"c_o_german","to":"c_g_onprem","relation":"violates","provenance":"derived","confidence":0.7,"rationale":"If they went to restaurants they belong in the branch that does not exist, which is why the same 0.4 million can be claimed twice."},{"id":"ce13","from":"c_g_unaccounted","to":"c_whole","relation":"missing_from","provenance":"derived","confidence":0.9,"rationale":"The residual is defined against the stated total, so it hangs off the whole and not off any branch."},{"id":"ce14","from":"c_g_stated","to":"c_cut","relation":"missing_from","provenance":"derived","confidence":0.75,"rationale":"A stated absence of coverage becomes a hole in the partition only once channel is the dimension; under a geography cut the same sentence would say nothing."},{"id":"ce15","from":"c_cut","to":"c_i_super","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The ledger's own largest line is already a channel, which is why channel is the cheapest cut to impose."},{"id":"ce16","from":"c_cut","to":"c_i_web","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The website line is a channel too, so four of the five lines need no re-coding."},{"id":"ce17","from":"c_g_unaccounted","to":"c_i_wholesale","relation":"supported_by","provenance":"derived","confidence":0.9,"rationale":"The wholesaler's 0.4 million is inside the 3.5 million that was summed, so the 0.6 million residual is on top of it."},{"id":"ce18","from":"c_g_onprem","to":"c_g_stated","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"No salesperson and no ledger line is the evidence that the branch was never opened, rather than opened and empty."},{"id":"ce19","from":"c_o_german","to":"c_i_wholesale","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The line itself, and the stated fact that it is booked by country, is the whole of the evidence for the defect."},{"id":"ce20","from":"c_g_unaccounted","to":"c_g_stated","relation":"supported_by","provenance":"derived","confidence":0.6,"rationale":"The uncounted channel is the obvious candidate home for the uncounted cases, though the minutes never connect the two."}]},{"id":"tbpn","kind":"tbpn","title":"Elad Gil's map of the AI application market: seven named verticals inside a $5 trillion whole","summary":"An investor partitions the AI opportunity vertical by vertical and names the finalists in each. The buckets and their members are quoted; the residual branch that holds most of the $5 trillion, and the rule for finding what fills it, are the analysis.","source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-10-10_sam-altman-live-on-sora-hollywood-the-future-of-ads-bill-peebles-dylan-patel-elad-gil-robby-stein-morgan-housel-misha-laskin.md","date":"2025-10-10","episode_title":"Sam Altman live on Sora, Hollywood & the future of ads (Bill Peebles, Dylan Patel, Elad Gil, Robby Stein, Morgan Housel, Misha Laskin)"},"why_this_episode":"Elad Gil does the partition out loud. Asked how to think about AI companies, he says the markets have crystallised, runs the AI application market vertical by vertical naming the finalists in each, flags the verticals where the winner is unknown, and separately sizes the whole at about $5 trillion of services. It is a MECE exercise with its two classic defects on the record: a layer (the foundation model companies) is mixed in with the verticals and re-appears inside them, and the branches he can name cover only a sliver of the whole he has stated.","idea_bearing_slot":"gap","layout":{"mode":"plane","regions":[{"label":"Branches Gil named","x":[-66.5,37],"y":[-4,15],"color":"#3987e5"},{"label":"Added by the LLM","x":[39,66.5],"y":[-4,15],"color":"#9085e9"},{"label":"What the cut leaves out","x":[-66.5,66.5],"y":[-51,-37],"color":"#d55181"}],"guides":[{"from":[-66.5,8],"to":[37,8],"style":"solid"},{"from":[37,8],"to":[66.5,8],"style":"dashed"}]},"nodes":[{"id":"w1","slot":"whole","label":"$5T of services AI can enter","text":"The whole being partitioned is the services economy Gil's team sized as the ground AI could intervene in: about $5 trillion, a large share of GDP.","provenance":"fact","source_quote":"The services economy that we looked at on my team in terms of where AI could intervene is about $5 trillion.","source_ref":"Elad Gil, L3144-L3144","entities":[],"level":0,"pos":[0,52],"size":2},{"id":"cut0","slot":"cut","label":"Verticals, not the model layer","text":"The host sets the dimension before the answer starts: the question is about vertical markets, smaller markets, and explicitly not the foundation model layer.","provenance":"fact","source_quote":"If we're talking vertical markets, smaller markets, not the foundation model layer.","source_ref":"Host, L2938-L2940","entities":[],"level":1,"pos":[-33,32],"size":1.15},{"id":"cut1","slot":"cut","label":"Go vertical by vertical","text":"Gil's own cut: the AI application market is walked one vertical at a time, and each vertical is asked the same question.","provenance":"fact","source_quote":"And you can go through sort of vertical by vertical.","source_ref":"Elad Gil, L2996-L2996","entities":[],"level":1,"pos":[0,32],"size":1.15},{"id":"cut2","slot":"cut","label":"Second cut: settled or open","text":"A second dimension runs across the first. Each vertical is filed as settled, where it is clear who the finalists are, or open, where the market is clearly important, there are tons of players, and the winners are unknown.","provenance":"derived","confidence":0.8,"rationale":"Gil applies the same finalists test to every vertical he names but never calls it a dimension. Reading it as a second cut is what turns financial tooling, sales enablement and accounting from a list into a class, and it is the class an investor or a founder is actually choosing between.","level":1,"pos":[33,32],"size":1.15},{"id":"b_model","slot":"bucket","label":"Foundation model market","text":"The foundation model market: the first branch Gil files, and the one the host's framing had put outside the question.","provenance":"fact","source_quote":"We know that for the foundation model market.","source_ref":"Elad Gil, L2988-L2988","entities":[],"level":2,"pos":[-66.5,8],"size":1.15},{"id":"b_code","slot":"bucket","label":"Coding","text":"Coding: a settled vertical whose finalists Gil can name without hesitating.","provenance":"fact","source_quote":"We know for coding, it's cognition, cursor, and then the foundation model companies in Microsoft.","source_ref":"Elad Gil, L2994-L2994","entities":[],"level":2,"pos":[-47.5,8],"size":1.15},{"id":"b_health","slot":"bucket","label":"Healthcare","text":"Healthcare: named as one of the verticals now known, with a handful of contenders in it.","provenance":"fact","source_quote":"There's a bunch of verticals now we know, a bridge for healthcare and maybe commier.","source_ref":"Elad Gil, L2998-L2998","entities":[],"level":2,"pos":[-28.5,8],"size":1.15},{"id":"b_legal","slot":"bucket","label":"Legal","text":"Legal: solidified, in Gil's reading, except for a handful of narrower sub-verticals such as personal injury.","provenance":"fact","source_quote":"legal feels like it's already solidified except a handful of these more vertical specific","source_ref":"Elad Gil, L3014-L3014","entities":[],"level":2,"pos":[-9.5,8],"size":1.15},{"id":"b_fin","slot":"bucket","label":"Financial tooling","text":"Financial tooling: a market Gil is sure will matter, with tons of players in it and no known winner.","provenance":"fact","source_quote":"And there's tons of players, but we don't know who the winners are. That's financial tooling.","source_ref":"Elad Gil, L3004-L3006","entities":[],"level":2,"pos":[9.5,8],"size":1.15},{"id":"b_acct","slot":"bucket","label":"Accounting and sales enablement","text":"Accounting, and sales enablement beside it: the other two branches Gil files under important, crowded and unresolved.","provenance":"fact","source_quote":"Maybe that's sales enablement. Maybe that's accounting.","source_ref":"Elad Gil, L3008-L3010","entities":[],"level":2,"pos":[28.5,8],"size":1.15},{"id":"b_rest","slot":"bucket","label":"Residual: every other service line","text":"The branch nobody opens. Models, coding, healthcare, legal, financial tooling, sales enablement, accounting and customer support are perhaps a few hundred billion dollars of the $5 trillion; the rest of the services economy is one unnamed branch.","provenance":"derived","confidence":0.7,"rationale":"Gil states a whole of about $5 trillion and names roughly eight verticals, then says you can come up with the list. Nobody closes the partition. Adding the residual branch is what turns a list of markets into a statement about coverage, and every gap below hangs inside it.","level":2,"pos":[47.5,8],"size":1.15},{"id":"b_durable","slot":"bucket","label":"Durable systems of record","text":"A branch that is populated and closed: multi-product systems of record whose moat is the cross-sell, not the model, and which an AI-native entrant does not take by being AI-native.","provenance":"derived","confidence":0.65,"rationale":"Gil says of one company that nobody is going to do the AI-first version and suddenly win. Generalising the one case into a branch of the same partition is the inference, and it matters because it is the part of the $5 trillion that is inside the whole but not inside the opportunity.","level":2,"pos":[66.5,8],"size":1.15},{"id":"i_labs","slot":"item","label":"Anthropic, OpenAI, Google, xAI, Meta","text":"The finalists Gil names in the foundation model market: Anthropic, OpenAI, Google, perhaps xAI, Meta, Mistral and a few others. A small list.","provenance":"fact","source_quote":"We know it's anthropic, open AI, Google, perhaps XAI, meta, a few others, mistraw, whatever.","source_ref":"Elad Gil, L2990-L2990","entities":["Anthropic","OpenAI","Google","xAI","Meta","Mistral"],"level":3,"pos":[-66.5,-14],"size":0.85},{"id":"i_coding","slot":"item","label":"Cognition, Cursor, and the labs","text":"The finalists Gil names in coding: Cognition, Cursor, and then the foundation model companies plus Microsoft.","provenance":"fact","source_quote":"it's cognition, cursor, and then the foundation model companies in Microsoft","source_ref":"Elad Gil, L2994-L2994","entities":["Cognition","Cursor","Microsoft"],"level":3,"pos":[-47.5,-26],"size":0.85},{"id":"i_health","slot":"item","label":"Abridge, maybe Commure","text":"The contenders Gil names in healthcare: Abridge, and maybe Commure. Transcribed as a bridge and commier.","provenance":"fact","source_quote":"a bridge for healthcare and maybe commier","source_ref":"Elad Gil, L2998-L2998","entities":["Abridge","Commure"],"level":3,"pos":[-28.5,-14],"size":0.85},{"id":"i_legal","slot":"item","label":"Legal bought no software until AI","text":"Legal never bought any software and was really hard to sell into; because of AI, a legal AI company can suddenly exist. The transcript renders the company as RV.","provenance":"fact","source_quote":"legal never bought any software. It was really hard to sell into legal, but because of AI, suddenly RV can exist","source_ref":"Elad Gil, L3124-L3126","entities":["Harvey"],"level":3,"pos":[-9.5,-26],"size":0.85},{"id":"i_support","slot":"item","label":"Support: labor, not seats","text":"Customer support as Gil re-prices it: not how many seats you sell the reps, but how much of their work you do. The labor market versus the software market.","provenance":"fact","source_quote":"you're looking at, for example, customer support. It's not Zendaz, How many seats can you sell the customer support reps? It's how much can you augment and do work for customer support reps? It's the labor market versus the software market.","source_ref":"Elad Gil, L3132-L3138","entities":["Zendesk"],"level":3,"pos":[47.5,-14],"size":0.85},{"id":"i_rippling","slot":"item","label":"Rippling cross-sells a dozen products","text":"Rippling cross-sells a dozen different HR products; AI can make some of them better, but nobody is going to do the AI-first Rippling and suddenly win.","provenance":"fact","source_quote":"Ripling is an amazing company they uh cross sell a dozen different HR products. And AI can make some stuff better, but nobody's going to do the AI first rippling and suddenly win, right?","source_ref":"Elad Gil, L3090-L3096","entities":["Rippling"],"level":3,"pos":[66.5,-26],"size":0.85},{"id":"o_labs","slot":"overlap","label":"The labs are in every bucket","text":"The foundation model companies are a branch of this partition and a member of the coding branch at the same time. Layer and vertical are two dimensions, and mixing them means no vertical branch is exclusive of the model branch.","provenance":"derived","confidence":0.85,"rationale":"The host explicitly excluded the model layer from the question, and Gil's coding list ends with the foundation model companies. The double count is on the record; naming it as a mixed cut rather than a quirk is the inference, and it carries a rule: every vertical bucket has to be defended against the lab that is already sitting in it.","level":3,"pos":[-57,20],"size":1.15},{"id":"o_ai_everything","slot":"overlap","label":"AI means everything now","text":"Gil states the limit case of the defect himself: AI means everything now, it means consumer, it means roll-ups, it means vertical SaaS. A branch that contains everything is exclusive of nothing.","provenance":"fact","source_quote":"And AI means everything now. It means consumer. It means roll-ups. It means vertical fast.","source_ref":"Elad Gil, L3042-L3044","entities":[],"level":3,"pos":[57,44],"size":1.15},{"id":"g_unnamed","slot":"gap","label":"Most of the whole has no contender","text":"Add up the verticals anyone in the room can name and you have a small fraction of $5 trillion. The rest of the services economy has no finalist, no crowd and, in this conversation, no name.","provenance":"derived","confidence":0.55,"rationale":"The arithmetic is forced but the reading is not: coverage is inferred by comparing a stated whole with a list the speaker himself treats as illustrative rather than complete, and the un-named remainder may be un-named because it is unattractive rather than because it is unnoticed.","idea":"The largest AI application segment is the set of service lines nobody at the table can name: where there is neither a finalist nor a crowd, the first credible product defines the category instead of fighting for it, so the highest-yield screen is to list the services economy by payroll and strike out every line that appeared in this conversation.","level":3,"pos":[20,-44],"size":1.2},{"id":"g_nosoftware","slot":"gap","label":"Verticals that bought no software","text":"The branch with no incumbent is the branch that never bought software in the first place. Legal was one of those until AI made it buyable; the rest of that class is still empty.","provenance":"derived","confidence":0.65,"rationale":"Gil gives the mechanism for exactly one vertical: legal bought no software, was hard to sell into, and became reachable because of AI. Turning one case into a screen for the whole residual branch is a generalisation, and it is contestable because legal also had unusually high billing rates, which is not true of every software-free trade.","idea":"Screen the services economy for lines with near-zero software spend per worker and high labor spend, such as claims adjusting, freight brokerage, permitting, title work and medical billing appeals, because each one is an empty bucket where an AI-native entrant has no incumbent to displace and no crowd to outspend.","level":3,"pos":[64,-44],"size":1.2},{"id":"g_labor","slot":"gap","label":"The labor half of every bucket","text":"Every branch here is drawn around a software market and sized by seats. The labor spend for the same work sits in no branch at all, and it is the larger number.","provenance":"derived","confidence":0.7,"rationale":"Gil states the shift from seat-based value to labor and applies it to customer support. Reading it as a missing branch rather than a pricing note is the inference: if the cut is drawn on software categories, a whole dimension of the $5 trillion has no bucket, which is why the market sizes come out too small.","idea":"Price and size against the labor line rather than the seat line: the open space is any vertical where software spend is near zero and payroll is large, and the product that wins it is sold as work delivered, not as software seats, which also removes the incumbent's price anchor.","level":3,"pos":[-64,-44],"size":1.2},{"id":"g_nofinalist","slot":"gap","label":"No finalist is not no players","text":"Financial tooling, sales enablement and accounting are thin in finalists and thick in entrants. What is missing from those branches is a winner, not a founder, which is the opposite of an underserved market.","provenance":"derived","confidence":0.7,"rationale":"Gil states both halves for these verticals, that the market matters and that there are tons of players with no known winner, but does not distinguish them from a branch that is genuinely empty. The distinction is the inference, and it is what stops a MECE reading of a market map from mistaking a crowd for an opening.","idea":"Rank branches by finalists per player, not by finalists: a branch with many entrants and no winner prices entry at the cost of a distribution war, while a branch with neither entrant nor winner is where the same capital buys the category.","level":3,"pos":[-24,-44],"size":1.2}],"edges":[{"id":"te1","from":"w1","to":"cut1","relation":"cut_by","provenance":"derived","confidence":0.7,"rationale":"Gil's vertical-by-vertical run and his $5 trillion sizing are about 150 lines apart in the same answer; treating the $5 trillion as the whole that the vertical cut partitions is the reading that makes both statements one partition."},{"id":"te2","from":"w1","to":"cut0","relation":"cut_by","provenance":"derived","confidence":0.6,"rationale":"The host's dimension is set before the whole is sized and by a different speaker, so joining them is an inference across the conversation."},{"id":"te3","from":"cut1","to":"cut2","relation":"cut_by","provenance":"derived","confidence":0.8,"rationale":"The finalists test is applied inside the vertical cut, so it is a second dimension running across the first rather than a rival to it."},{"id":"te4","from":"cut1","to":"b_model","relation":"partitions","provenance":"derived","confidence":0.55,"rationale":"Gil answers a question about vertical markets by filing the foundation model market first. Treating it as a branch of the same cut is the reading that makes the overlap visible; treating it as a preamble would hide it."},{"id":"te5","from":"cut1","to":"b_code","relation":"partitions","provenance":"derived","confidence":0.85,"rationale":"Coding is named in the same run of verticals, one line before the vertical-by-vertical remark."},{"id":"te6","from":"cut1","to":"b_health","relation":"partitions","provenance":"fact","source_quote":"And you can go through sort of vertical by vertical. There's a bunch of verticals now we know, a bridge for healthcare and maybe commier.","source_ref":"Elad Gil, L2996-L2998"},{"id":"te7","from":"cut1","to":"b_legal","relation":"partitions","provenance":"derived","confidence":0.75,"rationale":"Legal is filed in the same run-through a dozen lines later, after the hosts prompt for more."},{"id":"te8","from":"cut1","to":"b_fin","relation":"partitions","provenance":"derived","confidence":0.8,"rationale":"The but then that opens the contested markets continues the same enumeration, so financial tooling is a branch of the same cut."},{"id":"te9","from":"cut1","to":"b_acct","relation":"partitions","provenance":"derived","confidence":0.8,"rationale":"Named in the same breath as financial tooling and on the same footing."},{"id":"te10","from":"cut1","to":"b_rest","relation":"partitions","provenance":"derived","confidence":0.7,"rationale":"The branch added to close the partition; it exists only because the cut is supposed to be collectively exhaustive."},{"id":"te11","from":"cut1","to":"b_durable","relation":"partitions","provenance":"derived","confidence":0.6,"rationale":"Generalised from one company into a branch of the same cut, so that the part of the whole AI does not take is visible rather than assumed away."},{"id":"te12","from":"b_model","to":"i_labs","relation":"contains","provenance":"fact","source_quote":"We know that for the foundation model market. We know it's anthropic, open AI, Google, perhaps XAI, meta, a few others, mistraw, whatever.","source_ref":"Elad Gil, L2988-L2990"},{"id":"te13","from":"b_code","to":"i_coding","relation":"contains","provenance":"fact","source_quote":"We know for coding, it's cognition, cursor, and then the foundation model companies in Microsoft.","source_ref":"Elad Gil, L2994-L2994"},{"id":"te14","from":"b_health","to":"i_health","relation":"contains","provenance":"fact","source_quote":"There's a bunch of verticals now we know, a bridge for healthcare and maybe commier.","source_ref":"Elad Gil, L2998-L2998"},{"id":"te15","from":"b_legal","to":"i_legal","relation":"contains","provenance":"derived","confidence":0.65,"rationale":"The legal branch and the legal-never-bought-software remark are about 110 lines apart, and the company is named only as RV; placing it in the branch is a reading of the transcript, not a stated placement."},{"id":"te16","from":"b_durable","to":"i_rippling","relation":"contains","provenance":"derived","confidence":0.7,"rationale":"The branch was generalised from this company, so the containment is the inference read back."},{"id":"te17","from":"b_rest","to":"i_support","relation":"contains","provenance":"derived","confidence":0.6,"rationale":"Customer support is named as a market but never given finalists, so it sits in the residual branch: a service line inside the whole with nobody filed against it."},{"id":"te18","from":"o_labs","to":"b_model","relation":"violates","provenance":"derived","confidence":0.85,"rationale":"The model branch is a layer, not a vertical, so it cuts across every other branch."},{"id":"te19","from":"o_labs","to":"b_code","relation":"violates","provenance":"derived","confidence":0.85,"rationale":"The coding branch contains the model companies by Gil's own list, so the two branches share members."},{"id":"te20","from":"o_ai_everything","to":"cut1","relation":"violates","provenance":"derived","confidence":0.7,"rationale":"If AI means consumer, roll-ups and vertical SaaS at once, then AI is not a branch of any cut; the remark is aimed at investing trends, and applying it to this partition is the inference."},{"id":"te21","from":"g_unnamed","to":"b_rest","relation":"missing_from","provenance":"derived","confidence":0.55,"rationale":"What is absent from the residual branch is any named contender at all."},{"id":"te22","from":"g_nosoftware","to":"b_rest","relation":"missing_from","provenance":"derived","confidence":0.65,"rationale":"The software-free trades are inside the residual branch and are the part of it with no incumbent to displace."},{"id":"te23","from":"g_labor","to":"cut1","relation":"missing_from","provenance":"derived","confidence":0.7,"rationale":"The labor half is missing from the cut itself rather than from any one branch, which is why no branch is sized correctly."},{"id":"te24","from":"g_nofinalist","to":"b_fin","relation":"missing_from","provenance":"derived","confidence":0.75,"rationale":"What financial tooling lacks is a winner, and Gil says so; that this is not the same absence as an empty branch is the inference."},{"id":"te25","from":"g_nofinalist","to":"b_acct","relation":"missing_from","provenance":"derived","confidence":0.75,"rationale":"Same absence in accounting and sales enablement, filed by Gil on the same footing."},{"id":"te26","from":"cut2","to":"b_model","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The settled end of the second cut: a branch where the finalists are known."},{"id":"te27","from":"cut2","to":"b_fin","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The open end of the second cut: a branch where the winners are not known."},{"id":"te28","from":"b_rest","to":"w1","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"The residual exists only because the stated whole is far larger than the named branches."},{"id":"te29","from":"g_unnamed","to":"w1","relation":"supported_by","provenance":"derived","confidence":0.6,"rationale":"The stated $5 trillion is the denominator the coverage claim is measured against."},{"id":"te30","from":"g_unnamed","to":"cut1","relation":"supported_by","provenance":"derived","confidence":0.55,"rationale":"The enumeration Gil offers is what the coverage claim counts; he presents it as illustrative, which is why the confidence is not higher."},{"id":"te31","from":"g_nosoftware","to":"i_legal","relation":"supported_by","provenance":"derived","confidence":0.65,"rationale":"The one worked case of a software-free vertical becoming buyable is the whole evidential base for the screen."},{"id":"te32","from":"g_labor","to":"i_support","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"Gil's own re-pricing of customer support from seats to work done is the stated instance of the missing dimension."},{"id":"te33","from":"g_nofinalist","to":"b_fin","relation":"supported_by","provenance":"derived","confidence":0.75,"rationale":"Tons of players with no known winner is stated for this branch, and it is the fact the distinction rests on."},{"id":"te34","from":"o_labs","to":"i_coding","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The model companies appear inside the coding list, which is the double count itself."},{"id":"te35","from":"o_labs","to":"cut0","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The host had put the model layer outside the vertical question, which is what makes its reappearance a mixed cut rather than a choice."}]}]}</script>

<!-- MECE, TBPN example: the eight branches of the partition stay on one level - a row of

      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, ymin, z), new THREE.Vector3(x, ymax, z)]), lineMat));
      const lab = label2d(ay.label, 'axlabel', 'rotate(-90deg)'); lab.position.set(x - 8, (ymin + ymax) / 2, z); group.add(lab);
      for (const t of (ay.ticks || [])) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x - 1, t.value, z), new THREE.Vector3(x + 1, t.value, z)]), lineMat)); const tl = label2d(t.label, 'tick', 'translateX(-50%)'); tl.position.set(x - 2.5, t.value, z); group.add(tl); }
      bbox.expandByPoint(shift(new THREE.Vector3(x - 11, ymin, 0))); bbox.expandByPoint(shift(new THREE.Vector3(x, ymax, 0)));
    }
  }
}

// ---------- build an example ----------
function clearGroup() {
  if (!state.group) return;
  state.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); } if (o.isCSS2DObject && o.element) o.element.remove(); });
  scene.remove(state.group);
  $('labels').replaceChildren();
  state.group = null; state.nodes.clear(); state.edges = []; state.hit = []; state.hover = null; state.selected = null; state.derivedDecor = [];
  $('panel').hidden = true;
}

function buildExample(i) {
  clearGroup();
  state.exampleIndex = i;
  const ex = GRAPH.examples[i];
  const group = new THREE.Group(); scene.add(group); state.group = group;
  const positions = computeLayout(ex);
  // centre
  const bbox = new THREE.Box3();
  for (const p of positions.values()) bbox.expandByPoint(p);
  const centre = bbox.getCenter(new THREE.Vector3());
  const decorOffset = ex.layout?.mode !== 'plane' ? centre.clone() : new THREE.Vector3();
  if (ex.layout?.mode !== 'plane') for (const p of positions.values()) p.sub(centre);
  const bbox2 = new THREE.Box3(); for (const p of positions.values()) bbox2.expandByPoint(p);
  for (const n of ex.nodes) { const rec = makeNode(n, positions.get(n.id)); state.nodes.set(n.id, rec); group.add(rec.obj); state.hit.push(rec.hit); }
  for (const e of ex.edges) {
    const A = state.nodes.get(e.from), B = state.nodes.get(e.to); if (!A || !B) continue;
    const rec = makeEdge(e, A, B); state.edges.push(rec); group.add(rec.grp); A.edges.push(rec); B.edges.push(rec);
  }
  drawDecor(ex, group, bbox2, decorOffset);
  // camera fit
  const size = bbox2.getSize(new THREE.Vector3()), c = bbox2.getCenter(new THREE.Vector3());
  state.fit = { size, centre: c, mode: ex.layout?.mode || 'force', distance: ex.layout?.camera?.distance };
  renderNote(ex);
  renderLegend(ex);    // legend first, so the camera fit can measure it
  resetView();
  applyVisibility();
  for (const b of $('examples').children) b.setAttribute('aria-pressed', String(b.dataset.index == i));
  try { window.__frameworkExtension?.({ THREE, scene, group, graph: GRAPH, example: ex, nodesById: state.nodes, positions, api: { slotStyle, label2d, colors: { INK, INK2, MUTED, HAIRLINE, SURFACE, SLOT_COLORS, SCHEMA_COLOR } } }); } catch (e) { console.error('framework extension failed', e); }
}

// Fit the graph into the part of the stage not covered by the legend (left) or the open panel (right),
// so labels are not hidden under the cards at the default view.
function safeArea(size) {
  const W = stage.clientWidth, H = stage.clientHeight;
  const sr = stage.getBoundingClientRect();
  let left = 0, top = 0, right = 0;
  const wide = W > 820;
  const leg = $('legend'); if (wide && leg && leg.offsetParent !== null) { const r = leg.getBoundingClientRect(); left = Math.max(left, r.right - sr.left + 16); }
  const panel = $('panel'); if (wide && panel && !panel.hidden) { const r = panel.getBoundingClientRect(); right = Math.max(right, sr.right - r.left + 16); }
  return { W, H, left, top, right, w: Math.max(200, W - left - right), h: Math.max(200, H - top) };
}
function resetView() {
  if (!state.fit) return;
  const { size, centre, mode } = state.fit;
  const sa = safeArea(size);
  const halfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const bottomPad = 30;                       // px: labels hang below the lowest row of nodes
  const availH = Math.max(150, sa.h - bottomPad);
  // distance at which the graph (plus margins) fits the safe area: the vertical FOV spans sa.H pixels
  const fitH = (size.y / 2 + 8) * sa.H / (halfFov * availH);
  const sidePad = 110;                       // px: labels are centred under nodes and stick out sideways
  const fitW = (size.x / 2 + 6) * sa.H / (halfFov * Math.max(200, sa.w - 2 * sidePad));
  const dist = state.fit.distance || Math.max(50, Math.max(fitH, fitW) * (mode === 'force' ? 1.3 : 1.08) + size.z / 2);
  // world units per pixel at the target depth; shift the centre so the graph sits in the safe area
  const wpp = (2 * dist * halfFov) / sa.H;
  const target = centre.clone().add(new THREE.Vector3(-((sa.left - sa.right) / 2) * wpp, ((sa.top - bottomPad) / 2) * wpp, 0));
  const camPos = mode === 'force' ? target.clone().add(new THREE.Vector3(dist * 0.3, dist * 0.22, dist * 0.92)) : target.clone().add(new THREE.Vector3(0, 0, dist));
  camera.position.copy(camPos); controls.target.copy(target);
  camera.near = 0.1; camera.far = 5000; camera.updateProjectionMatrix(); controls.update();
}

function applyVisibility() {
  for (const rec of state.nodes.values()) {
    const vis = rec.node.provenance !== 'derived' || state.showDerived;
    rec.obj.visible = vis;
    rec.label.visible = vis && state.showLabels;
    rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  for (const rec of state.edges) {
    const endsOk = rec.A.obj.visible && rec.B.obj.visible;
    // a derived edge is reasoning too: it goes away with the derived nodes, even when both its ends are facts
    const vis = endsOk && (!rec.grounding || state.showGrounding) && (rec.edge.provenance !== 'derived' || state.showDerived);
    rec.grp.visible = vis;
    if (rec.label) rec.label.element.style.display = (vis && state.showLabels) ? '' : 'none';
  }
  for (const lab of state.derivedDecor) lab.element.style.display = state.showDerived ? '' : 'none';
  // The idea key explains a marker; drop it when no idea node is on screen (e.g. the facts-only view).
  const ideaKey = $('legend')?.querySelector('.key-row.idea-key');
  if (ideaKey) ideaKey.style.display = [...state.nodes.values()].some(r => r.node.idea && r.obj.visible) ? '' : 'none';
  renderStats();
}

// ---------- legend / note / stats ----------
function renderLegend(ex) {
  const el = $('legend'); el.replaceChildren();
  const h = (t) => { const x = document.createElement('h2'); x.textContent = t; return x; };
  el.appendChild(h('Slots'));
  const counts = new Map(); for (const n of ex.nodes) counts.set(n.slot, (counts.get(n.slot) || 0) + 1);
  for (const s of GRAPH.slots) {
    const row = document.createElement('div'); row.className = 'slot-row';
    const chip = document.createElement('span'); const stl = slotStyle.get(s.id);
    chip.className = 'chip' + (stl.shape && stl.shape !== 'sphere' ? ' ' + stl.shape : ''); chip.style.background = stl.color;
    if (s.structural) chip.style.borderRadius = '2px';
    const name = document.createElement('span'); name.textContent = s.label;
    const tp = document.createElement('span'); tp.className = 'tp'; tp.textContent = s.structural ? 'schema' : (s.typical_provenance || '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = String(counts.get(s.id) || 0);
    row.append(chip, name, tp, n); row.title = s.description || ''; el.appendChild(row);
  }
  el.appendChild(h('Provenance'));
  const ideaCount = ex.nodes.filter(n => n.idea).length;
  const keys = [['●', 'fact: stated in the source (solid)'], ['◌', 'derived: LLM inference (translucent, dashed)'], ['▪', 'schema: framework scaffolding (grey)'], ['→', 'solid edge stated, dashed inferred'], ['⋯', 'grounding link: derived → fact']];
  if (ideaCount) keys.push(['★', 'gold ring: an opportunity this framework surfaces']);
  for (const [sym, txt] of keys) {
    const row = document.createElement('div'); row.className = 'key-row';
    if (sym === '★') row.classList.add('idea-key');
    const a = document.createElement('span'); a.className = 'sym'; a.textContent = sym; if (sym === '★') a.style.color = IDEA;
    const b = document.createElement('span'); b.textContent = txt; row.append(a, b); el.appendChild(row);
  }
  const st = document.createElement('div'); st.className = 'stats'; st.id = 'stats'; el.appendChild(st);
  renderStats();
}
function renderStats() {
  const st = $('stats'); if (!st) return;
  const ex = GRAPH.examples[state.exampleIndex];
  const nf = ex.nodes.filter(n => n.provenance === 'fact').length, nd = ex.nodes.filter(n => n.provenance === 'derived').length, ns = ex.nodes.filter(n => n.provenance === 'schema').length;
  const ef = ex.edges.filter(e => e.provenance === 'fact').length, ed = ex.edges.filter(e => e.provenance === 'derived' && e.relation !== 'supported_by').length, eg = ex.edges.filter(e => e.relation === 'supported_by').length, es = ex.edges.filter(e => e.provenance === 'schema').length;
  const visN = [...state.nodes.values()].filter(r => r.obj.visible).length, visE = state.edges.filter(r => r.grp.visible).length;
  st.replaceChildren();
  const line = (html) => { const d = document.createElement('div'); d.append(...html); st.appendChild(d); };
  const b = (t) => { const x = document.createElement('b'); x.textContent = t; return x; };
  line(['nodes ', b(String(nf)), ' fact · ', b(String(nd)), ' derived', ns ? ` · ${ns} schema` : '']);
  line(['edges ', b(String(ef)), ' fact · ', b(String(ed)), ' derived · ', b(String(eg)), ' grounding', es ? ` · ${es} schema` : '']);
  line([`showing ${visN} nodes, ${visE} edges`]);
}
function renderNote(ex) {
  const el = $('note'); el.replaceChildren();
  const h = document.createElement('h3'); h.textContent = ex.title || ex.id; el.appendChild(h);
  const p = document.createElement('p'); p.textContent = ex.summary || ''; el.appendChild(p);
  const s = document.createElement('div'); s.className = 'src';
  if (ex.source?.type === 'transcript') s.textContent = `TBPN ${ex.source.date} · ${ex.source.episode_title || ''}`;
  else if (ex.source?.type === 'text') s.textContent = `source: ${ex.source.title || 'scenario text'}`;
  el.appendChild(s);
}

// ---------- panel ----------
function openPanel(rec) {
  const n = rec.node, ex = GRAPH.examples[state.exampleIndex];
  const panel = $('panel'); panel.replaceChildren(); panel.hidden = false;
  const head = document.createElement('div'); head.className = 'p-head';
  const slotEl = document.createElement('div'); slotEl.className = 'p-slot';
  const chip = document.createElement('span'); chip.className = 'chip'; chip.style.background = rec.color; slotEl.append(chip, document.createTextNode((slotStyle.get(n.slot)?.slot?.label) || n.slot));
  const close = document.createElement('button'); close.className = 'close'; close.type = 'button'; close.textContent = '×'; close.setAttribute('aria-label', 'Close'); close.onclick = () => { panel.hidden = true; state.selected = null; };
  head.append(slotEl, close); panel.appendChild(head);
  const h3 = document.createElement('h3'); h3.textContent = n.label; panel.appendChild(h3);
  const badge = document.createElement('span'); badge.className = 'badge ' + n.provenance; badge.textContent = n.provenance; panel.appendChild(badge);
  const text = document.createElement('p'); text.textContent = n.text; panel.appendChild(text);
  const h4 = (t) => { const x = document.createElement('h4'); x.textContent = t; panel.appendChild(x); };
  if (n.provenance === 'fact') {
    h4(n.paraphrase ? 'Paraphrased from the source' : 'Quoted from the source');
    const q = document.createElement('blockquote'); q.textContent = n.source_quote || ''; panel.appendChild(q);
    const r = document.createElement('div'); r.className = 'ref'; r.textContent = n.source_ref || ''; panel.appendChild(r);
  } else if (n.provenance === 'derived') {
    h4('Confidence');
    const c = document.createElement('div'); c.className = 'conf'; c.textContent = `${Math.round((n.confidence || 0) * 100)} / 100`; panel.appendChild(c);
    const bar = document.createElement('div'); bar.className = 'confbar'; const fillEl = document.createElement('i'); fillEl.style.width = `${Math.round((n.confidence || 0) * 100)}%`; bar.appendChild(fillEl); panel.appendChild(bar);
    h4('Why the LLM infers this'); const r = document.createElement('p'); r.textContent = n.rationale || ''; panel.appendChild(r);
    if (n.idea) { h4('Opportunity this points to'); const ip = document.createElement('p'); ip.className = 'idea'; ip.textContent = n.idea; panel.appendChild(ip); }
    const sup = ex.edges.filter(e => e.relation === 'supported_by' && e.from === n.id).map(e => state.nodes.get(e.to)).filter(Boolean);
    if (sup.length) { h4('Supported by'); const ul = document.createElement('ul'); for (const s of sup) { const li = document.createElement('li'); li.textContent = s.node.label; const q = document.createElement('div'); q.className = 'ref'; q.textContent = (s.node.source_quote || '').slice(0, 140); li.appendChild(q); ul.appendChild(li); } panel.appendChild(ul); }
  } else {
    const r = document.createElement('p'); r.className = 'ref'; r.textContent = 'Framework scaffolding: neither a fact nor an inference.'; panel.appendChild(r);
  }
  const rels = rec.edges.filter(e => e.edge.relation !== 'supported_by');
  if (rels.length) {
    h4('Edges'); const ul = document.createElement('ul');
    for (const e of rels) { const li = document.createElement('li'); const out = e.edge.from === n.id; const other = out ? e.B.node : e.A.node; const rl = document.createElement('span'); rl.className = 'rel'; rl.textContent = (out ? '→ ' : '← ') + (relLabel.get(e.edge.relation) || e.edge.relation) + (e.edge.provenance === 'derived' ? ' (inferred)' : '') + ' '; li.append(rl, document.createTextNode(other.label)); ul.appendChild(li); }
    panel.appendChild(ul);
  }
  if (Array.isArray(n.entities) && n.entities.length) { h4('Entities'); const p = document.createElement('p'); p.className = 'ref'; p.textContent = n.entities.join(', '); panel.appendChild(p); }
}

// ---------- interaction ----------
const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2(); const tooltip = $('tooltip');
function setHover(rec) {
  if (state.hover === rec) return;
  if (state.hover) { const h = state.hover; h.mesh.scale.setScalar(1); if (h.mesh.material.emissive) h.mesh.material.emissive.setHex(0x000000); for (const e of h.edges) { e.line.material.color.set(e.grounding ? MUTED : (e.edge.provenance === 'schema' ? HAIRLINE : INK2)); if (e.arrow) e.arrow.material.color.set(INK2); } }
  state.hover = rec;
  if (rec) { rec.mesh.scale.setScalar(1.18); if (rec.mesh.material.emissive) rec.mesh.material.emissive.set(rec.color).multiplyScalar(0.35); for (const e of rec.edges) { if (!e.grp.visible) continue; e.line.material.color.set(INK); if (e.arrow) e.arrow.material.color.set(INK); } }
  renderer.domElement.style.cursor = rec ? 'pointer' : '';
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(state.hit.filter(h => h.parent.visible), false);
  const rec = hits.length ? state.nodes.get(hits[0].object.userData.nodeId) : null;
  setHover(rec);
  if (rec) {
    tooltip.replaceChildren();
    const a = document.createElement('div'); a.className = 't-label'; a.textContent = rec.node.label;
    const b = document.createElement('div'); b.className = 't-meta'; b.textContent = `${(slotStyle.get(rec.node.slot)?.slot?.label) || rec.node.slot} · ${rec.node.provenance}${rec.node.provenance === 'derived' ? ' ' + Math.round((rec.node.confidence || 0) * 100) + '%' : ''}`;
    const c = document.createElement('div'); c.textContent = rec.node.text.length > 160 ? rec.node.text.slice(0, 157) + '…' : rec.node.text;
    tooltip.append(a, b, c);
    tooltip.style.display = 'block';
    const mx = ev.clientX - r.left + 14, my = ev.clientY - r.top + 14;
    tooltip.style.left = Math.min(mx, r.width - 320) + 'px'; tooltip.style.top = Math.min(my, r.height - 120) + 'px';
  } else tooltip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => { setHover(null); tooltip.style.display = 'none'; });
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  if (state.hover) { state.selected = state.hover; openPanel(state.hover); } else { $('panel').hidden = true; state.selected = null; }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
  if (ev.key === 'd') { $('t-derived').checked = !$('t-derived').checked; $('t-derived').dispatchEvent(new Event('change')); }
  if (ev.key === 'g') { $('t-grounding').checked = !$('t-grounding').checked; $('t-grounding').dispatchEvent(new Event('change')); }
  if (ev.key === 'r') resetView();
  if (ev.key === 'Escape') { $('panel').hidden = true; state.selected = null; }
});
$('t-derived').addEventListener('change', (e) => { state.showDerived = e.target.checked; applyVisibility(); });
$('t-grounding').addEventListener('change', (e) => { state.showGrounding = e.target.checked; applyVisibility(); });
$('t-labels').addEventListener('change', (e) => { state.showLabels = e.target.checked; applyVisibility(); });
$('t-rotate').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
$('reset').addEventListener('click', resetView);

// example selector
const seg = $('examples');
const kindCount = new Map(); for (const ex of GRAPH.examples) kindCount.set(ex.kind, (kindCount.get(ex.kind) || 0) + 1);
GRAPH.examples.forEach((ex, i) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.index = i; b.textContent = kindCount.get(ex.kind) > 1 ? (ex.title || ex.id) : ex.kind === 'tbpn' ? 'From TBPN' : ex.kind === 'classic' ? 'Classic' : (ex.title || ex.id); b.title = ex.title || ''; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => buildExample(i)); seg.appendChild(b); });

// ---------- go ----------
// URL parameters set the initial state (deep links, scripted screenshots): ?example=1&derived=0&grounding=1&labels=0&rotate=1
const q = new URLSearchParams(location.search);
const flag = (k, def) => q.has(k) ? !['0', 'false', 'off', 'no'].includes(q.get(k).toLowerCase()) : def;
state.showDerived = flag('derived', true); $('t-derived').checked = state.showDerived;
state.showGrounding = flag('grounding', false); $('t-grounding').checked = state.showGrounding;
state.showLabels = flag('labels', true); $('t-labels').checked = state.showLabels;
controls.autoRotate = flag('rotate', false); $('t-rotate').checked = controls.autoRotate;
let startIndex = parseInt(q.get('example') || '0', 10);
if (!(startIndex >= 0 && startIndex < GRAPH.examples.length)) startIndex = Math.max(0, GRAPH.examples.findIndex(x => x.id === q.get('example')));
resize();
buildExample(startIndex);
$('fallback').hidden = true; window.__engineReady = true;
function loop() {
  requestAnimationFrame(loop);
  controls.update();
  for (const rec of state.nodes.values()) for (const c of rec.obj.children) if (c.userData.isIdeaRing) c.quaternion.copy(camera.quaternion);
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
}
loop();
</script>
