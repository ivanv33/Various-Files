<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel .lab { display: inline-block; transform: translateY(11px); background: rgba(26,26,25,.72); padding: 0 4px; border-radius: 3px; }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  /* Insights: the LLM layer on its own. Facts ghost, inferences stay lit, and a card lists what was derived. */
  #insights { right: 12px; top: 12px; bottom: 12px; width: 360px; padding: 14px 16px; overflow: auto; font-size: 13px; z-index: 3; }
  #insights[hidden] { display: none; }
  #insights .i-head { display: flex; align-items: flex-start; gap: 8px; }
  #insights .eyebrow { color: #eda100; }
  #insights h3 { margin: 4px 0 8px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #insights .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  #insights .formula { margin: 0 0 12px; padding: 10px 12px; border-left: 2px solid #eda100; background: rgba(237,161,0,.06); color: var(--ink); line-height: 1.5; }
  #insights h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; display: flex; align-items: center; gap: 6px; }
  #insights h4 .chip { width: 9px; height: 9px; border-radius: 50%; }
  #insights .i-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--hairline); cursor: pointer; }
  #insights .i-item:hover { background: rgba(255,255,255,.03); }
  #insights .i-item .t { color: var(--ink); }
  #insights .i-item .idea { grid-column: 1 / -1; color: #eda100; font-size: 12px; }
  #insights .i-item .c { font: 11px var(--mono); color: var(--muted); align-self: start; }
  #insights .i-item.starred .t::before { content: "★ "; color: #eda100; }
  .ghost { opacity: .18 !important; }
  .nlabel.ghost .lab { background: transparent; text-shadow: none; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"framework":{"slug":"five-whys","name":"5 Whys","category":"02-strategic-and-business","wikipedia":"https://en.wikipedia.org/wiki/Five_whys","one_liner":"Traces one observed failure down successive layers of cause until the answer is a standard, an incentive or a structure rather than a person, then names the countermeasure that removes it."},"slots":[{"id":"problem","label":"Problem","typical_provenance":"fact","description":"The observed failure, stated concretely enough to be checked: what happened, to whom, how often. Recurrence evidence belongs here too, because a failure that has been cleared before is the strongest sign that earlier answers stopped too high.","color":"#3987e5","shape":"sphere"},{"id":"why","label":"Why","typical_provenance":"either","description":"One causal layer, the answer to 'why did the layer above happen?'. Use level 1..n. The upper layers are usually stated by the speakers; the lower ones, where the answer stops being mechanical and becomes a standard or an incentive, usually have to be inferred.","color":"#d95926","shape":"sphere"},{"id":"root_cause","label":"Root cause","typical_provenance":"derived","description":"The systemic cause at the bottom of the chain: a standard, a process, an incentive or a structure whose removal would prevent the whole class of failure, not this instance of it. Almost never stated, because naming it is an admission.","color":"#199e70","shape":"diamond"},{"id":"countermeasure","label":"Countermeasure","typical_provenance":"either","description":"What would remove a cause. The fix aimed at a shallow why is usually stated and usually already taken; the countermeasure that reaches the root cause is normally inferred, and it is where the opportunity in the material shows up.","color":"#9085e9","shape":"box"}],"relations":[{"id":"because","label":"because","description":"the node it starts from happened because of the node it points to; one step down the causal chain"},{"id":"addressed_by","label":"addressed by","description":"a cause is removed, or its symptom cleared, by the countermeasure it points to"}],"examples":[{"id":"classic","kind":"classic","title":"Ohno's machine stoppage: the missing strainer","summary":"Taiichi Ohno's own demonstration of the method: a stopped machine, five whys asked in turn, and an answer at the bottom that is a missing part rather than a blown fuse. Extended by two facts Ohno's telling implies, the one-item maintenance sheet and the two earlier fuse replacements, so the sixth why reaches the standard.","insights":{"short":"Given Taiichi Ohno's machine that stopped mid-shift, where a blown fuse traced through a dry bearing and a worn pump shaft to a missing strainer, with a one-item maintenance sheet shared by five machines and two earlier fuse replacements, applying 5 Whys we derived that the routine could never see filtration, that the root cause is the standard rather than the part, and that the fuse swaps were two earlier stops at the first why; the reader gains the slot the story leaves empty, a countermeasure that rewrites the sheet, checks strainers at acceptance and audits the four sibling machines.","long":"The facts. In Taiichi Ohno's account, a machine on the assembly line stopped mid-shift and the supervisor, rather than sending for a new fuse, asked why five times. An overload blew the fuse, the bearing was under-lubricated, the lubrication pump was not pumping, its shaft was worn and rattling, and no strainer was fitted so metal scrap got in. The team fitted a strainer to the pump inlet and the line restarted. The scenario adds that the maintenance sheet listed a single item, a monthly oil top-up, that the same sheet was in use on the four other machines of this type, and that the fuse on this machine had been replaced twice in the previous year.\n\nThe method. 5 Whys insists that the chain run past the failed part to the standard that let it fail, and that each countermeasure hang off the layer it actually removes. The story states five whys and one fix; it leaves the root-cause slot empty and never names the two fuse replacements as a countermeasure taken twice at the top of the chain.\n\nWhat we derived. A sixth layer: nothing in the maintenance routine could detect a missing strainer, since a sheet whose only item is an oil top-up inspects the oil, not the filtration, so the omission could persist from installation until the shaft failed (80%). The root cause is a standard, not a part: the machine was accepted into service and maintained under a sheet that never mentions filtration, and the same gap is live on the four sibling machines (75%). Replacing the fuse is the countermeasure you reach by stopping at the first why, and the record of two replacements shows it had already been taken twice, clearing the symptom without touching the cause (70%). The reader gains, in place of a business idea, the countermeasure the source left unwritten: one that changes the standard rather than the pump, with a filtration item on the maintenance sheet, a strainer check at installation acceptance, and an audit of the four sibling machines running the same sheet (75%)."},"source":{"type":"text","title":"A machine stops on the assembly line","attribution":"Adapted from Taiichi Ohno, Toyota Production System: Beyond Large-Scale Production (1978; English edition 1988), the machine-stoppage example that introduces asking why five times.","text":"A machine on the assembly line stopped in the middle of the shift. The supervisor did not send for a new fuse; he asked why, and kept asking.\nWhy did the machine stop? There was an overload and the fuse blew.\nWhy was there an overload? The bearing was not sufficiently lubricated.\nWhy was it not lubricated sufficiently? The lubrication pump was not pumping sufficiently.\nWhy was it not pumping sufficiently? The shaft of the pump was worn and rattling.\nWhy was the shaft worn out? There was no strainer attached and metal scrap got in.\nThe team fitted a strainer to the pump inlet and the line restarted. The maintenance sheet for this machine listed a single item, a monthly oil top-up, and the same sheet was in use on the four other machines of this type on the line. The plant's records showed that the fuse on this machine had been replaced twice in the previous year."},"layout":{"mode":"tree","root":"p","direction":"down","regions":[{"label":"countermeasures","x":[22,62],"y":[-56,46],"color":"#9085e9"}],"guides":[{"from":[-30,36],"to":[-30,36],"style":"solid","label":"why 1"},{"from":[-30,24],"to":[-30,24],"style":"solid","label":"why 2"},{"from":[-30,12],"to":[-30,12],"style":"solid","label":"why 3"},{"from":[-30,0],"to":[-30,0],"style":"solid","label":"why 4"},{"from":[-30,-12],"to":[-30,-12],"style":"solid","label":"why 5"},{"from":[-30,-24],"to":[-30,-24],"style":"solid","label":"why 6"},{"from":[-30,-36],"to":[-30,-36],"style":"solid","label":"why 7"},{"from":[-30,-48],"to":[-30,-48],"style":"solid","label":"root cause"},{"from":[-14,-30],"to":[20,-30],"style":"dashed"},{"from":[-36,-30],"to":[-36,-30],"style":"solid","label":"the source stops here"}]},"nodes":[{"id":"p","slot":"problem","label":"Machine stopped mid-shift","text":"A machine on the assembly line stopped in the middle of the shift.","provenance":"fact","level":0,"source_quote":"A machine on the assembly line stopped in the middle of the shift","source_ref":"narrator, sentence 1","pos":[-6,48],"size":1.3},{"id":"p2","slot":"problem","label":"Fuse replaced twice this year","text":"The plant's records showed the fuse on this machine had been replaced twice in the previous year: the same stoppage had already occurred and been cleared twice.","provenance":"fact","level":0,"source_quote":"the fuse on this machine had been replaced twice in the previous year","source_ref":"narrator, sentence 15 (the plant records)","pos":[-40,48]},{"id":"w1","slot":"why","label":"Overload blew the fuse","text":"There was an overload and the fuse blew.","provenance":"fact","level":1,"source_quote":"There was an overload and the fuse blew","source_ref":"the team, answer to why 1, sentence 4","pos":[-6,36]},{"id":"w2","slot":"why","label":"Bearing under-lubricated","text":"The bearing was not sufficiently lubricated.","provenance":"fact","level":2,"source_quote":"The bearing was not sufficiently lubricated","source_ref":"the team, answer to why 2, sentence 6","pos":[-6,24]},{"id":"w3","slot":"why","label":"Lubrication pump not pumping","text":"The lubrication pump was not pumping sufficiently.","provenance":"fact","level":3,"source_quote":"The lubrication pump was not pumping sufficiently","source_ref":"the team, answer to why 3, sentence 8","pos":[-6,12]},{"id":"w4","slot":"why","label":"Pump shaft worn and rattling","text":"The shaft of the pump was worn and rattling.","provenance":"fact","level":4,"source_quote":"The shaft of the pump was worn and rattling","source_ref":"the team, answer to why 4, sentence 10","pos":[-6,0]},{"id":"w5","slot":"why","label":"No strainer, metal scrap got in","text":"There was no strainer attached and metal scrap got in.","provenance":"fact","level":5,"source_quote":"There was no strainer attached and metal scrap got in","source_ref":"the team, answer to why 5, sentence 12","pos":[-6,-12]},{"id":"w6","slot":"why","label":"One-item sheet, 5 machines","text":"The maintenance sheet for this machine listed a single item, a monthly oil top-up, and the same sheet was in use on the four other machines of this type on the line.","provenance":"fact","level":6,"source_quote":"The maintenance sheet for this machine listed a single item, a monthly oil top-up, and the same sheet was in use on the four other machines of this type on the line","source_ref":"narrator, sentence 14 (the maintenance sheet)","pos":[-6,-24]},{"id":"w7","slot":"why","label":"Routine cannot see filtration","text":"Nothing in the maintenance routine could detect a missing strainer: a sheet whose only item is an oil top-up inspects the oil, not the filtration, so the omission could persist from installation until the shaft failed.","provenance":"derived","level":7,"confidence":0.8,"rationale":"The contents of the sheet are stated; that a one-item sheet cannot catch a missing filter, and that the omission was therefore invisible to the routine rather than overlooked by an operator, is the step from the stated condition to its consequence.","pos":[-6,-36]},{"id":"rc","slot":"root_cause","label":"The standard omits filtration","text":"The root cause is a standard, not a part: the machine was accepted into service and maintained under a sheet that never mentions filtration, so a missing strainer was not something the routine could ever catch, and the same gap is live on the four sibling machines running the same sheet.","provenance":"derived","level":8,"confidence":0.75,"rationale":"Follows from three stated facts held together: no strainer was attached, the sheet's only item is an oil top-up, and that sheet covers four more machines. The missing part explains one stoppage; only the standard explains why the omission survived from installation and why the failure is latent elsewhere.","pos":[-6,-48],"size":1.5},{"id":"cm0","slot":"countermeasure","label":"Replace the fuse (shallow fix)","text":"Replacing the fuse is the countermeasure you reach by stopping at the first why; the record of two replacements in a year shows it had already been taken twice, clearing the symptom without touching the cause.","provenance":"derived","level":1,"confidence":0.7,"rationale":"The scenario states the two replacements but never calls them a countermeasure. Reading the record as two earlier stops at why one is what makes the recurrence meaningful, and it is the inference the framework exists to force.","pos":[40,36],"size":0.8},{"id":"cm1","slot":"countermeasure","label":"Fit a strainer to the pump","text":"The team fitted a strainer to the pump inlet and the line restarted.","provenance":"fact","level":5,"source_quote":"The team fitted a strainer to the pump inlet and the line restarted","source_ref":"narrator, sentence 13","pos":[40,-12]},{"id":"cm2","slot":"countermeasure","label":"Put filtration in the standard","text":"The countermeasure that matches the root cause changes the standard rather than the pump: a filtration item on the maintenance sheet, a strainer check at installation acceptance, and an audit of the four sibling machines running the same sheet.","provenance":"derived","level":8,"confidence":0.75,"rationale":"If the cause is the standard then only the standard can be the remedy, and the shared sheet makes the same failure latent on four other machines, so the countermeasure has to reach them. The scenario states the fix on one pump and nothing beyond it.","pos":[40,-48],"size":0.8}],"edges":[{"id":"ce1","from":"p","to":"w1","relation":"because","provenance":"fact","source_quote":"Why did the machine stop? There was an overload and the fuse blew","source_ref":"the first why, sentences 3-4"},{"id":"ce2","from":"w1","to":"w2","relation":"because","provenance":"fact","source_quote":"Why was there an overload? The bearing was not sufficiently lubricated","source_ref":"the second why, sentences 5-6"},{"id":"ce3","from":"w2","to":"w3","relation":"because","provenance":"fact","source_quote":"Why was it not lubricated sufficiently? The lubrication pump was not pumping sufficiently","source_ref":"the third why, sentences 7-8"},{"id":"ce4","from":"w3","to":"w4","relation":"because","provenance":"fact","source_quote":"Why was it not pumping sufficiently? The shaft of the pump was worn and rattling","source_ref":"the fourth why, sentences 9-10"},{"id":"ce5","from":"w4","to":"w5","relation":"because","provenance":"fact","source_quote":"Why was the shaft worn out? There was no strainer attached and metal scrap got in","source_ref":"the fifth why, sentences 11-12"},{"id":"ce6","from":"w5","to":"w6","relation":"because","provenance":"derived","confidence":0.6,"rationale":"The scenario states the missing strainer and, separately, what the sheet contains; that the sheet is why the strainer was missing and stayed missing is a sixth why nobody in the scenario asks."},{"id":"ce7","from":"w6","to":"w7","relation":"because","provenance":"derived","confidence":0.8,"rationale":"A one-item sheet is stated; that it makes filtration invisible to the routine is read off it."},{"id":"ce8","from":"w7","to":"rc","relation":"because","provenance":"derived","confidence":0.75,"rationale":"The blind routine is a consequence of the standard the routine is written from; the standard is the layer below it."},{"id":"ce9","from":"rc","to":"cm2","relation":"addressed_by","provenance":"derived","confidence":0.75,"rationale":"A countermeasure removes its cause: a standard that omits filtration is removed by putting filtration in the standard and auditing the machines that share it."},{"id":"ce10","from":"w5","to":"cm1","relation":"addressed_by","provenance":"derived","confidence":0.9,"rationale":"The scenario reports the strainer being fitted immediately after the missing strainer is found, but never states one as the remedy for the other; the step is close to forced."},{"id":"ce11","from":"w1","to":"cm0","relation":"addressed_by","provenance":"derived","confidence":0.7,"rationale":"Fuse replacement answers the first why and only the first why; the plant record shows it was the countermeasure actually taken twice before."},{"id":"cs1","from":"w7","to":"w6","relation":"supported_by","provenance":"derived","confidence":0.8},{"id":"cs2","from":"rc","to":"w5","relation":"supported_by","provenance":"derived","confidence":0.75},{"id":"cs3","from":"rc","to":"w6","relation":"supported_by","provenance":"derived","confidence":0.75},{"id":"cs4","from":"cm2","to":"w6","relation":"supported_by","provenance":"derived","confidence":0.75},{"id":"cs5","from":"cm0","to":"p2","relation":"supported_by","provenance":"derived","confidence":0.7},{"id":"cs6","from":"cm0","to":"w1","relation":"supported_by","provenance":"derived","confidence":0.7}]},{"id":"tbpn","kind":"tbpn","title":"Brian Armstrong on the Coinbase support-bribery breach","summary":"The CEO of the breached company walks the causal chain in one answer: customers socially engineered, support agents bribed for their name and address, the agents targeted most being overseas contractors, bribes that would move someone in the United States too, and a 24/7 coverage requirement that keeps the model in place. The layers below that, and the countermeasure that would reach them, are the graph's derived half.","insights":{"short":"Given Brian Armstrong's Crypto Day account of the Coinbase breach, where attackers bribed overseas support contractors for customer data, phished a handful of customers and demanded $20 million, applying 5 Whys we derived that agents hold standing access to identity data so a bribe buys a lookup, that the root cause is data worth far more than its holder's wage in a 24/7 outsourced function, and that the 60% AI resolution rate is a security control; the opportunity is a PII-redacting agent console, AI support sold as an insider-threat control, and continuous vendor-access attestation.","long":"The facts. On TBPN's Crypto Day, Brian Armstrong gave a first-person post-mortem of the Coinbase breach. Attackers bribed support agents, mostly overseas contractors, for customer names and addresses, phished a handful of customers, whom Coinbase reimbursed, then demanded $20 million not to release the data. No keys or funds were touched. He added that such bribes would have worked in the United States too, that 24/7 coverage rules out simply moving support onshore, that vendors had to be pushed to a higher bar, and that existing controls limited the scope but not enough.\n\nThe method. 5 Whys writes down each layer of cause until the answer is a structure, not a person, then asks which countermeasure reaches it. Armstrong states six layers but never names the arrangement that makes them all true at once; his countermeasures, relocation, the bounty and AI answering 60% of inquiries, each attach to a shallower one.\n\nWhat we derived. Resolving a ticket requires reading the customer's identity, so every agent holds standing read access and a bribe buys an ordinary lookup, not an intrusion (70%). The root cause is a standing mismatch, not a bribed individual: a 24/7, partly outsourced support function holds identity data worth orders of magnitude more than its holder's wage, and access is granted to people, not tasks, so relocation changes a bribe's price, not the exposure (65%). The 60% AI resolution rate is a security control: an agent that cannot be bribed removes part of the human surface (65%). Three countermeasures reach that cause. Opportunity: Insider-threat tooling for outsourced support: a PII-redacting agent console with per-ticket, time-boxed access grants, sold to fintechs whose BPO vendors are in practice their security perimeter. (60%). Opportunity: Sell AI customer support to regulated fintechs as an insider-threat control with an audited automation rate rather than as a cost saving: the buyer is the security owner, not the support budget. (65%). Opportunity: Continuous vendor-access attestation for support BPOs: live evidence of which vendor staff can read which customer fields, priced as a control that the regulator and the enterprise customer can both see. (55%)."},"source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-05-28_crypto-day-brian-armstrong-balaji-chris-dixon-katie-haun-more.md","date":"2025-05-28","episode_title":"Crypto Day (Brian Armstrong, Balaji, Chris Dixon, Katie Haun and more)","url":"https://podscripts.co/podcasts/tbpn-live/crypto-day-brian-armstrong-balaji-chris-dixon-katie-haun-more"},"why_this_episode":"Post-mortems in the corpus are usually one layer deep. Here the CEO of the company that was breached is asked how he handled the extortion attack and answers with six distinct causal layers in sequence, none of which blames the bribed agents, plus four countermeasures he actually took. A host then asks the framework's own question aloud, whether this is a technology, talent, oversight or policy issue, which is exactly the fork 5 Whys is built to resolve.","idea_bearing_slot":"countermeasure","layout":{"mode":"tree","root":"p1","direction":"down","regions":[{"label":"countermeasures","x":[33,77],"y":[-53,42],"color":"#9085e9"}],"guides":[{"from":[-64,32],"to":[-64,32],"style":"solid","label":"why 1"},{"from":[-64,19],"to":[-64,19],"style":"solid","label":"why 2"},{"from":[-64,5],"to":[-64,5],"style":"solid","label":"why 3"},{"from":[-64,-15],"to":[-64,-15],"style":"solid","label":"why 4"},{"from":[-59,-9],"to":[-59,-21],"style":"solid"},{"from":[-59,-9],"to":[-56,-9],"style":"solid"},{"from":[-59,-21],"to":[-56,-21],"style":"solid"},{"from":[-64,-33],"to":[-64,-33],"style":"solid","label":"root cause"},{"from":[-50,-3],"to":[32,-3],"style":"dashed"},{"from":[-64,-3],"to":[-64,-3],"style":"solid","label":"links inferred below"}]},"nodes":[{"id":"p1","slot":"problem","label":"Customers phished out of money","text":"A handful of Coinbase customers were successfully socially engineered into sending their money; Coinbase reimbursed them 100%.","provenance":"fact","level":0,"source_quote":"they were able to successfully do that with a handful of customers, which we've reimbursed 100% at this point","source_ref":"Brian Armstrong, L7520-L7522","entities":["Coinbase","Brian Armstrong"],"pos":[-16,45],"size":1.3},{"id":"p2","slot":"problem","label":"$20M extortion demand","text":"Once the attackers realised they had been found out, they demanded $20 million or they would release the stolen customer information.","provenance":"fact","level":0,"source_quote":"they sent us this demand for $20 million, or we're going to release all this information","source_ref":"Brian Armstrong, L7526-L7528","entities":["Coinbase","Brian Armstrong"],"pos":[20,45]},{"id":"p3","slot":"problem","label":"No keys or funds touched","text":"No private keys and no funds were accessed directly by the attacker: the failure was in the support and identity layer, not in custody.","provenance":"fact","level":0,"source_quote":"we didn't see any private keys or funds accessed directly by the attacker","source_ref":"Brian Armstrong, L7508-L7510","entities":["Coinbase","Brian Armstrong"],"pos":[-54,45]},{"id":"y1","slot":"why","label":"Attackers held customer PII","text":"The attackers held personal information on Coinbase customers: name, address, et cetera.","provenance":"fact","level":1,"source_quote":"personal information on, on customers, like name, address, et cetera","source_ref":"Brian Armstrong, L7512-L7514","entities":["Coinbase","Brian Armstrong"],"pos":[-16,32]},{"id":"y2","slot":"why","label":"Support agents were bribed","text":"The attackers bribed some of Coinbase's customer support agents to share that customer information with them.","provenance":"fact","level":2,"source_quote":"able to bribe some of our customer support agents","source_ref":"Brian Armstrong, L7512","entities":["Coinbase","Brian Armstrong"],"pos":[-16,19]},{"id":"y3","slot":"why","label":"Overseas contractors targeted most","text":"The support agents targeted most were overseas contractors.","provenance":"fact","level":3,"source_quote":"The ones that got targeted the most were these overseas contractors and things like that","source_ref":"Brian Armstrong, L7680-L7682","entities":["Coinbase","Brian Armstrong"],"pos":[4,5]},{"id":"y4","slot":"why","label":"Bribe outweighs the wage","text":"The money offered as bribes would have been impactful even if the agents had been in the United States.","provenance":"fact","level":4,"source_quote":"some of the money being offered as bribes would have been pretty impactful even in the United States if people were there","source_ref":"Brian Armstrong, L7684-L7688","entities":["Coinbase","Brian Armstrong"],"pos":[0,-9]},{"id":"y5","slot":"why","label":"24/7 coverage forces the model","text":"Coinbase needs 24/7 support coverage, so moving all of it into the United States and paying people more is not a perfect solution and does not fully solve the problem.","provenance":"fact","level":4,"source_quote":"We need to have 24-7 coverage, et cetera. So it's not perfect solution to like just move it all in the US and pay people more.","source_ref":"Brian Armstrong, L7690","entities":["Coinbase","Brian Armstrong"],"pos":[6,-21]},{"id":"y6","slot":"why","label":"Agents must read PII to work","text":"Resolving a support ticket requires reading the customer's identity, so every agent, in-house or contracted, holds standing read access to that data; a bribe buys an ordinary lookup rather than an intrusion.","provenance":"derived","level":3,"confidence":0.7,"entities":["Coinbase","Brian Armstrong"],"rationale":"Armstrong describes agents sharing name and address, not any system being broken into, and says the controls limited the scope of what was reached rather than preventing the reads. Standing task-level access is the only arrangement in which bribery alone yields customer identity data, and it is nowhere stated.","pos":[-38,5]},{"id":"y7","slot":"why","label":"Vendors held the same access","text":"The exposure was not only in Coinbase's own systems: third-party vendors it works with had to be pushed to hit a higher security bar.","provenance":"fact","level":4,"source_quote":"There's vendors that we work with that we needed to push them to hit a higher bar as well","source_ref":"Brian Armstrong, L7672-L7676","entities":["Coinbase","Brian Armstrong"],"pos":[-40,-9]},{"id":"y8","slot":"why","label":"Controls limited scope, not access","text":"Coinbase already had controls that limited the scope of what the bribed agents could reach, but, in Armstrong's words, it obviously did not do enough.","provenance":"fact","level":4,"source_quote":"luckily we had, we had some good controls already, which limited the scope of it, but we obviously didn't do enough","source_ref":"Brian Armstrong, L7696-L7698","entities":["Coinbase","Brian Armstrong"],"pos":[-48,-21]},{"id":"rc","slot":"root_cause","label":"Data worth more than its custodian","text":"The root cause is a standing mismatch rather than a bribed individual: a 24/7, partly outsourced support function must hold customer identity data whose value to an attacker is orders of magnitude above the wage of the person holding it, and access is granted to people rather than to tasks. Relocating the people changes the price of a bribe; it does not remove the exposure.","provenance":"derived","level":5,"confidence":0.65,"entities":["Coinbase","Brian Armstrong"],"rationale":"Holds together four stated facts that no speaker joins: the 24/7 constraint that keeps support distributed, the bribe-versus-wage economics, the vendor gap, and the admission that scope-limiting controls were not enough. None of them alone is the cause; the arrangement that makes all four true at once is the layer below the last stated why.","pos":[-16,-33],"size":1.5},{"id":"c0","slot":"countermeasure","label":"Host: CX entirely code","text":"A host proposes that a more secure customer-experience function would in future be entirely code, or at least carry AI oversight of every interaction.","provenance":"fact","level":2,"source_quote":"is there's a world in the future where a more secure CX function would be entirely code","source_ref":"Host, L7630-L7632; the AI-oversight clause at L7640","entities":["Coinbase","Brian Armstrong"],"pos":[54,8]},{"id":"c1","slot":"countermeasure","label":"Relocate support operations","text":"Coinbase relocated some of its customer support operations.","provenance":"fact","level":3,"source_quote":"We did relocate some of our customer support operations","source_ref":"Brian Armstrong, L7678","entities":["Coinbase","Brian Armstrong"],"pos":[54,-1]},{"id":"c2","slot":"countermeasure","label":"$20M bounty as deterrent","text":"Coinbase flipped the extortion demand and put out a $20 million bounty for information leading to the attackers' arrest and conviction.","provenance":"fact","level":1,"source_quote":"we put out a 20 million dollar bounty for any information leading to their arrest","source_ref":"Brian Armstrong, L7550","entities":["Coinbase","Brian Armstrong"],"pos":[54,32]},{"id":"c3","slot":"countermeasure","label":"60% of inquiries answered by AI","text":"About 60% of Coinbase's customer support inquiries are now answered by AI.","provenance":"fact","level":2,"source_quote":"Our customer support, I think maybe 60% of inquiries are being answered by AI now","source_ref":"Brian Armstrong, L7366","entities":["Coinbase","Brian Armstrong"],"pos":[54,19]},{"id":"c4","slot":"countermeasure","label":"Take PII out of the human path","text":"The countermeasure that matches the root cause removes identity data from the human path: tickets resolved against tokenised references with per-ticket, time-boxed grants, so an agent, contractor or vendor can act on an account without ever reading name and address, and the bribe buys nothing worth paying for.","provenance":"derived","level":5,"confidence":0.6,"entities":["Coinbase","Brian Armstrong"],"rationale":"Follows from the root cause: if the exposure is standing human access to plaintext identity data, only removing that access removes it. The transcript states the scope-limiting controls and the vendor gap but never names access redesign, which is what the countermeasure slot forces you to write down.","idea":"Insider-threat tooling for outsourced support: a PII-redacting agent console with per-ticket, time-boxed access grants, sold to fintechs whose BPO vendors are in practice their security perimeter.","pos":[54,-25],"size":0.8},{"id":"c5","slot":"countermeasure","label":"AI support as a security control","text":"The 60% AI resolution rate is already a security control and not only a margin story: an agent that cannot be bribed removes part of the human surface, and the human-in-the-loop cases that remain carry the whole residual risk.","provenance":"derived","level":5,"confidence":0.65,"entities":["Coinbase","Brian Armstrong"],"rationale":"Armstrong answers a security question with the automation number and the remark that the AI is not going to get bribed, which makes automation rate a control metric. That reframing, and the corollary that the remaining human cases concentrate the risk, is not stated.","idea":"Sell AI customer support to regulated fintechs as an insider-threat control with an audited automation rate rather than as a cost saving: the buyer is the security owner, not the support budget.","pos":[54,-35],"size":0.8},{"id":"c6","slot":"countermeasure","label":"Continuous vendor attestation","text":"Because a vendor's controls are in practice the company's controls, the countermeasure extends past a contractual bar to continuous evidence: standing proof of which vendor staff can read which customer fields, rather than a point-in-time attestation.","provenance":"derived","level":5,"confidence":0.55,"entities":["Coinbase","Brian Armstrong"],"rationale":"Armstrong states that vendors had to be pushed to a higher bar but not how a bar is kept once pushed. The step from a one-off push to continuous verification is an inference, and a contestable one, since a contractual bar plus an annual audit is the industry's current answer.","idea":"Continuous vendor-access attestation for support BPOs: live evidence of which vendor staff can read which customer fields, priced as a control that the regulator and the enterprise customer can both see.","pos":[54,-45],"size":0.8}],"edges":[{"id":"t1","from":"p1","to":"y1","relation":"because","provenance":"fact","source_quote":"Attackers want this information because they want to text people, call people, try to socially engineer them and to get them to send their money","source_ref":"Brian Armstrong, L7516-L7518"},{"id":"t2","from":"y1","to":"y2","relation":"because","provenance":"fact","source_quote":"able to bribe some of our customer support agents and to share with them like personal information on, on customers","source_ref":"Brian Armstrong, L7512-L7514"},{"id":"t3","from":"y2","to":"y3","relation":"because","provenance":"fact","source_quote":"The ones that got targeted the most were these overseas contractors and things like that","source_ref":"Brian Armstrong, L7680-L7682"},{"id":"t4","from":"y3","to":"y4","relation":"because","provenance":"derived","confidence":0.75,"rationale":"Armstrong gives the size of the bribes immediately after saying which agents were targeted most, but never states the first as the reason for the second; that the wage gap is what made those agents the ones approached is the standard reading of the two lines together."},{"id":"t5","from":"y3","to":"y5","relation":"because","provenance":"derived","confidence":0.7,"rationale":"The 24/7 requirement is given as the reason support cannot simply move to the United States, which implies it is also why the work sits with overseas contractors in the first place. The constraint is stated; this causal step is not."},{"id":"t6","from":"y2","to":"y6","relation":"because","provenance":"derived","confidence":0.7,"rationale":"The bribe produced name and address with no system broken into, which only works if the agents can read that data as a matter of routine."},{"id":"t7","from":"y6","to":"y8","relation":"because","provenance":"derived","confidence":0.65,"rationale":"Controls that limit the scope of a breach without removing the access are exactly what standing read access looks like from the inside; joining the admission to the mechanism is the inference."},{"id":"t8","from":"y6","to":"y7","relation":"because","provenance":"derived","confidence":0.6,"rationale":"Armstrong says the exposure was not only in Coinbase's own systems. That vendor staff hold the same standing access, and that this is why the vendors had to be pushed, is the reading, not the statement."},{"id":"t9","from":"y5","to":"rc","relation":"because","provenance":"derived","confidence":0.65,"rationale":"The staffing model that 24/7 coverage forces is one of the four conditions the root cause names."},{"id":"t10","from":"y8","to":"rc","relation":"because","provenance":"derived","confidence":0.7,"rationale":"Scope-limiting controls that were not enough is the access half of the root cause, stated by the person who owns it."},{"id":"t11","from":"y7","to":"rc","relation":"because","provenance":"derived","confidence":0.6,"rationale":"The vendor perimeter extends the same mismatch to people Coinbase does not employ."},{"id":"t12","from":"y4","to":"rc","relation":"because","provenance":"derived","confidence":0.65,"rationale":"The bribe-versus-wage economics is the value half of the mismatch: the data is worth far more to the attacker than the custodian is paid."},{"id":"t13","from":"y3","to":"c1","relation":"addressed_by","provenance":"fact","source_quote":"We did relocate some of our customer support operations. The ones that got targeted the most were these overseas contractors","source_ref":"Brian Armstrong, L7678-L7682"},{"id":"t14","from":"p2","to":"c2","relation":"addressed_by","provenance":"fact","source_quote":"We decided to flip it and as you probably saw, we put out a $20 million bounty for any","source_ref":"Brian Armstrong, L7548-L7550"},{"id":"t15","from":"y2","to":"c3","relation":"addressed_by","provenance":"fact","source_quote":"the 60% of inquiries being answered by AI now, I mean, they're not going to get bribed","source_ref":"Brian Armstrong, L7646-L7648"},{"id":"t16","from":"y2","to":"c0","relation":"addressed_by","provenance":"derived","confidence":0.65,"rationale":"The host offers an all-code CX function in answer to the security question; that it is a countermeasure to bribery specifically, because a code path has nobody to bribe, is the reading of it."},{"id":"t17","from":"rc","to":"c4","relation":"addressed_by","provenance":"derived","confidence":0.6,"rationale":"Removing standing human access to identity data is the only countermeasure that acts on the mismatch itself rather than on its price."},{"id":"t18","from":"rc","to":"c5","relation":"addressed_by","provenance":"derived","confidence":0.6,"rationale":"Every inquiry resolved without a human removes a custodian from the population that can be bribed."},{"id":"t19","from":"rc","to":"c6","relation":"addressed_by","provenance":"derived","confidence":0.55,"rationale":"The mismatch reaches vendor staff, so a countermeasure that stops at Coinbase's own systems leaves it in place."},{"id":"ts1","from":"y6","to":"y2","relation":"supported_by","provenance":"derived","confidence":0.7},{"id":"ts2","from":"y6","to":"y1","relation":"supported_by","provenance":"derived","confidence":0.7},{"id":"ts3","from":"rc","to":"y5","relation":"supported_by","provenance":"derived","confidence":0.65},{"id":"ts4","from":"rc","to":"y8","relation":"supported_by","provenance":"derived","confidence":0.65},{"id":"ts5","from":"rc","to":"y4","relation":"supported_by","provenance":"derived","confidence":0.65},{"id":"ts6","from":"rc","to":"p3","relation":"supported_by","provenance":"derived","confidence":0.6},{"id":"ts7","from":"c4","to":"y8","relation":"supported_by","provenance":"derived","confidence":0.6},{"id":"ts8","from":"c4","to":"y1","relation":"supported_by","provenance":"derived","confidence":0.6},{"id":"ts9","from":"c5","to":"c3","relation":"supported_by","provenance":"derived","confidence":0.65},{"id":"ts10","from":"c5","to":"c0","relation":"supported_by","provenance":"derived","confidence":0.65},{"id":"ts11","from":"c6","to":"y7","relation":"supported_by","provenance":"derived","confidence":0.55}]}]}</script>
