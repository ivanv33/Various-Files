<title>Framework graph</title>
<style>
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;      /* page plane */
    --surface: #1a1a19;    /* chart surface (canvas background) */
    --card: #202020;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --schema: #898781;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--plane); color: var(--ink-2); font: 14px/1.45 var(--sans); }
  a { color: var(--ink-2); }
  a:hover { color: var(--ink); }
  kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--hairline); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  button, .seg button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  body { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header.bar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); }
  .title { display: flex; flex-direction: column; min-width: 220px; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 17px; font-weight: 600; margin: 2px 0 0; color: var(--ink); letter-spacing: -.01em; }
  .links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .links a:hover { color: var(--ink); border-color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-left: auto; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .toggles input { accent-color: var(--accent); }
  .toggles button { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggles button:hover { color: var(--ink); border-color: var(--muted); }

  main { position: relative; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #labels * { pointer-events: none; }
  .nlabel { font: 12px/1.2 var(--sans); color: var(--ink-2); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
  .nlabel .lab { display: inline-block; transform: translateY(11px); background: rgba(26,26,25,.72); padding: 0 4px; border-radius: 3px; }
  .nlabel.derived { color: var(--ink-2); font-style: italic; }
  .nlabel.schema { color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .nlabel .g { font-size: 9px; margin-right: 4px; vertical-align: 1px; }
  .nlabel .idea-star { color: #eda100; margin-right: 3px; }
  #panel .idea { border-left: 2px solid #eda100; padding: 6px 10px; margin: 8px 0; color: var(--ink); background: rgba(237,161,0,.07); }
  .elabel { font: 11px var(--mono); color: var(--muted); background: var(--surface); padding: 0 4px; border-radius: 3px; }
  .axlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tick { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .rlabel { font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .glabel { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

  #tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 5; }
  #tooltip .t-label { color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-meta { font: 11px var(--mono); color: var(--muted); }

  .card { position: absolute; background: rgba(32,32,32,.94); border: 1px solid var(--hairline); border-radius: 8px; backdrop-filter: blur(6px); }
  #legend { left: 12px; bottom: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; font-size: 12px; }
  #legend h2 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
  #legend h2:first-child { margin-top: 0; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .chip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.box { border-radius: 2px; }
  .chip.diamond { border-radius: 2px; transform: rotate(45deg); }
  .chip.cone { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .slot-row .n { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .slot-row .tp { font: 10px var(--mono); color: var(--muted); }
  .key-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--ink-2); }
  .key-row .sym { width: 14px; text-align: center; color: var(--ink); }
  .stats { font: 11px/1.6 var(--mono); color: var(--muted); border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 6px; }
  .stats b { color: var(--ink-2); font-weight: 500; }

  /* example note: a strip under the header, never over the graph */
  #note { display: grid; grid-template-columns: minmax(160px, 24%) 1fr minmax(160px, 22%); gap: 6px 20px; align-items: baseline; padding: 7px 16px; border-bottom: 1px solid var(--hairline); background: var(--plane); font-size: 12px; }
  #note h3 { margin: 0; font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.35; }
  #note p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #note:hover p, #note:focus-within p { -webkit-line-clamp: unset; }
  #note .src { font: 11px var(--mono); color: var(--muted); word-break: break-word; text-align: right; }

  #panel { right: 12px; top: 12px; bottom: 12px; width: 340px; padding: 12px 14px; overflow: auto; font-size: 13px; z-index: 4; }
  #panel[hidden] { display: none; }
  #panel .p-head { display: flex; align-items: flex-start; gap: 8px; }
  #panel .p-slot { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #panel h3 { margin: 4px 0 6px; font-size: 15px; color: var(--ink); font-weight: 600; line-height: 1.3; }
  #panel .close { margin-left: auto; background: transparent; border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex: none; }
  .badge { display: inline-block; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--muted); color: var(--ink); }
  .badge.fact { background: var(--ink-2); color: var(--plane); border-color: var(--ink-2); }
  .badge.derived { border-style: dashed; }
  .badge.schema { color: var(--muted); }
  #panel p { margin: 8px 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--muted); color: var(--ink-2); font-style: italic; }
  #panel .ref, #panel .conf { font: 11px var(--mono); color: var(--muted); }
  #panel h4 { font: 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
  #panel ul { margin: 0; padding-left: 16px; }
  #panel li { margin: 2px 0; }
  #panel li .rel { font: 11px var(--mono); color: var(--muted); }
  .confbar { height: 3px; background: var(--hairline); border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
  .confbar i { display: block; height: 100%; background: var(--ink-2); }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  #fallback[hidden] { display: none; }
  #fallback code { font: 12px var(--mono); color: var(--ink-2); }

  @media (max-width: 820px) {
    #legend { width: min(240px, 60%); max-height: 42%; font-size: 11px; }
    #note { grid-template-columns: 1fr; }
    #note .src { text-align: left; }
    #panel { left: 12px; width: auto; top: auto; max-height: 60%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="graph-data" type="application/json">{"framework":{"slug":"rumelt-strategy-kernel","name":"Rumelt's Strategic Kernel","category":"02-strategic-and-business","wikipedia":"https://en.wikipedia.org/wiki/Richard_Rumelt","one_liner":"Strips the slogans off a strategy and keeps only three things: a diagnosis that names the critical obstacle, a guiding policy that says how it will be met and what that costs, and coherent actions that carry the policy out and reinforce one another."},"slots":[{"id":"challenge","label":"Challenge","description":"The situation as described, before diagnosis: the pressures, numbers and complaints a speaker reports.","typical_provenance":"fact","color":"#7a8fa6","shape":"box"},{"id":"fluff","label":"Fluff","description":"Stated goals, missions and slogans that are not strategy; kept in the graph so the reader sees exactly what was stripped away.","typical_provenance":"fact","color":"#8a6fc4","shape":"cone"},{"id":"diagnosis","label":"Diagnosis","description":"The critical obstacle, named. Sometimes a speaker states one; the obstacle that actually binds is usually inferred.","typical_provenance":"derived","color":"#d94f3d","shape":"diamond"},{"id":"guiding_policy","label":"Guiding policy","description":"The overall approach chosen to meet the diagnosed obstacle, and the trade-off it accepts: what will not be done.","typical_provenance":"either","color":"#3f7fb5","shape":"sphere"},{"id":"coherent_action","label":"Coherent action","description":"A resource commitment that implements the policy and reinforces the other actions rather than competing with them.","typical_provenance":"either","color":"#4a9d6a","shape":"box"}],"relations":[{"id":"diagnoses","label":"diagnoses","description":"the diagnosis names the critical obstacle inside the challenge"},{"id":"addresses","label":"addresses","description":"the guiding policy addresses the diagnosed obstacle"},{"id":"implements","label":"implements","description":"the action commits resources that carry out the policy"},{"id":"reinforces","label":"reinforces","description":"the action makes another action cheaper, easier or more effective"},{"id":"masks","label":"masks","description":"the fluff stands where a challenge or a diagnosis should be, and hides it"}],"examples":[{"id":"classic","kind":"classic","title":"Apple, 1997: three objectives, or one rule","summary":"Apple's circulating plan named three objectives and no obstacle. The kernel that replaced it was one stated rule, a set of cuts that fed it, and a diagnosis nobody wrote down: the company's scope was sized for a share it did not have.","source":{"type":"text","title":"Apple in the summer of 1997","attribution":"Condensed from Richard Rumelt's account of the Apple turnaround in Good Strategy / Bad Strategy (2011), chapters 1 and 5. The three objectives stand for the goals-as-strategy plans of the period rather than quoting one document.","text":"In the summer of 1997 Apple was about ninety days from insolvency. Its share of the personal computer market was under four per cent, against a Windows-Intel standard that had already won the volume game, and the plan in circulation named objectives rather than obstacles: to regain lost market share, to return the company to profitability, and to reassert Apple as the industry's leader in innovation. Apple was selling more than a dozen Macintosh model families in overlapping configurations, together with the Newton handheld, printers and other peripherals, and it had licensed the Macintosh operating system to clone makers who sold to the same buyers Apple sold to. When Steve Jobs returned as interim chief executive he drew a two-by-two grid and said Apple would make four computers and nothing else: a desktop and a portable for consumers, a desktop and a portable for professionals. He ended the Newton, the printers and the clone licences, because none of them fed the four. He cut inventory and the number of distributors, moved manufacturing to contract assemblers, and opened a direct online store that sold Apple machines without a middleman. Asked in 1998 how a company with so small a share could survive in the long run against the scale of the Wintel machine, Jobs answered that he was going to wait for the next big thing."},"layout":{"mode":"plane","regions":[{"label":"Fluff (not strategy)","x":[-80,-48],"y":[-62,58],"color":"#8a6fc4"},{"label":"Challenge","x":[-40,78],"y":[29.5,58],"color":"#7a8fa6"},{"label":"Diagnosis","x":[-40,78],"y":[-3,28.5],"color":"#d94f3d"},{"label":"Guiding policy","x":[-40,78],"y":[-32.5,-4.5],"color":"#3f7fb5"},{"label":"Coherent actions","x":[-40,78],"y":[-62,-34],"color":"#4a9d6a"}]},"nodes":[{"id":"c1","slot":"challenge","label":"Ninety days from insolvency","text":"In the summer of 1997 Apple was roughly ninety days from running out of cash.","provenance":"fact","source_quote":"Apple was about ninety days from insolvency","source_ref":"sentence 1","entities":["Apple"],"pos":[-22,50]},{"id":"c2","slot":"challenge","label":"Under four per cent share","text":"Apple held under four per cent of the personal computer market, against a Windows-Intel standard that had already won the volume game.","provenance":"fact","source_quote":"Its share of the personal computer market was under four per cent","source_ref":"sentence 2","entities":["Apple"],"pos":[19,50]},{"id":"c3","slot":"challenge","label":"A dozen overlapping model families","text":"Apple was selling more than a dozen Macintosh model families in overlapping configurations, together with the Newton handheld, printers and other peripherals.","provenance":"fact","source_quote":"selling more than a dozen Macintosh model families in overlapping configurations","source_ref":"sentence 3","entities":["Apple","Macintosh","Newton"],"pos":[60,50]},{"id":"c4","slot":"challenge","label":"Clones sold to the same buyers","text":"Apple had licensed the Macintosh operating system to clone makers who sold to the same buyers Apple sold to.","provenance":"fact","source_quote":"it had licensed the Macintosh operating system to clone makers who sold to the same buyers Apple sold to","source_ref":"sentence 3","entities":["Apple","Macintosh"],"pos":[19,38]},{"id":"f1","slot":"fluff","label":"Regain lost market share","text":"The plan's first objective was to regain lost market share.","provenance":"fact","source_quote":"to regain lost market share","source_ref":"sentence 2, the plan in circulation","entities":["Apple"],"pos":[-64,45],"size":0.85},{"id":"f2","slot":"fluff","label":"Return to profitability","text":"The plan's second objective was to return the company to profitability.","provenance":"fact","source_quote":"to return the company to profitability","source_ref":"sentence 2, the plan in circulation","entities":["Apple"],"pos":[-64,33],"size":0.85},{"id":"f3","slot":"fluff","label":"Reassert innovation leadership","text":"The plan's third objective was to reassert Apple as the industry's leader in innovation.","provenance":"fact","source_quote":"to reassert Apple as the industry's leader in innovation","source_ref":"sentence 2, the plan in circulation","entities":["Apple"],"pos":[-64,21],"size":0.85},{"id":"d1","slot":"diagnosis","label":"Scope sized for a share Apple lacked","text":"The critical obstacle was not a lack of ambition but a portfolio, a licensing programme and a distribution system sized for a company many times Apple's share; nothing in the plan could be attempted until scope was cut to what four per cent of the market could fund.","provenance":"derived","confidence":0.85,"rationale":"The scenario gives the product count, the clone licences and the cash position separately and never says what connects them. Reading them as one obstacle - scope exceeding scale - is precisely the diagnosis the plan omits, and it is what makes the cash deadline binding rather than merely alarming.","entities":["Apple"],"pos":[-22,12],"size":1.15},{"id":"d2","slot":"diagnosis","label":"The volume game was lost","text":"Apple could not beat the Windows-Intel standard on volume, so a market-share objective was a wish rather than a route; the reachable position was a small, profitable, differentiated one.","provenance":"derived","confidence":0.85,"rationale":"The text states the share and that the standard had won the volume game. That this makes the share objective unreachable, and that a small differentiated position is what remains, is the step the text does not take.","entities":["Apple"],"pos":[19,12],"size":1.15},{"id":"d3","slot":"diagnosis","label":"Clones split the one franchise","text":"Licensing the operating system turned Apple's only proprietary asset into a commodity sold against Apple's own machines, so the clone programme subtracted from the franchise the plan wanted to grow.","provenance":"derived","confidence":0.75,"rationale":"The scenario says the clones sold to the same buyers. That this made the licences self-defeating rather than merely competitive, because the operating system was the only thing Apple owned that its rivals did not, is an inference.","entities":["Apple","Macintosh"],"pos":[60,12],"size":1.15},{"id":"g1","slot":"guiding_policy","label":"Four computers and nothing else","text":"Jobs's stated rule on his return: Apple would make four computers and nothing else.","provenance":"fact","source_quote":"Apple would make four computers and nothing else","source_ref":"sentence 4, Jobs","entities":["Apple","Steve Jobs"],"pos":[-10,-12.5]},{"id":"g2","slot":"guiding_policy","label":"Wait for the next big thing","text":"Asked how a company with so small a share could survive against Wintel's scale, Jobs answered that he was going to wait for the next big thing.","provenance":"fact","source_quote":"he was going to wait for the next big thing","source_ref":"sentence 7, Jobs","entities":["Apple","Steve Jobs"],"pos":[48,-12.5]},{"id":"g3","slot":"guiding_policy","label":"Concentrate on one platform","text":"The approach underneath the rule was concentration: one operating system, one narrow line, and every resource pointed at the few things a four-per-cent company could still do better than anyone.","provenance":"derived","confidence":0.8,"rationale":"No sentence states a policy. It is the common shape of every action taken - the four-product line, the cancellations, the channel and manufacturing cuts - read back as the direction that generated them rather than as five separate decisions.","entities":["Apple"],"pos":[-10,-24.5]},{"id":"g4","slot":"guiding_policy","label":"Trade-off: stop contesting share","text":"The policy's accepted cost was the objective the plan had led with. Apple would stop contesting the volume market, stop serving every segment and stop earning licence revenue, in exchange for a line it could fund and a company that survived to the next wave.","provenance":"derived","confidence":0.75,"rationale":"Rumelt's test for a guiding policy is what it gives up. The scenario lists cancellations but never states what was surrendered by making them; naming the abandoned share objective is what turns a list of cuts into a policy with a price.","entities":["Apple"],"pos":[48,-24.5]},{"id":"a1","slot":"coherent_action","label":"Consumer/pro, desktop/portable","text":"The line was cut to a desktop and a portable for consumers and a desktop and a portable for professionals.","provenance":"fact","source_quote":"a desktop and a portable for consumers, a desktop and a portable for professionals","source_ref":"sentence 4","entities":["Apple"],"pos":[-22,-42]},{"id":"a2","slot":"coherent_action","label":"End Newton, printers, clones","text":"Apple ended the Newton, the printers and the clone licences.","provenance":"fact","source_quote":"He ended the Newton, the printers and the clone licences","source_ref":"sentence 5","entities":["Apple","Newton"],"pos":[19,-42]},{"id":"a3","slot":"coherent_action","label":"Cut inventory and distributors","text":"Apple cut inventory and the number of distributors it sold through.","provenance":"fact","source_quote":"He cut inventory and the number of distributors","source_ref":"sentence 6","entities":["Apple"],"pos":[60,-42]},{"id":"a4","slot":"coherent_action","label":"Move to contract assemblers","text":"Manufacturing moved to contract assemblers.","provenance":"fact","source_quote":"moved manufacturing to contract assemblers","source_ref":"sentence 6","entities":["Apple"],"pos":[-22,-54]},{"id":"a5","slot":"coherent_action","label":"Open a direct online store","text":"Apple opened a direct online store that sold its machines without a middleman.","provenance":"fact","source_quote":"opened a direct online store that sold Apple machines without a middleman","source_ref":"sentence 6","entities":["Apple"],"pos":[19,-54]},{"id":"a6","slot":"coherent_action","label":"Each cut feeds the four","text":"The cancellations, the channel cuts and the outsourcing are one move rather than five: every engineer, dollar and shelf released by killing a product line or a distributor tier is one the four remaining computers can use.","provenance":"derived","confidence":0.7,"rationale":"The scenario lists the actions in sequence and never says they are connected. Reading them as transfers into a single line, rather than as independent cost cuts, is the coherence test the framework applies and the reason the set counts as a strategy.","entities":["Apple"],"pos":[60,-54]}],"edges":[{"id":"ce1","from":"a1","to":"g1","relation":"implements","provenance":"fact","source_quote":"Apple would make four computers and nothing else: a desktop and a portable for consumers, a desktop and a portable for professionals","source_ref":"sentence 4, Jobs","rationale":"The colon states the connection: the four-quadrant line is the content of the rule, not a separate decision."},{"id":"ce2","from":"a2","to":"g1","relation":"implements","provenance":"fact","source_quote":"He ended the Newton, the printers and the clone licences, because none of them fed the four.","source_ref":"sentence 5","rationale":"The scenario's own 'because' ties the cancellations to the four-computer rule."},{"id":"ce3","from":"f1","to":"c2","relation":"masks","provenance":"derived","confidence":0.8,"rationale":"The share objective restates the fact that share is low. It names no obstacle and no route, so it occupies the place where the diagnosis of the lost volume game should be."},{"id":"ce4","from":"f2","to":"c1","relation":"masks","provenance":"derived","confidence":0.75,"rationale":"Returning to profitability is the outcome the cash deadline demands; stating it as an objective hides that nothing in the plan changes the cost base that caused the deadline."},{"id":"ce5","from":"f3","to":"c3","relation":"masks","provenance":"derived","confidence":0.65,"rationale":"An innovation-leadership objective reads as a reason to keep every project alive, which is exactly the sprawl that made the company unfundable; the slogan argues against the cut it needed."},{"id":"ce6","from":"d1","to":"c3","relation":"diagnoses","provenance":"derived","confidence":0.85,"rationale":"Names the model count as a symptom of scope exceeding scale rather than as a product problem."},{"id":"ce7","from":"d2","to":"c2","relation":"diagnoses","provenance":"derived","confidence":0.85,"rationale":"Reads the share number together with the statement that the standard had won, and takes the volume contest to be closed."},{"id":"ce8","from":"d3","to":"c4","relation":"diagnoses","provenance":"derived","confidence":0.75,"rationale":"Treats the licensing programme as the obstacle rather than as a revenue line, because the clones sold to Apple's own buyers."},{"id":"ce9","from":"d1","to":"c1","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The ninety-day cash position is what makes scope, rather than ambition, the binding constraint."},{"id":"ce10","from":"d1","to":"c4","relation":"supported_by","provenance":"derived","confidence":0.75,"rationale":"The clone programme is a second commitment sized for a bigger company."},{"id":"ce11","from":"d3","to":"c3","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"The overlapping Macintosh families and the clones compete in the same configurations, which is what makes the split visible."},{"id":"ce12","from":"g3","to":"d1","relation":"addresses","provenance":"derived","confidence":0.85,"rationale":"Concentration is the direct answer to scope exceeding scale: it removes commitments rather than adding them."},{"id":"ce13","from":"g2","to":"d2","relation":"addresses","provenance":"derived","confidence":0.7,"rationale":"Waiting for the next big thing is an answer to a lost volume contest, not to a cash crisis: it concedes the current game and buys position in the next one."},{"id":"ce14","from":"g4","to":"d2","relation":"addresses","provenance":"derived","confidence":0.75,"rationale":"The trade-off is intelligible only once the volume game is taken to be lost; otherwise abandoning share is simply a loss."},{"id":"ce15","from":"g1","to":"d1","relation":"addresses","provenance":"derived","confidence":0.8,"rationale":"The stated rule is the sharp instrument for the unstated diagnosis; the scenario gives the rule but never says what obstacle it was aimed at."},{"id":"ce16","from":"g3","to":"g1","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The four-computer rule is the clearest evidence of the concentration policy."},{"id":"ce17","from":"g4","to":"c2","relation":"supported_by","provenance":"derived","confidence":0.75,"rationale":"The four-per-cent share is the number that makes giving up the share contest a real cost rather than a rhetorical one."},{"id":"ce18","from":"a3","to":"g3","relation":"implements","provenance":"derived","confidence":0.75,"rationale":"Cutting inventory and distributors concentrates working capital and channel attention; the scenario does not say it was done for that reason."},{"id":"ce19","from":"a4","to":"g3","relation":"implements","provenance":"derived","confidence":0.7,"rationale":"Outsourcing assembly moves capital out of a capability Apple did not need to own once the line was four products wide."},{"id":"ce20","from":"a5","to":"g3","relation":"implements","provenance":"derived","confidence":0.7,"rationale":"A direct store is the distribution form a four-product line can support without a distributor tier."},{"id":"ce21","from":"a6","to":"g3","relation":"implements","provenance":"derived","confidence":0.65,"rationale":"Coherence is itself the policy's requirement: the cuts count as implementation only because their proceeds go to the same place."},{"id":"ce22","from":"a2","to":"a1","relation":"reinforces","provenance":"derived","confidence":0.8,"rationale":"The engineering and cash released by ending the Newton, the printers and the clones is what the four computers were funded with."},{"id":"ce23","from":"a3","to":"a4","relation":"reinforces","provenance":"derived","confidence":0.7,"rationale":"Fewer models and fewer distributors make demand predictable enough for contract assembly to work without large buffers."},{"id":"ce24","from":"a5","to":"a3","relation":"reinforces","provenance":"derived","confidence":0.7,"rationale":"A direct store replaces the volume the cut distributors carried, which is what makes the channel cut survivable."},{"id":"ce25","from":"a6","to":"a2","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"The cancellations are the largest of the transfers into the four-product line."},{"id":"ce26","from":"a6","to":"a3","relation":"supported_by","provenance":"derived","confidence":0.65,"rationale":"The inventory and channel cuts free working capital that the same four products consume."}]},{"id":"tbpn","kind":"tbpn","title":"Max Levchin on Affirm: the mission, and the policy underneath it","summary":"Levchin states a mission he is proud has not changed a word in fifteen years, and then, minutes later, states the actual guiding policy and its price: no late fees, no compounding interest, and therefore less margin. The diagnosis that makes the policy survivable is never said out loud.","source":{"type":"transcript","file":"tbpn-transcripts/transcripts/2025-08-29_pop-mart-the-history-economics-max-levchin-jim-belosic.md","date":"2025-08-29","episode_title":"Pop Mart, the history & economics, Max Levchin, Jim Belosic","url":"https://podscripts.co/podcasts/tbpn-live/pop-mart-the-history-economics-max-levchin-jim-belosic"},"why_this_episode":"In one uninterrupted interview Levchin supplies every part of the kernel and, unusually, the fluff as well: two mission statements and two claims of superiority sit a few minutes from a guiding policy with its trade-off named out loud ('you have less margin and less opportunity for margin'), a stated industry diagnosis, and four resource commitments. It is the rare founder segment where the slogan and the strategy are both on the record, so the framework can show one being stripped off the other.","idea_bearing_slot":"diagnosis","layout":{"mode":"plane","regions":[{"label":"Fluff (not strategy)","x":[-80,-48],"y":[-62,58],"color":"#8a6fc4"},{"label":"Challenge","x":[-40,78],"y":[29.5,58],"color":"#7a8fa6"},{"label":"Diagnosis","x":[-40,78],"y":[-3,28.5],"color":"#d94f3d"},{"label":"Guiding policy","x":[-40,78],"y":[-32.5,-4.5],"color":"#3f7fb5"},{"label":"Coherent actions","x":[-40,78],"y":[-62,-34],"color":"#4a9d6a"}]},"nodes":[{"id":"c1","slot":"challenge","label":"Told: that's where the profit is","text":"Levchin was told repeatedly that a lender without late fees and compounding interest could not survive, because that is where the industry's profit is and the whole industry depends on it.","provenance":"fact","source_quote":"And I was told over and over again by people like, this is stupid. One, that's where the profit is, but two, you can't survive. Like the whole industry depends on this.","source_ref":"Max Levchin, L5112-L5116","entities":["Affirm","Max Levchin"],"pos":[-22,50]},{"id":"c2","slot":"challenge","label":"Lending is a dirty industry","text":"Levchin describes lending as the part of financial services you do not touch: a dirty industry that people with a choice stay away from.","provenance":"fact","source_quote":"like lending is kind of a dirty industry","source_ref":"Max Levchin, L5094-L5096","entities":["Affirm","Max Levchin"],"pos":[19,50]},{"id":"c3","slot":"challenge","label":"Rates would kill the model","text":"The standing criticism the hosts put to him: the model will never work in a high interest rate environment.","provenance":"fact","source_quote":"The model will never work in a high interest rate environment, right?","source_ref":"TBPN host, L4566","entities":["Affirm"],"pos":[60,50]},{"id":"c4","slot":"challenge","label":"Consumers wave off the asterisk","text":"Consumers see a headline zero and discount the footnote; Levchin contrasts them with machines, which will not make that mistake.","provenance":"fact","source_quote":"the machines will not make the mistake that consumers make when they're like, oh, it's a big zero. I have the asterisk. I don't care about the asterisk.","source_ref":"Max Levchin, L5118","entities":["Affirm","Max Levchin"],"pos":[-10,38]},{"id":"c5","slot":"challenge","label":"Bad products get demoted by AI","text":"Levchin's forecast for the market: a financial product that is not good for consumers will be naturally demoted by the next generation of search engines, which are the AI bots.","provenance":"fact","source_quote":"where if it's not good for consumers, it will be naturally demoted by the next generation of search engines, which are the AI bots.","source_ref":"Max Levchin, L5128-L5132","entities":["Affirm","Max Levchin"],"pos":[48,38]},{"id":"f1","slot":"fluff","label":"Mission: honest finance","text":"The mission statement: to build honest financial products that improve lives.","provenance":"fact","source_quote":"Anyway, so our mission is to build honest financial products that improve lives.","source_ref":"Max Levchin, L5032","entities":["Affirm","Max Levchin"],"pos":[-64,45],"size":0.85},{"id":"f2","slot":"fluff","label":"Unchanged in fifteen years","text":"Levchin notes with pride that the mission statement has not changed a word since the company started, almost fifteen years earlier.","provenance":"fact","source_quote":"So if you look at our mission statements, which I'm very proud to note has not changed a word since today we started the company.","source_ref":"Max Levchin, L5008","entities":["Affirm","Max Levchin"],"pos":[-64,26],"size":0.85},{"id":"f3","slot":"fluff","label":"In that domain, unmatched","text":"A claim of standing rather than of direction: in underwriting, Affirm is unmatched, it has always been the strength, and it continues to win.","provenance":"fact","source_quote":"And so in that domain, we're unmatched and that's always been our strength and we continue to win","source_ref":"Max Levchin, L4964","entities":["Affirm","Max Levchin"],"pos":[-64,12],"size":0.85},{"id":"f4","slot":"fluff","label":"Purism in mortgages and autos","text":"The expansion ambition: apply the same level of purism to mortgages, banking, auto loans and all sorts of fun things.","provenance":"fact","source_quote":"there's tons of opportunity to apply the same level of purism that we brought to lending to other things, from mortgages to banking, to auto loans, to all sorts of fun things","source_ref":"Max Levchin, L5124-L5128","entities":["Affirm","Max Levchin"],"pos":[-64,-2],"size":0.85},{"id":"d1","slot":"diagnosis","label":"It's all about late fees","text":"Levchin's own stated diagnosis of the industry: what makes lending something to stay away from is that it is ultimately all about late fees and compounding interest.","provenance":"fact","source_quote":"You want to maybe stay away from that because like ultimately it's all about late fees and compounding interest.","source_ref":"Max Levchin, L5104-L5106","entities":["Affirm","Max Levchin"],"pos":[-22,20.5],"size":1.15},{"id":"d2","slot":"diagnosis","label":"You cannot win on clever slogans","text":"In a market this competitive you cannot compete on clever slogans and temporary promos; you have to perform year in and year out.","provenance":"fact","source_quote":"It's very hard to compete in a highly competitive market on things like clever slogans and temporary promos, like you have to perform day in and day out and year in, you're out.","source_ref":"Max Levchin, L4952-L4954","entities":["Affirm","Max Levchin"],"pos":[19,20.5],"size":1.15},{"id":"d3","slot":"diagnosis","label":"A funder can walk at any time","text":"The funding-side obstacle, stated: at any given time somebody may choose to no longer participate, which is why diversification is not optional.","provenance":"fact","source_quote":"You have to be because at any given time, somebody may choose to no longer participate.","source_ref":"Max Levchin, L4584-L4586","entities":["Affirm","Max Levchin"],"pos":[60,20.5],"size":1.15},{"id":"d4","slot":"diagnosis","label":"Profit pool is borrower error","text":"The critical obstacle behind the stated one: in consumer credit the industry's margin is produced by borrower mistakes, so refusing fee and compounding revenue removes the profit pool itself rather than trimming a line item.","provenance":"derived","confidence":0.8,"rationale":"Levchin says the industry is all about late fees and that he was told the profit is there and that he could not survive without it. Putting those together as one obstacle - the revenue and the customer's error are the same thing - is not said, and it is what makes the policy costly rather than merely nice.","idea":"Because the industry's margin is the borrower's error, the underserved market is a no-asterisk version of the products where the error is largest - overdraft-priced deposit accounts, subprime auto, revolving retail cards - for a lender willing to earn its margin from selection instead.","entities":["Affirm","Max Levchin"],"pos":[-22,5.5],"size":1.15},{"id":"d5","slot":"diagnosis","label":"Selection replaces fee income","text":"With fee and compounding revenue renounced, the only remaining lever is who gets lent to: the binding constraint becomes underwriting accuracy, not distribution, brand or cost of funds.","provenance":"derived","confidence":0.75,"rationale":"Follows from the stated policy plus the stated claim that underwriting is the competitive edge, but the causal direction - that the edge is forced by the policy rather than chosen alongside it - is the inference. It explains why a firm with less margin invests most in modelling.","entities":["Affirm"],"pos":[19,5.5],"size":1.15},{"id":"d6","slot":"diagnosis","label":"Nobody prices the asterisk","text":"The obstacle that outlasts the others: the industry's margin depends on borrowers not pricing terms they cannot read. That asymmetry, not the fee itself, is what has no defence once reading is delegated to a machine.","provenance":"derived","confidence":0.6,"rationale":"Levchin states the consumer behaviour and that machines will not repeat it, and separately that products bad for consumers will be demoted by AI search. Naming the asymmetry itself as the obstacle - and therefore as the thing a competitor could attack directly - goes beyond either statement.","idea":"A machine-readable true-cost layer for consumer credit, publishing fee, penalty and compounding terms in a form an AI advisor can rank, would turn the asterisk into a comparison field and re-price every lender whose margin depends on it going unread.","entities":["Affirm"],"pos":[60,5.5],"size":1.15},{"id":"d7","slot":"diagnosis","label":"Rate exposure is funding-mix exposure","text":"The obstacle inside the rate criticism is not the level of rates but how fast a move reaches the cost of capital, and that speed is set by the mix and tenor of the funding agreements rather than by the lending model itself.","provenance":"derived","confidence":0.65,"rationale":"The hosts state the criticism and Levchin, in his reply, describes the mechanism: every funder has a benchmark tied to fed funds, and long-dated contracts make a rate change a slow trickle into cost of capital. Reading those together as the obstacle a funding policy answers, rather than a property of rates, joins two speakers, which puts it in the contestable band.","entities":["Affirm"],"pos":[35,13],"size":1.15},{"id":"g1","slot":"guiding_policy","label":"No late fees, no compounding","text":"The company was started specifically to have no late fees and no compounding interest, and to be on the opposite side of the things people hate.","provenance":"fact","source_quote":"We started the company specifically to not have late fees, to not have compounding interest to all the things that people hate, we want it to be on the opposite side.","source_ref":"Max Levchin, L5108-L5110","entities":["Affirm","Max Levchin"],"pos":[-22,-12.5]},{"id":"g2","slot":"guiding_policy","label":"Compete on underwriting depth","text":"The competitive edge has always been underwriting: depth of understanding of the borrower, better use of data, better modelling, living at the edge of current research.","provenance":"fact","source_quote":"And so our competitive edge has always been underwriting, just depth of understanding of the borrower of the end customer, better usage of data, better modeling, kind of living in the cutting edge of whatever most interesting math thing that happened in the research world","source_ref":"Max Levchin, L4956-L4960","entities":["Affirm","Max Levchin"],"pos":[19,-12.5]},{"id":"g3","slot":"guiding_policy","label":"Extremely diversified funding","text":"Affirm is a non-depository, non-bank lender, so all the capital it lends is sourced, and it keeps that sourcing extremely diversified.","provenance":"fact","source_quote":"So we're non-depository, non-bank lender, which means that our own capital or the capital that we lend out is some form of sourced. and there's multiple ways of doing it. We're extremely diversified in a source of capital.","source_ref":"Max Levchin, L4576-L4582","entities":["Affirm"],"pos":[60,-12.5]},{"id":"g4","slot":"guiding_policy","label":"Accepted cost: less margin","text":"The price of the policy, in the words of the people watching it: less margin and less opportunity for margin, and that was going to be tough.","provenance":"fact","source_quote":"okay, you have less margin and less opportunity for margin. And boy, that's going to be tough.","source_ref":"Max Levchin, L5118","entities":["Affirm","Max Levchin"],"pos":[48,-24.5]},{"id":"g5","slot":"guiding_policy","label":"Forfeit fee pool, win it on selection","text":"The policy stated as a trade-off: give up the revenue the industry runs on, accept a structurally lower margin, and buy the margin back by lending only where repayment can be predicted better than anyone else can predict it.","provenance":"derived","confidence":0.85,"rationale":"Levchin states the renunciation and, separately, the cost and the underwriting edge; he never states that they are one policy in which the second pays for the first. That joining is what makes the commitments coherent rather than a list of virtues.","entities":["Affirm"],"pos":[-10,-24.5]},{"id":"a1","slot":"coherent_action","label":"Lend only to those who can afford","text":"Affirm will not lend money to someone who cannot afford it; the no-fee model means it can only lend to those who can.","provenance":"fact","source_quote":"In fact, we will not lend money to someone who cannot afford it. Our whole model is built around the idea of no late fees, no gimmicks, no compounding interest, which means that we can only lend money to those who can afford.","source_ref":"Max Levchin, L4916-L4920","entities":["Affirm","Max Levchin"],"pos":[-22,-42]},{"id":"a2","slot":"coherent_action","label":"Securitise, warehouse lines","text":"Affirm securitises loans regularly and runs a collection of warehouse lines against the receivables; together these make up its capital markets program.","provenance":"fact","source_quote":"we now are big enough where we securitize in a fairly regular basis, which means people buy our securities. that we securitize, and then we have a whole collection of what's called warehouse lines where you finance the receivables or you borrow against the receivables as a security. And so all of that comprises our capital markets program.","source_ref":"Max Levchin, L4598-L4608","entities":["Affirm"],"pos":[19,-42]},{"id":"a3","slot":"coherent_action","label":"The card, up 120% year over year","text":"The Affirm Card, launched a couple of years earlier, is growing at 120% year over year and is what carries the product into offline, in-home services purchases.","provenance":"fact","source_quote":"growing nicely in part that's because our card which we launched a couple of years ago, that's growing at 120% year over year.","source_ref":"Max Levchin, L4522-L4524","entities":["Affirm"],"pos":[60,-42]},{"id":"a4","slot":"coherent_action","label":"Average ticket just under $300","text":"The average ticket this quarter is just under $300, against roughly $900 at the time of the IPO.","provenance":"fact","source_quote":"So this quarter, our average ticket is just under $300.","source_ref":"Max Levchin, L4678","entities":["Affirm"],"pos":[-22,-54]},{"id":"a5","slot":"coherent_action","label":"Down-market into small tickets","text":"Read as a commitment rather than an outcome: the ticket has fallen from about $900 at IPO to under $300 while frequency rose, which is a deliberate move into small, repeat purchases where a fee-free product's advantage over a revolving card compounds fastest.","provenance":"derived","confidence":0.7,"rationale":"The transcript reports the ticket size and the card's growth as results. Treating the drift as a chosen commitment - and explaining why the no-fee policy is worth most at small, frequent tickets - is the inference; it is what makes the card and the ticket one action rather than two statistics.","entities":["Affirm"],"pos":[19,-54]},{"id":"a6","slot":"coherent_action","label":"Small tickets strain selection","text":"The one place the action set pulls against itself: many small decisions per dollar lent is exactly where an underwriting advantage is hardest to hold and cheapest for a competitor to approximate, so the down-market push taxes the capability the whole policy rests on.","provenance":"derived","confidence":0.55,"rationale":"Nothing in the transcript raises a tension; Levchin presents the card and the falling ticket as unambiguous wins. The framework requires the coherence of the action set to be tested rather than assumed, and this is the one link where two commitments plausibly compete for the same scarce capability.","entities":["Affirm"],"pos":[60,-54]}],"edges":[{"id":"te1","from":"d1","to":"c2","relation":"diagnoses","provenance":"fact","source_quote":"You want to maybe stay away from that because like ultimately it's all about late fees and compounding interest.","source_ref":"Max Levchin, L5104-L5106","rationale":"The speaker's own 'because' names the fee dependence as the reason lending is an industry to stay away from."},{"id":"te2","from":"g1","to":"d1","relation":"addresses","provenance":"fact","source_quote":"You want to maybe stay away from that because like ultimately it's all about late fees and compounding interest. We started the company specifically to not have late fees, to not have compounding interest to all the things that people hate, we want it to be on the opposite side.","source_ref":"Max Levchin, L5104-L5110","rationale":"One continuous turn states the obstacle and then states the policy as its opposite."},{"id":"te3","from":"a1","to":"g1","relation":"implements","provenance":"fact","source_quote":"Our whole model is built around the idea of no late fees, no gimmicks, no compounding interest, which means that we can only lend money to those who can afford.","source_ref":"Max Levchin, L4918-L4920","rationale":"The 'which means' states that the affordability rule follows from the no-fee model."},{"id":"te4","from":"g2","to":"d2","relation":"addresses","provenance":"fact","source_quote":"It's very hard to compete in a highly competitive market on things like clever slogans and temporary promos, like you have to perform day in and day out and year in, you're out. And so our competitive edge has always been underwriting","source_ref":"Max Levchin, L4952-L4956","rationale":"The 'And so' ties the underwriting edge directly to the claim that slogans do not win this market."},{"id":"te5","from":"g3","to":"d3","relation":"addresses","provenance":"fact","source_quote":"We're extremely diversified in a source of capital. You have to be because at any given time, somebody may choose to no longer participate.","source_ref":"Max Levchin, L4582-L4586","rationale":"The 'You have to be because' states the obstacle the diversification policy answers."},{"id":"te6","from":"a2","to":"g3","relation":"implements","provenance":"fact","source_quote":"and then we have a whole collection of what's called warehouse lines where you finance the receivables or you borrow against the receivables as a security. And so all of that comprises our capital markets program.","source_ref":"Max Levchin, L4604-L4608","rationale":"The speaker names securitisation and the warehouse lines as together comprising the capital markets program, which is the sourcing the diversification policy describes."},{"id":"te7","from":"f1","to":"c2","relation":"masks","provenance":"derived","confidence":0.75,"rationale":"'Honest financial products that improve lives' is a statement of desire that would be signed by any lender in the dirty industry it is meant to distinguish itself from; it names no obstacle and forbids nothing, so it stands where the challenge should."},{"id":"te8","from":"f2","to":"d2","relation":"masks","provenance":"derived","confidence":0.7,"rationale":"Pride that the mission has not changed a word in fifteen years is offered as evidence of strategic constancy a few minutes after the speaker says markets are not won on slogans; the unchanged sentence hides that everything load-bearing did change."},{"id":"te9","from":"f3","to":"d5","relation":"masks","provenance":"derived","confidence":0.6,"rationale":"'We're unmatched and we continue to win' converts a capability that has to be re-earned every quarter into a settled property, which hides that the selection edge is the policy's single point of failure."},{"id":"te10","from":"f4","to":"d6","relation":"masks","provenance":"derived","confidence":0.55,"rationale":"Listing mortgages, banking and auto loans as opportunity treats the policy as portable; it passes over whether the asymmetry that makes the position defensible in point-of-sale credit exists in those markets at all."},{"id":"te11","from":"d4","to":"c1","relation":"diagnoses","provenance":"derived","confidence":0.8,"rationale":"Reframes the warning he was given as the structure of the industry rather than as scepticism about his company."},{"id":"te12","from":"d4","to":"d1","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The stated diagnosis supplies the mechanism; the derived one says the mechanism is the profit pool."},{"id":"te13","from":"d5","to":"g2","relation":"supported_by","provenance":"derived","confidence":0.75,"rationale":"The stated underwriting edge is the evidence that selection is where the margin is being made."},{"id":"te14","from":"d5","to":"g1","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"The renounced revenue is what leaves selection as the only remaining lever."},{"id":"te15","from":"d6","to":"c4","relation":"diagnoses","provenance":"derived","confidence":0.6,"rationale":"Takes the asterisk behaviour to be the industry's revenue mechanism rather than a consumer failing."},{"id":"te35","from":"d5","to":"c1","relation":"diagnoses","provenance":"derived","confidence":0.7,"rationale":"The warning that the profit is in the fees is the situation d5 reads: if that pool is refused, the obstacle inside the warning is that margin has to come from selection instead."},{"id":"te16","from":"d6","to":"c5","relation":"supported_by","provenance":"derived","confidence":0.65,"rationale":"The speaker's own forecast that products bad for consumers get demoted by AI search is the evidence that the asymmetry is closing."},{"id":"te17","from":"g5","to":"d4","relation":"addresses","provenance":"derived","confidence":0.85,"rationale":"Once the profit pool is the borrower's error, a policy that refuses it must name where the replacement margin comes from; that is exactly what this policy does."},{"id":"te18","from":"g5","to":"d5","relation":"addresses","provenance":"derived","confidence":0.8,"rationale":"The policy accepts the selection constraint rather than working around it."},{"id":"te19","from":"g5","to":"g1","relation":"supported_by","provenance":"derived","confidence":0.85,"rationale":"The stated renunciation is half of the trade-off."},{"id":"te20","from":"g5","to":"g4","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The stated margin cost is the price the trade-off pays."},{"id":"te21","from":"g5","to":"g2","relation":"supported_by","provenance":"derived","confidence":0.8,"rationale":"The stated underwriting edge is the compensating half of the trade-off."},{"id":"te22","from":"g3","to":"d7","relation":"addresses","provenance":"derived","confidence":0.7,"rationale":"Diversified, long-dated sourcing is what turns a rate move into a slow trickle rather than a shock; the policy answers the funding-mix obstacle, not the rate level. The transcript states the policy and the trickle but never connects them to the hosts' criticism."},{"id":"te33","from":"d7","to":"c3","relation":"diagnoses","provenance":"derived","confidence":0.65,"rationale":"Names the obstacle inside the hosts' criticism: a rate move hurts only as fast as it reaches the cost of capital, which is a funding-book property."},{"id":"te34","from":"d7","to":"c3","relation":"supported_by","provenance":"derived","confidence":0.65,"rationale":"The stated criticism is the situation the diagnosis reads; Levchin's slow-trickle description in reply is the mechanism it names."},{"id":"te23","from":"a1","to":"g2","relation":"implements","provenance":"derived","confidence":0.75,"rationale":"Refusing borrowers who cannot afford the loan is the underwriting policy expressed as a rule about who is served, not just as better modelling."},{"id":"te24","from":"a3","to":"g1","relation":"implements","provenance":"derived","confidence":0.6,"rationale":"The card carries the fee-free product into everyday offline spending, which is where the contrast with a revolving credit card is felt most often; the transcript reports its growth without saying what it is for."},{"id":"te25","from":"a5","to":"g5","relation":"implements","provenance":"derived","confidence":0.65,"rationale":"Small, frequent tickets are where a no-fee product's advantage compounds, so the down-market move is the trade-off policy applied to product mix."},{"id":"te26","from":"a1","to":"a2","relation":"reinforces","provenance":"derived","confidence":0.7,"rationale":"Lending only to those who can afford it produces the low loss rates that make the securitisations sellable, which in turn lowers the cost of the capital the underwriting is applied to."},{"id":"te27","from":"a3","to":"a5","relation":"reinforces","provenance":"derived","confidence":0.7,"rationale":"The card is the instrument that makes the small-ticket, offline volume reachable at all."},{"id":"te28","from":"a2","to":"a1","relation":"reinforces","provenance":"derived","confidence":0.6,"rationale":"A diversified, publicly observed funding programme prices the loan book continuously, which disciplines the underwriting it funds."},{"id":"te29","from":"a5","to":"a4","relation":"supported_by","provenance":"derived","confidence":0.7,"rationale":"The sub-$300 average ticket against roughly $900 at IPO is the measurement of the move."},{"id":"te30","from":"a5","to":"a3","relation":"supported_by","provenance":"derived","confidence":0.65,"rationale":"The card's growth is the mechanism by which the ticket fell."},{"id":"te31","from":"a6","to":"a3","relation":"supported_by","provenance":"derived","confidence":0.55,"rationale":"The card's growth rate is what makes the volume of small decisions large enough to matter."},{"id":"te32","from":"a6","to":"g2","relation":"supported_by","provenance":"derived","confidence":0.55,"rationale":"The claim that underwriting is the whole edge is what makes any pressure on it a strategic risk rather than an operational one."}]}]}</script>

<script type="module">

// ---------- palette (validated categorical slots, dark surface; see _meta and SPEC.md section 5) ----------
const SLOT_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
const SCHEMA_COLOR = '#898781';

const NODE_R = 2.2;

// ---------- data ----------
const $ = (id) => document.getElementById(id);

// ---------- renderer / scene ----------

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.autoRotateSpeed = 0.6;

const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(40, 80, 120); scene.add(key);

// The header and the note strip lay out after the first script pass, so a one-shot resize()

// ---------- state ----------
const state = { exampleIndex: 0, showDerived: true, showGrounding: false, showLabels: true, group: null, nodes: new Map(), edges: [], hit: [], hover: null, selected: null, fit: null, derivedDecor: [] };

// ---------- layouts ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function forceLayout(nodes, edges, pinned, seed, opts = {}) {
  const rand = mulberry32(seed);
  const pos = new Map();
  const R0 = opts.radius || Math.max(18, nodes.length * 2.2);
  for (const n of nodes) {
    if (pinned.has(n.id)) pos.set(n.id, pinned.get(n.id).clone());
    else pos.set(n.id, new THREE.Vector3((rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0, (rand() - .5) * 2 * R0 * (opts.flat ? 0.15 : 1)));
  }
  const ids = nodes.map(n => n.id);
  const L = opts.rest || 16, K = opts.repulse || 420;

  const d = new THREE.Vector3();
  for (let it = 0; it < 420; it++) {
    const alpha = 0.9 * (1 - it / 420) + 0.04;
    for (const id of ids) f.get(id).set(0, 0, 0);
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const a = pos.get(ids[i]), b = pos.get(ids[j]);
      d.subVectors(a, b); let dist = d.length(); if (dist < 0.5) { d.set(rand() - .5, rand() - .5, rand() - .5); dist = 0.5; }
      const s = K / (dist * dist); d.normalize().multiplyScalar(s);
      f.get(ids[i]).add(d); f.get(ids[j]).sub(d);
    }
    for (const e of edges) {
      if (!pos.has(e.from) || !pos.has(e.to)) continue;
      const a = pos.get(e.from), b = pos.get(e.to);
      d.subVectors(b, a); const dist = Math.max(d.length(), 0.01);
      const s = (dist - L) * 0.05; d.normalize().multiplyScalar(s);
      f.get(e.from).add(d); f.get(e.to).sub(d);
    }
    for (const id of ids) {
      if (pinned.has(id)) continue;
      const p = pos.get(id), ff = f.get(id);
      ff.addScaledVector(p, -0.012);
      if (opts.flat) ff.z -= p.z * 0.2;
      const len = ff.length(); if (len > 6) ff.multiplyScalar(6 / len);
      p.addScaledVector(ff, alpha);
    }

}

function treeLayout(ex) {
  const nodes = ex.nodes, edges = ex.edges.filter(e => e.relation !== 'supported_by');
  const level = new Map();
  const explicit = nodes.every(n => Number.isInteger(n.level));
  if (explicit) nodes.forEach(n => level.set(n.id, n.level));
  else {
    const out = new Map(nodes.map(n => [n.id, []])), und = new Map(nodes.map(n => [n.id, []]));
    for (const e of edges) { out.get(e.from)?.push(e.to); und.get(e.from)?.push(e.to); und.get(e.to)?.push(e.from); }
    const root = ex.layout.root && level.has(ex.layout.root) === false ? ex.layout.root : nodes[0].id;
    const q = [root]; level.set(root, 0);
    while (q.length) { const id = q.shift(); for (const t of out.get(id) || []) if (!level.has(t)) { level.set(t, level.get(id) + 1); q.push(t); } }
    // unreachable by direction: attach by undirected distance
    const q2 = [...level.keys()];
    while (q2.length) { const id = q2.shift(); for (const t of und.get(id) || []) if (!level.has(t)) { level.set(t, level.get(id) + 1); q2.push(t); } }
    for (const n of nodes) if (!level.has(n.id)) level.set(n.id, 0);
    for (const n of nodes) if (Number.isInteger(n.level)) level.set(n.id, n.level);
  }
  const layers = new Map();
  for (const n of nodes) { const l = level.get(n.id); if (!layers.has(l)) layers.set(l, []); layers.get(l).push(n); }
  const order = [...layers.keys()].sort((a, b) => a - b);
  const pos = new Map();
  const right = ex.layout.direction === 'right';
  const GAP_L = right ? 26 : 18, GAP_S = right ? 9 : 14;
  // barycentre ordering pass to reduce crossings
  const parents = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) if (level.get(e.to) > level.get(e.from)) parents.get(e.to).push(e.from);
  const xOf = new Map();
  for (const l of order) {
    const arr = layers.get(l);
    if (l !== order[0]) arr.sort((a, b) => {
      const pa = parents.get(a.id).filter(p => xOf.has(p)), pb = parents.get(b.id).filter(p => xOf.has(p));
      const ma = pa.length ? pa.reduce((s, p) => s + xOf.get(p), 0) / pa.length : 0;
      const mb = pb.length ? pb.reduce((s, p) => s + xOf.get(p), 0) / pb.length : 0;
      return ma - mb;
    });
    arr.forEach((n, i) => {
      const s = (i - (arr.length - 1) / 2) * GAP_S;
      xOf.set(n.id, s);
      pos.set(n.id, right ? new THREE.Vector3(l * GAP_L, -s, 0) : new THREE.Vector3(s, -l * GAP_L, 0));

function ringLayout(ex) {
  const nodes = ex.nodes;
  const onRing = nodes.filter(n => Number.isInteger(n.order) && !Array.isArray(n.pos));
  const R = Math.max(22, onRing.length * 4.2);
  const pinned = new Map();
  onRing.sort((a, b) => a.order - b.order).forEach((n, i) => { const t = Math.PI / 2 - (i / onRing.length) * Math.PI * 2; pinned.set(n.id, new THREE.Vector3(Math.cos(t) * R, Math.sin(t) * R, 0)); });
  for (const n of nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  if (pinned.size === nodes.length) return pinned;
  return forceLayout(nodes, ex.edges, pinned, 7, { radius: R * 0.5, flat: true, rest: 12 });
}

function planeLayout(ex) {
  const pinned = new Map();
  for (const n of ex.nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  if (pinned.size === ex.nodes.length) return pinned;
  return forceLayout(ex.nodes, ex.edges, pinned, 11, { flat: true, rest: 14 });
}

function computeLayout(ex) {
  const mode = ex.layout?.mode || 'force';
  if (mode === 'tree') return treeLayout(ex);
  if (mode === 'ring') return ringLayout(ex);
  if (mode === 'plane') return planeLayout(ex);
  const pinned = new Map();
  for (const n of ex.nodes) if (Array.isArray(n.pos)) pinned.set(n.id, new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2] || 0));
  return forceLayout(ex.nodes, ex.edges, pinned, 3);
